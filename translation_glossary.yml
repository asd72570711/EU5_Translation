aliases:
  Holy Roman Empire:
    zh: "神聖羅馬帝國"
    also:
      - HRE

contextual:
  Chobanids:
    default: "丘拜尼"
    senses:
      - zh: "出班"
        when: "指人名、家族始祖或個人 Choban"
      - zh: "丘拜尼"
        when: "指國家、王朝、政權或 Chobanid state/dynasty"
  Iberia:
    default: "伊比利亞"
    senses:
      - zh: "伊比利半島"
        when: "明確指 Iberian Peninsula"
      - zh: "伊比利山脈"
        when: "明確指 Iberian Mountains"
      - zh: "伊比利亞"
        when: "其他地理、文化、區域或泛稱語境"
  Ottoman:
    default: "鄂圖曼"
    senses:
      - zh: "鄂圖曼"
        when: "指 Ottoman Empire、Ottoman state、Ottoman government、Ottoman culture、Ottoman dynasty 或一般鄂圖曼相關事物"
      - zh: "奧斯曼"
        when: "明確指 Osman 人名、奧斯曼一世或語源相關情境"
  Herculean:
    default: "海克力斯般"
    senses:
      - zh: "海克力斯般"
        when: "形容如 Hercules / Heracles 般的力量、偉業或英雄式特質"
      - zh: "巨大的"
        when: "一般形容艱鉅、龐大或極困難，且不需保留神話典故時"
  Tokelauan:
    default: "托克勞"
    senses:
      - zh: "托克勞文化"
        when: "指文化"
      - zh: "托克勞語"
        when: "指語言"
      - zh: "托克勞崇拜"
        when: "指宗教、信仰或 worship 語境"
  Trent:
    default: "特利騰"
    senses:
      - zh: "特利騰"
        when: "指 Council of Trent、宗教會議或教會史語境"
      - zh: "特倫托"
        when: "明確指現代城市 Trento 或義大利地名語境"
