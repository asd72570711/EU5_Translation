l_simp_chinese:
 LOADING_TIP_0: " #T 「一名修士若與千年以來的全體基督教為敵，那他必然是錯的。」#! \n #tooltip_subheading — 查理五世，神聖羅馬皇帝，於沃姆斯議會，1521年#!"
 LOADING_TIP_1: " #T 「戰爭始於你願意之時，卻不會終於你稱心之刻。」#! \n #tooltip_subheading — 尼古洛·馬基維利，#italic 《佛羅倫斯史》#!，1521年#!"
 LOADING_TIP_2: " #T 「國王不僅是上帝在人間的副手，坐在上帝的寶座上；甚至上帝本人也稱他們為神。」#! \n #tooltip_subheading — 詹姆士六世，蘇格蘭、英格蘭、法蘭西與愛爾蘭國王，1609年#!"
 LOADING_TIP_3: " #T 「若我們注定一死，我們足以使國家蒙受損失。若我們注定生還，人越少，榮耀的份額便越大。」#! \n #tooltip_subheading — 威廉·莎士比亞，#italic 《亨利五世》#!，1599年#!"
 LOADING_TIP_4: " #T 「出賣一個國家？何不也出賣空氣、遼闊的大海，以及大地？難道偉大精靈不是為了祂的子民而創造這一切嗎？」#! \n #tooltip_subheading — 特庫姆塞，肖尼族酋長，1810年#!"
 LOADING_TIP_5: " #T 「神聖羅馬帝國既不神聖，也不羅馬，更不是帝國。」#! \n #tooltip_subheading — 伏爾泰，#italic 《論各民族的風俗與精神》第三卷，第70章#!，1773年#!"
 LOADING_TIP_6: " #T 「我決意永不發動不義之戰，但正當之戰若非擊敗敵人，我也絕不終止。」#! \n #tooltip_subheading — 卡爾十二世，瑞典國王，1699年#!"
 LOADING_TIP_7: " #T 「一個政府最容易從另一個政府學會的技藝，莫過於從人民口袋裡榨取金錢。」#! \n #tooltip_subheading — 亞當·斯密，蘇格蘭經濟學家，#italic 《國富論》#!，1776年#!"
 LOADING_TIP_8: " #T 「請思量，你們或許錯了。」#! \n #tooltip_subheading — 奧立佛·克倫威爾，英格蘭、蘇格蘭與愛爾蘭邦聯護國公，1652年#!"
 LOADING_TIP_9: " #T 「我懷著遺憾宣告這致命的真理：路易必須死，好讓國家得以存活。」#! \n #tooltip_subheading — 馬克西米連·羅伯斯比爾，國民公會代表，1792年#!"
 LOADING_TIP_10: " #T 「當我們的主與導師耶穌基督說『悔改』時，祂意願信徒的一生都成為悔改的一生。」#! \n #tooltip_subheading — 馬丁·路德，#italic 《九十五條論綱》#!，1517年#!"
 LOADING_TIP_11: " #T 「我從你那裡得不到任何幫助或益處，我從未想過你會是這樣的人，我曾對你抱有截然不同的想像，但如今我看見一切都毫無意義……」#! \n #tooltip_subheading — 雷恩舍爾德於波爾塔瓦戰役中對列文豪普特所言，1708年#!"
 LOADING_TIP_12: " #T 「前去，讓世界燃起火焰！」#! \n #tooltip_subheading — 依納爵·羅耀拉，巴斯克神學家，約1540年#!"
 LOADING_TIP_13: " #T 「既然我已將雙手浸入泥水，且非當海盜不可，那麼做指揮官總勝過做平凡人。」#! \n #tooltip_subheading — 黑色准男爵，威爾斯海盜船長，1719年#!"
 LOADING_TIP_14: " #T 「如獅子般活上一日，遠勝如豺狼般活上一百年。」#! \n #tooltip_subheading — 蒂普蘇丹，邁索爾之虎，約1780年#!"
 LOADING_TIP_15: " #T 「我們要求你們承認教會及其至高祭司教宗為宇宙的統治者。」#! \n #tooltip_subheading — 斐迪南二世，亞拉岡與卡斯提爾國王，#italic 致泰諾‑阿拉瓦克人的信#!，1500年#!"
 LOADING_TIP_16: " #T 「榮譽能接上一條腿嗎？不能。能消除傷口的痛楚嗎？不能。那榮譽是什麼？空氣。」#! \n #tooltip_subheading — 威廉·莎士比亞，#italic 《亨利四世》第一部#!，1597年#!"
 LOADING_TIP_17: " #T 「繼續走我的正道，這條路尚未終結。」#! \n #tooltip_subheading — 卡美哈梅哈一世，夏威夷國王，臨終遺言，1819年#!"
 LOADING_TIP_18: " #T 「若天堂裡有西班牙人，我寧願下地獄。」#! \n #tooltip_subheading — 哈土依，泰諾族酋長，在被西班牙人處以火刑前，1512年#!"
 LOADING_TIP_19: " #T 「主啊，激勵我們更大膽地冒險，駛向更廣闊的海洋；在那裡風暴將彰顯祢的主宰，在那裡陸地消失於視線之外，我們將找到星辰。」#! \n #tooltip_subheading — 法蘭西斯·德雷克爵士，英格蘭探險家，1577年#!"
 LOADING_TIP_20: " #T 「至於教宗，我拒絕承認他；他是基督的敵人與反基督，連同他所有的虛假教義。」#! \n #tooltip_subheading — 湯瑪斯·克蘭默，坎特伯雷大主教，1556年#!"
 LOADING_TIP_21: " #T 「在佛羅里達、維吉尼亞、新英格蘭與加拿大這裡，土地之多，勝過整個基督教世界所有人民所能耕種。」#! \n #tooltip_subheading — 約翰·史密斯船長，英格蘭殖民者，1631年#!"
 LOADING_TIP_22: " #T 「我們的獨立必須不惜一切代價取得。若有產者不支持我們，他們必將倒下；我們可以憑藉社群中那龐大而可敬的階級，也就是無產者，來支持自己。」#! \n #tooltip_subheading — 沃爾夫·托恩，愛爾蘭革命家，1796年#!"
 LOADING_TIP_23: " #T 「美洲既沒有國王，沒有貴族，也沒有由法律確立的神職人員；它是地球表面最繁榮、治理最良好的地方。」#! \n #tooltip_subheading — 沃爾夫·托恩，愛爾蘭革命家，1796年#!"
 LOADING_TIP_24: " #T 「我們認為以下真理是不證自明的：人人生而平等，他們由造物主賦予若干不可剝奪的權利，其中包括生命、自由與追求幸福。」#! \n #tooltip_subheading — 美國獨立宣言，1776年#!"
 LOADING_TIP_25: " #T 「公允地說，兩句話都很真實：人對人而言是一種神；而人對人而言又是十足的狼。」#! \n #tooltip_subheading — 湯瑪斯·霍布斯，《論公民》，1651年#!"
 LOADING_TIP_26: " #T 「在原初狀態中的人最為溫和；大自然將他置於野獸的愚昧與文明人的致命啟蒙之間，距離兩者相等。」#! \n #tooltip_subheading — 讓‑雅克·盧梭，#italic 《論人類不平等的起源》#!，1754年#!"
 LOADING_TIP_27: " #T 「杜鵑若不啼，殺之。」#! \n #tooltip_subheading — 織田信長，日本大名，活躍於1580年前後#!"
 LOADING_TIP_28: " #T 「杜鵑若不啼，使之啼。」#! \n #tooltip_subheading — 豐臣秀吉，日本關白，活躍於1590年前後#!"
 LOADING_TIP_29: " #T 「杜鵑若不啼，待其啼。」#! \n #tooltip_subheading — 德川家康，日本將軍，活躍於1600年前後#!"
 LOADING_TIP_30: " #T 「我既不廢立國王，只是扶助我的君主。」#! \n #tooltip_subheading — 貝特朗·杜·蓋克蘭，布列塔尼將軍，1369年#!"
 LOADING_TIP_31: " #T 「瑞典與我何干？我厭惡她，甚於地獄深坑……」#! \n #tooltip_subheading — 弗里德里希·席勒，德國劇作家，#italic 《華倫斯坦之死》#!，1799年#!"
 LOADING_TIP_32: " #T 「城市已經陷落，而我仍活著。」#! \n #tooltip_subheading — 君士坦丁十一世，拜占庭皇帝，臨終遺言，1453年#!"
 LOADING_TIP_33: " #T 「對待每個法國人，都要像對待魔鬼本人一樣。」#! \n #tooltip_subheading — 霍雷肖·納爾遜，英國海軍上將，1793年#!"
 LOADING_TIP_34: " #T 「我再也無法服從；我已嘗過指揮的滋味，不能再放手。」#! \n #tooltip_subheading — 拿破崙·波拿巴，科西嘉砲兵中尉，1790年#!"
 LOADING_TIP_35: " #T 「只要把自己的船靠到敵艦旁，艦長就不會錯得太離譜。」#! \n #tooltip_subheading — 霍雷肖·納爾遜，英國海軍上將，1805年#!"
 LOADING_TIP_36: " #T 「#italic Honi soit qui mal y pense#!。心懷惡念者蒙羞。」#! \n #tooltip_subheading — 英格蘭與法蘭西國王愛德華三世，嘉德勳章格言，1348年#!"
 LOADING_TIP_37: " #T 「與其讓宗教和侍奉上帝之事受到絲毫損害，我寧願失去我所有的領地，以及一百條性命，若我有的話；因為我無意成為異端者的統治者。」#! \n #tooltip_subheading — 西班牙國王腓力二世，#italic 致教宗庇護五世的信#!，1566年#!"
 LOADING_TIP_38: " #T 「閣下自稱對待敵人的方式，確實很符合#italic 您#!的慷慨，但在整個英格蘭民族中卻罕有其例。」#! \n #tooltip_subheading — 布拉斯·德·萊索，西班牙海軍上將，#italic 致藍旗艦隊副司令愛德華·弗農書#!，1739年#!"
 LOADING_TIP_39: " #T 「每個西班牙人小便時都應望向英格蘭。」#! \n #tooltip_subheading — 布拉斯·德·萊索，西班牙海軍上將，於卡塔赫納圍城期間，1741年#!"
 LOADING_TIP_40: " #T 「祈禱無非就是與上帝保持友誼。」#! \n #tooltip_subheading — 亞維拉的聖女德肋撒，教會聖師，#italic 《聖德蘭自傳》#!，約1565年#!"
 LOADING_TIP_41: " #T 「我對上帝說西班牙語，對女人說義大利語，對男人說法語，對我的馬說德語。」#! \n #tooltip_subheading — 查理五世，神聖羅馬皇帝、西班牙國王、奧地利大公等#!"
 LOADING_TIP_42: " #T 「國王親自騎馬射鹿。然而馬匹失足，使他墜馬，但他並未受傷。環顧四周後，他說：『別讓史官知道這件事。』」#! \n #tooltip_subheading — #italic 《太宗實錄》第7卷第4條#!，約1410年#!"
 LOADING_TIP_43: " #T 「貪生者死，輕死者生。」\n #tooltip_subheading — 上杉謙信，日本大名，活躍於1570年前後#!"
 LOADING_TIP_44: " #T 「學問之於人，猶如枝葉之於樹；可以說，人不可沒有它。」\n #tooltip_subheading — 武田信玄，日本大名，活躍於1550年前後#!"
 LOADING_TIP_45: " #T 「敵人在本能寺。」#! \n #tooltip_subheading — 明智光秀，織田家將領，1582年#!"
 LOADING_TIP_46: " #T 「英格蘭人極度熱愛自己，也熱愛一切屬於他們的事物；他們以為除了自己之外沒有別的人，除了英格蘭之外沒有別的世界。」#! \n #tooltip_subheading — 安德烈亞·特雷維桑，威尼斯外交官，1498年#!"
 LOADING_TIP_47: " #T 「只要加泰隆尼亞還剩下一個加泰隆尼亞人，我們就會有敵人與戰爭。」#! \n #tooltip_subheading — 法蘭西斯科·德·奎維多，卡斯提爾作家，1645年"
 LOADING_TIP_48: " #T 「西班牙許多地方幾乎荒無人煙。原因是人民可悲的懶惰，極像威爾斯人……」#! \n #tooltip_subheading — 法蘭西斯·威洛比，英格蘭作家，1673年#!"
 LOADING_TIP_49: " #T 「英格蘭有六十種不同宗教，卻只有一種醬汁。」#! \n #tooltip_subheading — 法蘭切斯科·卡拉喬洛，那不勒斯海軍上將，卒於1799年#!" # HP Sauce?
 LOADING_TIP_50: " #T 「過去諸世紀所見、當今諸世紀所見，或未來諸世紀所能期待見到的最高場合。」#! \n #tooltip_subheading — 米格爾·德·塞凡提斯，卡斯提爾作家，論勒班陀戰役，#italic 《機智的紳士唐吉軻德·德拉曼查》#!，1605年#!"
 LOADING_TIP_51: " #T 「我在羅斯巴赫贏得那場戰役時，大多數步兵的火槍還扛在肩上。」#! \n #tooltip_subheading — 腓特烈二世「大帝」，普魯士國王，約1757年#!"
 LOADING_TIP_52: " #T 「鐵因閒置而生鏽；水因停滯而失其清澈……同樣，怠惰也會侵蝕心智的活力。」#! \n #tooltip_subheading — 李奧納多·達·文西，佛羅倫斯博學者，約1500年#!"
 LOADING_TIP_53: " #T 「美來自整體的形式與相互呼應，來自各部分相對於整體、各部分彼此之間，以及它們再回到整體的關係。」#! \n #tooltip_subheading — 安卓·帕拉底歐，維琴察建築師，#italic 《建築四書》#!，1570年#!"
 LOADING_TIP_54: " #T 「自然塑造了他，然後打碎了模具。」#! \n #tooltip_subheading — 盧多維科·阿里奧斯托，費拉拉詩人，#italic 《瘋狂的奧蘭多》#!，1532年#!"
 LOADING_TIP_55: " #T 「我是世界的秘書。」#! \n #tooltip_subheading — 皮埃特羅·阿雷蒂諾，阿雷佐諷刺作家，約1530年#!"
 LOADING_TIP_56: " #T 「宇宙無法被閱讀，除非我們先學會它的語言，並熟悉它書寫所用的字元。它以數學語言寫成。」#! \n #tooltip_subheading — 伽利略·伽利萊，比薩自然哲學家，#italic 《試金者》#!，1623年#!"
 #
 LOADING_TIP_d008_0: " #T 「這些希臘人在教會禮拜中極為虔誠，士兵與司祭同樣參與其中，因為他們以自己的母語齊聲吟唱，彼此並無區別。」#! \n #tooltip_subheading — 阿斯克的亞當，威爾斯歷史學家，約1399年#!"
 LOADING_TIP_d008_1: " #T 「寧要土耳其人的頭巾，不要教宗的三重冕。」#! \n #tooltip_subheading — 盧卡斯·諾塔拉斯，拜占庭海軍上將，約1453年#!"
 LOADING_TIP_d008_2: " #T 「上帝不許我作一個沒有帝國的皇帝。我的城市陷落時，我也將與它一同倒下。」#! \n #tooltip_subheading — 君士坦丁十一世，拜占庭皇帝，1453年#!"
 LOADING_TIP_d008_3: " #T 「我們已與拉丁人分離，因為他們不僅是分裂者，更是異端。」#! \n #tooltip_subheading — 以弗所的馬可，拜占庭神學家，1439年#!"
 LOADING_TIP_57: " #T 「我們原本打算在夜間執行任務；若在白天行動，便會毀了我們。上帝使其成為最好的安排，我相信這正是我們勝利的原因。」#! \n #tooltip_subheading — 費爾南多·德·阿瓦洛斯，佩斯卡拉侯爵，帕維亞戰役帝國軍指揮官，1525年。#!"
 LOADING_TIP_58: " #T 「除榮譽外，一切盡失。」#! \n #tooltip_subheading — 法蘭索瓦一世，法蘭西國王，論帕維亞戰役，1525年。#!"
 LOADING_TIP_59: " #T 「俘虜一位基督徒國王並非喜事。」#! \n #tooltip_subheading — 查理五世，神聖羅馬皇帝，論帕維亞戰役，1525年。#!"
