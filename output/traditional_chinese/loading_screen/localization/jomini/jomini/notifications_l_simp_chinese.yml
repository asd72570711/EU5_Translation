l_simp_chinese:
 JOMINI_NOTIFICATION_TIMESTAMP_NOW: "剛剛"
 JOMINI_NOTIFICATION_TIMESTAMP_MINUTES: "$MINUTES$分鐘前"
 JOMINI_NOTIFICATION_TIMESTAMP: "$DATE$"
 JOMINI_DLC_MANAGER_DISABLED_MODS_CRASH_TITLE: "模組已停用"
 JOMINI_DLC_MANAGER_DISABLED_MODS_CRASH_DESC: "遊戲上次啟動時遇到問題，可能是由不相容的模組造成。\n為確保穩定性，所有模組已暫時停用。\n若要重新啟用模組，請前往「$MESSAGE$」播放集，移除任何有問題的模組，並套用變更。"
 JOMINI_DLC_MANAGER_OUTDATED_MODS_ALERT_TITLE: "偵測到不支援的模組"
 JOMINI_DLC_MANAGER_OUTDATED_MODS_ALERT_DESC: "你有部分模組適用於不同版本的$GAME$。這些模組可能無法正常運作，並可能導致遊戲出現問題。為了穩定性，我們建議在這些模組更新前先停用它們。\n\n以下模組已過期：\n$MODS_OUTDATED_LIST$"
 JOMINI_JOIN_SERVER_ALERT_TITLE: "無法連線至伺服器"
 JOMINI_JOIN_SERVER_ALERT_DESC: "請前往主選單加入遊戲。"
 JOMINI_FILE_TRANSFER_ERROR_TITLE: "檔案傳輸失敗"
 JOMINI_FILE_TRANSFER_ERROR_DESC: "請再次嘗試連線至伺服器。"
 JOMINI_DLC_MANAGER_CONFIRM_UGC_UPLOAD_TITLE: "確認UGC上傳"
 JOMINI_DLC_MANAGER_CONFIRM_UGC_UPLOAD_DESC: "確定要上傳此模組嗎？這會在Steam工作坊建立新的模組。\n\n提交此項目即表示你同意工作坊服務條款。若你尚未同意條款，Steam內嵌介面視窗將會開啟並提示你閱讀條款；在你接受前，你的內容會被Steam隱藏。"
