l_simp_chinese:
 SETTING_ANIMATED_PORTRAITS: "角色動畫"
 SETTING_ANIMATED_PORTRAITS_TOOLTIP: "#T $SETTING_ANIMATED_PORTRAITS$\n#!決定重要角色是否顯示動畫。\n\n關閉此選項可能會提升效能。"
 SETTING_PORTRAITS_SSAO: "角色SSAO"
 SETTING_PORTRAITS_SSAO_TOOLTIP: "#T $SETTING_PORTRAITS_SSAO$\n#!決定是否對肖像套用螢幕空間環境遮蔽。\n\n關閉此選項可能會提升效能。"
 SETTING_PORTRAITS_UNSHARP_MASKING: "肖像銳化"
 SETTING_PORTRAITS_UNSHARP_MASKING_TOOLTIP: "#T $SETTING_PORTRAITS_UNSHARP_MASKING$\n#!決定是否對肖像套用非銳化遮罩，使其看起來更清晰。\n\n關閉此選項可能會提升效能。"
 SETTING_GRUESOME_PORTRAITS_TRAITS_VISIBLE: "駭人肖像"
 SETTING_GRUESOME_PORTRAITS_TRAITS_VISIBLE_TOOLTIP: "#T $SETTING_GRUESOME_PORTRAITS_TRAITS_VISIBLE$\n#!決定是否在肖像中顯示毀容等駭人特質。\n\n若你覺得它們過於不適，請關閉此選項。"
 
