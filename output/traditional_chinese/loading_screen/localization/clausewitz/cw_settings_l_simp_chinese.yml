l_simp_chinese:
 # General 
 SETTING_VALUE_NONE: "$VALUE$"
 SETTING_VALUE_TOTAL_PERCENTAGE: "$VALUE|%/0$"
 SETTING_VALUE_PERCENTAGE: "$VALUE|%0$"
 SETTING_VALUE_SECONDS: "$VALUE$秒"
 SETTING_VALUE_MINUTES: "$VALUE$分鐘"
 # Graphics
 SETTING_RENDERER: "渲染器"
 SETTING_RENDERER_TOOLTIP: "決定使用哪一種渲染器。"
 SETTING_VSYNC: "垂直同步"
 SETTING_VSYNC_TOOLTIP: "#T $SETTING_VSYNC$\n#!讓遊戲與螢幕使用相同的畫面更新率，以減少畫面撕裂。\n\n關閉此選項可能會提升效能。"
 SETTING_PORTRAIT_MULTI_SAMPLING: "肖像多重採樣"
 SETTING_PORTRAIT_MULTI_SAMPLING_TOOLTIP: "#T $SETTING_PORTRAIT_MULTI_SAMPLING$\n#!使用Alpha-To-Coverage的多重採樣，讓髮絲混合更平滑。\n\n降低設定可提升效能。"
 SETTING_MULTI_SAMPLING: "反鋸齒（MSAA）"
 SETTING_MULTI_SAMPLING_TOOLTIP: "#T $SETTING_MULTI_SAMPLING$\n#!使用多重採樣反鋸齒（MSAA）會讓影像邊緣更平滑。\n\n降低設定可能會提升效能。"
 SETTING_ANTI_ALIASING: "反鋸齒"
 SETTING_ANTI_ALIASING_TOOLTIP: "#T $SETTING_ANTI_ALIASING$\n#!使用反鋸齒會讓影像邊緣更平滑。\n\n建議使用FXAA。"
 OPTION_ANTI_ALIASING_DISABLED: "停用"
 OPTION_ANTI_ALIASING_FXAA: "FXAA"
 SETTING_UPSCALE: "升頻方法"
 SETTING_UPSCALE_TOOLTIP: "#T $SETTING_UPSCALE$#!\n升頻方法可透過演算法上採樣達到更高的顯示解析度。這可能會提升效能，但也可能造成視覺瑕疵或其他非預期行為。\n\n可用的升頻方法可能取決於你的顯示卡。"
 OPTION_UPSCALE_FSR2: "AMD FidelityFX Super Resolution 2"
 OPTION_UPSCALE_DLSS: "NVIDIA DLSS"
 OPTION_UPSCALE_XESS: "Intel® XeSS"
 SETTING_UPSCALE_QUALITY: "升頻品質"
 SETTING_UPSCALE_QUALITY_TOOLTIP: "#T $SETTING_UPSCALE_QUALITY$#!\n設定升頻方法的目標，從偏重最高品質到偏重最高效能。"
 OPTION_UPSCALE_QUALITY_ULTRA_QUALITY: "極致品質"
 OPTION_UPSCALE_QUALITY_QUALITY: "品質"
 OPTION_UPSCALE_QUALITY_BALANCED: "平衡"
 OPTION_UPSCALE_QUALITY_PERFORMANCE: "效能"
 OPTION_UPSCALE_QUALITY_ULTRA_PERFORMANCE: "極致效能"
 SETTING_ANISOTROPIC_FILTERING: "材質過濾"
 SETTING_ANISOTROPIC_FILTERING_TOOLTIP: "#T $SETTING_ANISOTROPIC_FILTERING$\n#!使用各向異性過濾會讓有材質的表面看起來更好。\n\n降低設定可能會提升效能。"
 SETTING_RESOLUTION: "解析度"
 SETTING_RESOLUTION_TOOLTIP: "#T $SETTING_RESOLUTION$\n#!設定遊戲的影像品質。\n\n較低解析度可能會提升效能。\n\n#X 使用不支援長寬比的遊戲解析度可能會導致介面超出螢幕#!"
 SETTING_RENDER_SCALE: "渲染比例"
 SETTING_RENDER_SCALE_TOOLTIP: "#T $SETTING_RENDER_SCALE$#!\n遊戲渲染解析度相對於主要解析度的比例，不包含使用者介面。\n\n降低設定可能會提升效能，但會降低整體精細度；高於100%可能會提升精細度，但很可能降低效能。"
 SETTING_RENDER_SCALE_FORMAT: "$VALUE|%0$"
 SETTING_DISPLAY: "螢幕"
 SETTING_DISPLAY_TOOLTIP: "#T $SETTING_DISPLAY$\n#!如果你的電腦有多個螢幕，請選擇遊戲要使用的螢幕。"
 SETTING_GRAPHICS_DEVICE: "顯示卡"
 SETTING_GRAPHICS_DEVICE_TOOLTIP: "#T $SETTING_GRAPHICS_DEVICE$\n#!選擇遊戲要使用哪張顯示卡。\n\n使用內建顯示卡或軟體渲染器可能會降低效能。"
 SETTING_SHADOW_MAP_RESOLUTION: "陰影品質"
 SETTING_SHADOW_MAP_RESOLUTION_TOOLTIP: "#T $SETTING_SHADOW_MAP_RESOLUTION$\n#!若啟用陰影，決定陰影貼圖的渲染解析度。\n\n降低設定可能會提升效能。"
 SETTING_DISPLAY_MODE: "顯示模式"
 SETTING_DISPLAY_MODE_TOOLTIP: "#T $SETTING_DISPLAY_MODE$\n#!決定遊戲如何顯示在你的螢幕上"
 SETTING_BLOOM_QUALITY: "光暈"
 SETTING_MESH_LOD_BIAS: "網格LOD品質"
 SETTING_MESH_LOD_FADE: "網格LOD淡化"
 SETTING_TERRAIN_SMOOTHING: "地形平滑化"
 OPTION_FULLSCREEN: "全螢幕"
 OPTION_FULLSCREEN_TOOLTIP: "#T $OPTION_FULLSCREEN$\n#!使用整個螢幕顯示遊戲。解析度設定會改變影像的清晰度。"
 OPTION_WINDOWED: "視窗"
 OPTION_WINDOWED_TOOLTIP: "#T $OPTION_WINDOWED$\n#!以視窗顯示遊戲。解析度設定會改變視窗大小。"
 OPTION_DISABLED: "停用"
 OPTION_OFF: "關閉"
 OPTION_LOW: "低"
 OPTION_MEDIUM: "中"
 OPTION_HIGH: "高"
 OPTION_VERY_HIGH: "非常高"
 OPTION_ULTRA: "極高"
 OPTION_CUSTOM: "自訂"
 OPTION_DEFAULT: "預設"
 SETTINGS_CATEGORY_UI: "介面"
 SETTINGS_CATEGORY_GAME: "遊戲"
 SETTING_TEXTURE_QUALITY: "材質品質"
 SETTING_TEXTURE_QUALITY_TOOLTIP: "#T $SETTING_TEXTURE_QUALITY$#!\n控制載入材質的解析度。\n\n降低設定可能會提升效能。"
 SETTING_QUALITY: "品質預設"
 SETTING_SFX: "音效"
 SETTING_UI: "介面"
 SETTING_QUALITY_TOOLTIP: "#T $SETTING_QUALITY$\n#!選擇下方進階圖形選項的預設。\n\n低預設會提升效能。"
 SETTING_BLOOM_QUALITY_TOOLTIP: "#T $SETTING_BLOOM_QUALITY$\n#!啟用「光暈」效果，讓極亮光源溢出到影像其他部分。\n\n降低設定可能會提升效能。"
 SETTING_DOF_TOOLTIP: "#T $SETTING_DOF$\n#!啟用景深以模擬相機鏡頭，模糊影像中失焦的區域。\n\n關閉此選項可能會提升效能。"
 SETTING_LENS_FLARE_TOOLTIP: "#T $SETTING_LENS_FLARE$\n#!啟用會出現在強烈光暈區域的鏡頭光暈效果。必須啟用光暈才會出現此效果。\n\n關閉此選項可能會提升效能。"
 SETTING_SECONDARY_LENS_FLARE_TOOLTIP: "#T $SETTING_SECONDARY_LENS_FLARE$\n#!啟用會出現在強烈光暈區域的次要鏡頭光暈效果。必須啟用光暈才會出現此效果。\n\n關閉此選項可能會提升效能。"
 SETTING_MAP_SSAO_TOOLTIP: "#T $SETTING_MAP_SSAO$\n#!決定是否對地圖套用螢幕空間環境遮蔽。\n\n關閉此選項可能會提升效能。"
 SETTING_REFRACTION_TOOLTIP: "決定水面是否顯示折射。"
 SETTING_REFRACTION_QUALITY_TOOLTIP: "#T $SETTING_REFRACTION_QUALITY$#!\n若啟用水面折射，控制折射品質。\n\n降低設定可能會提升效能。"
 SETTING_MAPOBJECT_QUALITY_TOOLTIP: "#T $SETTING_MAPOBJECT_QUALITY$#!\n決定地圖物件（例如建築）的最高品質等級。\n\n降低設定可能會提升效能。"
 SETTING_MESH_LOD_BIAS_TOOLTIP: "#T $SETTING_MESH_LOD_BIAS$#!\n決定單位模型等地圖物件的LOD（細節層級）品質。\n\n降低設定可能會提升效能。"
 SETTING_MESH_LOD_FADE_TOOLTIP: "#T $SETTING_MESH_LOD_FADE$\n#!啟用時，3D模型會在你縮放時於不同細節層級（LOD）之間平滑轉換。\n\n關閉此選項可能會提升效能。"
 SETTING_PROVINCE_NAMES_TOOLTIP: "決定城市與省份名稱在地圖上的顯示方式。"
 SETTING_FILL_IN_IMPASSABLE_TERRAIN_TOOLTIP: "決定不可通行地形是否包含在地圖上的國家邊界內。"
 SETTING_LANGUAGE_TOOLTIP: "#T $SETTING_LANGUAGE$#!\n決定使用者介面的語言。"
 SETTING_ACCOUNT_EMAIL_TOOLTIP: "你的Paradox帳號電子郵件"
 SETTING_FRAMERATE_CAP: "最高FPS"
 SETTING_FRAMERATE_CAP_TOOLTIP: "#T $SETTING_FRAMERATE_CAP$#!\n遊戲渲染的最高FPS（每秒幀數）。\n\n降低設定可能會減少耗電量。"
 OPTION_CAP_30: "30"
 OPTION_CAP_60: "60"
 OPTION_CAP_90: "90"
 OPTION_CAP_120: "120"
 OPTION_CAP_144: "144"
 OPTION_CAP_165: "165"
 SETTING_TEXTURE_STREAMING: "材質串流"
 SETTING_TEXTURE_STREAMING_TOOLTIP: "#T $SETTING_TEXTURE_STREAMING$#!\n材質會視需要載入。\n\n降低GPU記憶體使用量，但會增加一些CPU時間負擔。對記憶體較少的GPU可能會提升效能。"
 SETTING_TEXTURE_STREAMING_CACHE: "材質串流快取大小"
 SETTING_VALUE_MB: "$VALUE$MB"
 # GUI
 SETTING_ANIMATION_SPEED: "動畫速度"
 SETTING_GUI_SCALING: "GUI縮放"
 SETTING_GUI_SCALING_TOOLTIP: "#T $SETTING_GUI_SCALING$\n#!設定整個使用者介面的縮放比例。對較高螢幕解析度很有用。\n\n#X 設定過高會使介面無法正確顯示在螢幕內！#!"
 SETTING_TOOLS_GUI_SCALING: "工具GUI縮放"
 SETTING_TOOLS_GUI_SCALING_TOOLTIP: "#T $SETTING_TOOLS_GUI_SCALING$\n#!設定工具使用者介面的縮放比例。對較高螢幕解析度很有用。\n\n#X 設定過高會使介面無法正確顯示在螢幕內！#!"

