 hre_circle_levy_request_desc: "請求帝國行政圈為帝國徵召徵召兵。行政圈領袖會因其合作而獲得獎勵。"
 hre_enforce_circle_landfriede: "執行行政圈帝國治安令"
 hre_enforce_circle_landfriede_desc: "賦予行政圈領袖權力，使其在自身領地內執行帝國和平。"
 HRE_CIRCLE_LEVY_CIRCLES_ACTIVE: "帝國行政圈已啟用"

 IMPERIAL_CIRCLES_EVENTS_FLAVOR: "帝國行政圈"

 imperial_circles.1.title: "帝國行政圈建立"
 imperial_circles.1.desc: "形成期已經結束。帝國行政圈已被固定，其領袖將治理帝國事務。神聖羅馬帝國的新篇章由此展開。"
 imperial_circles.1.a: "為了帝國的榮耀！"

 imperial_circles.2.title: "資金失蹤"
 imperial_circles.2.desc: "在最近的帝國議會中，我們行政圈支持了帝國憲制改革提案。這份支持伴隨著行政圈成員之間的普遍理解：我們身為行政圈領袖，將向他們分配資金。無論是否合理，我們未能回應這些期待，已引發數起關於我們濫用權力、扣留本應給予行政圈成員資金的抱怨。如果我們不處理這些抱怨，未來可能會嚴重損害我們的領導權。"
 imperial_circles.2.a: "他們說得對，我們現在就該分發資金。"
 imperial_circles.2.b: "他們弄錯了，根本不存在這種賄賂。"
 imperial_circles.2.c: "向我們在[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetNameWithNoTooltip]的朋友求助。"

 imperial_circles.11.title: "行政圈中的不滿"
 imperial_circles.11.desc: "我們的行政圈成員正變得躁動不安。如果我們不儘快採取行動，我們作為行政圈領袖的權威可能會遭到公開挑戰。"
 imperial_circles.11.a: "分發緊急資金以緩解緊張。"
 imperial_circles.11.b: "讓他們抱怨吧——我們有更大的憂慮。"

 imperial_circles.12.title: "諸侯要求改變"
 imperial_circles.12.desc: "行政圈內的挫折感已達到臨界點。我們的成員正公開質疑我們的領導權。一場選舉或許即將到來。"
 imperial_circles.12.a: "我們必須在為時已晚前行動。"

 imperial_circles.20.title: "我們的投票被收買"
 imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName]已向我們帝國行政圈的領袖[SCOPE.sCountry('target').GetName]支付金錢，使其支持目前提交帝國議會的提案。我們已收到[SCOPE.GetValue('received_bribe')|0V]@gold!作為自己的份額，而我們在目前決議中的[vote|e]如今會鎖定為皇帝的選擇，直到決議結束為止。"
 imperial_circles.20.a: "這筆金錢不會被拒絕。"

 imperial_circles.50.title: "挑戰行政圈領導權"
 imperial_circles.50.desc: "我們已站出來挑戰[recipient.GetName]對我們帝國行政圈的領導權。\n\n他們的軟弱與疏忽已無法再被容忍，許多人必然會支持我們的抱怨。如果我們能展現出自己顯然是更好、更強的領袖，他們將向我們的要求退讓；但若做不到，無疑會損害外國與我國人民對我們的看法。"
 imperial_circles.50.a: "推動挑戰。"
 imperial_circles.50.b: "撤回挑戰。"
 imperial_circles.53.title: "挑戰失敗"
 imperial_circles.53.desc: "我們對[recipient.GetName]帝國行政圈領導權的挑戰已告失敗。我們的威望未能與對方相比，而我們的地位也因這次嘗試受損。我們必須等待，才能再次推動此事。"
 imperial_circles.53.a: "我們將等待時機。"

 imperial_circles.51.title: "被罷免行政圈領袖"
 imperial_circles.51.desc: "一名對手成功挑戰了我們的領導權。我們已被剝奪行政圈領袖頭銜，必須重建自己在行政圈內的地位。"
 imperial_circles.51.a: "這份羞辱不會被遺忘。"

 imperial_circles.52.title: "行政圈領導權獲得維持"
 imperial_circles.52.desc: "一名挑戰者試圖推翻我們，但其威望不足。作為行政圈領袖的地位仍然穩固。"
 imperial_circles.52.a: "我們的權威沒有這麼容易被打破。"

 imperial_circles.70.title: "當選行政圈領袖"
 imperial_circles.70.desc: "隨著前任領袖不再位居我們行列之中，行政圈轉而期望我們承擔領導權。我們如今已是行政圈領袖。"
 imperial_circles.70.a: "我們將卓然領導行政圈。"

 imperial_circles.71.title: "行政圈缺乏領袖"
 imperial_circles.71.desc: "某個帝國行政圈已沒有合格候選人能承擔領導權。當行政圈無人治理時，皇帝的權威也會受到削弱。"
 imperial_circles.71.a: "我們必須親自任命某人。"

 imperial_circles.80.title: "帝冠改變一切"
 imperial_circles.80.desc: "我們如今戴上了帝冠。作為皇帝，我們不能同時擔任行政圈領袖——這兩個職位都要求全心效忠。我們將放棄行政圈領導權，好讓他人挺身而出。"
 imperial_circles.80.a: "帝國必須優先。"