 request_circle_privilege_members_tt: "我們[imperial_circle|e]的每位成員都會獲得[ShowModifier('granted_circle_privilege')]，持續5年。"

 distribute_imperial_grant: "分發帝國撥款"
 distribute_imperial_grant_desc: "從你的國庫向行政圈成員分發金錢，改善關係與行政圈滿意度。"
 distribute_imperial_grant_act: "向你的行政圈成員分發金錢。"
 distribute_imperial_grant_tt: "我們花費[SCOPE.GetValue('total_grant')|2V]@gold!（我們[economical_base|e]的20%），平均分配給我們[imperial_circle|e]中的非領袖成員。每位受領者都會獲得[ShowModifier('received_imperial_circle_grant')]，持續2年，並獲得對我們的[ShowBiasValue('opinion_received_imperial_grant')|+=2][opinion|e]。"
 distribute_imperial_grant_effect_text: "[SCOPE.sCountry('actor').GetName]向其行政圈分發帝國撥款。"
 distribute_imperial_grant_effect_text_past: "[SCOPE.sCountry('actor').GetName]已向其行政圈分發帝國撥款。"

 demand_circle_loyalty: "要求行政圈效忠"
 demand_circle_loyalty_desc: "向我們的行政圈成員宣示權威。我們會獲得3年的威望與外交地位，但成員會怨恨這種強加行為，行政圈滿意度也會下降。"
 demand_circle_loyalty_act: "向你的行政圈成員宣示權威。"
 demand_circle_loyalty_tt: "我們會獲得[ShowModifier('imposed_circle_authority')]，持續3年。我們[imperial_circle|e]中的每位非領袖成員都會獲得[ShowModifier('pressured_circle_loyalty')]，持續3年，並獲得對我們的[ShowBiasValue('opinion_demanded_loyalty')|+=2][opinion|e]。行政圈滿意度降低5。"
 demand_circle_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName]要求其行政圈效忠。"
 demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName]已要求其行政圈效忠。"

 reform_coinage_in_circle: "改革行政圈鑄幣"
 reform_coinage_in_circle_desc: "帝國已將地區鑄幣的權限交到我們手中。改革我們的貨幣及其使用方式，將有助於行政圈每位成員的經濟流通，同時提升我們在行政圈內的地位。不幸的是，這會以我們自身鑄幣能力為代價。"
 reform_coinage_in_circle_act: "改革我們行政圈內的鑄幣制度。"
 reform_coinage_in_circle_tt: "我們將獲得[ShowModifier('reformed_circle_coinage_leader')]，而我們行政圈的每位成員都會獲得[ShowModifier('reformed_circle_coinage_member')]，持續5年。每位行政圈成員都會獲得對我們的[ShowBiasValue('opinion_reformed_circle_coinage')|+=2][opinion|e]，且我們會使行政圈滿意度提高5。"
 reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName]改革其行政圈的鑄幣制度。"
 reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName]已改革其行政圈的鑄幣制度。"

 reduction_of_circle_titles: "削減行政圈頭銜"
 reduction_of_circle_titles_desc: "我們的行政圈已變得低效，並陷入彼此掣肘的頭銜與行政職位之中。削減這些頭銜不僅能確保行政圈效率，也能鞏固我們作為領袖的地位。這種頭銜集中化不會受到行政圈成員歡迎，並會降低他們的滿意度。"
 reduction_of_circle_titles_act: "執行行政圈頭銜削減"
 reduction_of_circle_titles_tt: "我們將獲得[ShowModifier('reduction_of_circle_titles')]，而每位行政圈成員都會獲得對我們的[ShowBiasValue('opinion_reduction_of_circle_titles')|+=2][opinion|e]。行政圈滿意度將降低5。"
 reduction_of_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName]執行行政圈頭銜削減"
 reduction_of_circle_titles_text_past: "[SCOPE.sCountry('actor').GetName]已執行行政圈頭銜削減"

 challenge_circle_leadership: "挑戰行政圈領導權"
 challenge_circle_leadership_desc: "我們目前的行政圈領袖已證明自己不配擔任此職與承擔其責任。我們有機會質疑其權力並削弱其權威，這可能使其掌控進一步動搖，甚至引發直接的公開反對。"
 challenge_circle_leadership_act: "挑戰目前行政圈領袖的權威。"
 challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName]挑戰行政圈領導權。"
 challenge_circle_leadership_effect_text_past: "[SCOPE.sCountry('actor').GetName]已挑戰行政圈領導權。"
 challenge_circle_leadership_tt: "若符合以下任一情況，我們就會贏得挑戰：\n  • 我們行政圈的滿意度低於15——公開叛亂\n  • 我們行政圈的滿意度低於30，且我們的威望至少與對方一樣高\n  • 我們的威望比對方高出25或更多\n\n失敗或撤回將花費威望。新任領袖在2年內免受挑戰。"

 appeal_to_emperor: "向皇帝求助"
 appeal_to_emperor_desc: "向皇帝求助，請其介入你的行政圈領導權爭端。"
 appeal_to_emperor_act: "向皇帝求助，請其介入你的行政圈領導權爭端。"
 appeal_to_emperor_effect_text: "[SCOPE.sCountry('actor').GetName]向皇帝求助。"
 appeal_to_emperor_effect_text_past: "[SCOPE.sCountry('actor').GetName]已向皇帝求助。"
 appeal_to_emperor_reject_effect_text: "[SCOPE.sCountry('recipient').GetName]駁回[SCOPE.sCountry('actor').GetName]的求助。"
 appeal_to_emperor_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName]已駁回[SCOPE.sCountry('actor').GetName]的求助。"
 INCOMING_OFFER_appeal_to_emperor: "[SCOPE.sCountry('actor').GetName]請求我們介入其帝國行政圈的領導權爭端。接受會使其行政圈滿意度降低8、懲罰行政圈領袖的威望，並使我們獲得威望與帝國權威。\n\n$INFO$"
 INCOMING_OFFER_TITLE_appeal_to_emperor: "$appeal_to_emperor$"

