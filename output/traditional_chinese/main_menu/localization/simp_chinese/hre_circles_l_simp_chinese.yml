 join_an_imperial_circle: "加入帝國行政圈"
 join_an_imperial_circle_desc: "在形成期期間加入帝國行政圈。"
 join_an_imperial_circle_act: "加入[SCOPE.sImperialCircle('target').GetName]。"
 join_an_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName]加入[SCOPE.sImperialCircle('target').GetName]。"
 join_an_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName]已加入[SCOPE.sImperialCircle('target').GetName]。"

 bribe_imperial_circle: "賄賂帝國行政圈"
 bribe_imperial_circle_desc: "向帝國行政圈領袖及其行政圈每位成員支付金錢，使其在帝國議會中投票支持我們的提案。行政圈領袖會收到完整基礎賄款，而其他每位成員則會收到該金額的25%。每位成員的投票都會鎖定為皇帝的選擇，直到決議結束為止。"
 bribe_imperial_circle_act: "賄賂[SCOPE.sCountry('target').GetName]支持我們的議會提案。"
 bribe_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName]賄賂[SCOPE.sCountry('target').GetName]的行政圈支持帝國提案。"
 bribe_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName]已賄賂[SCOPE.sCountry('target').GetName]的行政圈支持帝國提案。"
 bribe_imperial_circle_members_tt: "[SCOPE.sCountry('target').GetName]行政圈中的其他每位成員都會收到[SCOPE.GetValue('bribe_member_share')|0V]@gold!，且其在目前帝國議會提案中的[vote|e]會鎖定為皇帝的選擇。"
 BRIBE_IMPERIAL_CIRCLE_CTRL_HINT: "賄賂整個[imperial_circle|E]"

 approve_imperial_circle_proposal: "支持提案"
 approve_imperial_circle_proposal_desc: "作為行政圈領袖，鎖定此行政圈每位成員（包括我們自己）的投票，使其支持目前提交帝國議會的提案。不需要支付金錢，但鎖定會持續到決議結束為止。"
 approve_imperial_circle_proposal_act: "策動[SCOPE.sImperialCircle('target').GetName]投票支持提案。"
 approve_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName]策動[SCOPE.sImperialCircle('target').GetName]投票支持帝國提案。"
 approve_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName]已策動[SCOPE.sImperialCircle('target').GetName]投票支持帝國提案。"
 approve_imperial_circle_proposal_members_tt: "[SCOPE.sImperialCircle('target').GetName]的每位成員，其在目前帝國議會提案中的[vote|e]都會鎖定為提議政策。"

 oppose_imperial_circle_proposal: "反對提案"
 oppose_imperial_circle_proposal_desc: "作為行政圈領袖，鎖定此行政圈每位成員（包括我們自己）的投票，使其反對目前提交帝國議會的提案。若已有目前政策紀錄，投票會鎖定為目前政策；否則行政圈將棄權。"
 oppose_imperial_circle_proposal_act: "策動[SCOPE.sImperialCircle('target').GetName]投票反對提案。"
 oppose_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName]策動[SCOPE.sImperialCircle('target').GetName]投票反對帝國提案。"
 oppose_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName]已策動[SCOPE.sImperialCircle('target').GetName]投票反對帝國提案。"
 oppose_imperial_circle_proposal_members_tt: "[SCOPE.sImperialCircle('target').GetName]的每位成員，其在目前帝國議會提案中的[vote|e]都會鎖定為目前政策；若沒有目前政策紀錄，則鎖定為棄權。"

 call_imperial_circle_to_war: "召喚行政圈參戰"
 call_imperial_circle_to_war_desc: "召喚行政圈領袖，讓其行政圈為你目前的戰爭提供軍事支援。"
