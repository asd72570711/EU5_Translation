 INCOMING_OFFER_appeal_to_circle_diet: "[SCOPE.sCountry('actor').GetName]請求向其提供財政援助。接受會給予他們我們年收入的五分之一，並使其顯得更加正統。拒絕此提議將降低我們行政圈的滿意度。\n\n$INFO$"
