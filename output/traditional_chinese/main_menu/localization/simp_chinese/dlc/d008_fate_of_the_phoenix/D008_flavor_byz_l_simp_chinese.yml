l_simp_chinese:

 d008_flavor_byz.1.title: "煉金術的承諾"
 d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
 d008_flavor_byz.1.desc: "過去，希臘火聞名整個地中海，甚至遠播更遠之地；它令敵方所有海軍畏懼，最終成為傳奇。它能在水面上燃燒得比任何火焰都熾熱，且無法以常規手段撲滅，幾乎能在瞬間將任何船艦化為灰燼。其製造方法一直是我國嚴密守護的秘密，但時光無情，這項知識也從我們手中失傳，使我們無法像過去那樣製造希臘火。\n\n如今，我國最傑出的煉金術師之一[target_artist.GetName]向我們保證，[target_artist.GetSheHe]能找回失傳的配方並加以重現。若此言屬實，我們或許能再次以致命烈焰武裝艦隊。我方[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]都對此消息感到興奮，但若要真正完成研發，[target_artist.GetNameWithNoTooltip]需要我們提供資金進行[target_artist.GetHerHis]實驗。"
 d008_flavor_byz.1.a: "[target_artist.GetSheHe|U]需要什麼，就給[target_artist.GetSheHe]什麼！"
 d008_flavor_byz.1.b: "沒有過去那些幻想，我們的海軍也已經足夠強大。"
 d008_flavor_byz.1.a.tt: "[target_artist.GetName]將進行實驗，尋找希臘火的配方"

 d008_flavor_byz.2.title: "追尋火焰"
 d008_flavor_byz.2.desc: "[target_artist.GetName]讓[target_artist.GetHerselfHimself]閉門躲在[target_artist.GetHerHis]實驗室中尋找希臘火配方已有一段時間，但截至目前，[target_artist.GetSheHe]唯一得到的成果只有一連串夜間爆炸，以及幾根燒焦的眉毛。[target_artist.GetHerHis|U]顯然無能，已使許多人懷疑[target_artist.GetSheHe]是否真能完成[target_artist.GetHerHis]事業；但[target_artist.GetSheHe]向我們保證，[target_artist.GetSheHe]已接近突破，只差一點時間與資金。"
 d008_flavor_byz.2.a: "很好，再提供一筆資金給[target_artist.GetHerHim]。"
 d008_flavor_byz.2.b: "我們受夠這些幻想了。"
 d008_flavor_byz.2.a.tt: "[target_artist.GetName]將繼續[target_artist.GetHerHis]尋找希臘火的配方"

 d008_flavor_byz.3.title: "希臘火"
 d008_flavor_byz.3.desc: "[ROOT.GetCountry.GetCapital.GetName]的居民曾多次因[target_artist.GetName]實驗引發的爆炸而從睡夢中驚醒。[target_artist.GetHerselfHimself]也曾多次在實驗中受傷，但所有艱辛終於結出果實。經歷無數試驗與錯誤後，[target_artist.GetSheHe]已成功可靠地重現歷史記載中的希臘火。如今我們可以擴大產量，並為船艦裝備希臘火。雖然我們仍會對確切配方與製造方法保密，但這次必須確保自己不會再次忘記如何製造。"
 d008_flavor_byz.3.a: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]海軍將再次焚燒大海！"
 unlocked_greek_fire_tt: "我們解鎖了[ShowUnitDefinitionName('n_greek_fire_galley_renaissance')]、[ShowUnitDefinitionName('n_greek_fire_galley_discovery')]、[ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')]與[ShowUnitDefinitionName('a_greek_fire_discovery_infantry')][unit_types|e]的使用權"
 
 d008_flavor_byz.5.title: "改革塔格馬塔"
 d008_flavor_byz.5.entry: "$d008_flavor_byz.5.title$"
 d008_flavor_byz.5.desc: "將[ROOT.GetCountry.GetAdjective]國家推向毀滅邊緣的苦難終於過去。在承受最沉重負擔的人之中，便有直接向[ROOT.GetCountry.GetGovernment.GetRulerTitle]宣誓效忠的古老職業軍團塔格馬塔。它們早已遠不如昔日輝煌，但正是這支有別於封建徵召兵、持續存在的常備軍，讓我們得以存續。\n\n局勢恢復穩定後，[target_character.GetName]將[target_character.GetHerHis]注意力轉向接下來的工作。塔格馬塔必須徹底改革：恢復帝國資助、加強紀律，並重拾使命感，使[ROOT.GetCountry.GetAdjectiveWithNoTooltip]軍團不僅名義上，而是在實質上超越普通徵召兵。危機在逆境中鍛造的一切，和平將把它淬鍊成真正配得上[ROOT.GetCountry.GetLongNameWithNoTooltip]的事物。"
 d008_flavor_byz.5.a: "讓塔格馬塔重生成為[ROOT.GetCountry.GetNameWithNoTooltip]的先鋒。"
 d008_flavor_byz.5.a.entry: "讓塔格馬塔重生成為羅馬的先鋒。"
 d008_flavor_byz.5.b: "這些軍團已在熔爐中證明了自己。"
 variable_won_fate_of_the_phoenix_disaster_variable_tt: "[ShowDisasterName('fate_of_the_phoenix')]已被克服"

 d008_flavor_byz.4.title: "[target.GetNameWithNoTooltip]的追尋終結"
 d008_flavor_byz.4.desc: "[target.GetName]英年早逝，不幸使[target.GetHerHis]尋找希臘火的工作無疾而終。[target.GetHerHis|U]門徒與其他傑出煉金術師查看[target.GetHerHis]筆記，試圖挽救並延續[target.GetHerHis]研究，但[target.GetHerHis]的實驗似乎一直兜圈子，沒有任何具體成果可循。希臘火就此永遠成為封存於歷史中的謎團。"
 d008_flavor_byz.4.a: "唉……算了，總之……"

 d008_flavor_byz.6.title: "鳳凰重生"
 d008_flavor_byz.6.entry: "$d008_flavor_byz.6.title$"
 d008_flavor_byz.6.desc: "曾經只是緊守黑海沿岸、脆弱的繼承國，[ROOT.GetCountry.GetName]如今完成了昔日難以想像的成就。[ShowLocationName('constantinople')]已在我方手中，[ShowCultureGroupName('turkic_group')]入侵者已被逐出[ShowRegionName('anatolia_region')]廣袤土地，而[ROOT.GetCountry.GetLongNameWithNoTooltip]也恢復了古老榮光。[ROOT.GetCountry.GetGovernment.GetCourtTitle]的學者私下耳語，[ROOT.GetCountry.GetFlavorRank]已如鳳凰般從自己的灰燼中再次崛起。\n\n[target_character.GetName]如今完全繼承了羅馬遺產。復興的考驗不亞於先祖在最黑暗時刻所經歷的磨難，因此，那些曾只保留給撐過大災難者的制度、特權與野心，如今都因征服與復興而理所當然地歸於我方。"
 d008_flavor_byz.6.a: "帝國再次從灰燼中崛起。"
 tre_restored_empire_unlocks_tt: "我們解鎖了[ShowBureaucracyTypeName('allelengyon_bureaucracy')]與[ShowBureaucracyTypeName('kephalai_bureaucracy')][bureaucracies|e]、[ShowBuildingTypeName('hippodrome')][building|e]，以及[ShowGovernmentReformName('katepanata')]與[ShowGovernmentReformName('kritai_katholikoi_reformed')][government_reforms|e]的永久加成"
 tre_unlock_phoenix_cabinet_actions_tt: "我們永久解鎖[ShowCabinetActionName('spread_philhellenism')]與[ShowCabinetActionName('encourage_latin_militarism')][cabinet_actions|e]"
