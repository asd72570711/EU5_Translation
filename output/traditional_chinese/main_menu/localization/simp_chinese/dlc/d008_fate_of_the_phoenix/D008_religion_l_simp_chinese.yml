l_simp_chinese:

 # Hellenism

 #Religious Aspects
 civic_religion_aspect: "城邦宗教"
 civic_religion_aspect_desc: "敬奉諸神便等同於維繫國家的福祉。因此，宗教儀式與典禮是我們必須履行的公民義務，以確保我們城邦的繁榮。"

 hero_cult_aspect: "英雄崇拜"
 hero_cult_aspect_desc: "我們的歷史充滿了塑造我國社會與性格的強大人物。他們是諸神的凡人之子，是擁有非凡能力、往往遭逢悲劇命運的人類，並曾守護與引領我們的祖先建立今日偉大的國家。如今，崇拜他們並學習他們的教誨，便是我們的責任。"

 dionysian_mysteries_aspect: "狄俄尼索斯秘儀"
 dionysian_mysteries_aspect_desc: "入會者在狄俄尼索斯秘儀中進行的儀式、舞蹈與音樂，能為其成員帶來解放與釋放，且不分社會階級。神明的死亡與重生，映照著葡萄藤的循環：自大地生長、化為美酒，最後由信徒飲下，以榮耀狄俄尼索斯。"

 eleusinian_mysteries_aspect: "艾盧西斯秘儀"
 eleusinian_mysteries_aspect_desc: "艾盧西斯秘儀的信徒追隨著珀耳塞福涅被冥王黑帝斯從其母得墨忒耳身邊擄走，隨後又被釋放與欺瞞的神話。對入會者而言，這則神話象徵著一切植物生命的生長與重生循環，以及生命從一代流向下一代的永恆。"

 samothracian_mysteries_aspect: "薩莫色雷斯秘儀"
 samothracian_mysteries_aspect_desc: "在薩莫色雷斯島上，一支秘儀崇拜曾在希臘化時代鼎盛時繁榮興盛；它以接納任何想加入者聞名，無論其社會階級為何。據說許多神話英雄，如海克力斯、伊阿宋與俄耳甫斯，都曾在薩莫色雷斯接受入會儀式。我們可以從遺跡與廢墟中蒐集並重建這些秘儀，使這一崇拜重返昔日榮光。"

 olympiad_aspect: "奧林匹克運動會"
 olympiad_aspect_desc: "奧林匹克運動會是對諸神的慶典，也是展現我國力量與團結的舞台。參與競技會是一項公民義務，能為我們的運動員帶來榮耀。"

 mithraic_mysteries_aspect: "密特拉秘儀"
 mithraic_mysteries_aspect_desc: "自稱辛德希歐耶的密特拉秘儀入會者，在羅馬與帝國鼎盛時期的西羅馬帝國都廣受歡迎。他們的儀式、集會與宴飲都在祕密的地下神殿中進行，但我們可以將其重新帶回光明之下，並為我國人民的利益復興其傳統。"
 
 imperial_cult_aspect: "帝國崇拜"
 imperial_cult_aspect_desc: "正如古羅馬皇帝曾被人民與元老院視為神聖，我們的統治者及其王朝也應被如此看待。他們的偉大、威嚴與權威清楚表明，他們不僅獲得神聖認可，更是神明本身。"

 dii_familiares_aspect: "家神"
 dii_familiares_aspect_desc: "家庭與親族之神在我國人民生活中扮演著極為重要的角色。他們守護並影響著一個人領域中發生的一切，通常包括家庭，也可能涵蓋道路、街區，甚至整座城市。"

 mos_maiorum_aspect: "祖宗之法"
 mos_maiorum_aspect_desc: "這套不成文的準則曾自古代至帝國鼎盛時期支配羅馬人的生活，即「祖先之道」。這套傳統與實踐定義了何謂羅馬人，以及在家中與公共場合應如何行事。"

 monism_aspect: "一元論"
 monism_aspect_desc: "我們復興中的哲學家主張，萬有皆流出自太一——一個超越性的唯一原理，所有神祇與萬物皆由其流溢而出。傳統萬神殿成為寓言；諸神則是太一的各種面向。神諭失去其特定力量，但對太一的信仰滲透於每一項治理行動之中。"

#Omens

 #Zeus
 the_thunderer_omen: "雷霆者"
 the_thunderer_omen_desc: "天空因閃電與雷鳴而怒起，任何反對我們的人都將畏懼退縮。"
 supreme_of_gods_omen: "眾神至尊"
 supreme_of_gods_omen_desc: "熾烈的太陽昭示我們得到了眾神中最強大者的眷顧。無人會質疑我們的榮耀！"
 monarch_of_the_sky_omen: "天空君主"
 monarch_of_the_sky_omen_desc: "一群鳥振翅高飛，回應[ShowGodName('zeus_god')]，並承載他的意志。"
 omnipotence_of_heaven_omen: "天穹全能"
 omnipotence_of_heaven_omen_desc: "我們真正置身於[ShowGodName('zeus_god')]的臨在之中，能感受到他的力量，以及對他而言無事不可能。"
 the_liberator_omen: "解放者"
 the_liberator_omen_desc: "[ShowGodName('zeus_god')]的力量曾幫助我們的祖先對抗波斯的壓迫；他也將使我們掙脫枷鎖。"
 the_bountiful_one_omen: "豐饒者"
 the_bountiful_one_omen_desc: "所有仰望[ShowGodName('zeus_god')]的人都將分享他的力量，並從他的豐盛中獲得回報。"
 the_holy_omen: "神聖者"
 the_holy_omen_desc: "沒有什麼比置身於至高神明的臨在，並獲得他的眷顧更加神聖。"
 king_of_all_omen: "萬物之王"
 king_of_all_omen_desc: "[ShowGodName('zeus_god')]是神明中的最高權威，正如我們的統治者高於我國人民。"
 immortal_omen: "不朽者"
 immortal_omen_desc: "神明怎可能被殺死？有[ShowGodName('zeus_god')]庇護，我們的軍隊又怎會失敗？"
 splendor_omen: "光輝"
 splendor_omen_desc: "晴朗的天空展現了[ShowGodName('zeus_god')]的榮耀不容置疑。他對我們展現的眷顧，將為全世界所見。"

 #Aphrodite
 mother_of_love_omen: "愛之母"
 mother_of_love_omen_desc: "愛自[ShowGodName('aphrodite_god')]滿溢而出，我們的民眾也將沐浴於同樣的愛中。"
 the_foam_born_omen: "泡沫所生者"
 the_foam_born_omen_desc: "孕育[ShowGodName('aphrodite_god')]的海中泡沫拍打著我國海岸，而她始終慈愛地引領我們的船隻穿越其間。"
 the_seductress_omen: "誘惑者"
 the_seductress_omen_desc: "愛與誘惑是[ShowGodName('aphrodite_god')]的領域，她的技藝與眷顧將使許多人轉向我們。"
 giver_of_joy_omen: "喜悅賜予者"
 giver_of_joy_omen_desc: "沒有什麼比置身於美之女神的臨在，並獲得她的眷顧更加幸福。"
 nurturer_of_children_omen: "孩童撫育者"
 nurturer_of_children_omen_desc: "女神的愛沒有比對孩童的愛更進一步的展現，而她慈母般的愛也延伸至我們所有人。"
 the_beautiful_omen: "美麗者"
 the_beautiful_omen_desc: "作為最美麗的女神，[ShowGodName('aphrodite_god')]吸引了眾多同情者，而我們也將在她的眷顧下如此。"
 the_secretive_omen: "隱祕者"
 the_secretive_omen_desc: "並非所有愛都應公開。謹慎與祕密同樣是女神的工具。"
 the_harmonizer_omen: "調和者"
 the_harmonizer_omen_desc: "[ShowGodName('aphrodite_god')]的愛平等地分享給所有人，我們對人民的愛也應如此。"
 the_lover_of_laughter_omen: "愛笑者"
 the_lover_of_laughter_omen_desc: "[ShowGodName('aphrodite_god')]的容顏總是帶著微笑；我們也應如此。"
 the_desired_omen: "受渴望者"
 the_desired_omen_desc: "作為最美麗的女神，[ShowGodName('aphrodite_god')]在所有人心中激起渴望。因此，獲得她的眷顧將吸引他人靠近。"

 #Poseidon
 tempest_omen: "暴風"
 tempest_omen_desc: "神聖的怒火攪動海水，釋放出足以挑戰最勇敢航海者的風暴。"
 lord_of_the_sea_omen: "海洋之主"
 lord_of_the_sea_omen_desc: "統治海洋便意味著支配世界。"
 protector_of_horses_omen: "馬匹守護者"
 protector_of_horses_omen_desc: "在萬馬神聖之父的眷顧下，我們自己的坐騎也將茁壯強健。"
 wielder_of_the_trident_omen: "三叉戟持有者"
 wielder_of_the_trident_omen_desc: "沒有比海神之武器更具象徵性的兵器；它證明多叉攻勢才是最佳選擇。"
 earth_shaker_omen: "撼地者"
 earth_shaker_omen_desc: "正如他擊打大地創造泉水，踏上我國土地的敵人也將遭受打擊。"
 leader_of_the_nymphs_omen: "寧芙領袖"
 leader_of_the_nymphs_omen_desc: "[ShowGodName('poseidon_god')]的眷顧也帶來他的寧芙之眷顧，她們將賜福我國所有水域與泉源。"
 the_watcher_omen: "守望者"
 the_watcher_omen_desc: "[ShowGodName('poseidon_god')]的目光無所不在，遍及所有海洋與水域，沒有任何事物能逃過他的注視。"
 the_graceful_omen: "優雅者"
 the_graceful_omen_desc: "海洋與波浪中蘊含著美，而正確地沉思它們，能使心靈變得美麗。"
 master_of_the_waves_omen: "浪濤之主"
 master_of_the_waves_omen_desc: "未得[ShowGodName('poseidon_god')]允許，無人得以航行大海。"
 dark_blue_haired_omen: "深藍髮者"
 dark_blue_haired_omen_desc: "浪濤是神明自身的藍髮，在他的眷顧下，我們的船隻將迅速航行其上。"
 #Hermes
 messenger_omen: "信使"
 messenger_omen_desc: "有翼之踵總能迅速且安全地傳遞任何訊息。"
 golden_wand_omen: "金杖持有者"
 golden_wand_omen_desc: "商神杖曾被用來分開兩條蛇，但能分開之物，也能連結彼此。"
 god_of_travelers_omen: "旅人之神"
 god_of_travelers_omen_desc: "所有旅人與漂泊商人都會向[ShowGodName('hermes_god')]尋求安全與庇護。"
 protector_of_merchants_omen: "商人守護者"
 protector_of_merchants_omen_desc: "在[ShowGodName('hermes_god')] 殷切注視之下，商人將安全且滿載地穿越我國土地。"
 wing_footed_omen: "有翼足者"
 wing_footed_omen_desc: "[ShowGodName('hermes_god')]的眷顧將使我們的軍隊如神明本身一般迅速移動。"
 trickster_omen: "騙術師"
 trickster_omen_desc: "風向的變化顯示即便[ShowGodName('hermes_god')]也有反覆無常的一面，而萬物皆受變化與欺瞞支配。"
 patron_of_thieves_omen: "盜賊庇護者"
 patron_of_thieves_omen_desc: "迅捷可以用於善行，也可以用於惡行，但無論如何，這都是值得擁有的優點。"
 president_of_games_omen: "競技會主席"
 president_of_games_omen_desc: "[ShowGodName('hermes_god')]的眷顧降臨於體育競技會，為我們帶來娛樂與健康的活動。"
 guardian_of_the_gates_omen: "門扉守護者"
 guardian_of_the_gates_omen_desc: "所有道路與旅人遲早都會穿過一道門，而它將允許其通行，或阻擋其去路。"
 giver_of_wealth_omen: "財富賜予者"
 giver_of_wealth_omen_desc: "在[ShowGodName('hermes_god')]的庇佑下，貿易不僅是貨物的流動，也是財富的流動。"
 #Ares
 throng_of_battle_omen: "戰陣喧囂"
 throng_of_battle_omen_desc: "在每場衝突、每次爭鬥中，[ShowGodName('ares_god')]都棲身其間，而決定其結果的正是他的意志。"
 insatiable_at_war_omen: "戰爭無饜者"
 insatiable_at_war_omen_desc: "[ShowGodName('ares_god')]沉醉於戰鬥之中，戰鬥越漫長、越血腥，越能贏得他的眷顧。"
 slayer_of_men_omen: "殺人者"
 slayer_of_men_omen_desc: "[ShowGodName('ares_god')]的怒火將伴隨我們的人奔赴戰場，而他的力量也將注入他們的臂膀。"
 plague_of_mankind_omen: "人類災禍"
 plague_of_mankind_omen_desc: "無人膽敢面對戰神，還夢想能活到明日。"
 warrior_omen: "戰士"
 warrior_omen_desc: "單純的屠戮不足以滿足戰士之神，唯有光榮的戰鬥才可以。"
 audacious_omen: "大膽者"
 audacious_omen_desc: "衝向戰鬥、重創敵人，必能確保[ShowGodName('ares_god')]的眷顧，並贏得他的恩典。"
 blood_soaked_omen: "浴血者"
 blood_soaked_omen_desc: "敵人的鮮血將被灑落，獻給那位索求鮮血的神明。" #Blood for the Blood God!
 malignant_omen: "惡毒者"
 malignant_omen_desc: "只要能確保敵人毀滅，任何策略都不算太卑劣。"
 indestructible_omen: "不毀者"
 indestructible_omen_desc: "[ShowGodName('ares_god')]不僅持矛攻擊敵人，也持盾守護自身。"
 fickle_lord_of_war_omen: "反覆無常的戰爭之主"
 fickle_lord_of_war_omen_desc: "戰爭與戰鬥可能在任何時刻逆轉，但[ShowGodName('ares_god')]的眷顧將確保它們轉向有利於我們的一方。"
 #Athena
 unseen_hand_omen: "無形之手"
 unseen_hand_omen_desc: "沒有任何計畫僅因偶然而失敗；諸天會誘使入侵指揮官做出糟糕決策。巡邏隊被引入伏擊，補給線遭到擾亂，隊長們也被嚴重誤導。"
 unwavering_omen: "堅定者"
 unwavering_omen_desc: "正如[ShowGodName('athena_god')]驕傲且不可動搖地屹立，我們也將不受任何疲憊所動搖。"
 she_who_fights_in_front_omen: "前線作戰者"
 she_who_fights_in_front_omen_desc: "迅速迎向敵人並正面交鋒，是解決他們最快的方法。"
 the_industrious_omen: "勤勉者"
 the_industrious_omen_desc: "勤勉並專注於自己的工作，是獲得利潤與正面成果的最佳方式。"
 the_judge_omen: "審判者"
 the_judge_omen_desc: "在[ShowGodName('athena_god')]殷切的注視與智慧之下，沒有罪行會逍遙法外，也沒有無辜者會遭受不公傷害。"
 the_chieftain_of_war_omen: "戰爭首領"
 the_chieftain_of_war_omen_desc: "正如螞蟻若無路線可循便會漫無目的地遊蕩，軍隊若無適當領導與指引也將四散。"
 teacher_of_the_waves_omen: "浪濤教師"
 teacher_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')]或許統治浪濤，但[ShowGodName('athena_god')]以船隻馴服了它們。"
 protector_of_the_anchorage_omen: "錨地守護者"
 protector_of_the_anchorage_omen_desc: "作為造船大師，在[ShowGodName('athena_god')]的眷顧下，我們的船隻又怎會不安全？"
 the_bright_eyed_omen: "明眸者"
 the_bright_eyed_omen_desc: "身處貓頭鷹的象徵之下，我們確實承受了[ShowGodName('athena_god')]的眷顧與智慧。"
 the_armed_one_omen: "武裝者"
 the_armed_one_omen_desc: "[ShowGodName('athena_god')]自誕生之時便全副武裝，向我們展示永遠為戰鬥做好準備才是最佳戰略。"
 
 hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip]對我們微笑"
 hellenism_religion.1.desc: "在這些平靜的日子裡，諸神並未將目光從我們身上移開。徵兆出現在奇異的巧合、突如其來的幸運，以及遍布[ROOT.GetCountry.GetGovernment.GetCourtTitle]的日常之中。\n\n祭司宣稱[target_god.GetName]正對我們的[ROOT.GetCountry.GetFlavorRank]與我們敬愛的[target_character.GetNameWithNoTooltip]微笑。的確，看來我們的運勢正在轉變，而我們所奉獻的祭品終於對命運產生了影響！"
 hellenism_religion.1.a: "我們接受這份祝福。"
 fertile_ruler_and_family_tt: "[target_character.GetName]與[consort|e]的[fertility|e]將會提高"

 hellenism_religion.2.title: "[target_character.GetNameWithNoTooltip]之鷹"
 hellenism_religion.2.desc: "關於[target_character.GetName]，我們還能說些什麼呢？其戰術才能正是我國[ROOT.GetCountry.GetFlavorRank]祖先所推崇軍事傳統的光輝典範。論狡智、堅忍與勇氣，少有人能與奧德修斯、伊阿宋或埃阿斯並列。\n\n然而，[target_character.GetShortNameWithNoTooltip]正是我們奉行[ShowReligionAdjective('hellenism_religion')]根源的驕傲成果，是戰場上真正的雄鷹！"
 hellenism_religion.2.a: "[target_character.GetSheHe]會在陰影下作戰嗎？"
 hellenism_religion.2.b: "派[target_character.GetHerHim]去學院任教！"

 hellenism_religion.3.title: "[target_location.GetNameWithNoTooltip]的哲學學派"
 hellenism_religion.3.desc: "人類靈魂從何而來？死後又有什麼等待著我們？人生若作為無羽兩足動物會更好嗎？這些炙熱的問題佔據著[target_location.GetName][ShowBuildingTypeName('university')]中知識分子與哲學家們過度充實的頭腦。\n\n最近，該院系受到了當地一位富裕贊助者的庇護，此人如今請求增加資金，聲稱這些場所確實能幫助傳播創新而前沿的思想。"
 hellenism_religion.3.a: "只要他們不教任何第歐根尼的東西……"
 hellenism_religion.3.b: "他們不能單純想像自己有經費嗎？"

 hellenism_religion.4.title: "給[target_character_2.GetNameWithNoTooltip]的護符"
 hellenism_religion.4.desc: "敵人與仇敵日夜謀劃，要導致我們的覆滅。然而，只要[target_character_2.GetName]還活著，繼承便是安全的。這個孩子將我們整個[ROOT.GetCountry.GetFlavorRank]的未來握在[target_character_2.GetHerHis]纖細的手中。\n\n沐浴在奧林帕斯諸神的光輝之中，[target_character_2.GetShortNameWithNoTooltip]註定成就偉大，這點我們深信不疑。我們宮廷中一位名叫[target_character_3.GetName]的神秘[target_character_3.GetWomanMan]提出願意割愛一枚護身符。據說其中蘊藏一滴神聖精華，能在年幼的[target_character_2.GetShortNameWithNoTooltip]成年以前驅避邪惡。"
 hellenism_religion.4.a: "代[target_character_2.GetShortNameWithNoTooltip]感謝[target_character_3.GetShortNameWithNoTooltip]。"
 hellenism_religion.4.b: "我們不在乎這種迷信！"
 talisman_tt: "給予年幼[target_character_2.GetName]的護符#italic 可能#!保護[target_character_2.GetHerHim]免於疾病相關[events|e]與狩獵意外"
 target_character_3_is_declined_tt: "[target_character_3.GetName]的提議已被禮貌婉拒"

 hellenism_religion.5.title: "[target_province.GetNameWithNoTooltip]慶祝[target_god.GetNameWithNoTooltip]"
 hellenism_religion.5.desc: "喜訊來自[target_province.GetName]，當地人民已走上街頭慶祝[target_god.GetName]。在前所未有的虔誠舉動中，當地人組織了自己的節慶，熱切讚頌近來的好運。\n\n在這一天，即便統治的負擔也顯得輕了些。諸神受到敬奉，人群喧鬧不已，虔敬如奧林帕斯山上的仙饌般遍布全省。"
 hellenism_religion.5.a: "讓該省慶祝吧。"
 every_pop_in_target_province_gains_10_satisfaction_tt: "[target_province.GetName]的我方[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"

 hellenism_religion.6.title: "在最明亮的白晝"
 hellenism_religion.6.desc: "在奧林帕斯諸神的虔誠引導下，[target_character.GetName]的統治已達到前所未有的高度。良好的政策、財富的分享，以及整體穩定而和平的時期，不過是諸神賜予我們的部分恩惠。這確實是我國人民所享有的黃金時代，他們高呼[target_character.GetShortNameWithNoTooltip]之名，使[target_character.GetHerHim]與海克力斯、伯里克利等傳奇人物一同不朽。"
 hellenism_religion.6.a: "將我們的繁榮集中於行政！"
 hellenism_religion.6.b: "讓我們的外交威望統治世界。"
 hellenism_religion.6.c: "我們的敵人將被碾碎！"

 hellenism_religion.7.title: "[ShowGodNameWithNoTooltip('ares_god')]的化身"
 hellenism_religion.7.desc: "烈火、硫磺與染血呼喊的駭人聲響，伴隨著[target_character.GetName]踏上[target_character.GetHerHis]道路。這位[target_character.GetWomanMan]自幼便以能征善戰聞名，且一次又一次展現出終結[target_character.GetHerHis]敵人性命的才能。\n\n如今，部隊將[target_character.GetSheHe]稱為[ShowGodName('ares_god')]的化身，[target_character.GetSheHe]註定要以我們[ROOT.GetCountry.GetFlavorRank]之名蹂躪大地。"
 hellenism_religion.7.a: "[target_character.GetSheHe|U]知道勝利者就是犧牲一切之人。"
 hellenism_religion.7.b: "我們不能冒險釋放如此災難性的力量……"

 hellenism_religion.8.title: "[ShowCultureNameWithNoTooltip('greek_culture')]歷史史詩"
 hellenism_religion.8.desc: "荷馬史詩長久以來一直是文化與識字發展的指引原則，是我國傳統保存下來的瑰寶。\n\n為了紀念這份遺產，[target_character.GetName]挺身而出，提議提供贊助，以出版關於《伊里亞德》與《奧德賽》的研究與著作。[target_character.GetSheHe|U]希望藉由獲准仔細研讀這些傳奇篇章，來榮耀我們光輝的過去。"
 hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hellenism_religion.8.b: "$jurchen_confederation_events.3.b$"

 hellenism_religion.9.title: "富饒的[target_province.GetNameWithNoTooltip]"
 hellenism_religion.9.desc: "顯而易見，[target_province.GetName]享有諸神的眷顧，這從整個省份日益增長的繁榮便可看出。最近，探礦者與當地開發者帶著計畫前來，希望將這份財富集中到該省的城市中心，代價則是周邊村落的利益。此舉將推動都市化進程，但也會剝奪當地人的額外收益。"
 hellenism_religion.9.a: "財富歸於人民！"
 hellenism_religion.9.b: "讓我們集中力量。"
 pops_in_aforementioned_provinces_weak_satisfaction_tt: "上述[provinces|e]中的我方[pops|e]將獲得[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%][pop_satisfaction|e]"

 hellenism_religion.10.title: "[ROOT.GetCountry.Custom('GetDemeterMomName')]的祝福"
 hellenism_religion.10.desc: "相當長一段時間以來，[target_market.GetName]各地的糧倉都享有豐足。這必定是豐收女神[ROOT.GetCountry.Custom('GetDemeterMomName')]對我們微笑的徵兆。我們新獲得的繁榮，是神聖眷顧的最新證明。當地人前來請願，希望分配多餘的食糧，而祭司則建議應追加一份貢獻。"
 hellenism_religion.10.a: "把它交給人民。"
 hellenism_religion.10.b: "諸神應得此物。"
 Demeter_latin_name: "刻瑞斯"
 Demeter_base_name: "得墨忒耳"

 hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip]心生不悅"
 hellenism_religion.11.desc: "在神明無情的注視下，看來[target_god.GetName]對我們極為不滿！深夜的黑暗預兆、徘徊不散的陰影，以及日益加劇的末日感正在我國人民之中蔓延。我們不知道自己做了什麼惹怒如此強大的神祇，而重新獲得其虔誠眷顧的唯一道路，就是謙卑地低頭敬奉神明。"
 hellenism_religion.11.a: "人生便是如此。"
 hellenism_religion.11.b: "立即組織一場大規模貢獻。"

 hellenism_religion.12.title: "怪異之生"
 hellenism_religion.12.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]籠罩在一片寂靜之中。在[ROOT.GetCountry.GetGovernment.GetAdjective]居所牆內的育嬰室裡，[target_character_1.GetName]的一名孩子在驚恐的祈禱與無眠之夜中誕生，而這個孩子將厄運本身帶到了[target_character_2.GetHerHim]身邊。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]稱其為預兆。僕人稱其為詛咒。我們的敵人會稱其為弱點。然而[target_character_2.GetShortName]仍有一息尚存，而如此孽種的命運或許仍將決定我們的血脈……"
 hellenism_religion.12.a: "蠢材！[target_character_2.GetShortNameWithNoTooltip]不過是個孩子！"
 hellenism_religion.12.b: "我們不能冒觸怒神明的風險。"

 hellenism_religion.13.title: "腐敗祭司"
 hellenism_religion.13.desc: "諸神或許永恆，但他們的僕人仍是血肉之軀。我們收到報告稱，[target_character.GetName]一直將[target_character.GetHerHis]神聖職務當作私人錢袋，在本應只有祭品通行之處收受人情與錢幣。\n\n如果我們介入，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]將因受辱與羞辱而怒吼。若我們視而不見，便是在教導我們[ROOT.GetCountry.GetFlavorRank]中的每個陰謀家，虔誠也只不過是另一種買賣，甚至可能冒犯諸神本身。"
 hellenism_religion.13.a: "[target_character.GetHerHis|U]貪婪將毀滅我們所有人！"
 hellenism_religion.13.b: "視而不見。"

 hellenism_religion.14.title: "[target_province.GetNameWithNoTooltip]怠慢[target_god.GetNameWithNoTooltip]"
 hellenism_religion.14.desc: "來自[target_province.GetName]的消息令人憂心。[target_god.GetNameWithNoTooltip]的儀式正被怠慢，祭品遲遲未獻，信徒抱怨神殿大門不再如應有那般開啟。\n\n無論這是懶惰、貧困，還是沉默的反抗，都不太重要。當一位神被說成遭到忽視時，每場不幸很快都會找到一名神聖的罪魁禍首。祭司要求採取行動，而[target_province.GetNameWithNoTooltip]正等待我們的裁決。"
 hellenism_religion.14.a: "以武力徵收他們的虔敬。"
 hellenism_religion.14.b: "我們不會以鞭笞統治。"
 pops_in_target_province_mild_pop_satisfaction_malus_tt: "[target_province.GetName]的我方[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"

 riots_destroy_temple_desc: "人群轉為暴力，神殿成為目標。至黎明時，只剩焦黑的石塊。"
 riots_cause_minimal_damage_desc: "街頭出現動亂與叫喊，但最糟的情況得以避免。"

 hellenism_religion.15.title: "有爭議的占兆"
 hellenism_religion.15.desc: "憑[ShowGodName('zeus_god')]雄偉的鬍鬚起誓，占兆官們正彼此爭得不可開交！同一組徵兆有兩種解讀、兩種截然不同的警告，而雙方都以同樣的確信宣告。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]因此陷入兩難。當我們的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]如此明顯地分裂時，人們會怎麼想？我們是否已迷失道路？無論這些徵兆如何解讀，可以肯定的是，我們都將承受其後果……"
 hellenism_religion.15.a: "我們受夠老人的低語了！"

 hellenism_religion.16.title: "諸神之怒"
 hellenism_religion.16.desc: "我們的廳堂之中爆發了一場爭執，而祭司堅稱諸神正在注視。他們指向我們分散的土地、對遠方之地薄弱的掌控，並低聲說驕傲會招致神聖的矯正。\n\n如果諸神打算提醒我們自身的脆弱，他們不會寄來一封禮貌的信。他們會送來天候、烈火與恐懼，並選擇打在最痛之處。"
 hellenism_religion.16.a: "願風暴迅速過去。"

 hellenism_religion.17.title: "潘朵拉的盒子"
 hellenism_religion.17.desc: "一件奇異的玩物來到了[target_province.GetName]，在人們會心的微笑與愚蠢的挑釁中輾轉傳遞。有些人發誓它無害，另一些人則堅稱它不祥，是誘惑不慎者並懲罰傲慢者之物。\n\n無論它是否真正受詛咒，或只是一點引發恐慌的火花，只要有足夠多人相信，不幸便會以某種方式成真。有些當地祭司甚至報告稱，盒子上帶有一張痛苦至極、染滿血紅的奇異人臉。"
 hellenism_religion.17.a: "我們不在乎迷信。"
 hellenism_religion.17.b: "花錢將它封存起來。"
 locations_and_pops_in_target_province_suffer_minimal_damage_tt: "[target_province.GetName]與當地居民將免受神罰"

 hellenism_religion.18.title: "在最黑暗的夜晚"
 hellenism_religion.18.desc: "夜晚感覺比應有的更加漫長。在我們[ROOT.GetCountry.GetFlavorRank]的每個角落，人們談論著毀滅、飢餓、失敗，以及諸神轉過臉去。顯而易見，我們正處於一段動盪時期，無論是因為我們自身的不足，還是因為觸怒了奧林帕斯諸神。\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName]無法逃離這些低語。當我們的根基動搖時，即便最堅固的王冠也顯得沉重。"
 hellenism_religion.18.a: "我們已陷入絕望。"
 hellenism_religion.18.b: "那就獻上祭品吧。願諸神聆聽。"

 hellenism_religion.19.title: "恐懼與飢荒"
 hellenism_religion.19.desc: "恐慌比任何瘟疫都蔓延得更快。此處歉收，彼處怪異的不幸，於是忽然之間，每個鄰人都成了講述陰鬱故事的占兆官。儘管我們竭力安撫當地人，但看來人們眼中累積的惡兆，已足以讓整個社群陷入恐慌。\n\n祭司主張恐懼必須受到引導，以免它滋長為反抗。[target_province.GetName]的人民期待我們給出確定性，即便這份確定性必須被買來。"
 hellenism_religion.19.a: "讓土地承擔負擔。"
 hellenism_religion.19.b: "獻上安撫，並減輕衝擊。"

 sacrifice_to_the_gods: "安撫諸神"

 hellenism_religion.20.title: "諸神反對戰爭"
 hellenism_religion.20.desc: "並非所有神明都喜愛流血。隨著[target_war.GetName]拖延不決，祭司警告諸天正對我們的事業變得冷淡。不同於[ShowGodName('ares_god')]，其他神明並不會不論正當性如何都認可每一場衝突。\n\n士兵或許仍為我們的旗幟歡呼，但人民已疲憊不堪，而每一項苦難如今都被歸咎於神明不悅。在這樣的時刻，即便勝利也可能像是一種懲罰，一個漫長而不確定的終點……"
 hellenism_religion.20.a: "我們將忍受他們的不悅。"

 hellenism_religion.21.title: "[target_location.GetNameWithNoTooltip]怠慢儀式"
 hellenism_religion.21.desc: "人們會忘記自己對諸神的責任，尤其是在安寧或繁榮時期，這是可以理解的。在[target_location.GetName]，儀式變得稀少且敷衍。遊行規模縮小，祭品減少，古老的歌謠也唱得毫無信念。\n\n祭司要求我們殺雞儆猴。如果城市不願自發敬奉諸神，那麼恐懼或許能教會他們虔敬。無論如何，我們不能允許自己的信仰萎縮。"
 hellenism_religion.21.a: "讓平民牢記此事。"
 hellenism_religion.21.b: "精英階層過得太安逸了。"
 hellenism_religion.21.c: "讓他們去吧，並接受風險。"
 pops_go_unpunished_gods_angry_tt: "缺乏懲罰必定會激怒諸神"

 hellenism_religion.22.title: "首都的鳥占實踐"
 hellenism_religion.22.desc: "[target_character.GetName]已成為首都眾人的話題。儘管[target_character.GetHerHis]裝束古怪，[target_character.GetSheHe]仍吹噓自己擁有解讀未來的深奧能力。的確，憑藉鳥、骨頭與令人屏息的確信，[target_character.GetSheHe]聲稱能解讀諸神的意志，無論好壞。\n\n[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有些人發笑，另一些人則悄悄付錢，希望即便愚蠢的預兆也仍可能派上用場，成為一件極其有趣的新奇事物。"
 hellenism_religion.22.a: "繼續嘎嘎叫吧，[target_character.GetShortNameWithNoTooltip]！"
 hellenism_religion.22.b: "這真是丟臉。"

 birds_divinations_come_true_desc: "徵兆彼此吻合，幸運隨之而來。[ROOT.GetCountry.GetGovernment.GetCourtTitle]稱其為證據。"
 the_divinations_lie_desc: "什麼也沒發生。鳥依然只是鳥，而[ROOT.GetCountry.GetGovernment.GetCourtTitle]仍然惱怒。"

 hellenism_religion.23.title: "宗教場域擴建"
 hellenism_religion.23.desc: "祭司提出了一項雄心勃勃的提案，將重塑神聖之地本身。諸如[target_location.GetName]的神殿都將被擴建，廳堂拓寬，庭院加以裝飾，使信徒能再次感受到諸神的壯麗壓在肩頭。\n\n然而石頭不會自己移動，工匠也不會只為祈禱工作。無論我們用錢資助這次擴建，還是強迫人民提供勞力，其代價都將被感受到，而諸神也必定會注意我們支付代價的方式。"
 hellenism_religion.23.a: "妥善資助擴建。"
 hellenism_religion.23.b: "讓人民承擔負擔。"

 hellenism_religion.24.title: "迷信"
 hellenism_religion.24.desc: "一股日益增長的不安已籠罩[ROOT.GetCountry.GetGovernment.GetCourtTitle]，且最緊緊纏繞著[target_character.GetName]。微小預兆變成重大徵兆，夢境變成警告，甚至無害的巧合也被視為來自天上的訊息。\n\n這種恐懼在催生謹慎時或許有用，但也可能腐蝕行動的意志。若[target_character.GetShortNameWithNoTooltip]無法擺脫這些想法，我們的統治很快就可能更多受迷信，而非理性引導。"
 hellenism_religion.24.a: "謹慎總比粗心好。"
 hellenism_religion.24.b: "我們必須超越迷信思考。"

 hellenism_religion.25.title: "為戰爭獻祭"
 hellenism_religion.25.desc: "戰爭總會吞噬一切，即便最堅毅的士兵，在命運變得不確定時也會開始仰望諸天。祭司堅稱，我們在[target_war.GetName]中的鬥爭不會僅由鋼鐵決定；若要承受前方的一切，就必須敬奉諸神。\n\n他們提出了一場昂貴的祭祀，意在打動神明並強化我國人民的精神。若我們拒絕，或許能省下錢幣，但也冒著讓懷疑在隊伍中滋長，並讓諸神只聽見我們沉默的風險。"
 hellenism_religion.25.a: "不惜代價。"
 hellenism_religion.25.b: "我們會在沒有他們作秀的情況下取勝。"
 we_will_win_the_ongoing_conflict_without_gods_tt: "我們不會依賴神聖迷信來贏得當前衝突"

 hellenism_religion.26.title: "[target_god.GetNameWithNoTooltip]聽取我們的懇求"
 hellenism_religion.26.desc: "香煙濃厚，聖歌響亮，祭壇也從不缺少祭品。祭司聲稱，正因這些努力，我們的虔敬已抵達奧林帕斯的耳中，而諸神如今也停留得足夠接近，能夠作出回應。\n\n然而神性從不無條件地慷慨。若我們此刻請求祝福，就必須接受[target_god.GetName]可能索要代價，而回應也可能以我們無法預見的方式改變我國[ROOT.GetCountry.GetFlavorRank]的道路。"
 hellenism_religion.26.a: "讓[target_god.GetNameWithNoTooltip]回應吧。"
 hellenism_religion.26.b: "我們不會招來他們的審判。"
 gods_reward_our_piety_tt: "[target_god.GetName]以[gold|e]獎賞我們的虔敬"
 gods_imbue_stability_tt: "[target_god.GetName]的恩寵提高我們的[stability|e]"
 gods_sent_capable_character_tt: "[target_god.GetName]將透過[target_character_2.GetName]顯現"

 hellenism_religion.27.title: "哲學家的悖論"
 hellenism_religion.27.desc: "一位名為[target_character.GetName]、言辭尖銳的哲學家開始在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中發言，每一句話都將確信化為懷疑。廷臣們聚集聆聽，一半覺得有趣，一半感到不安，因為即便是簡單的真理，也被像從長袍上抽線一般拆解開來。\n\n智慧可以是一份禮物，但當它拒絕低頭時，也可能成為麻煩。若我們縱容這位思想家，[ROOT.GetCountry.GetGovernment.GetCourtTitle]或許會變得更有智慧，也或許會變得躁動不安，因為思想總有從最初容納它們的廳堂向外擴散的習慣。"
 hellenism_religion.27.a: "讓論辯繼續。"
 hellenism_religion.27.b: "謎語夠多了。把[target_character.GetHerHim]送走。"

 hellenism_religion.28.title: "[ShowGodNameWithNoTooltip('athena_god')]的智慧"
 hellenism_religion.28.desc: "在和平時期，野心沉靜，審慎興起，祭司也經常談及[ShowGodName('athena_god')]。他們堅稱智慧不僅是一種美德，更是一件武器，最好在[ROOT.GetCountry.GetFlavorRank]未被戰爭分心時鍛造。\n\n一項提案擺在我們面前，昂貴卻合理，承諾在浪費之處帶來秩序，在疑惑之處帶來清晰。若我們拒絕，也許能保住錢幣，但[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]不會忘記我們曾背離女神的勸告。"
 hellenism_religion.28.a: "支付智慧的代價。"
 hellenism_religion.28.b: "我們不需要女神替我們思考。"
 because_athena_omen_active_desc: "由於[ShowGodName('athena_god')]的[omen|e]目前處於啟用狀態，並依我們的[religious_unity|e]調整"
 if_athena_omen_was_active_tt: "若[ShowGodName('athena_god')]的[omen|e]目前處於啟用狀態，此[event_option|e]的加成將會更強"
 our_denial_angers_the_clergy_tt: "我們的拒絕必定會激怒[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]"

 hellenism_religion.29.title: "[target_god.GetNameWithNoTooltip]要求獻祭"
 hellenism_religion.29.desc: "祭司面色凝重、語氣急切地到來，堅稱神明的不悅正籠罩我們的[ROOT.GetCountry.GetFlavorRank]。他們聲稱徵兆十分明確，唯有向[target_god.GetName]獻祭，才能在不幸變成災難之前恢復眷顧。\n\n黃金是最簡單的祭品，可以毫不猶豫地獻上，然而奧林帕斯很少只憑錢幣便滿足。若我們選擇更昂貴的祭品，或許能獲得更大的眷顧，但也會在土地上留下傷痕，而人民也會記住是誰下令如此。"
 hellenism_religion.29.a: "在祭壇上獻上黃金。"
 hellenism_religion.29.b: "讓土地本身承受負擔。"
 hellenism_religion.29.c: "我們拒絕這項要求。"

 hellenism_religion.30.title: "傭兵崇拜"
 hellenism_religion.30.desc: "奇異的耳語從[target_province.GetName]升起，由旅人帶來，又被不安的當地人反覆傳播。一支崇拜在陰影中形成，奉行傭兵理想，讚頌力量高於一切，並透過祕密儀式與保護承諾聚集追隨者。他們的領袖之一[target_character.GetName]已挺身而出，渴望進入我們[ROOT.GetCountry.GetFlavorRank]的政治舞台，並以昔日密斯提奧斯的身分代表他們發言，聲稱他們的虔誠能轉化為我們的優勢。\n\n然而，陰影中的耳語也洩露了這支崇拜隱藏的支配議程，以及對權力永不滿足的飢渴。若我們歡迎他們，或許能在信仰薄弱之處獲得影響力，但也可能邀請一股隱藏的腐敗進入我們[ROOT.GetCountry.GetGovernment.GetCourtTitle]的核心。"
 hellenism_religion.30.a: "讓他們進來，並密切監視。"
 hellenism_religion.30.b: "把他們趕回陰影中。"
 cult_operates_shadows_tt: "該崇拜將繼續在陰影中活動……"
 hellenism_religion.empty: ""

 # Neoplatonism Events

 hellenism_religion.32.title: "萬有之泉"
 hellenism_religion.32.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一位哲學家完成了一部抱負非凡的著作。在審慎而毫不退讓的文風中，[target_character.GetSheHe]主張第一原理——所有神祇與萬物皆由其向外流溢，如光自無盡太陽中放射而出——並非眾神中的一位神，而是神性本身的根基。[target_character.GetSheHe]堅稱傳統萬神殿仍然真實存在，但每一位神都是一個面向，是那個不可言說的唯一源頭的流溢：秩序流入智性，智性流入靈魂，靈魂流入物質。\n\n這篇論著已在整個[ROOT.GetCountry.GetGovernment.GetCourtTitle]中被抄錄。它的思想已經活了過來，無論我們是否行動，都將繼續傳播。"
 hellenism_religion.32.a: "委託抄本並廣泛分發。"
 hellenism_religion.32.b: "讓這個思想憑自身價值立足。"

 hellenism_religion.33.title: "基督徒問題"
 hellenism_religion.33.desc: "一位學識淵博的主教來到[ROOT.GetCountry.GetGovernment.GetCourtTitle]，既未帶劍，也無怨訴——只有問題。[target_character.GetName]將[target_character.GetHerHis]一生奉獻給柏拉圖哲學，並以平靜的確信主張，基督徒的神與哲學家的第一原理其實是一回事。[target_character.GetSheHe]認為，三位一體只是太一、智性與靈魂的三元組，以不同詞語包裹而已。\n\n這套論證並非毫無力量，[target_character.GetSheHe]也以一種彷彿早已聽過所有反駁的謹慎平靜口吻發言。無論我們接納還是拒絕，[target_character.GetHerHis]的來訪都不會在[ROOT.GetCountry.GetCapital.GetName]或更遠之處默默無聞地過去。"
 hellenism_religion.33.a: "歡迎對話。思想不是傳染病。"
 hellenism_religion.33.b: "拒絕這種等同。第一原理不是他們的神。"

 hellenism_religion.34.title: "世界靈魂"
 hellenism_religion.34.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的哲學家們一直在談論世界靈魂——那由第一原理流溢而出、貫穿所有有生命造物，賦予田野、河流、身體與氣息以生機的存在。他們主張，兩位偉大神祇最好不要被理解為海與天的統治者，而應被理解為此靈魂的成對面向：流經萬物並永遠返回其源頭的力量。\n\n在[target_province.GetName]，季節向來仁慈，人民似乎在骨子裡感受到了這套論證。土地慷慨，而哲學家說這正是天意的可見顯現——世界靈魂與太一和諧共存。"
 hellenism_religion.34.a: "委託撰寫 善治著作。照料土地就是照料靈魂。"
 hellenism_religion.34.b: "發布神學宣言。讓教義被書寫下來。"
 hellenism_religion_34_work_of_art: "世界靈魂"
 hellenism_religion_34_work_of_art_desc: "一部關於柏拉圖哲學的神學研究，主張世界靈魂是一切生命之物的賦活動力，流經自然，並返回其在太一中的源頭。"

 hellenism_religion.35.title: "上升的靈魂"
 hellenism_religion.35.desc: "消息傳到[ROOT.GetCountry.GetGovernment.GetCourtTitle]：[target_character.GetName]——這位作品悄然塑造了一代人思想的哲學家——即將死去。在最後幾週，[target_character.GetSheHe]不停教導，不是從書本出發，而是出於直接觀照，以謹慎的語言描述上升的三個階段：首先是靈魂轉離物質，其次是理性能力與智性對齊，最後——說到這裡，[target_character.GetHerHis]聲音降至近乎沉默——是與太一本身合一的時刻，超越一切思想，超越一切存在。\n\n統治者已受邀見證。[target_character.GetName]唯一的請求，就是不要讓這份教導失傳。"
 hellenism_religion.35.a: "記錄並分發[target_character.GetHerHis]臨終之言。"
 hellenism_religion.35.b: "以[target_character.GetHerHis]之名創建一所學校。"
 target_character_ascends_to_the_one_tt: "[target_character.GetName]平靜離世，已說盡一切可說之事。"

 hellenism_religion.36.title: "奧林帕斯復古派"
 hellenism_religion.36.desc: "並非[ROOT.GetCountry.GetFlavorRank]中的所有人都已接受這套新神學。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]中一個派系——由[target_character.GetName]公開領導——正越來越大聲地提出反對。他們的論點很簡單，訴諸內心而非理智：人民需要宙斯、雅典娜、阿瑞斯與波賽頓。不是象徵，不是流溢，不是某個不可命名、不可祈求、不可取悅的不可言說原理之面向。他們需要奧林帕斯諸神，需要有面容、有神殿、渴求祭品的諸神。\n\n[target_character.GetSheHe]宣稱，抽象的太一聽不見我們。舊日諸神曾能聽見。[target_character.GetName]公開請願，要求移除一元論教義，回歸傳統崇拜。"
 hellenism_religion.36.a: "捍衛教義。壓制該派系。"
 hellenism_religion.36.b: "允許正式辯論。讓雙方都發言。"
 hellenism_religion.36.c: "移除一元論教義。回歸奧林帕斯信仰。"
