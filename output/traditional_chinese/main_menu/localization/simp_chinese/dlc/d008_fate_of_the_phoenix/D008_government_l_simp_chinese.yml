l_simp_chinese:

 spread_philhellenism: "推廣親希臘主義"
 spread_philhellenism_desc: "藉由提倡[ShowCultureGroupName('greek_group')]的學術、藝術與哲學，我們試圖塑造國內外對我國的觀感。學者、藝術家與[ShowCultureName('greek_culture')]文化的愛好者將被我方吸引，以敬仰而非武力增進我國的光輝與影響力。"
 spread_philhellenism_action: "$spread_philhellenism$"
 spread_philhellenism_active: "推廣親希臘主義政策"
 spread_philhellenism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_wordier: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 spread_philhellenism_action_progress_tooltip: "[research_progress|e]：[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]\n\n[cultural_influence|e]：[SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"
 spread_philhellenism_action_progress_long_wordier: "@research_progress! [SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]\n\n@cultural_influence! [SCOPE.sCountry('actor').GetModifierValue('cultural_influence_modifier')]"

 encourage_latin_militarism: "鼓勵[ShowLanguageNameWithNoTooltip('latin_language')]軍國主義"
 encourage_latin_militarism_desc: "我們將使國家奉行[ShowLanguageName('latin_language')]的秩序戰爭理念：嚴格履行契約、統一操練，並使武裝義務成為常態。這樣的紀律必能降低維持野戰軍的花費，並培養職業服役傳統。"
 encourage_latin_militarism_action: "鼓勵拉丁軍國主義"
 encourage_latin_militarism_active: "鼓勵拉丁軍國主義"
 encourage_latin_militarism_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_wordier: "[army_maintenance|e]：[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]"
 encourage_latin_militarism_action_progress_long_wordier: "@army_maintenance! [SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]\n\n@army_tradition! [SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"
 encourage_latin_militarism_action_progress_tooltip: "[army_maintenance|e]：[SCOPE.sCountry('actor').GetModifierValue('army_maintenance_efficiency')]\n\n[army_tradition|e]：[SCOPE.sCountry('actor').GetModifierValue('monthly_army_tradition')]"

 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_high_legitimacy: "$nomos_empsychos_bureaucracy$"
 AUTO_MODIFIER_NAME_bureaucracy_nomos_empsychos_low_legitimacy: "$nomos_empsychos_bureaucracy$"

 cb_restore_roman_borders: "恢復$ROM_ADJ$邊界"
 cb_restore_roman_borders_desc: "舊帝國的榮光正召喚著我們。鳳凰該展翅高飛，使一切膽敢阻擋我方恢復舊日[ShowScriptedGeographyName('roman_borders_geography')]雄心之人走向毀滅。"
 roman_borders_geography: "$ROM_ADJ$邊界"

 epic_hellenic_history: "希臘歷史史詩"
 epic_hellenic_history_desc: "這部作品以金箔書頁寫成並飾以書法，重述古希臘世界輝煌的歷史。它見證我方的富裕，以及有幸視為先祖的偉大人物。此編年史收錄諸多故事，包括特洛伊的毀滅、偉大的阿基里斯在此殞落、傳奇的奧德修斯之旅，以及伊阿宋與阿爾戈英雄的航程等。"

 nomos_empsychos_bureaucracy: "活法"
 nomos_empsychos_bureaucracy_desc: "源自「活法」概念（#italic Nómos Émpsychos#!），皇帝構成我方行政的根本支柱，並體現主權本身。此原則最早由查士丁尼闡述，使立法、司法與統帥權繫於皇帝個人，令統治者位居羅馬國家的絕對核心。"


 
 honorary_titles_bureaucracy: "榮譽頭銜"
 honorary_titles_bureaucracy_desc: "從#italic 帕特里基奧斯#!與#italic 安提帕托斯#!，到#italic 馬吉斯特羅斯#!與#italic 皇宮負責人#!，我方宮廷以尊榮而非命令駕馭野心。\n\n這套精密制度透過授予階級榮譽、絲綢與特權，使皇帝能以獎勵忠誠、化解競爭的方式，將將軍、元老與行省菁英繫於王座，並使威望本身成為統治工具。"

 
 court_eunuchs_bureaucracy: "宮廷宦官"
 court_eunuchs_bureaucracy_desc: "受過教育、忠誠且不具王朝野心的宮廷宦官，構成值得信賴的行政幹部。他們親近皇帝，又不受家族勢力牽制，十分適合管理宮廷政務、財政與帝國通信。"

 
 ritualistic_court_bureaucracy: "禮儀宮廷"
 ritualistic_court_bureaucracy_desc: "典禮是可見的統治。帝國宮廷透過受規範的儀式、位序與排場，將權威化為神聖劇場；它在國內安排等級秩序，也以我方偉大首都——公認的文明世界中心——之威嚴震懾外國使者。"



 sixty_books_of_the_basilika_bureaucracy: "巴西利卡法典"
 HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "擁有$sixty_books_of_the_basilika_bureaucracy$"
 THIRD_HAS_SIXTY_BOOKS_OF_THE_BASILIKA_TRIGGER: "擁有$sixty_books_of_the_basilika_bureaucracy$"
 FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "$fate_of_the_phoenix$[disaster|e]正在進行"
 THIRD_FATE_OF_THE_PHOENIX_DISASTER_ACTIVE_TRIGGER: "$fate_of_the_phoenix$[disaster|e]正在進行"
 sixty_books_basilika_satisfaction_scale_tt: "農民[estate_satisfaction|e]懲罰會隨$sixty_books_of_the_basilika_bureaucracy$維護滑桿調整。（滿維護時#R -5%#!，無維護時#R -20%#!）"
 sixty_books_of_the_basilika_bureaucracy_desc: "以查士丁尼的#italic 民法大全#!為基礎，$sixty_books_of_the_basilika_bureaucracy$將羅馬法重整為連貫的[ShowLanguageName('greek_language')]法律彙編。藉由釐清、標準化並調和數世紀的法理學，它使皇帝之法無可置疑、權威而普世。"
 variable_tt_reformed_imperial_code_flag_via_flavor_byz_52: "$flavor_byz.52.title$"
 basilika_bigger_positive_tt: "[ShowBureaucracyTypeName('sixty_books_of_the_basilika_bureaucracy')][bureaucracy|e]的#G 正面#!修正將加倍"


 romanitas_bureaucracy: "羅馬精神"
 romanitas_bureaucracy_desc: "$romanitas_bureaucracy$肯定羅馬國家的延續性。皇帝並非以征服或族裔為據統治，而是作為逾千年權威、法律與傳統的合法繼承者。此一認同將帝國與信仰結合，把羅馬統治呈現為受神認可且在道德上至高無上。"



 imperial_senate_bureaucracy: "帝國元老院"
 imperial_senate_bureaucracy_desc: "元老院由帝國權威任命的高階顯貴組成，作為歡呼與諮議機構。它的認可使統治、繼承與重大法令獲得正當性，在確保主權牢牢掌握於帝國之手的同時，維繫羅馬的延續性。"


 kephalai_bureaucracy: "法令集成"
 kephalai_bureaucracy_desc: "#italic 法令集成#!是使帝國統治得以實行的行政與法律彙編。它取代#italic 督軍區#!等較早期的區域安排，將法律、稅賦與軍事義務濃縮為標準化指令，確保各行省統治一致。"
 won_fate_of_the_phoenix_disaster_tt: "我方已從[ShowDisasterName('fate_of_the_phoenix')][disaster|e]中勝利而出"
 fop_renaissance_latin_merchants_tt: "我方已授予[ShowCultureGroupName('latin_group')]商人特權"


 magister_militum_bureaucracy: "軍政署"
 magister_militum_bureaucracy_desc: "#italic 軍政署#!體現帝國軍隊的制度化指揮。將軍由官僚體系任命、輪調與制約，確保軍事力量服務國家而非個人野心。因此，戰爭成為由層級而非封建效忠所支配的行政職能，同時確保唯有最佳者得以晉升。"


 has_unlocked_bureaucracy_via_flavor_byz_31_tt: "我方已透過可能在#Y 1400#!年後發生的$flavor_byz.31.title$[event|e]解鎖此[bureaucracy|e]"

 themata_bureaucracy: "軍區"
 themata_bureaucracy_desc: "#italic 軍區#!為回應存亡壓力而設立，將帝國劃分為行省軍政區。每個區域均由一名#italic 軍區長官#!管轄，集民政與軍權於一身，既能迅速進行地方防衛，又在形式上隸屬帝國層級體系。"


 allelengyon_bureaucracy: "聯保稅"
 allelengyon_bureaucracy_desc: "聯保稅最初由皇帝巴西爾二世（通稱#italic 保加爾人屠夫#!）設想，源於[ShowLanguageName('greek_language')]詞#italic allilengýi#!，意為「團結」。#italic $allelengyon_bureaucracy$#!是一項重新分配財政負擔的稅賦義務。當小農無法繳清賦稅時，責任便依法轉移給該地區較富裕的地主，既確保帝國收入，也防止農民土地破產遭兼併。如此一來，財政團結便成為穩定與控制的槓桿。"

 katepanata: "卡特帕納塔"
 katepanata_desc: "面對好戰鄰國，解方是以果決軍權整合新征服領土。$katepanata$源自#italic katepánō#!一詞——意為「置於頂端者」——其地位高於一般軍區，將各行省置於同時掌握民政與軍權的單一指揮官之下。這些大區在10與11世紀開始廣泛採用，從治所位於[ShowLocationName('bari')]的[ShowRegionName('italy_region')]，到巴西爾二世等皇帝統治下動盪的[ShowAreaNameWithNoTooltip('armenia_area')]邊境，都確保遙遠且具爭議的領土不會陷入分散統治。願這些意志的堡壘成為對抗一切覬覦我方王冠者的旗幟！"

 mos_maiorum: "祖宗成法"
 mos_maiorum_desc: "羅馬從不專屬於[ShowLanguageName('greek_language')]。我方頭銜、法律與永恆之城的記憶，皆源自比當前語言更古老的[ShowLanguageName('latin_language')]傳統。$mos_maiorum$使這項遺產制度化：宮廷職位依古羅馬先例重新編制，宮廷語言改為[ShowLanguageName('latin_language')]，外交官維持工作的花費也將降低。"
 has_completed_fate_of_the_phoenix_disaster: "我方已勝利完成[ShowDisasterName('fate_of_the_phoenix')][disaster|e]"


