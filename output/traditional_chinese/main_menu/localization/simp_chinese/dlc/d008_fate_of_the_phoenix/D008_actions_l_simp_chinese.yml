l_simp_chinese:
 
 loan_icon: "出借聖像"
 loan_icon_desc: "將一件[ShowWorkOfArtTypeName('icon')]出借給另一個[country|e]，期限為#Y 10#!年，費用取決於對方的[income|e]與該[work_of_art|e]的[art_quality|e]。此舉也會改善兩國間的[opinion|e]與[trust|e]。"
 loan_icon_tt_no_target: "我們將提出出借一件我方[works_of_art|e]給目標[country|e]，以換取[gold|e]的提案"
 loan_icon_tt: "對方將收到我方出借[SCOPE.sWorkOfArt('target').GetName]的提案，以換取[SCOPE.GetValue('icon_price_value')|2][gold_i]"
 loan_icon_bad_economy_tt: "對方的經濟狀況似乎不佳，因此若對我方沒有足夠良好的[opinion|e]，#R 可能不會同意#!"
 loan_icon_choose_icon: "選擇要出借的[ShowWorkOfArtTypeName('icon')]"
 not_already_receiving_icon_tt: "對方不得已經獲得出借的[ShowWorkOfArtTypeName('icon')]"
 icon_not_already_loaned_tt: "我方目前不得正向另一個[country|e]借用此[ShowWorkOfArtTypeName('icon')]"

 mend_schism: "彌合大分裂"
 mend_schism_desc: "[ShowReligionGroupName('christian')]已分裂數個世紀。如今五大牧首區的所有主教座皆在我方控制下，是時候施展影響力修補這道傷痕，讓各教會重新和解。"
 restore_rome_primacy: "恢復[ShowLocationNameWithNoTooltip('rome')]首要地位"
 restore_rome_primacy_desc: "[ShowLocationName('rome')]曾是帝國的第一座首都，即使東西分裂後，直到西部陷落前仍是重要城市。如今，永恆之城再次落入我方控制，我們可以恢復它作為原初首都的首要地位。"
 patriarch_not_in_rome_tt: "我方[GetInternationalOrganizationType('autocephalous_patriarchate').GetName]不得已經位於[ShowLocationName('rome')]"
 reestablish_hellenism: "重建[ShowReligionNameWithNoTooltip('hellenism_religion')]"
 reestablish_hellenism_desc: "我國人民的古老宗教以其傳統與神秘吸引王室。我們可以恢復它昔日的榮光，再次使其成為主要宗教。"

 add_omen: "新增神諭"
 add_omen_god: "選擇引導神諭的神明"
 select_omen: "啟示神諭"
 select_omen_desc: "我方統治者將啟示一則神諭。"
 select_omen_tt: "我方[country|e]將獲得暫時加成。力量取決於我方[ruler|e]的相關[ability|e]。"
 select_omen_god_is_active_tt: "[target.GetName]已在處理另一則[omen|e]。"
 select_omen_god: "選擇神諭"
 select_omen_god_desc: "我方統治者將選擇一位神明，尋求其指引以選擇一則[omen|e]。"
 select_omen_god_tt: "選擇一位神明，尋求其指引以選擇一則[omen|e]。"

 
 host_olympiad: "舉辦奧林匹亞賽會"
 host_olympiad_desc: "我方統治者將在[ShowReligionAdjective('hellenism_religion')]的[holy_site|e]舉辦競技賽會，向眾神致敬。"
 host_olympiad_location_tt: "選定的[location|e]在奧林匹亞賽會期間獲得[ShowModifier('host_olympiad_location_modifier')]。"
 host_olympiad_effect_tt_location: "效果將依[target.GetName]的[holy_site_importance_short|e][target.GetImportance]提高。"
 host_olympiad_effect_tt_no_location: "效果將依選定[holy_site|e]的[holy_site_importance_short|e]提高。"
 
 sponsor_troop_feast: "為部隊舉辦宴會"
 sponsor_troop_feast_desc: "藉由為我軍舉辦宴會，我們將使士兵保持最佳狀態與高昂士氣，確保他們渴望為國效力。"


 roman_festivals: "舉辦羅馬節慶"
 roman_festivals_desc: "每個曆月都有許多紀念眾神的節慶，但這次我們將運用國家力量舉辦盛大的典禮。"
 explanation_roman_festivals_tt: "[ShowReligionAdjective('hellenism_religion')]人民會舉辦許多獻給眾神的慶典。每月的慶祝方式各不相同，我們將依其舉辦方式獲得不同效果。"
 compitalia_tt: "孔皮塔利亞節獻給#italic 路口拉瑞斯神#!，這些神祇守護十字路口的家宅。"
 lupercalia_tt: "牧神節圍繞健康、生育與城市淨化展開。"
 quinquatria_tt: "奎因夸特里亞節獻給女神[ShowGodName('athena_god')]。"
 fordicidia_tt: "福耳狄刻狄亞節圍繞生育、農耕與畜牧展開。慶典期間，參與者會向大地女神#italic 特魯斯#!獻祭懷孕的母牛。"
 mercuralia_tt: "墨丘利節獻給信使之神[ShowGodName('hermes_god')]。"
 vestalia_tt: "維斯塔利亞節獻給爐灶女神#italic 維斯塔#!。"
 neptunalia_tt: "尼普頓節獻給神祇[ShowGodName('poseidon_god')]。"
 vinalia_rustica_tt: "鄉村葡萄酒節圍繞葡萄收成、蔬菜生長與生育展開，獻給[ShowGodName('zeus_god')]與[ShowGodName('aphrodite_god')]。"
 ludi_romani_tt: "羅馬競技會包含一系列獻給[ShowGodName('zeus_god')]的遊戲與娛樂。"
 equus_october_tt: "十月馬祭包含賽馬節慶與獻給[ShowGodName('ares_god')]的馬匹祭祀，適逢農業與軍事行動季節結束之時。"
 ludi_plebeii_tt: "平民競技會包含多場以平民為主題的戲劇表演與體育競賽。"
 saturnalia_tt: "農神節獻給時間之神#italic 撒頓#!。"

 greek_festivals: "復興古希臘節慶"
 greek_festivals_desc: "我方領土上的每個地區都有獻給一位或多位眾神的特殊節慶。我們將運用國家力量支援各地，協助他們舉辦前所未有的盛大典禮。"
 greek_festivals_tt: "我們在以下至少一個省份擁有一處地點：[ShowProvinceDefinitionName('laconia_province')]、[ShowProvinceDefinitionName('achaea_province')]、[ShowProvinceDefinitionName('arcadia_province')]、[ShowProvinceDefinitionName('attica_province')]、[ShowProvinceDefinitionName('smyrna_province')]、[ShowProvinceDefinitionName('central_macedonia_province')]、[ShowProvinceDefinitionName('lower_macedonia_province')]、[ShowProvinceDefinitionName('aetolia_province')]、[ShowProvinceDefinitionName('rodos_province')]、[ShowProvinceDefinitionName('messenia_province')]、[ShowProvinceDefinitionName('aydin_province')]。"
 gymnopaedia_tt: "吉姆諾派迪亞節在#italic 斯巴達#!舉行，獻給神祇#italic 阿波羅#!。"
 gymnopaedia_tt_mod: "我們將獲得[ShowModifier('gymnopaedia_modifier')]。"
 laphria_tt: "拉夫里亞節在[ShowProvinceDefinitionName('achaea_province')]舉行，獻給女神#italic 阿提米絲#!。"
 laphria_tt_mod: "我們將獲得[ShowModifier('laphria_modifier')]。"
 lykaia_tt: "呂卡亞節在[ShowProvinceDefinitionName('arcadia_province')]舉行，作為青少年成年的儀式，也用於抵禦狼人威脅。"
 lykaia_tt_mod: "我們將獲得[ShowModifier('lykaia_modifier')]。"
 panathenaic_games_tt: "泛雅典娜節在[ShowProvinceDefinitionName('attica_province')]舉行，獻給女神[ShowGodName('athena_god')]。"
 panathenaic_games_tt_mod: "我們將獲得[ShowModifier('panathenaic_games_modifier')]。"
 apaturia_tt: "阿帕圖里亞節在[ShowProvinceDefinitionName('smyrna_province')]舉行，獻給眾神[ShowGodName('zeus_god')]與[ShowGodName('athena_god')]。"
 apaturia_tt_mod: "我們將獲得[ShowModifier('apaturia_modifier')]。"
 hetairideia_tt: "赫泰里狄亞節在[ShowProvinceDefinitionName('central_macedonia_province')]舉行，獻給神祇[ShowGodName('zeus_god')]。"
 hetairideia_tt_mod: "我們將獲得[ShowModifier('hetairideia_modifier')]。"
 apellai_tt: "阿佩萊節在[ShowProvinceDefinitionName('aetolia_province')]舉行，獻給神祇#italic 阿波羅#!。"
 apellai_tt_mod: "我們將獲得[ShowModifier('apellai_modifier')]。"
 halieia_tt: "哈利艾亞節在[ShowProvinceDefinitionName('rodos_province')]舉行，獻給神祇#italic 赫利俄斯#!。"
 halieia_tt_mod: "我們將獲得[ShowModifier('halieia_modifier')]。"
 heraclean_games_tt: "海克力斯運動會在[ShowProvinceDefinitionName('lower_macedonia_province')]舉行，獻給英雄與神祇#italic 海克力斯#!。"
 heraclean_games_tt_mod: "我們將獲得[ShowModifier('heraclean_games_modifier')]。"
 carneia_tt: "卡尼亞節在[ShowProvinceDefinitionName('messenia_province')]舉行，獻給神祇#italic 阿波羅#!。"
 carneia_tt_mod: "我們將獲得[ShowModifier('carneia_modifier')]。"
 panionia_tt: "泛伊奧尼亞節在[ShowProvinceDefinitionName('aydin_province')]舉行，獻給神祇[ShowGodName('poseidon_god')]。"
 panionia_tt_mod: "我們將獲得[ShowModifier('panionia_modifier')]。"


 hire_advisor_eunuch_chance_tt: "有10–100%的機率雇用一名具有較高平均[abilities|e]的[ShowTraitName('eunuch')][character|e]，機率會依[ShowBureaucracyTypeName('court_eunuchs_bureaucracy')]的鞏固程度與[ShowModifierTypeName('eunuch_power')]調整。"

 grant_a_triumph: "授予凱旋式"
 grant_a_triumph_desc: "成功理應受到慶祝。能幹的軍隊領袖應以勝利者身分，在盛大的凱旋遊行中呈現於民眾面前。"
 grant_a_triumph_tt: "我們在過去5年內贏得過一場戰爭。"
 grant_a_triumph_triumphant_bonus_tt: "選定的[character|e]將獲得[ShowTraitName('triumphant')]特質"



 
