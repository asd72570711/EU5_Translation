# Actions for Fate of the Phoenix Disaster

 selected_country_will_send_us_engineer_character_tt: "選定的[country|e]將派遣一名最優秀的[characters|e]給我們"
 target_country_forced_to_give_tribute_tt: "選定的[country|e]可能被說服向我們提供[gold|e]或[manpower|e]"
 at_war_with_heathens_or_heretics_tt: "我們目前正率領一場[war|e]，與一個不信奉[actor.GetReligion.GetName]的[country|e]交戰"
 selected_country_may_join_every_ongoing_war_against_heathen_and_heretics_tt: "選定的[country|e]可能加入我們正在進行的[wars|e]，其[war_leaders|e]必須是[heathens|e]或[heretics|e]"
 pops_in_capital_province_convert_catholic_tt: "首都[actor.GetCapital.GetProvince.GetName]中信奉[actor.GetReligion.GetName]的部分[pops|e]將改信[ShowReligionName('catholic')]"
 fate_of_phoenix_actions_price: "$fate_of_the_phoenix$行動花費"

 request_papal_donation: "請求$PAP_ADJ$捐款"
 request_papal_donation_desc: "[actor.GetFlavorRank]陷入困境、金庫空虛之際，我們可以派遣使節前往$PAP$，以[ShowReligionGroupName('christian')]之名請求援助。雖然這類請求很少能不付出代價，但他們的金錢或許能讓我們在危急時刻爭取時間。"
 grant_latin_merchants_privileges: "授予[ShowCultureGroupNameWithNoTooltip('italian_group')]商人特權"
 grant_latin_merchants_privileges_desc: "透過向[ShowCultureGroupName('italian_group')]商業共和國授予特殊權利，我們希望復興貿易並取得海軍支援。這些讓步或許能強化[actor.GetCapital.GetName]的商業，卻也可能加深外國對[actor.GetCapital.GetRank.GetName]的影響。"
 grant_latin_merchants_privileges_tooltip: "[ShowRegionName('italy_region')]內採用[ShowGovernmentReformName('merchant_republic')]的任何[country|e]都不是附庸，也不是我們的宿敵"
 accept_catholic_delegation: "接受[ShowReligionAdjectiveWithNoTooltip('catholic')]使團"
 accept_catholic_delegation_desc: "[GetUniqueInternationalOrganization('catholic_church').GetName]的代表可以受邀前往[actor.GetCapital.GetName]，帶來團結的話語與對妥協的無聲期待。根據許多顧問的說法，接待這些代表或許能改善我們與[ShowReligionAdjective('catholic')]世界的關係，但此類舉動也會造成國內緊張。"
 attract_italian_engineer: "吸引[ShowCultureGroupNameWithNoTooltip('italian_group')]工程師"
 attract_italian_engineer_desc: "我們正在尋找知名的[ShowCultureGroupName('italian_group')]工程師，以改善防禦工事與軍事工程。他們的專業能為古老問題帶來現代解決方案，但或許要付出受西方方法與影響束縛的代價。"
 demand_beylik_tribute: "要求貝伊國進貢"
 demand_beylik_tribute_desc: "隨著我們在[ShowRegionName('anatolia_region')]重申權威，我們或許能再次迫使鄰近的貝伊國承認[actor.GetAdjective]的至高地位。現在徵收貢賦，便能削弱未來的對手，恢復人們對[actor.GetFlavorRank]力量的信心。"
 summon_patriarchate_member: "召集宗主教區成員"
 summon_patriarchate_member_desc: "身為[GetInternationalOrganizationType('autocephalous_patriarchate').GetNameWithNoTooltip]的領袖，我們可以召集其他[ShowReligionAdjective('orthodox')]領袖，對抗信仰之敵。這類請求仰賴共同信念而非義務，或許仍能號召戰士為我們而戰。"
 reform_imperial_armies: "改革[GetCountry('BYZ').GetAdjectiveWithNoTooltip]軍事"
 reform_imperial_armies_desc: "[actor.GetFlavorRank]的武裝力量經歷數十年疏忽與臨時應變，已經飽受摧殘。全面改革將帶來全新的紀律與結構，但也需要穩定、白銀，以及改變根深蒂固習慣的意志。"
 patronize_orthodox_monastery: "資助$orthodox_monastery$"
 patronize_orthodox_monastery_desc: "透過資助當地的[ShowBuildingTypeName('orthodox_monastery')]，我們重申自身的虔誠，並強化當地宗教生活。這樣的慷慨必定能改善當地生活品質，提醒信徒[actor.GetLongName]仍是正信的守護者。"
 reform_armed_forces_tt: "我們將能改革[army|e]或[navy|e]，消除過去數世紀留下的衰敗"
 has_not_completed_all_six_reforms_tt: "我們尚未完成全部#Y 6#!項可用改革"
 patronize_orth_monastery_tt: "選定的[location|e]將獲得[ShowModifier('patronize_orthodox_monastery_modifier')][modifier|e]，而我們許多信奉[ShowReligionAdjective('orthodox')]的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"

