l_simp_chinese:
 
 d008_orthodox_events.1.title: "[actor.GetNameWithNoTooltip]提出的提議"
 d008_orthodox_events.1.desc: "[actor.GetLongName]的使團來到我方[ROOT.GetCountry.GetGovernment.GetCourtTitle]，提議將其精美的宗教聖像作品[target.GetName]出借予我方。這自然不是無償之舉，卻也有助於拉近兩國關係。"
 d008_orthodox_events.1.a: "我們欣然接受。"
 d008_orthodox_events.1.b: "告訴他們，我們已經有一件了。"

 d008_orthodox_events.2.title: "提議獲准"
 d008_orthodox_events.2.desc: "光榮的[target_country.GetLongName]接受了我方慷慨出借[target.GetName]的提議。他們已送來約定的報酬，此舉想必能拉近兩國關係。只盼借期屆滿時，他們會如約歸還聖像。"
 d008_orthodox_events.2.a: "在那之前，務必妥善保管。"

 d008_orthodox_events.3.title: "提議遭拒"
 d008_orthodox_events.3.desc: "[target_country.GetName]那些不敬的愚人拒絕了我方出借[target.GetName]的提議。我們本著善意而來，他們的回絕卻證明自己既無信仰，也無善意。唯有否定[ROOT.GetCountry.GetReligion.GetName]本身者，才敢拒絕一件[ShowWorkOfArtTypeName('icon')]。"
 d008_orthodox_events.3.a: "讓他們墮入地獄！"

 d008_orthodox_events.4.title: "[target_art.GetNameWithNoTooltip]借期屆滿"
 d008_orthodox_events.4.desc: "[ShowWorkOfArtTypeName('icon')]的借期已屆滿，這件作品是[origin_country.GetName]借給我們的。如今我們該將[target_art.GetName]歸還原主，而對方顯然正等著我們這麼做。不過，我們也可以宣稱自己可能「弄丟了」它，藉此不必歸還。"
 d008_orthodox_events.4.desc_no_country: "[target_art.GetName]已在我方手中一段時間。它原本是借來的，但由於原所有者已不再是獨立國家，我們沒有必要將它歸還給任何人。"
 d008_orthodox_events.4.a: "物歸原主。"
 d008_orthodox_events.4.b: "現在它是我們的了！"

 d008_orthodox_events.5.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.5.desc: "借給[target_country.GetLongName]的[target_art.GetName]已到期。因此，他們已以適當儀式將其歸還，妥善履行協議條款。"
 d008_orthodox_events.5.a: "這才是正統[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]國家應有的作為。"

 d008_orthodox_events.6.title: "$d008_orthodox_events.4.title$"
 d008_orthodox_events.6.desc: "借給[target_country.GetLongName]的[target_art.GetName]已到期。然而，[target_country.GetName]的豬玀拒絕歸還，只提出拙劣的藉口為拒絕辯解。"
 d008_orthodox_events.6.a: "他們會為這種侮辱付出代價！"

 d008_orthodox_events.7.title: "[target_pentarchy.GetNameWithNoTooltip]的牧首座"
 d008_orthodox_events.7.desc: "五大牧首區之一、[ShowReligionGroupName('christian')]的重要中心[target_pentarchy.GetName]如今已落入我方手中。[target_patriarch.GetName]將就任其牧首座，而我們將弘揚[ShowReligionAdjective('orthodox')]信仰的榮耀。"
 d008_orthodox_events.7.a: "五大牧首區將屬於我們！"

 d008_orthodox_events.8.title: "失去[target_pentarchy.GetNameWithNoTooltip]"
 d008_orthodox_events.8.desc: "[target_pentarchy.GetName]已被奪走，連同它帶來的權力與尊重也一併失去。難道上帝拋棄我們了嗎？[ROOT.GetCountry.GetName]的[ShowReligionAdjective('orthodox')]教會必將因這場損失而受創。"
 d008_orthodox_events.8.desc_all_pentarchy: "失去[target_pentarchy.GetName]後，五大牧首區的完整性已遭破壞，因為我們不再掌握所有牧首座。若要維繫信仰的力量，必須再度將五座牧首座盡數納入我方旗幟之下。"
 d008_orthodox_events.8.a: "我們必須奪回它！"
 downgrade_pentarchy_modifier_tt: "受控制的五大牧首區主教座不再提供增強效果"

 d008_orthodox_events.9.title: "五大牧首區重歸統一"
 d008_orthodox_events.9.desc: "隨著[target_pentarchy.GetName]落入我方手中，五大牧首區的主教座全都在我方控制之下。過去各主教座間彼此分離的關係，如今已在我方權威下重新統一。就連曾落入異教徒與異端手中的主教座，也因我方恩典回歸正軌。教會將再次統一，而我方宗主教將引領其道路。"
 d008_orthodox_events.9.a: "教會將再次統一。"
 upgrade_pentarchy_modifier_tt: "受控制的五大牧首區主教座效果將增強"
 pentarchy_unlocked_abilities_tt: "解鎖[ShowGenericActionName('mend_schism')]與[ShowGenericActionName('restore_rome_primacy')][actions|e]"

 d008_orthodox_events.10.title: "彌合大分裂"
 d008_orthodox_events.10.desc: "自[ShowLocationName('rome')]與[ShowLocationName('constantinople')]的宗主教分離以來，這道有害的裂痕已在[ShowReligionGroupName('christian')]核心潰爛數個世紀。西方教會的分裂只令基督的教誨遭到曲解，唯有魔鬼因此歡欣。\n\n如今，五大牧首區的五座牧首座皆歸我方權威，東西方宗主教再度同屬一個教會、同懷一種信念。雖仍有許多異端拒絕承認真教會的確信，但所有羊群終將回到真正牧者身邊。"
 d008_orthodox_events.10.a: "只有一個[ShowReligionGroupAdjectiveWithNoTooltip('christian')]教會。"

 d008_orthodox_events.11.title: "恢復[ShowLocationNameWithNoTooltip('rome')]的首要地位"
 d008_orthodox_events.11.desc: "帝國的發源與搖籃、古代文化與文明的明燈，永恆之城長久以來因異端與野蠻而被黑暗籠罩。如今它再度歸於正義的我方之手，榮耀將重現，世界中心的地位也將復歸。\n\n自這座新的[ROOT.GetCountry.GetGovernment.GetAdjective]首都，我方[ROOT.GetCountry.GetFlavorRank]的力量將遠播四方，天下各地的人們都會感受到我方的存在。榮耀歸於[ShowLocationName('rome')]！榮耀歸於[ROOT.GetCountry.GetLongName]！"
 d008_orthodox_events.11.a: "#italic 永恆之城重獲新生！#!"
 patriarchate_will_relocate_to_rome_tt: "[ShowLocationName('rome')]的宗主教如今將成為我方[GetInternationalOrganizationType('autocephalous_patriarchate').GetName]的領袖"

 d008_orthodox_events.12.title: "宣稱大分裂已彌合"
 d008_orthodox_events.12.desc: "[scope:actor.GetName]宣稱已治癒東西教會大分裂，讓基督教世界在君士坦丁堡之下統一。"
 d008_orthodox_events.12.a: "加入東正教信仰。"
 d008_orthodox_events.12.b: "羅馬是我們的牧者。"

 d008_orthodox_events.13.title: "宣稱大分裂已彌合"
 d008_orthodox_events.13.desc: "[scope:actor.GetName]竟擅自宣稱已按其自身條件彌合大分裂。"
 d008_orthodox_events.13.a: "豈有此理。"

 d008_orthodox_events.14.title: "宗主教遷往羅馬"
 d008_orthodox_events.14.desc: "[scope:actor.GetName]已將普世宗主教遷往羅馬，直接宣稱我方城市。"
 d008_orthodox_events.14.a: "我們絕不讓出羅馬。"
