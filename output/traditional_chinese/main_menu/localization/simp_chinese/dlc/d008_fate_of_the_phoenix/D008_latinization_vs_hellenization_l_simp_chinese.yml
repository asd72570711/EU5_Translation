l_simp_chinese:

 latinization_vs_hellenization.1.title: "[ShowCultureGroupNameWithNoTooltip('greek_group')]智慧的回聲"
 latinization_vs_hellenization.1.desc: "在[target_location.GetName]的修道院與講堂中，神學著作與教父作品在信徒與學者間流傳。講道與評註汲取東正教學問的深厚泉源，而這些文本的副本開始落入非希臘名流手中，使宮廷中那些看好與拉丁西方建立更緊密關係的人日益不安。"
 latinization_vs_hellenization.1.a: "讓他們的見解充實我們的土地。"
 latinization_vs_hellenization.1.b: "對古老卷軸的迷戀已經夠了。"
 target_character_disappears_tt: "[target_character.GetName]將消失"

 latinization_vs_hellenization.2.title: "日益受到青睞的[ShowLanguageNameWithNoTooltip('latin_language')]"
 latinization_vs_hellenization.2.desc: "在[ROOT.GetCountry.GetName]各地的沙龍與莊園中，一股微妙卻日益壯大的潮流開始偏好[ShowLanguageName('latin_language')]的習俗、法律與儀式。年輕貴族在言談間摻入外國詞句，與[ShowLanguageNameWithNoTooltip('latin_language')]宮廷通信，並要求推動改革，使我們的[ROOT.GetCountry.GetFlavorRank]更接近西方時尚；與此同時，其他人對古老確信如此迅速地消逝感到不安。"
 latinization_vs_hellenization.2.a: "這不會帶來任何壞處。"
 latinization_vs_hellenization.2.b: "現在就扭轉方向！"
 stability_scales_with_current_latinization_hellenization: "[stability|e]的變化取決於我們目前的[ShowSocietyDirectionName('latinization')]或[ShowSocietyDirectionName('hellenization')]數值"
 while_this_modifier_active_reduced_latinization_gain_from_events_tt: "此[country_modifier|e]生效期間，後續強化[ShowSocietyDirectionName('latinization')]的[events|e]效果會大幅減弱，其獎勵也會降低"
 bonus_weakened_because_of_suppressing_latinization_modifier: "此選擇的效益因[ShowModifier('suppressing_latinization_modifier')]而降低"

 latinization_vs_hellenization.3.title: "[ShowSocietyDirectionNameWithNoTooltip('latinization')]蓬勃發展"
 latinization_vs_hellenization.3.desc: "商人、法學家與學者報告，近期轉向[ShowLanguageName('latin_language')]形式已開始結出果實。契約撰寫得更加清晰，外國夥伴也更熟悉我們的做法，而改革的活力似乎正加速[ROOT.GetCountry.GetName]的發展；不過，也有人低聲說這些成果建立在仍可能動搖的基礎上。"
 latinization_vs_hellenization.3.a: "是時候享受良好政策的成果了。"
 latinization_vs_hellenization.3.b: "智者會選擇修正過去的錯誤！"

 latinization_vs_hellenization.4.title: "榮耀歸於[target_unit.GetNameWithNoTooltip]"
 latinization_vs_hellenization.4.desc: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]收到報告，得知[target_unit.GetName]在近期戰役中展現了卓越的紀律與勇氣。他們無論行軍或操練都隊列嚴整，其行為的故事已開始在普通士兵與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]間流傳；後者將他們視為[ROOT.GetCountry.GetName]軍團的典範。"
 latinization_vs_hellenization.4.a: "他們的服役與我們息息相關。"
 target_character_will_receive_a_nickname_tt: "[target_character.GetName]將因[target_character.GetHerHis]出色的服役而獲得合適的綽號"


 latinization_vs_hellenization.5.title: "[target_location.GetNameWithNoTooltip]的課程之爭"
 latinization_vs_hellenization.5.desc: "在[target_location.GetName]的[ShowBuildingTypeName('university')]中，學者為高等教育應使用何種語言爭論不休。一些人堅持只有[ShowLanguageName('latin_language')]能讓我們的[ROOT.GetCountry.GetFlavorRank]躋身強權之列，另一些人則堅持必須保存君士坦丁堡與教會的學術傳統。"
 latinization_vs_hellenization.5.a: "大學應以[ShowLanguageNameWithNoTooltip('latin_language')]授課。"
 latinization_vs_hellenization.5.b: "我們的教會與帝國傳統不容放棄。"
 pops_in_target_province_mild_bonus_satisfaction: "我們在[target_province.GetName]的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 pops_in_target_province_mild_penalty_satisfaction: "我們在[target_province.GetName]的[pops|e]將承受[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"

 latinization_vs_hellenization.6.title: "來自[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]的警告"
 latinization_vs_hellenization.6.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]中一位德高望重的成員[target_character.GetName]，帶著嚴重的憂慮來到[ROOT.GetCountry.GetGovernment.GetCourtTitle]面前。[target_character.GetSheHe|U]警告，教義與習俗中的[ShowLanguageName('latin_language')]時尚正在侵蝕我們信仰的根基，終有一天會危及祭壇與王座。"
 latinization_vs_hellenization.6.a: "聽取[target_character.GetHerHis]的勸告才是明智之舉。"
 latinization_vs_hellenization.6.b: "我們不會讓膽怯之人支配政策。"

 latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]嘗試外國習俗"
 latinization_vs_hellenization.7.desc: "從[target_location.GetName]的廳堂到遙遠的莊園，我們的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]熱切模仿[target_culture.GetName]的舉止、時尚與語言。有人將其視為教養，另一些人則低聲說，我們的貴族已經忘了成為[ROOT.GetCountry.GetAdjective]意味著什麼。"
 latinization_vs_hellenization.7.a: "讓他們從[target_culture.GetNameWithNoTooltip]文化的方式中取其所需。"
 latinization_vs_hellenization.7.b: "這種外國迷戀已經夠了。"
 destabilize_our_realm: "我們對這些潮流的防禦姿態使[ROOT.GetCountry.GetFlavorRank]動盪"
 perceived_as_weakness: "禁止嘗試外國習俗會被視為軟弱"

 latinization_vs_hellenization.8.title: "重整各省"
 latinization_vs_hellenization.8.desc: "[ROOT.GetCountry.GetCapital.GetName]的官員挺身提出全面重組[target_province.GetName]等省份，使司法管轄與行政更貼近我們的文化與政治中心。這項計畫承諾帶來更大控制力，卻也可能擾亂長久建立的地方平衡。"
 latinization_vs_hellenization.8.a: "不惜一切代價推行新秩序。"
 latinization_vs_hellenization.8.b: "尊重地方安排，平息他們的疑慮。"
 pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "受影響[provinces|e]中的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"

 latinization_vs_hellenization.9.title: "[target_character.GetShortNameWithNoTooltip]的教育"
 latinization_vs_hellenization.9.desc: "隨著[target_character.GetName]成年，導師與廷臣為[target_character.GetHerHis]應受何種教育而爭執。每一次對語言、文本與導師的選擇，都可能變成一場關於[ROOT.GetCountry.GetName]未來靈魂的代理戰爭。"
 latinization_vs_hellenization.9.a: "[target_character.GetHerHis|U]的教育必須遵循清晰而審慎的道路。"
 latinization_vs_hellenization.9.b: "我們不會將[target_character.GetShortNameWithNoTooltip]的成長政治化。"
 refusal_to_politicize_tt: "我們拒絕公開干涉[target_character.GetName]的教育，可能會被[ROOT.GetCountry.GetGovernment.GetCourtTitle]的一些人視為軟弱"
 court_does_not_react: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]沒有反應"

 latinization_vs_hellenization.10.title: "重拾[ShowCultureNameWithNoTooltip('roman_culture')]的輝煌"
 latinization_vs_hellenization.10.desc: "熟悉義大利城市新興方法的建築師，提議以文藝復興風格重塑[target_province.GetName]：寬闊大道、整齊街廓，以及模仿拉丁西方大師重新想像之羅馬輝煌的公共工程。仰慕這些崇高計畫的人看見了尊嚴的重生。或許只有開放於西方，才能帶來這樣的復興。"
 latinization_vs_hellenization.10.a: "讓[target_province.GetNameWithNoTooltip]重新崛起。"
 latinization_vs_hellenization.10.b: "讓聚落自然繁榮。"
 target_character_artist_skill: "[target_character.GetName][artistic_skill|e]"

 latinization_vs_hellenization.11.title: "為[target_province.GetNameWithNoTooltip]建造帝國傳統建築"
 latinization_vs_hellenization.11.desc: "藝術贊助者與地方行會遊說翻新[target_province.GetName]，借鑑我們帝國城市的偉大傳統：拱廊街道、開放廣場，以及使君士坦丁堡與羅馬東方不朽城市獨具特色的石工。許多顧問相信，恢復這類形式能有力地彰顯我們未曾中斷的羅馬傳承之尊嚴。"
 latinization_vs_hellenization.11.a: "這種優雅很適合我們的[ROOT.GetCountry.GetFlavorRank]。"
 latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$"

 latinization_vs_hellenization.12.title: "新稅制之爭"
 latinization_vs_hellenization.12.desc: "財政官員提出全面改革稅法，借鑑外國模式以加強評估與徵收。這項激進提案承諾帶來更大的秩序與收入，卻也威脅要動搖[ROOT.GetCountry.GetFlavorRank]各地既得利益。"
 latinization_vs_hellenization.12.a: "實行新制度。"
 latinization_vs_hellenization.12.b: "暫時放棄這些想法。"
 proposed_taxation_upsets_estates_tt: "提議中的稅制將擾亂數個[estates|e]既有的特權"
 new_tax_code_will_destabilize_the_realm: "修訂後的稅制將使[ROOT.GetCountry.GetFlavorRank]動盪"

 latinization_vs_hellenization.13.title: "[target_location.GetNameWithNoTooltip]要求自己的議會"
 latinization_vs_hellenization.13.desc: "[target_location.GetName]的名流挺身向[ROOT.GetCountry.GetGovernment.GetCourtTitle]請願，要求成立自治市議會，並以義大利城市自治公社的例子證明地方治理能帶來繁榮。答應他們的願望會削弱中央控制，讓[ROOT.GetCountry.GetFlavorRank]向拉丁治理模式靠攏；但拒絕則可能激怒那些向西方尋求靈感的有影響力精英。"
 latinization_vs_hellenization.13.a: "准許他們成立議會。"
 latinization_vs_hellenization.13.b: "他們仍將受到我們的直接監視。"
 upper_class_pops_in_these_cities_angry: "受影響[locations|e]中的[upper_class|e][pops|e]會因我們拒絕而不滿，並承受[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"

 latinization_vs_hellenization.14.title: "[target_province.GetNameWithNoTooltip]的大型節慶"
 latinization_vs_hellenization.14.desc: "[target_province.GetName]的地方領袖希望舉辦大型節慶，向土地的習俗與豐饒表達感恩。這類歡慶或許能緩解緊張、強化共同身分，但省份與國庫都必須投入資金，令財政顧問十分不滿。"
 latinization_vs_hellenization.14.a: "只為[target_province.GetNameWithNoTooltip]舉辦慶典。"
 latinization_vs_hellenization.14.b: "讓鄰近省份也參加慶典！"
 latinization_vs_hellenization.14.c: "既然有時間閒著，就有時間工作。"
 pops_are_happier_tt: "此[province|e]中不被視為[upper_class|e]的[pops|e]，將因持續中的節慶而獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"

 latinization_vs_hellenization.15.title: "拉丁方法手冊"
 latinization_vs_hellenization.15.desc: "一本詳盡記載操練與戰場機動的手冊，取材自拉丁西方傭兵隊長與軍事騎士團的方法，已開始在我們的軍官間流傳。只要我們願意將其採為官方教義，其中的圖表與口令便能為隊伍帶來秩序與一致性。"
 latinization_vs_hellenization.15.a: "把它分發下去！"
 latinization_vs_hellenization.15.b: "我們不需要這種影響。"

 latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip]與[target_estate.GetNameWithNoTooltip]衝突"
 latinization_vs_hellenization.16.desc: "唉！[target_character.GetName]與[target_estate.GetName]的領袖爆發激烈爭吵，雙方都指責對方越界。這場爭端威脅要惡化軍官團與[ROOT.GetCountry.GetFlavorRank]整體利益之間的關係。"
 latinization_vs_hellenization.16.a: "他們斥責[target_character.GetHerHim]是對的。"
 latinization_vs_hellenization.16.b: "[target_estate.GetNameWithNoTooltip]無權支配軍事事務！"
 court_faction_increases_influence: "一個敵對的[ROOT.GetCountry.GetGovernment.GetCourtTitle]派系將提高其影響力"
 our_authority_will_suffer_penalty: "我們的權威將受損"

 latinization_vs_hellenization.17.title: "[target_character.GetShortNameWithNoTooltip]自願服役"
 latinization_vs_hellenization.17.desc: "透過我們與[target_country.GetName]的聯繫，一位[target_culture.GetName]出身的老練戰士表示希望在我們旗下服役，受到兩國宮廷日益加深的聯繫吸引。[target_character.GetSheHe|U]帶來拉丁西方的軍事知識，並將[target_character.GetHerHim]的專長與[target_character.GetHerHis]經驗奉獻給我們的事業。"
 latinization_vs_hellenization.17.a: "每一位[target_culture.GetNameWithNoTooltip]領袖都受歡迎！"

 latinization_vs_hellenization.18.title: "領袖之間的分歧"
 latinization_vs_hellenization.18.desc: "我們的兩名指揮官[target_character_1.GetName]與[target_character_2.GetName]，因戰術與訓練問題公開產生分歧。他們的競爭可能分裂軍官團，使出征中的士兵感到困惑。這道裂痕難道只是分裂軍隊的最新症狀？無論如何，為了國家安全，我們最好結束這些爭吵。"
 latinization_vs_hellenization.18.a: "聽取[target_character_1.GetShortNameWithNoTooltip]的建議。"
 latinization_vs_hellenization.18.b: "[target_character_2.GetNameWithNoTooltip]才是對的！"

 latinization_vs_hellenization.19.title: "[target_province_destination.GetNameWithNoTooltip]吸引移民"
 latinization_vs_hellenization.19.desc: "[target_province_destination.GetName]的華美與美名，促使人們從[target_province_origin.GetName]踏上前往我國土地的旅程。若他們來自拉丁西方，定居將加深我們與那裡的聯繫；若他們是東正教鄰人，則會強化該省古老的特色。"
 latinization_vs_hellenization.19.a: "他們將充實我們的社會！"
 latinization_vs_hellenization.19.b: "他們不受歡迎。"

 latinization_vs_hellenization.20.title: "[target_character.GetNameWithNoTooltip]的忠誠"
 latinization_vs_hellenization.20.desc: "謠言四起，據說[target_character.GetName]一直與忠於他方的使節與代理人會面。無論這些耳語源自惡意還是誤解，都在啃噬我們指揮體系中的信任。雖然間諜回報有人不信任，我們仍應審慎評估情勢。"
 latinization_vs_hellenization.20.a: "[target_character.GetSheHe|U]已經獲得[target_character.GetHerselfHimself]一些假期……"
 latinization_vs_hellenization.20.b: "我們不能聽信這種閒言！"
 target_character_spills_the_beans: "[target_character.GetShortName]向我們的[rivals|e]與[rival_enemies|e]洩漏秘密"
 target_character_lips_shut: "[target_character.GetHerHis|U]守口如瓶"

 latinization_vs_hellenization.21.title: "通貨膨脹政策"
 latinization_vs_hellenization.21.desc: "大量劣質與偽造錢幣開始扭曲[ROOT.GetCountry.GetName]各地的物價。[ROOT.GetCountry.GetGovernment.GetCourtTitle]的一些顧問敦促立即干預，另一些人則認為，治療可能與病症一樣痛苦。"
 latinization_vs_hellenization.21.a: "加強我們對貨幣的控制。"
 latinization_vs_hellenization.21.b: "讓市場自行解決。"
 inflation_creeping_in_tt: "若放任不管，[inflation|e]未來可能造成重大問題"
 burghers_pleased: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]對我們的克制感到滿意"
 burghers_upset: "我們的不作為令[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]不滿"
 inflation_causes_instability: "猖獗的[inflation|e]會對我們的[stability|e]造成負面影響"

 latinization_vs_hellenization.22.title: "[target_character_1.GetShortNameWithNoTooltip]的導師朋友"
 latinization_vs_hellenization.22.desc: "[target_character_1.GetName]與[target_character_2.GetName]變得格外親近，而後者的教學已超越簡單的讀寫與算術。有人說這段友誼拓展了[target_character_1.GetHerHis]的視野，另一些人則害怕它會對[ROOT.GetCountry.GetFlavorRank]的未來造成不當影響。"
 latinization_vs_hellenization.22.a: "我們的小[target_character_1.GetShortNameWithNoTooltip]值得最好的教育！"
 latinization_vs_hellenization.22.b: "[target_character_1.GetSheHe|U]天生要領導，而不是讀書！"
 heir_will_receive_more_tutoring_tt: "我們親愛的[target_character_1.GetShortName]將接受額外指導，可能提升[target_character_1.GetHerHis]的[abilities|e]。若[target_character_1.GetSheHe]登上王位，這可能影響[target_character_1.GetHerHis]的政策制定。"

 latinization_vs_hellenization.23.title: "一位[target_character.GetWomanMan|U]文人"
 latinization_vs_hellenization.23.desc: "一位[target_culture.GetName]學者在義大利城市的人文主義傳統下受過訓練，來到我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]，帶來拉丁手稿、哲學評註，以及取自西方蓬勃學術的思想。這樣的人或許能成為拉丁世界思想潮流的珍貴渠道。然而，我們應當提防[target_character.GetSheHe]可能與[target_character.GetHerHim]一同帶來的外國同情。"
 latinization_vs_hellenization.23.a: "疲憊的旅人，留下來陪我們一陣子吧。"
 latinization_vs_hellenization.23.b: "我們不在乎流浪乞丐的妄想。"

 latinization_vs_hellenization.24.title: "博學的旅人"
 latinization_vs_hellenization.24.desc: "一位精通教父著作與偉大東正教神學家評註的[target_character.GetWomanMan]學者，請求居住於我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]，並願意分享從東方修道院蒐集的手稿，以及對帝國法律與東正教教義的深厚知識。這份智慧究竟會強化我們的傳統，還是只為擁擠的宮廷增添另一種聲音，取決於我們自己。"
 latinization_vs_hellenization.24.a: "很好，[target_character.GetShortNameWithNoTooltip]可以留下。"
 latinization_vs_hellenization.24.b: "沒什麼特別的，[target_character.GetSheHe]只是牆上的另一塊磚。"

 latinization_vs_hellenization.25.title: "文化衰敗"
 latinization_vs_hellenization.25.desc: "編年史家哀嘆[ROOT.GetCountry.GetName]的文化活力正在消逝。贊助逐漸衰落，傳統遭到忽視，曾經鼓舞人民的作品如今只在圖書館與庫房中蒙塵。我們身為偉大文化的先驅，是否已經與時代脫節？"
 latinization_vs_hellenization.25.a: "我們必須接受傳承已經黯淡。"
 latinization_vs_hellenization.25.b: "不，是其他人全都錯了！"

 latinization_vs_hellenization.26.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的東方時尚"
 latinization_vs_hellenization.26.desc: "東方宮廷的商人與使節帶來的絲綢、香水與習俗，吸引了我們[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的想像。有人認為，長久屹立於東西方之間的帝國本就應該如此；另一些人則主張，我們的未來在拉丁勢力手中，一個向東眺望的宮廷只會驅離西方盟友。"
 latinization_vs_hellenization.26.a: "東方一直都是我們世界的一部分。"
 latinization_vs_hellenization.26.b: "我們必須眺望西方，而非東方。"

 latinization_vs_hellenization.27.title: "[ShowSocietyDirectionNameWithNoTooltip('hellenization')]政策奏效"
 latinization_vs_hellenization.27.desc: "我們採行的文化政策終於開始結出果實。學者讚揚重新恢復的清晰，海軍將領談論重拾的信心，人民也感受到我們的道路儘管充滿爭議，卻正通往某個有意義的方向。"
 latinization_vs_hellenization.27.a: "微笑吧，我們讓祖先感到驕傲。"
 strength_of_hellenization_desc: "我們[ShowModifierTypeName('monthly_towards_hellenization')][country_modifier|e]的力量"

 latinization_vs_hellenization.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]抗拒當前潮流"
 latinization_vs_hellenization.28.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中的領袖家族抱怨，[ROOT.GetCountry.GetFlavorRank]的文化政策偏離得太遠、太快。他們堅持，只有自身穩定的手腕才能避免[ROOT.GetCountry.GetName]徹底失去其特色。"
 latinization_vs_hellenization.28.a: "答應他們的要求。"
 latinization_vs_hellenization.28.b: "我們不會改變方向。"

 latinization_vs_hellenization.29.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]抗拒當前潮流"
 latinization_vs_hellenization.29.desc: "令我們失望的是，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]最近開始不安地談論我們的文化方向。有人認為這些偏移具有腐化性，甚至危險，但所有人都同意必須保護信仰，免受這些惡意潮流侵害。"
 latinization_vs_hellenization.29.a: "留意他們的警告。"
 latinization_vs_hellenization.29.b: "教義不應支配政策。"
 refusal_leads_instability: "我們拒絕遵從，導致動盪"
 situation_dissipates: "激烈的交鋒沒有升級"

 latinization_vs_hellenization.30.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]抗拒當前潮流"
 latinization_vs_hellenization.30.desc: "在[ROOT.GetCountry.GetName]的田野與村莊中，許多下層階級成員抱怨，追求宏偉與習俗的遙遠爭論只為他們帶來新的義務與陌生官員。若不予回應，他們的安靜抵抗可能變得更加喧鬧。"
 latinization_vs_hellenization.30.a: "安撫[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]。"
 latinization_vs_hellenization.30.b: "強迫他們遵從當前潮流。"
