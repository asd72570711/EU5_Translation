l_simp_chinese:

 a_legionaries_1: "早期軍團士兵"
 a_legionaries_1_desc: "$a_legionaries_1$延續最古老的操練與紀律傳統。長矛、大盾與堅實的隊形，使其即使在戰局瞬息萬變時仍能屹立不搖。"
 a_legionaries_2: "軍團士兵"
 a_legionaries_2_desc: "軍團士兵受過精良的近戰訓練，配備投槍與短劍。他們的強項在於穩固的陣形與持續操練的軍事文化。"
 a_legionaries_3: "改良軍團士兵"
 a_legionaries_3_desc: "$a_legionaries_3$是歷經戰火淬鍊的步兵，配備最好的甲冑與武器，構成我軍核心。"
 a_legionaries_4: "重型軍團士兵"
 a_legionaries_4_desc: "$a_legionaries_4$是配備最精良甲冑與武器的菁英步兵。如同古羅馬的重裝軍團，這些部隊將成為擊潰敵人的戰錘。"
 a_legionaries_5: "禁衛軍團士兵"
 a_legionaries_5_desc: "$a_legionaries_5$體現軍團士兵的最高標準。他們從最精銳的軍團大隊中遴選而出，受託執行關鍵任務並守護國家最高機構。"
 a_legionaries_6: "帝國軍團士兵"
 a_legionaries_6_desc: "這些$a_legionaries_6$立於數世紀軍事演進的巔峰。他們精通裝備與戰術，充當禁軍，僅憑其存在便足以穩住動搖的戰線。"

 a_byzantine_cataphracts_2: "中世紀晚期全覆裝甲騎兵"
 a_byzantine_cataphracts_2_desc: "$a_byzantine_cataphracts_2$的人馬皆披覆鎖子甲，持長槍與厚盾轟然投入戰場。他們的衝鋒與鐵一般的紀律，令敵人聞之膽寒。"
 a_byzantine_cataphracts_3: "改良全覆裝甲騎兵"
 a_byzantine_cataphracts_3_desc: "這些$a_byzantine_cataphracts_3$結合舊有帝國操典與新式戰術，兼用長槍、弓與副武器。他們作為靈活的重騎兵部隊作戰，既能遠距騷擾，也能近戰殲敵。"
 a_byzantine_cataphracts_4: "重型全覆裝甲騎兵"
 a_byzantine_cataphracts_4_desc: "$a_byzantine_cataphracts_4$身披多層甲冑，足以偏轉大多數箭矢與刀刃。他們編成菁英楔形陣，藉由反覆衝鋒擊潰幾乎無法抵擋的敵軍陣線。"
 a_byzantine_cataphracts_5: "禁衛全覆裝甲騎兵"
 a_byzantine_cataphracts_5_desc: "$a_byzantine_cataphracts_5$由最優秀的槍騎兵中挑選，擔任王座與首都的騎乘禁衛。他們出現在每場戰鬥中，既是武器也是象徵，能鼓舞我軍並震懾敵人。"
 a_byzantine_cataphracts_6: "帝國全覆裝甲騎兵"
 a_byzantine_cataphracts_6_desc: "$a_byzantine_cataphracts_6$是數世紀騎兵傳統的集大成者：披甲的老兵、卓越的坐騎與完美的操練。他們是皇帝的親衛，能以一次恰到好處的衝鋒決定整場戰役。"

 n_greek_fire_galley_renaissance: "噴火筒"
 n_greek_fire_galley_renaissance_desc: "這些船艦配備施放希臘火的特殊管筒，能將烈焰傾瀉至敵艦上，轉眼間使其化為灰燼。在近距離交戰時，它們只預告毀滅。"
 n_greek_fire_galley_discovery: "改良噴火筒"
 n_greek_fire_galley_discovery_desc: "將希臘火投射系統改用於新式船艦，使其能繼續把敵船化為灰燼，並始終作為我國海軍的象徵。"
 a_greek_fire_renaissance_infantry: "手持噴火筒"
 a_greek_fire_renaissance_infantry_desc: "不僅船艦能受益於希臘火，我方陸軍也可配備手持裝置，向敵人噴射燃燒物質。火焰與毀滅將撕裂敵軍陣線，為我軍前進鋪路。"
 a_greek_fire_discovery_infantry: "改良手持噴火筒"
 a_greek_fire_discovery_infantry_desc: "軍隊與部隊不斷變化，但以烈焰覆蓋敵人、令其燃燒，依然是有效的作戰方式。因此，希臘火持續存在於我軍之中，也持續令敵手畏懼。"
