 mission_estate_satisfaction: "獲得[mission_target_estate.GetName]好感"
 mission_estate_satisfaction_desc: "為了未來事業，努力獲得有影響力[estate|e]的好感，對我國內政至關重要。"
 mission_estate_satisfaction_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = estates', '@government_panel! 政府面板 > 階層')]查看你的[estates_with_icon|e]。\n\n@arrow_bonus_tier_2! $increase_estate_satisfaction_tip$"

 mission_shared_enrichment: "共同富裕"
 mission_shared_enrichment_desc: "妥善課稅、帳冊管理，以及確保[estate|e]富裕，將為我國全境的課稅奠定偉大標準。"
 mission_shared_enrichment_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = estates', '@government_panel! 政府面板 > 階層')]查看你的[estates_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊#V 賄賂按鈕#!使用[ShowGenericActionName('bribe_estate')]。\n\n@arrow_bonus_tier_1! 你也可以從[Link('economy', '', '@economy_panel!$lateralview_economy_entry_name$ > 預算')]降低[estate]的[taxes_with_icon|e]，並等待其累積財富。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_estates', '@hint! 階層提示')]。"
 mission_shape_society: "塑造社會"
 mission_shape_society_desc: "變革的浪潮席捲我方疆域中的權力廳堂。若要提升並培養宮廷與[estate|e]之間的牢固聯繫，我們就必須相應地塑造社會。"
 mission_shape_society_tip: "@arrow_bonus_tier_3! 前往[Link('societal_values', '', '@government_panel! 政府面板 > 價值觀')]查看你的[societal_values_with_icon|e]。\n\n@arrow_bonus_tier_2! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府面板 > 內閣')]查看你的[cabinet_with_icon|e]。\n\n@arrow_bonus_tier_1! 指派一位[cabinet_member_with_icon|e]執行[ShowCabinetActionName('change_societal_values')][cabinet_action|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! $hint_has_possible_cabinet_action$')]和[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! $hint_lack_cabinet_for_cabinet_action$')]提示。"

 target_mission_pop_gets_20_satisfaction_tt: "我方[capital|e]中屬於[mission_target_estate.GetNameWithNoTooltip]的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%][pop_satisfaction|e]"
 every_pop_of_estate_10_satisfaction_tt: "#italic 我國全境#!中，屬於[mission_target_estate.GetNameWithNoTooltip]且屬於我方[culture|e]與[religion|e]的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%][pop_satisfaction|e]"
 every_pop_of_no_estate_10_satisfaction_tt: "#italic 我國全境#!中，屬於所選[estate|e]且屬於我方[culture|e]與[religion|e]的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%][pop_satisfaction|e]"

#traditional economy

 generic_traditional_economy: "傳統經濟"
 generic_traditional_economy_DESCRIPTION: "我國的力量，來自於經歷世代考驗並服務人民的經濟管理方法。"
 generic_traditional_economy_CRITERIA_DESCRIPTION: "我們已擁抱傳統而穩定經濟的價值與制度。"
 generic_traditional_economy_BUTTON_TOOLTIP: "透過強化傳統經濟，我們為持久繁榮與社會和諧奠定基礎。"
 generic_traditional_economy_BUTTON_DETAILS: "$generic_traditional_economy_BUTTON_TOOLTIP$"

 mission_increase_workforce: "擴大勞動力"
 mission_increase_workforce_desc: "為了支撐不斷成長的經濟與蓬勃壯大的雄心，我們必須確保勞動力既龐大又能幹。擴大勞動力將使我們能在土地各處推動更廣泛的發展。"

 mission_connect_location_to_capital: "通往[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的道路"
 mission_connect_location_to_capital_desc: "我國心臟必須與四肢保持連接。透過確保當前工作重心與首都相連，我們能強化地方行政的統一與力量，以及稅收與原始資源的汲取。"
 mission_connect_location_to_capital_tip: "@arrow_bonus_tier_2! 前往你的[capital_with_icon|e]，[Player.GetCapital.GetName]，並點擊[road_icon]#V 建造道路#!按鈕。\n\n@arrow_bonus_tier_1! 點擊你想建造[road_with_icon|e]通往的[location_with_icon|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_control', '@hint! $hint_control$提示')]。"
 designated_location_capital_connection_modifier_tt: "指定[province|e]中的每個[location|e]都將受益於[ShowModifier('capital_connection_modifier')][modifier|e]，其效果依[proximity|e]調整"
 
 mission_increase_rgo_level: "擴大資源生產"
 mission_increase_rgo_level_desc: "任何繁榮社會的基礎，都在於其取得自然資源的能力。我們必須發展鄉村基礎設施並提高生產水準，以滿足不斷成長的人口與經濟需求。"
 mission_increase_rgo_level_tip: "@arrow_bonus_tier_2! 前往你為任務選擇的[location_with_icon|e]。\n\n@arrow_bonus_tier_1! 點擊[rgo_icon]#V $game_concept_rgo$按鈕#!以擴張[resource_gathering_operations]。"

 mission_peasants_estate_satisfaction: "農民安居"
 mission_peasants_estate_satisfaction_desc: "農民階層構成我國根基。透過明智治理確保其滿意，將賦予我們實現雄心發展所需的穩定與掌控力。"
 mission_peasants_estate_satisfaction_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = estates', '@government_panel!政府面板 > 階層')]查看你的[estates_with_icon|e]。\n\n@arrow_bonus_tier_2! $increase_estate_satisfaction_tip$"

 mission_market_villages: "鄉村市場"
 mission_market_villages_desc: "在鄉村社群中建立地方市場，將為我方鄉間帶來貿易、機會與成長，打造更加繁榮且連通的國家。"
 mission_market_villages_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@peasants![ShowPopTypeName('peasants')][buildings]篩選，並點擊[ShowBuildingTypeName('market_village')][building]。\n\n@arrow_bonus_tier_1! 透過點擊清單或地圖，在[location_with_icon|e]中建造。"

 mission_embrace_trad_economy: "擁抱傳統經濟"
 mission_embrace_trad_economy_desc: "我們的經濟道路並不在於魯莽創新，而在於建立在經過考驗的方法之上。我們將透過資助鄉村社群並推動重返鄉間，強化傳統經濟以確保持久繁榮。"
 mission_embrace_trad_economy_tip: "$change_societal_value_tip$"

 mission_prosperous_production: "繁榮生產"
 mission_prosperous_production_desc: "鄉村聚落的繁榮，在我方宮廷中至關重要。為了確保材料穩定生產，並持續滿足人民需求，我們將著眼於提高那些英勇支持我國經濟之社群的富庶。"

 mission_fishing_villages: "支持漁村"
 mission_fishing_villages_desc: "海洋與河川蘊藏無數財富。透過賦權漁業社群，我們將增強糧食安全，並為鄉村繁榮開闢新途徑。"
 mission_fishing_villages_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@peasants![ShowPopTypeName('peasants')][buildings]篩選，並點擊[ShowBuildingTypeName('fishing_village')][building]。\n\n@arrow_bonus_tier_1! 透過點擊清單或地圖，在[location_with_icon|e]中建造。"


 mission_cloth_makers: "支持鄉村織布"
 mission_cloth_makers_desc: "布料生產是鄉村產業的支柱。透過扶植此技藝，我們將使人民富裕，並強化我們在國內外市場中的地位。"
 mission_cloth_makers_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@laborers![ShowPopTypeName('laborers')][buildings]篩選，並點擊[ShowBuildingTypeName('rural_clothmaker')][building|e]。\n\n@arrow_bonus_tier_1! 透過點擊清單或地圖，在[location_with_icon|e]中建造。"

 mission_irrigation: "擴建灌溉設施"
 mission_irrigation_desc: "有了肥沃土地與可靠水源，我們便能將最嚴酷的地形也轉化為豐饒田野。擴大灌溉系統將大幅提高農業產量。"
 mission_irrigation_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@peasants![ShowPopTypeName('peasants')][buildings]篩選，並點擊[ShowBuildingTypeName('irrigation_systems')][building|e]。\n\n@arrow_bonus_tier_1! 透過點擊清單或地圖，在[location_with_icon|e]中建造。"

 mission_masons: "建造石匠工坊"
 mission_masons_desc: "石工技藝對聚落與長久制度的興起至關重要。透過在我國境內組織熟練石匠，我們將奠定基礎，提供建材供應，並在其上建造我們的歷史。"
 mission_masons_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@laborers![ShowPopTypeName('laborers')][buildings]篩選，並點擊[ShowBuildingTypeName('mason')][building|e]。\n\n@arrow_bonus_tier_1! 透過點擊清單或地圖，在[location_with_icon|e]中建造。"

