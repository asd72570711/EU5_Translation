 generic_trade: "貿易發展"
 generic_trade_DESCRIPTION: "若要進一步增進我方繁榮，我們必須推動貿易事業！"
 generic_trade_CRITERIA_DESCRIPTION: "我們已塑造商人政策，並改善相關基礎設施。"
 generic_trade_BUTTON_TOOLTIP: "競爭激烈的貿易世界，透過商品交換與遠方貿易路線提供了有利可圖的機會。"
