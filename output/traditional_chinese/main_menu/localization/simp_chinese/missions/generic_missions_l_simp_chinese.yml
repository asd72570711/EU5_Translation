 mission_get_into_profitable_export: "出口之道"
 mission_get_into_profitable_export_desc: "只有當我們購買的商品被售入富裕市場時，金錢才會被賺取。建立出口路線是成功的關鍵。"
 mission_get_into_profitable_export_tip: "@arrow_bonus_tier_3! 前往[Link('trade', '', '@economy_panel! 經濟面板 > 貿易')]查看你的[trade_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊卡片進行一項建議[trades]，並讓一個月過去，以查看其表現。\n\n@arrow_bonus_tier_1! 或者，你可以點擊@automation!#V 自動化齒輪#!來自動化所有貿易\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_trade', '@hint! 貿易提示')]。"

