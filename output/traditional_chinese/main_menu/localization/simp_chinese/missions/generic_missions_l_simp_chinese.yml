 mission_ensure_book_production: "確保書籍生產"
 mission_ensure_book_production_desc: "我們提供知識與識字能力的努力，始於書籍供應。資助每一座新印刷中心，都將擴大書籍生產，使知識與識字能力傳播於我方土地。"
 mission_ensure_book_production_tip: "@arrow_bonus_tier_3! 前往[Link('goods_production', '', '@production_panel! 生產面板 > 商品')]並尋找@books![ShowGoodsName('books')][good|e]。\n\n@arrow_bonus_tier_2! 點擊[building_icon]#V 建築#!按鈕，篩選所有生產[ShowGoodsName('books')]且可在你的[country]建造的[buildings|e]。\n\n@arrow_bonus_tier_1! 在任意[location|e]建造#V 3#!座。"
 mission_new_institutions: "新機構"
 mission_new_institutions_desc: "追求外國知識只會為我們帶來新技術與各種優勢。 "
 mission_found_libraries: "創設圖書館"
 mission_found_libraries_desc: "我們必須建立圖書館以保存知識，並作為教育中心。"
 mission_found_libraries_tip: "@arrow_bonus_tier_2! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]並尋找[ShowBuildingTypeName('library')][building|e]。\n\n@arrow_bonus_tier_1! 點擊建築，在你的任一[locations_with_icon|e]中建造。"
 mission_wave_of_innovation: "革新浪潮"
 mission_wave_of_innovation_desc: "人民渴求知識！為滿足這份渴望，鼓勵創新思想以推進我國科學與文化將是明智之舉，否則我們恐將落後於鄰邦。"
 mission_build_chancery: "秘書室"
 mission_wave_of_innovation_tip: "@arrow_bonus_tier_3! 前往[Link('societal_values', '', '@government_panel! 政府面板 > 價值觀')]查看你的[societal_values_with_icon|e]。\n\n@arrow_bonus_tier_2! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府面板 > 內閣')]查看你的[cabinet_with_icon|e]。\n\n@arrow_bonus_tier_1! 指派一位[cabinet_member_with_icon|e]執行[ShowCabinetActionName('change_societal_values')][cabinet_action|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! $hint_has_possible_cabinet_action$')]和[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '@hint! $hint_lack_cabinet_for_cabinet_action$')]提示。"
 mission_build_chancery_desc: "我方眾多聚落構成的疆域日益擴大，使行政與法律程序的便利化需求增加。為了解決此事，我們必須建立一座合適的[ShowBuildingTypeName('chancery')]來監督政府。"
 mission_theatrical_expression: "戲劇表現"
 mission_theatrical_expression_desc: "我們的心靈、靈魂與文化本質，都存在於藝術的創造性表達之中。"
 mission_islamic_colleges: "伊斯蘭學院"
 mission_islamic_colleges_desc: "研讀經文並保存知識，是我們莊嚴的責任。因此，我們必須發展各種經學院，以教育人民並推進伊斯蘭學術。"
 mission_houses_of_wisdom: "智慧宮"
 mission_houses_of_wisdom_desc: "知識的傳播與更高智識的追求，將在每一座新的[ShowBuildingTypeName('university')]中蓬勃發展。"
 four_locations_gain_development_tt: "最多#Y 4#!處擁有最高[literacy|e]且有[ShowBuildingTypeName('university')]的[locations|e]將獲得[ShowNamedValue('development_mild_bonus')|+][development|e]。"
 mission_advances_technology: "技術進步"
 mission_advances_technology_desc: "我們必須投資技術進步，以確保人民的競爭力。"
 mission_advances_technology_tip: "@arrow_bonus_tier_3! 前往@advances_panel![Link('advances', 'subtab = research', 'lateralview_advances_entry_name')]，並選擇符合需求的革新。\n\n@arrow_bonus_tier_2! 你也可以點擊右上方的空燒瓶圖示，開啟整個@advances_panel![Link('technology_view', '', 'lateralview_technology_view_entry_name')]。\n\n@arrow_bonus_tier_1! 記得你可以從@automation![Link('automation', '', 'lateralview_automation_entry_name')]自動化我們的研究。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_can_do_more_research', '@hint! $hint_can_do_more_research$提示')]#!。"
 researched_5_new_advances_tt: "自啟用[ShowMissionName('progress_and_literacy')][mission|e]以來，我們已研究至少#Y 3#!項新[advances|e]"
 mission_raise_literacy: "提高識字率"
 mission_raise_literacy_desc: "識字是一座需要照料與細心發展的花園。教育人口，就是確保光明未來！"
 mission_raise_literacy_tip: "你可以透過多種方式改善整個[country_with_icon|e]的[literacy_with_icon|e]：\n$TAB$@arrow_bonus_tier_1! 從[Link('production', '', '@production_panel! 生產面板 > 建築')]建造[buildings_with_icon|e]，增加[upper_class|e][pops_with_icon|e]數量。\n$TAB$@arrow_bonus_tier_1! 在人口最多的[locations]建造[ShowBuildingTypeName('library')]建築。\n$TAB$@arrow_bonus_tier_1! 研究會提高[literacy]的[advances_with_icon|e]。你可以從[Link('technology_view', '', '@advances_panel! $lateralview_technology_view_entry_name$')]進行。\n$TAB$@arrow_bonus_tier_1! 將[rural_locations|e]升級為[urban_locations|e]。\n\n #italic 你可以從@advances_panel![Link('advances', '', 'lateralview_advances_entry_name')]查看目前[literacy]#!。"

 mission_ensure_book_production_reward_tt: "我們擁有最高[development|e]與[market_access|e]且生產[ShowGoodsName('books')]的[location|e]，將獲得遞減的[ShowModifier('center_of_writing_modifier')][modifier|e]，持續#Y 10#!年。"
 scales_with_number_of_libraries: "依滿員[ShowBuildingTypeName('library')][buildings|e]數量調整" 
 every_location_with_theater_pops_gain_10_satisfaction_tt: "擁有[ShowBuildingTypeName('theater')]的[locations|e]中[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 monthly_events_about_research_and_thought_tt: "當此[mission_task|e]正在積極推進時，可能會每月發生關於我們嘗試傳播創新與進步的[events|e]"

