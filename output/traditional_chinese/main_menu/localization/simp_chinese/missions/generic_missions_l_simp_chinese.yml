 mission_destabilize_rival: "在宿敵境內煽動不滿"
 mission_destabilize_rival_desc: "若要讓宿敵成為容易捕食的獵物，我們必須確保其內部不穩，並容易受到外來入侵。"
 mission_destabilize_rival_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]，並點擊你想鎖定的#V [rivals_icon|e]宿敵#!旗幟。\n\n@arrow_bonus_tier_2! 你可以點擊國家卡片上的[spy_network_icon]#W 間諜網按鈕#!，或在其[diplomacy_icon]#W 外交行動#!中的[hostile_icon]#W 敵對行動#!內點擊。\n\n@arrow_bonus_tier_1! 在我們的[rivals]中建立[spy_network_with_icon|e]，以累積足夠[spy_network_with_icon|e]對其使用#W 煽動不滿外交行動#!；該行動可在[diplomacy_icon]#W 外交行動#! > [spy_network_icon]#W 秘密行動#!中找到。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_lacks_of_rivals', '$hint_lacks_of_rivals$提示')]。"

