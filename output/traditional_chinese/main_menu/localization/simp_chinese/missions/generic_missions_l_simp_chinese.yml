 mission_create_cabinet_desc: "若無可信內閣輔佐，我方疆域過於遼闊，難以妥善治理。我們需要能幹且經驗豐富的顧問協助！"
 mission_create_cabinet_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府 > 內閣')]，或點擊[cabinet_actions_icon]#W 警示#!查看你的[cabinet_actions|e]。\n\n@arrow_bonus_tier_2!  任命相關[ability|e]最高的[character|e]至空缺[cabinet_seat|e]。\n\n@arrow_bonus_tier_1! 若我們沒有合適[characters]可用，請聘用一位新的[courtier|e]。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_has_possible_cabinet_action', '$hint_has_possible_cabinet_action$提示')]和[Link('hints', 'selected_hint = hint_lack_cabinet_for_cabinet_action', '$hint_lack_cabinet_for_cabinet_action$提示')]。#!"

 mission_promote_cabinet_head: "內閣首腦"
 mission_promote_cabinet_head_desc: "任命一位能幹領袖監督內閣並引導行政，將是明智之舉。"
