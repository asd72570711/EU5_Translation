 mission_increase_maritime_presence: "海上存在"
 mission_increase_maritime_presence_desc: "連接我方港口的海上航線發展，對我們累積的繁榮發揮了重要作用。因此，我們必須轉向擴張既有海上存在，以維持我方商業主導地位！"
 mission_increase_maritime_presence_tip: "$mission_expand_merchant_power_tip$"

 mission_protect_our_coasts: "保護我方海岸"
 mission_protect_our_coasts_desc: "四處劫掠的海盜、貪婪的外國商人與非法逐利者，始終覬覦我方海岸及其財富。透過在海岸線各處建設防禦基礎設施，我們將成功擊退敵人，同時維持富庶。"
