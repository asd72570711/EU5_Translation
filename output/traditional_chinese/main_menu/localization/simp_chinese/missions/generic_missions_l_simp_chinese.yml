 mission_capital_influence_tip: "@arrow_bonus_tier_3! 前往你的[capital_with_icon|e]，@location![Player.GetCapital.GetName]，查看其[buildings_with_icon|e]。\n\n@arrow_bonus_tier_2! 確保其大多數[buildings]都已完全[employed|e]。\n\n@arrow_bonus_tier_1! 你可以提高[stability_with_icon|e]，以協助[ShowModifierTypeName('local_pop_promotion_speed')]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_lack_pop_promotion_to_fill_buildings', '@hint! 階層提示')]。"
 mission_fund_construction_projects: "資助建設計畫"
