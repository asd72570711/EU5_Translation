 mission_expand_merchant_capacity_desc: "若要擴張我國的商業事業，我們必須先確保持續有熱忱商人湧入，他們將在我們的市場中買賣這些貨物。"
 mission_expand_merchant_capacity_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@burghers![ShowPopTypeName('burghers')][buildings]篩選，並點擊[ShowBuildingTypeName('marketplace')][building|e]。\n\n@arrow_bonus_tier_1! 在屬於所需[market_with_icon|e]的[locations]中建造。你可以透過設定面板頂部的適當市場卡片，按市場篩選。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_trade', '貿易提示')]"
 mission_expand_merchant_power: "有影響力的商人"
 mission_expand_merchant_power_desc: "若要使我方貿易雄心成功，我們在自身市場中的影響力必須無可爭議。建造[ShowBuildingTypeName('marketplace')]及類似建築，將對此任務大有助益。"
