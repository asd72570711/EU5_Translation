 mission_satisfy_own_demands_desc: "如果我方人民正迫切需要我們的產品，就無法將其銷往外國市場。我們應先滿足大眾需求，然後再專注於創造利潤。"
 mission_export_produced_goods: "出口[ROOT.GetCountry.MakeScope.GetVariable('mission_target_goods').GetGoods.GetNameWithNoTooltip]"
