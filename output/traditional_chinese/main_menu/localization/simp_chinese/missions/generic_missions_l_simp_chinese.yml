 royal_authority_tip: "@arrow_bonus_tier_3! 前往[Link('economy', 'tabcontent = balance', '@economy_panel! 經濟 > 收支')]。\n\n@arrow_bonus_tier_2! 提高[court_maintenance|e]以增加[legitimacy|e]。\n\n@arrow_bonus_tier_1! 選擇名為[ShowCabinetActionName('strengthen_government')]的[cabinet_action_with_icon|e]。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_low_legitimacy', '$hint_low_legitimacy$提示')]。#!"
 

 high_era_of_countryname: "[ROOT.GetCountry.GetNameWithNoTooltip]的盛世"
 high_era_of_countryname_desc: "良善治理、幸福人民，以及充分照顧其公民的國家，都是將使我們經歷繁榮與安寧時代的因素。"
 high_era_of_countryname_tip: "@arrow_bonus_tier_3! 前往[Link('economy', 'tabcontent = balance', '@economy_panel! 經濟 > 收支')]並投資[stability_with_icon|e]。\n\n@arrow_bonus_tier_2! 指示[cabinet|e]執行[ShowCabinetActionName('stabilize_country')]\n\n@arrow_bonus_tier_1! 透過建造具備[ShowPopTypeName('clergy')]的[buildings_with_icon|e]，增加[GetPlayer.GetReligion.GetAdjective][ShowPopTypeName('clergy')]數量。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_low_stability', '$hint_low_stability$提示')]。#!"

#development_of_infrastructure

 development_of_infrastructure: "基礎設施事業"
 development_of_infrastructure_DESCRIPTION: "在首都周邊妥善建立基礎設施至關重要。"
 development_of_infrastructure_CRITERIA_DESCRIPTION: "我們已充分發展首都。"
 development_of_infrastructure_BUTTON_TOOLTIP: "我們的首都將成為繁榮且不斷成長國家的跳動心臟。"
 development_of_infrastructure_BUTTON_DETAILS: "$development_of_infrastructure_BUTTON_TOOLTIP$"

 mission_assembly_halls: "集會廳"
 mission_assembly_halls_desc: "若要妥善行使我方權力並掌控疆域，我們需要在首都擁有一座合適的會議廳。"
 mission_assembly_halls_tip: "@arrow_bonus_tier_3! 前往你的[capital_with_icon|e]，@location![Player.GetCapital.GetName]。\n\n@arrow_bonus_tier_2! 點擊面板左側的@nobles![ShowPopTypeName('nobles')]按鈕，查看可為該[pop_type|e]建造的[buildings_with_icon|e]。\n\n@arrow_bonus_tier_1! 開始請求[building]的[construction_with_icon|e]。"
 mission_capital_province_prosperity: "首都繁榮"
 mission_capital_province_prosperity_desc: "首都省份的發展將促進繁榮，並確保其在區域中的主導地位。"
 a_great_capital: "偉大首都"
 a_great_capital_desc: "若要建立偉大社會，並成為人民閃耀的明燈，我們必須首先建造一座宏偉的首都，作為我方光榮疆域的心臟！"
 a_great_capital_tip: "@arrow_bonus_tier_3! 前往你的[capital_with_icon|e]，@location![Player.GetCapital.GetName]。\n\n@arrow_bonus_tier_2! 點擊地點卡片頂部的@construction!#V 建造按鈕#!。\n\n@arrow_bonus_tier_1! 開始請求數量[buildings|e]的[construction_with_icon|e]。"
 this_will_depend_on_how_many_buildings_our_capital_has_in_total_tt: "獲得的[development|e]部分取決於我方[capital|e]中[buildings|e]的總數"
 mission_capital_province_control: "首都周邊控制"
 mission_capital_province_control_desc: "我方影響力的本質與權力所在地，存在於環繞首都的土地之中。我們必須立即著手提高對其控制。"
 mission_capital_province_control_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府面板 > 內閣')]查看你的[cabinet_with_icon|e]。\n\n@arrow_bonus_tier_2! 指派一位[cabinet_member_with_icon|e]在[Player.GetCapital.GetProvince.GetName]的[province_with_icon|e]上執行[ShowCabinetActionName('increase_control_province')][cabinet_action|e]。\n\n@arrow_bonus_tier_1! 你也可以前往你的[capital_with_icon|e]，[Player.GetCapital.GetName]，並點擊#V 建造道路#!按鈕，建造一條通往鄰近[location|e]的[road_with_icon|e]，以提高其[control_with_icon|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_control', '@hint! $hint_control$提示')]。"
 mission_capital_town: "建立城鎮"
 mission_capital_town_desc: "若要促進我國境內收入與流通增加，我們必須建立一座新城鎮。"
 mission_capital_town_tip: "@arrow_bonus_tier_3! 前往你的[capital_with_icon|e]，@location![Player.GetCapital.GetName]。\n\n@arrow_bonus_tier_2! 點擊地點卡片左上方的[rural_location_icon][location_rank|e]圖示，將[location_with_icon|e]從[rural_location_with_icon|e]升級為@town![ShowLocationRankName('town')]。"
 mission_capital_city: "城市化浪潮"
 mission_capital_city_desc: "鼓勵成長與發展，將我們的首都轉變為繁榮城市。一座主要城市中心將成為偉大時代的開端！"
 mission_capital_city_tip: "@arrow_bonus_tier_3! 前往你的[capital_with_icon|e]，@location![Player.GetCapital.GetName]。\n\n@arrow_bonus_tier_2! 點擊地點卡片左上方的[location_rank|e]圖示，將[location_with_icon|e]從@town![ShowLocationRankName('town')]升級為@city![ShowLocationRankName('city')]。"
 burghers_capital_grow_tt: "我方[capital|e]中的[ShowPopTypeName('burghers')][pops|e]數量將會增長"
 mission_capital_city2: "$mission_capital_city$"
 mission_capital_city2_desc: "$mission_capital_city_desc$"
 mission_capital_city2_tip: "$mission_capital_city_tip$"
 if_we_complete_as_city_we_gain_x_tt: "@trigger_no! 若我們在[capital|e]擁有#Y 城市#![location_rank|e]時完成此[mission_task|e]，其將獲得[ShowModifier('center_of_urbanization_modifier')][modifier|e]，持續#Y 10#!年"
 mission_food_investment: "糧食投資"
 mission_food_investment_desc: "那些耕作田地、開採礦山並支撐政府運作之人，需要食物維生。因此，我們必須努力向人民提供糧食，並保護他們免於飢餓。"
 mission_food_investment_tip: "@arrow_bonus_tier_3! 前往[Link('food_production', '', '@production_panel! 生產面板 > 糧食')]查看你的[provinces_with_icon|e]清單及其[food_with_icon|e]情況。\n\n@arrow_bonus_tier_2! 點擊省份卡片查看其[locations_with_icon]，並在[food_productivity_with_icon|e]最高者中擴張[food_raw_materials|e]。\n\n@arrow_bonus_tier_1! 你也可以點擊[building_icon]#V [building]按鈕#!，查看該[location]中可用的[food][buildings]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_food', '@hint! 糧食提示')]。"
 every_location_in_cap_prov_food_provisions_modifier: "我方[capital|e]所在[province|e]中的每個已擁有[location|e]都將獲得[ShowModifier('capital_food_provisions_modifier')]，持續#Y 5#!年"
 mission_build_roads: "條條道路通往[ROOT.GetCountry.GetCapital.GetName]"
 mission_build_roads_desc: "我們偉大疆域的命脈與神經系統，將是一套連接首都與周邊鄰近聚落的新道路網。擴張道路網，以改善區域中的連通性與貿易！"
 mission_build_roads_tip: "@arrow_bonus_tier_2! 前往你的[capital_with_icon|e]，[Player.GetCapital.GetName]，並點擊#V 建造道路#!按鈕。\n\n@arrow_bonus_tier_1! 建造一條通往鄰近[location|e]的[road_with_icon|e]。"
 mission_task_will_be_bypassed_tt: "此[mission_task|e]將被跳過"
 mission_home_region_control: "控制區域"
 mission_home_region_control_desc: "本可充實國庫的應稅收入，往往從我們掌中溜走。我們的執達吏與行政官必須建立對周邊區域的支配，以鞏固首都影響力。"
 mission_home_region_control_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府面板 > 內閣')]查看你的[cabinet_with_icon|e]。\n\n@arrow_bonus_tier_2! 指派一位[cabinet_member_with_icon|e]在[Player.GetCapital.GetProvince.GetArea.GetRegion.GetName]的[region_with_icon|e]內[provinces|e]上執行[ShowCabinetActionName('increase_control_province')][cabinet_action|e]。\n\n@arrow_bonus_tier_1! 你也可以從你的[capital_with_icon|e]建造[roads_with_icon|e]，以提高[region]中的[control_with_icon|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_control', '@hint! $hint_control$提示')]。"
 will_scale_with_average_home_region_control_tt: "這將依我方本土[region|e]的平均[control|e]調整"

 mission_push_for_centralization: "推動中央集權"
 mission_push_for_centralization_desc: "若我們希望進一步擴張影響並維持權力掌控，將權力累積於中央權威之下，無疑是大膽且必要的舉措。以繁榮與支持我方統治的人民之名，我們必須尋求驅逐分權因素，並將國家引向更好的道路。"
 mission_push_for_centralization_tip: "$change_societal_value_tip$"
 monthly_events_about_centralization_tt: "當此[mission_task|e]正在積極推進時，可能會每月發生關於我們嘗試中央集權的[events|e]"

#progress_and_literacy
 progress_and_literacy: "進步與識字"
 progress_and_literacy_DESCRIPTION: "照顧人民的識字需求至關重要。"
 progress_and_literacy_CRITERIA_DESCRIPTION: "我們的人民已受教育，且識字率提高。"
 progress_and_literacy_BUTTON_TOOLTIP: "讓我方疆域成為聰慧頭腦與創新思想先驅的家園！"
