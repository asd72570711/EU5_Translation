 mission_grant_burghers_privileges_desc: "為了創造經濟上揚的基礎，我們必須先獲得商人的信任與善意。授予他們特權或大幅降低其稅負，或許能使他們站到我們這邊。" 
 mission_grant_burghers_privileges_tip: "@arrow_bonus_tier_3! 前往[Link('government', 'tabcontent = estates', '@government_panel! 政府面板 > 階層')]查看你的[estates_with_icon|e]。\n\n@arrow_bonus_tier_2! 授予[GetEstateName('burghers_estate')]一項新的[privilege_with_icon|e]。\n\n@arrow_bonus_tier_2! $increase_estate_satisfaction_tip$"
 up_to_4_locations_decaying_mod_based_on_crown_power_tt: "最多#Y 4#!處[urban_locations|e]將根據我方[crown_power|e]受到[ShowModifier('powerful_center_of_burghers_modifier')][decaying_modifier|e]影響"
 up_to_5_locations_decaying_mod_based_on_crown_power_and_scale_dev_tt: "最多#Y 5#!處[locations|e]將根據我方[crown_power|e]獲得[development|e]。[development|e]增益將取決於各地點通往[mission_target_market.GetName][market|e]的[market_access|e]"
 mission_setup_trade: "建立貿易"
 mission_setup_trade_desc: "若要使經濟成長，我們需要一套已建立的貿易網絡。任何形式的進口或出口，都足以讓我方商人獲得未來事業所需的經驗。"
 mission_setup_trade_tip: "@arrow_bonus_tier_3! 前往[Link('trade', '', '@economy_panel! 經濟面板 > 貿易')]查看你的[trade_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊卡片進行一項建議[trades]，並讓一個月過去，以查看其表現。\n\n@arrow_bonus_tier_1! 或者，你可以點擊@automation!#V 自動化齒輪#!來自動化所有貿易\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_trade', '@hint! 貿易提示')]。"
 mission_attracting_new_burghers: "壯大[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]"
 mission_attracting_new_burghers_desc: "既然我們的經濟圍繞資本理念規劃，我們就必須先播下種子。我們的城鎮與城市需要更多工匠、商人，以及其他值得敬重的商人階級成員。"
 mission_attracting_new_burghers_tip: "@arrow_bonus_tier_3! 前往你為任務選擇的[location_with_icon]。\n\n@arrow_bonus_tier_2! 點擊面板左側的@burghers![ShowPopTypeName('burghers')]按鈕，查看可為該[pop_type|e]建造的[buildings_with_icon|e]。\n\n@arrow_bonus_tier_1! 開始[ShowPopTypeName('burghers')][building]的[construction_with_icon|e]，以增加其人數。"

 mission_embrace_capital_economy: "擁抱$capital_economy_focus$"
 mission_embrace_capital_economy_desc: "過去，我國一直依靠$traditional_economy_focus$的理念。然而，這些方法不足以支撐繁榮的未來，因此我們將擁抱$capital_economy_focus$的現代理念。"
 monthly_events_about_capital_economy_tt: "當此[mission_task|e]正在積極推進時，可能會每月發生關於我們嘗試擁抱[ShowSocietyDirectionName('capital_economy')][societal_value|e]的[events|e]"
