#generic_conquer_province
 generic_conquer_province: "區域擴張"
 generic_conquer_province_DESCRIPTION: "向榮耀前進！"
 generic_conquer_province_CRITERIA_DESCRIPTION: "我們的[ROOT.GetCountry.GetFlavorRank]已擴張其領土。"
 generic_conquer_province_BUTTON_TOOLTIP: "主動進攻是對抗敵對鄰邦擴張威脅的必要手段。"
 generic_conquer_province_BUTTON_DETAILS: "環繞我方疆域的邊境遍布敵人，以及企圖終結我方統治之輩。我們必須掌握主動，發起進攻戰役，以免淪為鄰近禿鷲擴張傾向下的犧牲品。"
 has_cb_that_allows_conquest_on_neighbor_country_tt: "我們對鄰近[country|e]擁有允許征服[locations|e]的[casus_belli|e]"
 choose_province_for_next_conquest_tasks_tt: "我們將為接下來的[mission_tasks|e]選擇指定[province|e]"

 select_mission_for_next_mission_tasks: "為下一個[mission task|e]選擇一個[province|e]"
 monthly_events_about_integration_tt: "當此[mission_task|e]正在積極推進時，可能會每月發生關於整合工作的[events|e]"
 requirements_after_mission_conquer_province_tt: "此任務的要求將在我們完成$mission_conquer_province$[mission_task|e]後揭示"

 mission_war_chest: "籌措戰爭金庫"
 mission_war_chest_desc: "戰爭是一頭飢渴黃金的烈焰巨獸。為了召集士兵、激勵徵召兵並資助戰役，我們需要大量金錢。"

 mission_obtain_casus_belli: "取得[casus_belli|e]"
 mission_obtain_casus_belli_desc: "我們的目標正當，而在邊界擴張並確保免受潛在威脅之前，我們絕不能止步。因此，我們必須尋求正當且合法的理由，將外國土地併入我方國土。"
 mission_obtain_casus_belli_tip: "@arrow_bonus_tier_3! 取得宣戰理由的最佳方式，是向我們的[parliament_with_icon|e]請求。你可以從[Link('government', 'tabcontent = parliament', '@government_panel!政府面板 > 議會')]召開議會會期。\n\n@arrow_bonus_tier_2! 在外國[countries]建立[spy_network_with_icon|e]後，若我們在其土地上擁有[cores_with_icon|e]，或其為我們的[rivals_with_icon|e]，便可對其捏造宣戰理由。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_casus_belli', '@hint! 宣戰理由提示')]。"

 mission_conquer_province: "征服省份"
 mission_conquer_province_desc: "以弱小鄰邦為代價擴張我國，無非是自然法則——適者生存。"
 mission_conquer_province_tip: "@arrow_bonus_tier_3! 一旦累積足夠[war_score_with_icon|e]，便可從[diplomatic_actions|e]向敵人提出[peace_treaty_with_icon|e]。 \n\n@arrow_bonus_tier_2! 在[peace_treaty]面板中，選擇你想征服的[locations_with_icon|e]或[provinces_with_icon|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_war', '@hint! 戰爭')]、[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! 圍城')]和[Link('hints', 'selected_hint = hint_battle', '@hint! 戰鬥')]提示。"
 top_owner_is_us_or_not_ownable_tt: "每個可擁有的（即#R 非#!不可通行、海洋或湖泊）[location|e]均由我們或我們的[subjects|e]擁有"
 mission_peace_integrate_province: "整合我們的征服地"
 mission_peace_integrate_province_desc: "我們不可只滿足於勝利果實。妥善整合被征服土地，應是我們的首要任務。"
 mission_peace_integrate_province_tip: "@arrow_bonus_tier_2! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府面板 > 內閣')]查看你的[cabinet_with_icon|e]。\n\n@arrow_bonus_tier_1! 指派一位[cabinet_member_with_icon|e]執行[ShowCabinetActionName('integrate_province')][cabinet_action|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_has_conquered_provinces', '@hint! $hint_has_conquered_provinces$')]提示。"
 mission_fortifications: "鞏固邊境"
 mission_fortifications_desc: "當偉大的攻勢正在推進時，我們也不可忽視防禦計畫；一旦征服戰役結束，便應確保新邊境安全。"
 mission_fortifications_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]並尋找[ShowBuildingTypeName('castle')][building|e]。\n\n@arrow_bonus_tier_2! 點擊建築，在你的任一[locations_with_icon|e]中建造。\n\n@arrow_bonus_tier_1! 要塞會阻擋敵方[armies_with_icon|e]移動，因此最好鞏固你的邊境，尤其是不可通行地形之間的天然咽喉。"
 mission_fortifications_reward_tt: "目標[location|e]將獲得[ShowModifier('mission_defensive_fortification_modifier')]"
 no_eligible_border_location_tt: "@trigger_no! 沒有符合條件的邊境[location|e]"

 mission_army: "召集軍隊"
 mission_army_desc: "無論是由忠誠臣民組成，還是從平民中徵召而來，我們的軍隊都必須整裝待命。常備軍將提供紀律與持久力，而徵召兵則會在需要時壯大我們的隊伍。兩者合一，便將成為足以保衛我國、並在海外彰顯我方威勢的力量。"
 mission_army_tip: "@arrow_bonus_tier_3! 遊戲開始時，你的[levies_with_icon|e]會承擔大部分戰鬥。你可以透過授予某些[privileges_with_icon|e]，或從[Link('country_culture', 'subtab = breakdown', '@society_panel! 社會面板 > 文化')]接納更多[cultures_with_icon|e]來增加[levies]規模。\n\n@arrow_bonus_tier_2! 你也可以從[Link('unit_overview', '', '@military_panel! $lateralview_unit_overview_entry_name$')]建立[regulars_with_icon|e]或招募[mercenaries_with_icon|e]\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_has_unraised_levies_in_war', '@hint! 徵召兵提示')]。"

 mission_army_infantry: "徵召步兵"
 mission_army_infantry_desc: "任何成功軍隊的骨幹都是其步兵。一支訓練有素、堅實可靠的部隊，隨時準備保衛我們的人民並消滅敵人！"
 mission_army_cavalry: "徵召騎兵"
 mission_army_cavalry_desc: "迅捷衝鋒與致命浪潮般的猛攻，將讓我們的騎兵在敵人心中播下恐懼。我們將集結一支無敵之師，踐踏任何擋在我們道路上的人！"
 mission_army_levies: "召集徵召兵"
 mission_army_levies_desc: "每一位健壯男子都有義務拿起武器，保衛我們的人民與利益。"
 mission_army_mercenaries: "僱傭軍團"
 mission_army_mercenaries_desc: "受過精良戰爭訓練的外國人，將構成我們下一場軍事戰役的堅實核心。"
 mission_obtain_casus_belli_parliament: "議會正當化"
 mission_obtain_casus_belli_parliament_desc: "我們擴張疆域的計畫，取決於能否透過議會為對敵人的合法戰爭提供正當理由。"
 mission_obtain_casus_belli_spy_network: "滲透工作"
 mission_obtain_casus_belli_spy_network_desc: "我們的間諜是能幹的亡命之徒，隨時準備滲透敵人的宮廷。在他們協助下，我們或許能深刻洞悉敵人的事務，甚至為即將到來的戰役指定目標！"
 designate_rival_as_main_threat_tt: "我們將指定一個曾遭我們侮辱的[rivals|e]，作為這些[mission_tasks|e]的主要對手"
 mission_declare_war: "開戰！"
 mission_declare_war_desc: "我們的計畫與準備即將完成。是時候宣戰，趁熱打鐵了。"
 mission_declare_war_tip: "@arrow_bonus_tier_3! 前往你想攻擊的[country_with_icon|e]的#high 外國面板#!，並點擊[war_icon]#V 宣戰#![diplomatic_action|e]。\n\n@arrow_bonus_tier_2! 在面板底部選擇你的[casus_belli_with_icon|e]。\n\n@arrow_bonus_tier_1! 小心敵人可能召入[war]的任何[allies_with_icon|e]。\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_war', '@hint! 戰爭')]、[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! 圍城')]和[Link('hints', 'selected_hint = hint_battle', '@hint! 戰鬥')]提示。"
 
 justify_religious_war: "正當化宗教戰爭"
 justify_religious_war_desc: "環繞我國邊境的異教徒與不信者，很快便會感受到我軍的神聖威力。為了使我們的戰爭動議合法化，我們必須訴諸[ShowReligionAdjective('catholic')]教會中最崇高的權威。"
 mobilize_the_clergy: "動員[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]"
 mobilize_the_clergy_desc: "信仰是我國人民的核心，也是偉大社會的支柱。在偉大聖職者的凝聚下，我們必須仰賴[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]，激勵民眾投入即將到來的衝突！"

 raise_a_navy: "建立海軍"
 raise_a_navy_desc: "在我們備戰之際，海岸的支配權不容置疑。建立一支強大海軍，將協助我們實施封鎖並加速軍事戰役。"
 raise_a_navy_tip: "@arrow_bonus_tier_3! 遊戲開始時，你的[navy_levies_with_icon|e]會承擔大部分戰鬥。你可以透過授予某些[privileges_with_icon|e]，或從[Link('country_culture', 'subtab = breakdown', '@society_panel! 社會面板 > 文化')]接納更多[cultures_with_icon|e]來增加[navy_levies]規模。\n\n@arrow_bonus_tier_2! 你也可以從[Link('unit_overview', '', '@military_panel! $lateralview_unit_overview_entry_name$')]建造[regular_ship_with_icon|e]或招募[mercenaries_with_icon|e]\n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_has_unraised_levies_in_war', '@hint! 徵召兵提示')]。"
 mission_surpass_enemy: "超越敵人"
 mission_surpass_enemy_desc: "持續進行的戰役凸顯出我方海軍必須超越敵人的必要性。若要維持海上霸權，我們就必須搜尋並摧毀敵艦。"

 mission_armory: "建造軍械庫"
 mission_armory_desc: "我們在[ROOT.GetCountry.GetFlavorRank]周邊區域事務中的影響日益增長，使得推動建立徵兵中心、支持不斷壯大的常備軍變得必要。已發展為城鎮或城市的領土，能夠也應該推動興建當地的[ShowBuildingTypeName('armory')]。"
 mission_manpower: "獲得人力"
 mission_manpower_desc: "為了壯大隊伍並確保兵員供應，我們必須維持一套充滿新兵的健全補充體系！"

 mission_reduce_antagonism: "降低$antagonism$"
 mission_reduce_antagonism_desc: "我們在海外的征服必定會引起鄰邦側目。為避免他們聯合起來對抗我們，我們必須設法改善自己在其眼中的地位。"
 mission_restore_province: "恢復繁榮"
 mission_restore_province_desc: "戰爭的蹂躪，對那些最近成為我方疆域一部分的人並不仁慈。恢復部分繁榮，是改善新征服省份當地人觀感的好方法。"
 mission_restore_province_tip: "@arrow_bonus_tier_3! [war_with_icon|e]常會摧毀你[locations_with_icon|e]的[prosperity_with_icon|e]。它會隨時間恢復，但你可以透過[cabinet_action_with_icon|e]加速恢復。\n\n@arrow_bonus_tier_2! 前往[Link('government', 'tabcontent = cabinet', '@government_panel! 政府面板 > 內閣')]查看你的[cabinet_with_icon|e]。\n\n@arrow_bonus_tier_1! 指派一位[cabinet_member_with_icon|e]執行[ShowCabinetActionName('recovery_effort')][cabinet_action|e]。"
 non_scope_every_pop_conquest_location_var_province_10_sat_tt: "指定[province|e]中我們的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 every_pop_conquest_location_var_province_10_sat_tt: "[conquest_province.GetName]中我們的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"

#generic_vassal_ties
 generic_vassal_ties: "$vassal$紐帶"
 generic_vassal_ties_DESCRIPTION: "我們必須確保與$vassal$的關係穩定！"
 generic_vassal_ties_CRITERIA_DESCRIPTION: "我們與$vassal$的關係比以往更加牢固。"
 generic_vassal_ties_BUTTON_TOOLTIP: "在不確定的時代，與可信賴的附庸合作，是克服內外挑戰的關鍵。"
 generic_vassal_ties_BUTTON_DETAILS: "在充滿不確定的動盪時代，我們必須仰賴可靠的$vassal$，以承受道路上出現的一切障礙與敵人。唯有透過合作與友好關係，我們才能堅持下去！"
 monthly_events_about_annexation_tt: "當此[mission|e]啟用時，可能會每月發生關於進行中併吞的[events|e]"
 mission_commence_annexation: "開始併吞"
 mission_commence_annexation_desc: "儘管我們關係友好，但附庸所行使的自治似乎已走到盡頭。因此，我們必須開始將其正式整合入我國的流程。"
 mission_commence_annexation_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]並點擊#V 管理附屬國#!，查看你的[subjects_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊[subject]名稱以開啟[diplomatic_actions|e]。\n\n@arrow_bonus_tier_1! 選擇#V $ANNEXTITLE$#!。"

 mission_complete_annexation: "完成併吞"
 mission_complete_annexation_desc: "整合我方附庸的工作進展順利。雖然完成此流程可能需要時間，但我們仍以統一為念持續推進。"
 mission_select_vassal: "為此[mission|e]選擇一個[ShowSubjectTypeName('vassal')]"
 mission_no_valid_vassals: "@trigger_no! 沒有可用的[ShowSubjectTypeName('vassal')]。"

 mission_connect_the_capitals: "連接首都"
 mission_connect_the_capitals_desc: "在我們的[ShowSubjectTypeName('vassal')]境內各地建立適當通訊與直接基礎設施連結，將確保一條直接通道，無疑會提升其忠誠。"
 mission_connect_the_capitals_tip: "@arrow_bonus_tier_2! 前往你的[capital_with_icon|e]，[Player.GetCapital.GetName]，並點擊#V 建造道路#!按鈕。\n\n@arrow_bonus_tier_1! 建造一條通往鄰近[location|e]的[road_with_icon|e]，使我們附屬國的[capital|e]更加接近我們。"

 mission_monetary_assistance: "金錢援助"
 mission_monetary_assistance_desc: "我們有責任向較不幸的附庸提供充足的金錢援助。這將有助於拉近彼此關係，使外交更加容易。向其財庫贈送一份象徵性的厚禮，將大大促進其繁榮！"
 mission_monetary_assistance_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]並點擊#V 管理附屬國#!，查看你的[subjects_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊[subject]名稱以開啟[diplomatic_actions|e]。\n\n@arrow_bonus_tier_1! 移除附屬國行動篩選器以查看所有行動，並尋找#V $send_gift$#!"
 mission_base_of_power: "權力根基"
 mission_base_of_power_desc: "我們必須確保附庸擁有一處強大的權力所在地，一座強盛首都，足以匹配其在我方旗幟下的繁榮地位。"
 mission_base_of_power_tip: "@arrow_bonus_tier_3! 前往你的附屬國首都。\n\n@arrow_bonus_tier_2! 點擊@build_icon!#V 建造#!按鈕，查看可在該[location_with_icon|e]建造的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依收益排序，並開始建造你認為最合適者。"

 mission_improve_relations_with_vassal: "改善與[ROOT.GetCountry.MakeScope.GetVariable('mission_chosen_vassal_variable').GetCountry.GetNameWithNoTooltip]的關係"
 mission_improve_relations_with_vassal_desc: "為了加強兩國合作，我們必須向附庸伸出援手，建立牢固的外交紐帶。" 
 mission_improve_relations_with_vassal_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]並點擊#V 管理附屬國#!，查看你的[subjects_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊[subject]名稱以開啟[diplomatic_actions|e]。\n\n@arrow_bonus_tier_1! 在上方國家卡片中選擇[opinion_icon]#V $IMPROVE_RELATIONTITLE$#!，並等待好感提升。請記住，此行動將花費你#V 1#!名[diplomat_with_icon|e]。"

 mission_joint_military_development: "聯合軍事發展"
 mission_joint_military_development_desc: "為了保護我國，我們與附庸之間的軍事合作至關重要。"
 mission_joint_military_development_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]並點擊#V 管理附屬國#!，查看你的[subjects_with_icon|e]。\n\n@arrow_bonus_tier_2! 點擊[subject]名稱以開啟[diplomatic_actions|e]。\n\n@arrow_bonus_tier_1! 選擇#V $offer_support_military$#!。"
 mission_target_subject_will_lose_lib_desire_gain_center_of_urbanization_modifier_capital_tt: "指定[subject|e]的[liberty_desire|e]將降低，且其[capital|e]將獲得[ShowModifier('center_of_urbanization_modifier')][modifier|e]"

#generic_humiliate_rival
 generic_humiliate_rival: "羞辱宿敵"
 generic_humiliate_rival_DESCRIPTION: "那些企圖與我們匹敵者，必須見識自己的低劣！"
 generic_humiliate_rival_CRITERIA_DESCRIPTION: "我們已成功超越一名宿敵。"
 generic_humiliate_rival_BUTTON_TOOLTIP: "國家必須透過超越嫉妒宿敵的野心並確保優勢，宣示自身支配地位。"
 generic_humiliate_rival_BUTTON_DETAILS: "我們的宿敵與敵人懷著嫉妒望向我們，因為我們正經歷繁榮，並將人民推向新的高度。是時候確立我們對那些試圖匹敵我方成長者的優越，並徹底超越他們了。"

 mission_insult_rival: "外交較量"
 mission_insult_rival_desc: "向一名宿敵送上一番精心設計的侮辱，是展示其缺陷並在外交談判中確立我方優勢的絕佳方式。"
 mission_insult_rival_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]，並點擊#V [rivals_icon|e]宿敵按鈕#!列。\n\n@arrow_bonus_tier_2! 你也可以點擊[rivals_icon]#W 可用宿敵警示#!。\n\n@arrow_bonus_tier_1! 你可以等其他[countries]宣告其[rivals]後再採取行動。如此便能避免激怒錯誤的[countries]。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_lacks_of_rivals', '$hint_lacks_of_rivals$提示')]。"

 mission_impose_embargo: "實施禁運"
 mission_impose_embargo_desc: "我們不能允許外國代理人與敵人進入我們的市場，並從我國境內貿易中獲利！"
 mission_impose_embargo_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]，並點擊你想鎖定的#V [rivals_icon|e]宿敵#!旗幟。\n\n@arrow_bonus_tier_2! 你可以在其[diplomacy_icon]#W 外交行動#!中的#W 經濟行動#!內點擊。\n\n@arrow_bonus_tier_1! 找到並點擊#W 禁運國家#!以對其實施禁運。"

 market_dominance_key: "市場主導"
 mission_humiliate_rival: "羞辱宿敵"
 mission_humiliate_rival_desc: "透過在外交桌上壓迫宿敵，並強硬展現我們對其優勢，我們只會進一步增強國內外的力量。"
 mission_humiliate_rival_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]，並點擊你想鎖定的#V [rivals_icon|e]宿敵#!旗幟。\n\n@arrow_bonus_tier_2! 你可以點擊國家卡片上的[war_icon]#W 宣戰按鈕#!，或在其[diplomacy_icon]#W 外交行動#!中的[hostile_icon]#W 敵對行動#!內點擊。\n\n@arrow_bonus_tier_1! 宣告[war]前，請考慮先取得[casus_belli_with_icon|e]。我們可以在[parliament|e]期間請求，或針對我們的[rivals|e]捏造。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_war', '$hint_war$提示')]和[Link('hints', 'selected_hint = hint_call_for_peace', '$hint_call_for_peace$提示')]。"

 mission_surpass_rival: "超越敵手"
 mission_surpass_rival_desc: "那些試圖篡奪我們陽光下位置的人，必須明白他們在我方不可阻擋的威勢面前，不過是微不足道的塵埃。我們的力量必須使其孱弱軍隊黯然失色！"
 mission_surpass_rival_tip: "@arrow_bonus_tier_3! 前往[Link('diplomacy', 'relations_tab = current_relations', '@diplomacy_panel! 外交 > 目前關係')]，並點擊你想鎖定的#V [rivals_icon|e]宿敵#!旗幟。\n\n@arrow_bonus_tier_2! 持續查看其[country_icon|e]#W 國家面板#!，以比較彼此實力。\n\n@arrow_bonus_tier_1! 考慮宣告[war_with_icon|e]以持續削弱他們。 \n\n #italic 若要了解更多，可查看[Link('hints', 'selected_hint = hint_war', '$hint_war$提示')]和[Link('hints', 'selected_hint = hint_call_for_peace', '$hint_call_for_peace$提示')]。"
 should_complete_stronger_than_rival_tt: "以高於[target_rival.GetName]的[military_strength|e]完成此[task|e]，將獲得#G 20#![prestige|e]。"

 mission_establish_spy_networks: "建立間諜網"
