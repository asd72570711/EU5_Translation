 mission_build_entrepot_desc: "商人湧入我方土地，是繁榮與錢財的良好徵兆。我們必須透過國家資助的轉口港來適當掌握並進一步鼓勵這股潮流。這項新基礎設施必定會為商業提供嶄新途徑，並提升我們的商業重要性！"
 mission_build_entrepot_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@burghers![ShowPopTypeName('burghers')][buildings]篩選，並點擊[ShowBuildingTypeName('entrepot')][building]（你需要先研究適當的[advance_with_icon|e]！）。\n\n@arrow_bonus_tier_1! 在你的[market_center_with_icon|e]中建造。"

 mission_trade_capacity: "貿易容量"
 mission_trade_capacity_desc: "我方商人的觸角正緩慢成長。這是一項艱辛且常伴隨危險的職業。他們前往遙遠土地，帶回異國商品，傳播思想並促進技術交流。我們有責任進一步支持他們並擴展其能力，以長期補足我方富庶。"
 mission_trade_capacity_tip: "@arrow_bonus_tier_3! 前往[Link('production', '', '@production_panel! 生產面板 > 建築')]查看你的[buildings_with_icon|e]清單。\n\n@arrow_bonus_tier_2! 依@burghers![ShowPopTypeName('burghers')][buildings]篩選，並點擊[ShowBuildingTypeName('marketplace')][building]。\n\n@arrow_bonus_tier_1! 透過點擊清單或地圖，依需求建造足夠數量。"

#Generic Capital Economy 
 generic_capital_economy: "發展$capital_economy_focus$"
 generic_capital_economy_DESCRIPTION: "貪婪，若沒有更好的說法，就是好事！"
 generic_capital_economy_CRITERIA_DESCRIPTION: "我們已建立以生產、貿易或貸款創造資本的新經濟基礎。"
 generic_capital_economy_BUTTON_TOOLTIP: "國家的財富存在於城鎮與城市的富庶之中。我們應將其潛力發揮到極致，並建立一套產業，打造無與倫比的經濟！"
 generic_capital_economy_BUTTON_DETAILS: "$generic_capital_economy_BUTTON_TOOLTIP$"

