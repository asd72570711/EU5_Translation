l_simp_chinese:

 conquest_mission_events.1.title: "戰爭捐獻"
 conquest_mission_events.1.desc: "隨著緊張局勢升高，充實戰爭金庫的需求也愈發迫切，[target_estate.GetName]中具有影響力的成員帶著慷慨提議接近了[target_character.GetName]。他們意識到我國軍事事業的重要性，承諾將提供一筆可觀捐款，以支援戰爭事業。\n\n然而，這份慷慨並非毫無期待；[target_estate.GetNameWithNoTooltip]企圖利用這筆貢獻，在[ROOT.GetCountry.GetFlavorRank]事務中取得更大的影響力。"
 conquest_mission_events.1.a: "這將大幅幫助當前的戰爭事業。"
 conquest_mission_events.1.b: "禮貌感謝他們的好意，並予以拒絕。"
 reject_the_advances_of_the_estate_tt: "#italic 我們將拒絕[target_estate.GetNameWithNoTooltip]的示好#!"

 conquest_mission_events.2.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]抗議戰爭金庫"
 conquest_mission_events.2.desc: "隨著[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]專注於積累一筆可觀的戰爭金庫，以資助未來的軍事行動，下層階級之間開始醞釀不滿。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]在增稅與強制徵收的重壓下苦苦掙扎，已公開表達他們的不滿。\n\n他們主張，戰爭的負擔不應如此沉重地落在他們肩上，尤其是較富裕的階層似乎毫髮無傷。若不處理這些抗議，便可能升級為全面動亂，威脅[ROOT.GetCountry.GetFlavorRank]的穩定。"
 conquest_mission_events.2.a: "他們將為此買單。"
 conquest_mission_events.2.b: "我們可以給予一些金錢讓步。"
 conquest_mission_events.2.c: "改授予他們一項特權。"

 conquest_mission_events.3.title: "戰爭貸款"
 conquest_mission_events.3.desc: "隨著大規模軍事行動的準備加劇，各階層看見了從[ROOT.GetCountry.GetGovernment.GetAdjective]充實戰爭金庫需求中獲利的機會。我們[ROOT.GetCountry.GetFlavorRank]中的主要金融家已向[ROOT.GetCountry.GetGovernment.GetCourtTitle]提出一項誘人的提案：以具競爭力的利率提供大筆貸款，用於資助當前的戰爭事業。\n\n然而，接受他們的提議可能會增強他們的影響力，並可能改變各階層之間的權力平衡。"
 conquest_mission_events.3.b: "很好，簽下貸款。"
 conquest_mission_events.3.c: "我們承擔不起這個代價。"
 conquest_mission_events.3.a: "爭取更好的條件！"
 special_loan_with_lower_interest_tt: "這筆[loan|e]以較低[interest|e]利率提供"
 turn_away_the_loan_tt: "#italic 拒絕我們[estates|e]的提議"
 extra_special_loan_with_lower_interest_tt: "由於[target_character.GetName]的談判技巧，這筆[loan|e]的金額將會#G 更大#!，[interest|e]利率也會#G 更低#!"

 conquest_mission_events.4.title: "[target_loot_location.GetNameWithNoTooltip]遭到劫掠"
 conquest_mission_events.4.desc: "戰火已失控蔓延，所到之處盡成焦土。一度繁榮的[target_loot_province.GetName]承受了衝突的主要衝擊，四處劫掠的士兵與走投無路的逃兵洗劫聚落、掠奪農場，使鄉村化為廢墟。\n\n關於村莊燃燒、農民飢餓與地方貿易崩潰的報告已傳至[ROOT.GetCountry.GetGovernment.GetCourtTitle]，勾勒出戰爭人命代價的慘淡景象。若不迅速採取行動，我們劫掠造成的長期損害可能會使該省的繁榮在未來數年內陷入癱瘓。"
 conquest_mission_events.4.a: "戰爭中一切皆為公平。"
 conquest_mission_events.4.b: "他們只是稍微劫掠一下而已！"
 conquest_mission_events.4.c: "我們不能容許[target_loot_province.GetNameWithNoTooltip]周遭出現這種行為！"

 conquest_mission_events.5.title: "戰爭蹂躪"
 conquest_mission_events.5.desc: "持續不斷的衝突已讓我們付出代價。隨著戰事拖延，關於艱困與不滿的報告如野火般蔓延。村莊失去了身強力壯的男子，稅賦比以往更高，補給也愈發短缺。\n\n平民百姓已開始厭倦[target_character.GetName]所要求的無盡流血與犧牲。從繁忙城市到寧靜鄉村，人民的精神正在動搖，異議的低語也愈發響亮。若放任不管，這日益增長的戰爭厭倦可能會威脅[ROOT.GetCountry.GetFlavorRank]的穩定。"
 conquest_mission_events.5.a: "他們不過是些聲音。"
 conquest_mission_events.5.b: "用宣傳反制他們！"

 conquest_mission_events.6.title: "戰爭創新"
 conquest_mission_events.6.desc: "隨著戰爭持續肆虐，需求已成為創新之母。漫長的衝突使我軍接觸到外國敵人與盟友，而他們各自擁有獨特的技術與科技。從繳獲的敵方攻城器械，到戰場上觀察到的改良戰術，我們的士兵與工程師已開始採用並完善這些創新。\n\n這場知識交流不僅提升了我們的軍事能力，也在整個[ROOT.GetCountry.GetFlavorRank]激起了一波技術進步。"
 conquest_mission_events.6.a: "我們將研究戰爭。"
 conquest_mission_events.6.b: "專注於整體進步。"
 research_gained_scales_with_monthly_towards_innovative_tt: "獲得的[research_progress|e]會隨著我們的[ShowModifierTypeName('monthly_towards_innovative')]數值調整"

 conquest_mission_events.7.title: "[target_province.GetNameWithNoTooltip]的整合進展"
 conquest_mission_events.7.desc: "[target_province.GetName]的整合工作正穩步推進。在[target_location.GetName]，當地人口開始適應我們的法律與習俗。\n\n市場重新開放，街頭更常聽見我們的語言，抵抗也逐漸化為沉默的接受。雖然仍有一些傳統保留下來，但該地區正慢慢與我們[ROOT.GetCountry.GetFlavorRank]的步調趨於一致。"
 conquest_mission_events.7.a: "強化整合工作。"
 conquest_mission_events.7.b: "讓我們試著尊重當地人。"
 locals_in_target_province_gain_mild_satisfaction_tt: "[target_province.GetName]中我們的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 locations_in_target_province_receive_very_weak_bonus_integration_tt: "上述正在接受我們[integrating|e]的[province|e]中的[locations|e]，將獲得[ShowNamedValue('integration_progress_very_weak_bonus')|+=][integration|e]進度"

 conquest_mission_events.8.title: "[target_province.GetNameWithNoTooltip]的整合阻力"
 conquest_mission_events.8.desc: "[target_province.GetName]的抵抗仍然強烈。在[target_location.GetName]，官員通報稱當地對我們的統治與政策愈發抗拒。\n\n當地領袖削弱我們的改革，而我們的旗幟也遭到輕蔑對待。當地人口固守舊有之道，而我們同化他們的努力則遭遇沉默或公開蔑視。"
 conquest_mission_events.8.a: "他們的努力都是徒勞！"
 conquest_mission_events.8.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 conquest_mission_events.8.c: "讓他們認識鞭子的滋味。"
 locals_in_target_province_lose_mild_satisfaction_tt: "[target_province.GetName]中我們的[pops|e]將失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 mission_ruler_or_regent_is_conqueror_tt: "[target_province.GetName]中遭遇的些微抵抗，在[target_character.GetName]面前毫無勝算"

 conquest_mission_events.9.title: "[target_province.GetNameWithNoTooltip]的文化傳播"
 conquest_mission_events.9.desc: "在[target_province.GetName]，我們[target_culture.GetName]文化的元素正在扎根。在[target_location.GetName]，文化變遷的跡象開始浮現。\n\n孩子們正在學習我們的語言，來自首都的服飾與習俗正在傳播，而認同我們[ROOT.GetCountry.GetFlavorRank]的想法，也不再對所有人都顯得陌生。這種轉變細微，卻真實存在。"
 conquest_mission_events.9.a: "人人都喜歡成為[target_culture.GetNameWithNoTooltip]人？"
 conquest_mission_events.9.b: "讓我們進一步推廣這些嘗試！"
 conquest_mission_events.9.c: "效法我們偉大的[target_character.GetShortNameWithNoTooltip]！"
 conquest_mission_events.9.d: "多元即是力量！"

 conquest_mission_events.10.title: "[target_province.GetNameWithNoTooltip]的宗教傳播"
 conquest_mission_events.10.desc: "[target_province.GetName]的人民開始接受我們的[target_religion.GetName]。\n\n在[target_location.GetName]，傳教者周圍形成了小型聚會，神廟中的皈依者也悄然增加。信仰正證明自己是統一的強大工具。"
 conquest_mission_events.10.a: "他們正在看見光明！"

 conquest_mission_events.11.title: "當地[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]要求在[target_province.GetNameWithNoTooltip]合作"
 conquest_mission_events.11.desc: "[target_province.GetName]的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]接近我們，尋求在我們的體系中取得角色，以換取他們的效忠。\n\n在[target_location.GetName]，這些家族願意提供影響力、資源與地方控制權——但前提是授予他們土地與特權。他們的支持可以使整合更加順利，但代價將由平民百姓與我們的權威承擔。"
 conquest_mission_events.11.a: "熟悉的惡魔總比陌生的好……"
 conquest_mission_events.11.b: "他們不能支配我們的政策。"
 conquest_mission_events.11.c: "改支持當地[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]。"
 conquest_mission_events.11.d: "[target_character.GetShortNameWithNoTooltip]的權威無可爭議。"
 ruler_or_regent_too_strong_tt: "[target_character.GetName]的統治過於強大，任何微不足道的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]都無從挑戰"
  