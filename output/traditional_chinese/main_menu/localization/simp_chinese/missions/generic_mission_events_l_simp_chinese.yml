l_simp_chinese:

 generic_mission_events.4.title: "[arguing_estate.GetNameWithNoTooltip]在[target_location.GetNameWithNoTooltip]抗議"
 generic_mission_events.4.desc: "[arguing_estate.GetName]對[mission_target_estate.GetName]階層在我方宮廷中日益增長的影響力表達愈發強烈的擔憂。在[target_location.GetName]，他們的抗議聲浪越來越大，指控[target_character.GetName]偏袒一方，並無視傳統的權力平衡。\n\n這場動盪威脅著各階層之間精心維繫的合作，也可能削弱我方[ROOT.GetCountry.GetFlavorRank]的內部團結。我們的顧問與地方行政官強烈建議，在抗議席捲整個首都之前出手干預。"
 generic_mission_events.4.a: "我們不會理會[arguing_estate.GetNameWithNoTooltip]。"
 generic_mission_events.4.b: "他們的抱怨也有道理。"
 generic_mission_events.4.c: "[target_character.GetShortNameWithNoTooltip]會讓他們閉嘴！"
 generic_mission_events.4.d: "這些事不值得我們費心。"
 upset_both_estates_devastate_target_location_tt: "抗議可能會失控，並在過程中重創[target_location.GetName]"
 protests_die_down_tt: "抗議迅速平息"

 generic_mission_events.5.title: "[target_character2.GetName]請求捐款"
 generic_mission_events.5.desc: "[target_character2.GetName]帶著一項精心盤算的提案接近[target_character1.GetName]。[target_character2.GetSheHe]主張，向[mission_target_estate.GetName]階層慷慨捐款，將創造必要條件，使[target_character2.GetHerHis]在[ROOT.GetCountry.GetGovernment.GetCabinetTitle]中的角色得以擴張。\n\n這項提案既是為了提升[target_character2.GetHerHis]個人地位，也是為了強化我方[ROOT.GetCountry.GetFlavorRank]與各階層之間的聯繫。"
 generic_mission_events.5.a: "給[target_character2.GetHerHim]一個[target_character2.GetSheHe]無法拒絕的提議。"
 generic_mission_events.5.b: "我們負擔不起這些捐款。"

 generic_mission_events.6.title: "分權請願"
 generic_mission_events.6.desc: "[mission_target_estate.GetName]提交了一份正式請願，要求回歸分權治理。他們主張權力應歸還地方行政官，而非繼續集中於[target_character.GetName]手中。\n\n此舉被廣泛視為試圖遏制[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]日益增長的權威，並改變我方[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的影響力平衡。"
 generic_mission_events.6.desc.generic: "各階層提交了一份正式請願，要求回歸分權治理。他們主張權力應歸還地方行政官，而非繼續集中於[target_character.GetName]手中。\n\n此舉被廣泛視為試圖遏制[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]日益增長的權威，並改變我方[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的影響力平衡。"
 generic_mission_events.6.a: "我們將會合作。"
 generic_mission_events.6.b: "他們不能決定[target_character.GetNameWithNoTooltip]的政策！"

 generic_mission_events.7.title: "[target_pop_scope.GetNameWithNoTooltip]為[target_province.GetNameWithNoTooltip]帶來成長"
 generic_mission_events.7.desc: "得益於我們與[mission_target_estate.GetName]的合作，[target_pop_scope.GetName]享受了一段繁榮時期。他們的成功轉化為[target_province.GetName]全境可見的成長。\n\n這項發展證明了相互合作的益處，也見證了我方[ROOT.GetCountry.GetGovernment.GetCourtTitle]以[target_character.GetShortName]之名推行的有效政策。"
 generic_mission_events.7.a: "這正是我們健康共存的證明！"
 generic_mission_events.7.b: "全都要歸功於[target_character.GetShortNameWithNoTooltip]的政策！"
 member_of_the_mission_target_estate_may_approach_us_again_after_months_tt: "該[estate|e]可能會在數月後再次接觸我們"

 generic_mission_events.8.title: "併吞程序"
 generic_mission_events.8.desc: "對[mission_target_subject.GetName]的併吞正在[target_character1.GetName]監督下推進。[mission_target_subject.GetName]的[mission_target_subject.Custom('GetRulerOrRegentTitle')][target_character2.GetName]，仍持續自[target_location.GetName]治理。\n\n進展穩定，各種跡象都顯示整合將順利進行。若程序能繼續不受干擾地推進，他們最終將被完全整合。"
 generic_mission_events.8.a: "我們可以利用這股勢頭。"
 generic_mission_events.8.b: "緩慢而穩定……"

 generic_mission_events.9.title: "外交事件"
 generic_mission_events.9.desc: "整合流程是一件複雜之事。法律不一致，以及兩套——往往截然不同的——法理框架結合，很容易在過程中引發外交事件與阻礙。最近便發生了這樣一件事。這次最新失誤很可能會損害我們的併吞工作。"
 generic_mission_events.9.a: "沒有什麼是[target_character1.GetShortNameWithNoTooltip]無法重新談判的。"
 generic_mission_events.9.b: "這無疑是對我方進展的一次打擊。"
 generic_mission_events.9.c: "強行推進！"
 diplomatic_abilities_of_target_character_prevent_any_negative_incident: "[target_character1.GetName]的[dip|e]將不允許此事件影響併吞流程"

 generic_mission_events.10.title: "文化學習"
 generic_mission_events.10.desc: "隨著[mission_target_subject.GetName]被納入我方[ROOT.GetCountry.GetFlavorRank]，我們也因其傳統與生活方式而更加豐富。語言、藝術與習俗的交流，已開始塑造雙方人民。\n\n這種文化交融或許正是整合所帶來的最大長期益處之一，而我們的藝術心靈也必將在未來多年受益於此……"
 generic_mission_events.10.a: "[target_culture.GetNameWithNoTooltip]文化繼續閃耀！"
 generic_mission_events.10.b: "我們可以吸引他們最優秀的一些人。"

 generic_mission_events.11.title: "[target_culture.GetNameWithNoTooltip]與[target_culture2.GetNameWithNoTooltip]之間的摩擦"
 generic_mission_events.11.desc: "雖然政治統一或許正在推進，但文化和諧仍遙不可及。[target_culture.GetNameWithNoTooltip]與[target_culture2.GetNameWithNoTooltip]人口已開始因習俗、語言與 被認為受到的輕蔑 而爆發衝突。\n\n我們的一些顧問私下低語，若將責任歸咎於單一人物，局勢或許更容易解決。其他人則認為，見證兩個有著明顯文化差異的國家結合，本就是一種自然的奇特現象。"
 generic_mission_events.11.a: "這會傷害我們的外交門面。"
 generic_mission_events.11.b: "把一切都歸咎於[target_scapegoat_character.GetNameWithNoTooltip]！"

 generic_mission_events.12.title: "與[target_overlord.GetNameWithNoTooltip]的外交紐帶"
 generic_mission_events.12.desc: "[target_overlord.GetName]已採取措施加強與我們的關係。無論其動機是戰略考量還是真誠興趣，他們試圖拉近彼此距離的努力都未被忽視。\n\n唯有時間能證明這些姿態是真誠，還是更深層博弈的一部分。目前，我們將保持警惕，並觀察局勢如何發展。"
 generic_mission_events.12.a: "我們會饒有興致地觀察他們的動向！"
 overlord_info_generic_vassal_mission_pack_tt: "[target_overlord.GetName]目前正在積極對我們推進[ShowMissionName('generic_vassal_ties')][mission|e]"

 generic_mission_events.13.title: "[target_location.GetNameWithNoTooltip]的成長"
 generic_mission_events.13.desc: "[target_location.GetName]是坐落於[target_province.GetName]的一處重要[target_location.GetRank.GetName]，如今已迅速轉變為蓬勃發展的商業與治理樞紐。商人湧入其市場，工匠建立新的工坊，地方官員也隨著這處[target_location.GetRank.GetNameWithNoTooltip]在財富與影響力上成長而擴張自身觸角。這無疑是我們專注於集中我方[ROOT.GetCountry.GetFlavorRank]的結果，也是在[target_character.GetName]明智指引下未來局勢的徵兆。"
 generic_mission_events.13.a: "我們的努力正在見效！"
 generic_mission_events.13.b: "讓我們資助這股新的中央集權浪潮。"
 generic_mission_events.13.c: "沒有必要干預。"
 valid_province_tt: "此[event_option|e]有一個有效[province|e]"

 generic_mission_events.14.title: "[target_province.GetNameWithNoTooltip]抵制中央集權"
 generic_mission_events.14.desc: "儘管[target_character.GetName]懷抱願景與決心，[target_province.GetName]的人民仍對近期強加於他們的中央集權趨勢日益警惕。城鎮長老抱怨傳統消逝，地方裁判官拖延行事，自治的低語在鄉間迴盪。本意是帶來秩序的措施，反倒被視為侵擾。抵抗並未以公開叛亂形式扎根，而是以頑固沉默與微妙抗命蔓延，化為一股暗流，威脅侵蝕我方[ROOT.GetCountry.GetFlavorRank]權威的根基。"
 generic_mission_events.14.a: "他們忘了自己的地位。"
 generic_mission_events.14.b: "唉，他們無法理解我們的意圖。"
 generic_mission_events.14.c: "把一切都歸咎於[target_character2.GetShortNameWithNoTooltip]！"
 suitable_character_exists_tt: "存在適合此[event_option|e]的[character|e]"

 generic_mission_events.15.title: "鄉村被忽視"
 generic_mission_events.15.desc: "[target_province.GetName]的人民，連同其省份中心[target_location.GetName]的居民，表達出日益增長的不滿。當我們的目光越來越轉向偉大城市與中央治理的擴張，這些鄉村社群感覺被拋在一旁，遺忘在進步的陰影之下。他們的請願聲浪愈發高漲：停止改革，重新關注土地，並記住那些耕作土壤、從底層將[ROOT.GetCountry.GetFlavorRank]連結在一起的人。"
 generic_mission_events.15.a: "只是暫時的小障礙。"
 generic_mission_events.15.b: "我們不在乎鄉村人的怨言。"
 generic_mission_events.15.c: "尋求[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的協助。"
 progress_towards_centralization_will_not_be_hindered_tt: "我們朝[ShowSocietyDirectionName('centralization')][societal_value|e]的進展將不會受阻"

 generic_mission_events.16.title: "[target_character.GetNameWithNoTooltip]的稅制改革"
 generic_mission_events.16.desc: "在中央集權浪潮中，[target_character.GetName]提出了全面改革，以徹底改造我方[ROOT.GetCountry.GetFlavorRank]的稅收制度。這些變革旨在充實國庫並簡化收入徵收，將財政權威從地方勢力手中抽離，牢牢集中於[target_character.GetHerHis]手中。然而，如此雄心並非無人察覺。事實上，從[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]到[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]，每個階層都將失去影響力，而他們的不安已開始轉化為抵抗。"
 generic_mission_events.16.a: "繼續推行改革。"
 generic_mission_events.16.b: "我們不要打破現狀。"

 generic_mission_events.17.title: "[target_location.GetNameWithNoTooltip]新城鎮的前景"
 generic_mission_events.17.desc: "[target_location.GetName]的聚落穩步成長，街道如今擠滿尋求接近我方[ROOT.GetCountry.GetFlavorRank]心臟機會的農民、商人與工匠。雖然它仍只是樸素的[target_location.GetRank.GetName]，但靠近[ROOT.GetCountry.GetCapital.GetName]的位置賦予其戰略重要性與經濟前景。土地肥沃，道路人來人往，當地民眾也渴望獲得承認與成長。\n\n只要投入適當投資，[target_location.GetNameWithNoTooltip]便可轉變為真正的城鎮，擁有市場、工坊與市民特許狀。它不僅會為該區域帶來秩序與繁榮，也能成為我們中央集權雄心的可見象徵。剩下的，只是投入金錢與意志來完成它。"
 generic_mission_events.17.a: "[target_location.GetNameWithNoTooltip]會成為一座不錯的城鎮！"
 generic_mission_events.17.b: "我們不要節外生枝。"
 cost_of_town_scales_tt: "這座新[urban_location|e]的成本將根據我們的[ShowSocietyDirectionName('centralization')][societal_value|e]以及[ShowModifierTypeName('town_upgrade_cost_modifier')][modifier|e]進一步降低"

 generic_mission_events.18.title: "[target_location.GetNameWithNoTooltip]的學者"
 generic_mission_events.18.desc: "在[target_location.GetName]靜謐的書齋中，一小群熱切的學者浮現出來。他們尋求的不只是贊助，還有承認。他們要求承認知識、理性與發現的追求，是任何中央集權且開明的[ROOT.GetCountry.GetFlavorRank]不可或缺的支柱，而這些訴求已傳到[target_character.GetName]耳中。\n\n他們的請願勾勒出雄心勃勃的計畫：翻譯外國文本、與海外思想家建立通信，以及建造一座樸素但持久的學術機構。他們的目標似乎與近期席捲我方[ROOT.GetCountry.GetFlavorRank]的創新浪潮相契合。然而，這些事業需要金錢、耐心，以及保護，使其免於那些將此等追求視為戰爭與治理以外無益消遣者的阻撓。"
 generic_mission_events.18.a: "資助他們的事業。"
 generic_mission_events.18.b: "我們無法為瑣碎開支撥出這麼多錢"
 based_on_target_location_average_literacy_tt: "根據[target_location.GetName]的平均[literacy|e]："
 scholars_in_target_location_wont_approach_tt: "#italic 當目前[mission_task|e]正在積極推進時，[target_location.GetName]的學者可能會在數月後再次接觸我們#!"

 generic_mission_events.19.title: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的一顆頭腦"
 generic_mission_events.19.desc: "消息很快在[ROOT.GetCountry.GetCapital.GetName]的廳堂間傳開。一位前途可期但尚未證明自己的藝術家[target_character2.GetName]，帶著大膽理論、註解手稿，以及重塑我方[ROOT.GetCountry.GetFlavorRank]智識文化的願景抵達。有人稱[target_character2.GetHerHim]為江湖騙子，也有人稱其為天才。可以確定的是，[target_character2.GetSheHe]尋求贊助，尋求一個讓[target_character2.GetHerHis]思想能夠蓬勃發展的宮廷位置。\n\n重視理性與改革者敦促我們冒險一試。固守階序與傳統者，則寧願在[target_character2.GetSheHe]再說出一句話之前，就讓[target_character2.GetHerHim]離開。"
 generic_mission_events.19.a: "[target_character.GetSheHe|U]展現出潛力！"
 generic_mission_events.19.b: "又一個毫無才華的蠢材跑來玷污[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 skill_of_scientist_scales_with_country_literacy_tt: "[target_character2.GetName]的[artistic_skill|e]將部分取決於我方[ROOT.GetCountry.GetFlavorRank]全境的平均[literacy|e]"
 artist_will_be_promtly_defenestrated_tt: "#italic [target_character2.GetName]將被立即且不可逆地拋出窗外#!"

 generic_mission_events.20.title: "[target_character2.GetNameWithNoTooltip]的思想"
 generic_mission_events.20.desc: "[target_character2.GetName]撰寫的論著已開始在[ROOT.GetCountry.GetCapital.GetName]的識字圈子中流傳。這些作品大膽、具爭議且文筆優雅，挑戰舊有教條，並對治理、法律與精神秩序提出 全面改革。有人低語[target_character2.GetSheHe]引導著天才，也有人高喊褻瀆。無論真相如何，這些著作已在書齋之外激起辯論，如今它們擺在我們面前，等待裁斷。我們選擇如何回應，或許不僅會塑造作者命運，也會塑造我方[ROOT.GetCountry.GetFlavorRank]本身的智識軌跡。"
 generic_mission_events.20.a: "[target_character2.GetHerHis]的著作自有其價值。"
 generic_mission_events.20.b: "這是異端，燒了它！"
 generic_mission_events.20.c: "賣給出價最高的人。"

 generic_mission_events.21.title: "異端研究"
 generic_mission_events.21.desc: "我方學者研究中出現的最新理論，在[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]內激起憤怒。雖然這些科學結論根基於觀察與理性，卻削弱了長久以來的信念與神聖文本，在信眾之中引發對異端的恐懼。\n\n然而，在宮廷與智識圈中，我們的人民被讚頌為[target_culture.GetName]遠見者。支持這類作品將標誌著邁向創新且世俗的[ROOT.GetCountry.GetFlavorRank]的明確一步，但也可能點燃與傳統精神守護者的對抗，而這些守護者的影響力不亞於[target_pop_scope.GetName]。"
 generic_mission_events.21.a: "我們不在乎[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的聒噪。"
 generic_mission_events.21.b: "我們不要製造新的敵人。"
 generic_mission_events.21.c: "我方最聰慧的頭腦不該受長袍老者挑戰！"
 will_not_hinder_our_progress_to_innovative_tt: "我們朝[ShowSocietyDirectionName('innovative')][societal_value|e]的進展將不會受阻"
 clergy_do_not_dare_move_against_target_character_tt: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]將不敢對[target_character.GetName]採取行動"

 generic_mission_events.22.title: "[target_location.GetNameWithNoTooltip]圖書館"
 generic_mission_events.22.desc: "在我們批准與資金支持下，[target_location.GetName]的出席者與鎮民匯集資源與精力，創設了一座新圖書館。這座機構旨在收藏知識、鼓勵識字，並吸引遠近思想家，成為我方智識好奇心的見證。\n\n雖然規模仍然樸素，但它代表[target_province.GetName]內對學習日益增長的渴望，而第一批書架上已熱鬧地擺滿新書、手稿與記錄。若有適當資金與背書，它或可綻放為整個[ROOT.GetCountry.GetFlavorRank]的教育燈塔，世世代代啟發博學者與有志之士。"
 generic_mission_events.22.a: "明智投資終有回報！"
 generic_mission_events.22.b: "邀請[target_province.GetNameWithNoTooltip]各地的人前來"
 generic_mission_events.22.c: "也許[target_heir.GetShortNameWithNoTooltip]可以在那裡待上一段時間？"
 heir_gains_depend_on_inno_and_literacy_tt: "獲得的[total_ability|e]將很大程度取決於我方[ROOT.GetCountry.GetFlavorRank]全境的平均[literacy|e]，以及[ShowSocietyDirectionName('innovative')][societal_value|e]程度"

 generic_mission_events.23.title: "外國干涉"
 generic_mission_events.23.desc: "首都街頭的耳語與密室中的談話似乎表明，我們的敵人已開始推動其計畫。外交侮辱、幕後交易，以及我們似乎被排除在各項談判之外，都顯示[target_country.GetName]已損害我們在國內外的聲譽。這不過是最新一次挑釁，而且是我們必須嚴肅看待的挑釁！我國主權不容質疑，即使是[target_character2.GetName]及[target_character2.GetHerHis]同類之流也不行！"
 generic_mission_events.23.a: "真是卑鄙手段。"
 already_destabilized_desc: "我們已正在承受此[modifier|e]的效果"
 target_country_sow_discontent_tt: "[target_country.GetName]已對我們使用[ShowRelationTypeName('sow_discontent')][diplomatic_action|e]，進一步在我方[ROOT.GetCountry.GetFlavorRank]全境播下不穩定的種子"

 generic_mission_events.24.title: "[target_location.GetNameWithNoTooltip]的贊助"
 generic_mission_events.24.desc: "為配合我們集中財富與經濟權力的雄心，[target_location.GetName]地方當局提交了一項大規模投資提案。他們主張，改善基礎設施並擴張商業樞紐，將使這座[target_location.GetRank.GetName]轉變為我方[ROOT.GetCountry.GetFlavorRank]經濟的基石。\n\n所需資金相當可觀，但潛在回報，無論經濟還是政治，都更加巨大。顧問建議迅速行動，將這項發展鞏固為我們更廣泛推動首都中心經濟的一部分。"
 generic_mission_events.24.a: "這至關重要，繼續執行。"
 generic_mission_events.24.b: "我們眼下無法調撥這麼多資金。"

 generic_mission_events.25.title: "被拋下的鄉民"
 generic_mission_events.25.desc: "隨著我們的政策越來越偏向城市樞紐與商業中心，鄉村聲音也變得躁動不安。在[target_province.GetName]，村社議會抱怨徵發增加、發展遭到忽視，以及年輕人向城市遷移。繁忙城市市場與安靜而被遺忘的農田之間的對比，日益鮮明。我們[ROOT.GetCountry.GetGovernment.GetCourtTitle]中有人主張這是現代成長的必然結果；也有人警告，若放任忽視不管，可能會硬化為叛亂。"
 generic_mission_events.25.a: "這就是進步的代價。"
 generic_mission_events.25.b: "我們不能讓鄉村聚落衰微！"
 progress_towards_cap_economy_will_not_be_hindered_tt: "我們朝[ShowSocietyDirectionName('capital_economy')][societal_value|e]的進展將不會受阻"

 generic_mission_events.26.title: "[target_good.GetNameWithNoTooltip]產業成長"
 generic_mission_events.26.desc: "對[target_good.GetName]的需求激增，在[target_location.GetName]引發了一場經濟繁榮。新的工坊、擴張的市場與增加的貿易，使這座[target_location.GetRank.GetName]轉變為我們蓬勃資本經濟中的關鍵節點。[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]讚賞這項發展，渴望進一步擴張其影響力。\n\n然而，[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]之中也有人低聲抱怨，他們的土地正被不受節制的擴張吞沒，而耕作土地之人卻幾乎沒有得到好處。"
 generic_mission_events.26.a: "我們歡迎這項發展。"
 generic_mission_events.26.b: "我們不要忽視[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]。"

 generic_mission_events.27.title: "[target_province.GetNameWithNoTooltip]抵制城市化"
 generic_mission_events.27.desc: "我們鼓勵[target_province.GetName]城市成長的努力，遭遇了相當大的抵抗！地方習俗與領導者反對改革，對變革保持警惕，也害怕增加的官僚體系會侵蝕其自治。\n\n雖然尚未出現公開反抗，但放緩已相當明顯。城市規劃者與行政官抱怨阻撓、延誤與缺乏合作。這或許是對我們城市導向政策更深層抵抗的第一個徵兆。"
 generic_mission_events.27.a: "些許摩擦在所難免。"
 generic_mission_events.27.b: "我們不要打破現狀。"

 generic_mission_events.28.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]認可社會進步"
 generic_mission_events.28.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]已正式表達對我們轉向資本驅動經濟的支持。在近期於[target_location.GetName]的一場集會上，他們讚揚我方[ROOT.GetCountry.GetGovernment.GetCourtTitle]對城市投資、貿易激勵與基礎設施的承諾。\n\n作為感謝，也或許是為了確保進一步好感，他們向國庫提供了一筆慷慨捐款，專款用於未來的城市建設工作。"
 generic_mission_events.28.a: "我們感謝他們的禮物。"