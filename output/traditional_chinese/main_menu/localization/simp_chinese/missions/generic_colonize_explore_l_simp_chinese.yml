l_simp_chinese:

#Misc
  generic_colonize_explore: "奔赴未知"
  generic_colonize_explore_DESCRIPTION: "遠方地平線與無主土地的呼喚，激起了我們的雄心。我們必須繪製海圖、發現新領土，並擴張我方影響力，以確保我國未來的繁榮。"
  generic_colonize_explore_CRITERIA_DESCRIPTION: "我們已開始探索未知水域，或已為殖民擴張奠定基礎。"
  generic_colonize_explore_BUTTON_TOOLTIP: "未知之地蘊藏著成長、財富與威望的無限潛力。我們必須擁抱它。"
  generic_colonize_explore_BUTTON_DETAILS: "國境之外的廣闊世界充滿了謎團與機遇。透過探索未知地區並建立殖民地，我們便能在歷史中確立自身地位，並塑造我國的命運！"

#Missions
  mission_hire_explorer: "雇用探險家"
  mission_hire_explorer_desc: "我們需要身強力壯的探險家，才能妥善駕馭未知。"
  mission_chart_horizon: "繪製地平線"
  mission_chart_horizon_desc: "陸地與海上的冒險遠征將拓展我們對地平線的掌握，探索並繪製我國人民前所未見之地的地圖。"
  mission_new_maps: "新地圖"
  mission_new_maps_desc: "為了真正理解新發現的重要性，我們必須推動遠征，測繪並完成那些領土的地圖。"
  mission_overseas_efforts: "海外事業"
  mission_overseas_efforts_desc: "我們顯然已站在新時代的門檻上。向前邁進並宣稱未知土地，便是在未來數百年的史冊中刻下我國之名。"
  mission_settle_horizon: "定居地平線"
  mission_settle_horizon_desc: "擴張的需求使我們的顧問支持將人民送往潛在殖民地的構想。移民湧入無疑也將促成知識的傳播、新技術的採用，以及原料的取得。"
  mission_colonial_ambitions: "殖民雄心"
  mission_colonial_ambitions_desc: "定居於異鄉海岸並利用其資源，是進一步擴展我方商業觸角，並因此增強我方力量的絕佳方式。為此，我們必須尋求建立殖民附屬國，使其準備好服務並推進我方利益。"


#Tooltips
  land_explo_key: "如果我們在完成任務時至少擁有#Y 1#!次陸地[exploration|e]："
  yes_land_explo_bonus_tt: "@trigger_yes! $land_explo_key$"
  no_land_explo_bonus_tt: "@trigger_no! $land_explo_key$"
  sea_explo_key: "如果我們在完成任務時至少擁有#Y 1#!次海上[exploration|e]："
  yes_sea_explo_bonus_tt: "@trigger_yes! $sea_explo_key$"
  no_sea_explo_bonus_tt: "@trigger_yes! $sea_explo_key$"
  mission_colonial_ambitions_tt: "我們的一個殖民[subjects|e]將獲得[liberty_desire|e]#G 降低#!"
  mission_settle_horizon_tt: "當此[mission_task|e]啟用時，可能會每月發生關於我方殖民聚落的[events|e]"
  
 

#Events

  generic_colonial_exploration_events.1.title: "相互競逐的冒險家"
  generic_colonial_exploration_events.1.desc: "繪製地平線的偉大時代，催生了一代技藝精湛的航海家與冒險家，他們渴望揭開未知的面紗。其中，許多聲名卓著的探險家，如[target_character_1.GetName]與[target_character_2.GetName]，已嶄露頭角，各自渴望啟程並為自己揚名。\n\n他們的競爭心驅使雙方攀上更高峰，努力在技藝與雄心上勝過彼此。隨著競爭加劇，其中一人已開始脫穎而出，其非凡才華比以往更加耀眼，準備帶領我國人民邁向更大的榮耀。"
  generic_colonial_exploration_events.1.a: "青睞[target_character_1.GetNameWithNoTooltip]。"
  generic_colonial_exploration_events.1.b: "[target_character_2.GetNameWithNoTooltip]將帶領我們走向榮耀！"
  generic_colonial_exploration_events.1.c: "那[target_character_3.GetNameWithNoTooltip]呢？"
  generic_colonial_exploration_events.1.d: "如此偉大之事，豈能受限於區區個人！"
  next_completed_exploration_will_fire_event_tt: "我們在#Y 10#!年內完成的下一次[exploration|e]將觸發一個[event|e]"

  generic_colonial_exploration_events.2.title: "探索的未來"
  generic_colonial_exploration_events.2.desc: "經過數月危險旅程與細緻測繪後，我們的探險家帶著遠方土地與未知水域的詳盡記錄歸來。他們的發現非同凡響，既提供了進一步遠征的即時機會，也帶來了可能推進航海科學的見解。\n\n然而，[ROOT.GetCountry.GetGovernment.GetCourtTitle]對如何善用這份知識財富意見分歧。有人主張賦權給最有前途的探險家，讓其繼續推進邊界；也有人主張將這些發現導向技術進步，以造福後代。這項決定必將塑造我國人民探索事業的道路。"
  generic_colonial_exploration_events.2.a: "資助未來研究。"
  generic_colonial_exploration_events.2.b: "現在就支持我們的探險家。"

  generic_colonial_exploration_events.3.title: "探索的未來"
  generic_colonial_exploration_events.3.desc: "[target_charter.GetName]的定居者提出一項計畫，希望使當地原住民改信[ROOT.GetCountry.GetReligion.GetName]，並隨後轉化為[ROOT.GetCountry.GetCulture.GetName]文化；他們相信，此舉不僅能帶來精神啟蒙，也能促進其與殖民地更緊密地整合。\n\n若能接受我們的生活方式，原住民便能更直接地為殖民地的成長與繁榮作出貢獻。然而，這項事業需要[ROOT.GetCountry.GetCapital.GetName]提供大量財政支援，以資助傳教工作與文化計畫。雖然有人認為這是對特許地未來至關重要的投資，但也有人警告不應干涉原住民的生活方式，擔心這可能破壞該省脆弱的平衡。"
  generic_colonial_exploration_events.3.a: "我們將資助這些嘗試。"
  generic_colonial_exploration_events.3.b: "我們不要打破現狀。"
  natives_left_undisturbed_tt: "#italic [target_charter.GetNameWithNoTooltip]的原住民將不受打擾#!"

  generic_colonial_exploration_events.4.title: "殖民地站穩腳跟"
  generic_colonial_exploration_events.4.desc: "關於[target_charter.GetName]廣袤土地與可觀機遇的消息，已開始在本土各地流傳。商人、農民與富有冒險精神的家庭，都被這片新世界中繁榮與自由的故事所吸引。\n\n受到早期定居者成功的鼓舞，如今許多人正準備橫渡大海，踏上尋求更好生活的旅程。這股興趣浪潮有望壯大殖民地人口並加速其發展，使其轉變為繁榮的活動與成長樞紐。"
  generic_colonial_exploration_events.4.a: "但願這股趨勢能持續下去。"