l_simp_chinese:
 unionevents.1.title: "本地貴族抗議"
 unionevents.1.desc: "[ROOT.GetCountry.GetGovernment.GetFullRulerName|U]似乎偏袒[ROOT.GetCountry.GetGovernment.GetRuler.GetCulture.GetName]貴族，而非[ROOT.GetCountry.GetCulture.GetName]貴族。我們現有的貴族對自身數百年來的優良血統竟被愚蠢地忽視感到憤怒。這對我們的國度造成了相當嚴重的後果。"
 unionevents.1.a: "砍掉幾個人的腦袋！"
 opinion_restrict_nobles: "限制外來貴族"
 unionevents.1.b: "和解。"
 opinion_reconcile: "和解"
 unionevents.2.title: "[target_ruler.GetNameWithNoTooltip|U]忽視[ROOT.GetCountry.GetNameWithNoTooltip]"
 unionevents.2.desc: "我們的共主十分專注於[target_ruler.GetHerHis]自己的[union_target.GetFlavorRank]，似乎沒有投入足夠時間處理我們[ROOT.GetCountry.GetFlavorRank]的事務。顯然，這並不是我國人民所樂見的情況。"
 unionevents.2.a: "這是對[ROOT.GetCountry.GetNameWithNoTooltip]的侮辱！"
 opinion_ignorant_monarch: "無知的君主"
 unionevents.2.b: "邀請[target_ruler.GetHerHim]前來我們的首都！"
 opinion_supportive_monarch: "支持的君主"
 unionevents.3.title: "[ROOT.GetCountry.GetName|U]在經濟上遭到忽視"
 unionevents.3.desc: "雖然我們因同一位主權者而聯合在一起，但我國商人仍被當作外國人看待。這正在經濟上傷害我們的國家。[ROOT.GetCountry.GetGovernment.GetFullRulerName|U]應該花更多時間留在我國，並使其繁榮起來！"
 unionevents.3.a: "這只是名義上的聯合嗎？"
 opinion_union_in_name: "僅止於名義的聯合"
 unionevents.4.title: "文化差異"
 unionevents.4.desc: "可悲的是，我們新君主的作風不如我們自身文明。然而，[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]那些落後的人民似乎對此感到冒犯。 "
 unionevents.4.a: "他們應該學點禮貌！"
 opinion_backward_monarch: "落後的君主"
 unionevents.5.title: "我們的聯合聲名不佳"
 unionevents.5.desc: "客氣地說，我們的君主並不被視為最適合當鄰居的人。事實上，該國的歷史就是一部擴張與征服的歷史。可悲的是，我們似乎也因此被貼上了同樣的標籤。"
 unionevents.5.a: "事實上，我們並不一樣。"
 opinion_bad_monarch: "惡劣的君主"
 unionevents.5.b: "我們本為一體！"
 opinion_one_and_same: "一體同心"
 unionevents.98.title: "[ROOT.GetCountry.GetDiplomacy.GetUnion.GetNameWithNoTooltip]與[ROOT.GetCountry.GetFlavorRank]"
 unionevents.98.title.fallback: "[GetInternationalOrganizationType('union').GetNameWithNoTooltip]與[ROOT.GetCountry.GetFlavorRank]"
 unionevents.98.desc: "隨著[root_character.GetName]逝世，[ROOT.GetCountry.GetLongName]已無任何統治者。通常，[ROOT.GetCountry.GetGovernment.GetHeirSelection.GetName]會迅速為我們找出新的候選人來治理國家。然而，由於我們是[ROOT.GetCountry.GetDiplomacy.GetUnion.GetName]的一員，情況已然不同，因此[ROOT.GetCountry.GetFlavorRank]面臨一項相當獨特的決定。"
 unionevents.98.desc.union_has_leader: "$unionevents.98.desc$\n\n[target_character.GetName]，也就是[ROOT.GetCountry.GetDiplomacy.GetUnion.GetNameWithNoTooltip]的現任領袖，要求取得[ROOT.GetCountry.GetAdjectiveWithNoTooltip]王位。如果我們想留在[GetInternationalOrganizationType('union').GetName]中，甚至可能接掌它，那麼選舉[target_character.GetShortNameWithNoTooltip]或許是可行的選擇，儘管這與[ShowGovernmentTypeName('republic')]的價值形成鮮明對比。"
 unionevents.98.desc.union_has_no_leader: "$unionevents.98.desc$\n\n[target_character.GetName]如今或許已經掌管[ROOT.GetCountry.GetDiplomacy.GetUnion.GetNameWithNoTooltip]，但絕不是[ROOT.GetCountry.GetAdjectiveWithNoTooltip]政府的合格候選人。為了維持我們在[GetInternationalOrganizationType('union').GetName]中的地位，我們可以為[target_character.GetHerHim]破例，儘管我國許多人民會因此對[ShowGovernmentTypeName('republic')]失去信心。"
 unionevents.98.fallback: "曾經存在[GetInternationalOrganizationType('union').GetName]之處，如今只剩下[ROOT.GetCountry.GetLongName]官署中的外交與行政亂局。[ShowGovernmentTypeName('monarchy')]或許來來去去，但[ShowGovernmentTypeName('republic')]長存。"
 unionevents.98.a: "選舉[target_character.GetShortNameWithNoTooltip]！"
 unionevents.98.b: "我們是時候脫離[ROOT.GetCountry.GetDiplomacy.GetUnion.GetNameWithNoTooltip]了。"
 unionevents.98.c: "[ROOT.GetCountry.GetLongNameWithNoTooltip]萬歲！"
 unionevents.100.title: "[breakaway_ruler.GetShortNameWithNoTooltip]在[root_country.GetNameWithNoTooltip]掌權"
 unionevents.100.desc: "由於我們無法掌控的情勢與事件，[breakaway_ruler.GetName]已接管[root_country.GetLongName]的統治政府。因此，我們與他們的聯合不再生效，因為我們不再共有同一位國家元首……"
 unionevents.100.a: "喔，當然！好像我們本來就需要他們似的！"