l_simp_chinese:
 border_friction.1.title: "邊境摩擦"
 border_friction.1.desc: "並非所有人都對我們與[border_claim_country.GetLongName]結盟感到高興。我們[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中的一個有影響力派系一直在推動終結這項同盟，並將焦點放在[border_claim_province.GetName]省份上；該省份由[border_claim_country.GetNameWithNoTooltip]掌控，但許多人認為它理應屬於我們。他們已經成功煽起人們對此局勢的廣泛憤慨！"
 border_friction.1.a: "或許該調整政策了……"
 border_friction_from_event: "因宣稱而惱怒"
 border_friction.1.b: "把事情往好的方面宣傳吧！"
 border_friction.1.c: "放棄我們的宣稱。"
 border_friction.2.title: "$border_friction.1.title$"
 border_friction.2.desc: "『[border_claim_province.GetName]是我們正當的領土，卻被其他國家掌控，而我們的政府似乎完全沒有努力收復它！他們到底有什麼用？』傳單如此宣稱，呼籲對[border_claim_country.GetLongName]開戰。\n\n在這些痛罵之詞的煽動下，對於我們未能收復所宣稱省份的廣泛不滿，正席捲全國。"
 border_friction.2.a: "$border_friction.1.a$"
 border_friction.2.b: "$border_friction.1.b$"
 border_friction.2.c: "撤銷該宣稱。"