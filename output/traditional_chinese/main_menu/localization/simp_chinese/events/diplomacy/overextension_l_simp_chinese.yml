l_simp_chinese:
 overextension.1.title: "軍隊逃亡"
 overextension.1.desc: "我們的惡名正使各地普遍怨恨我們的戰爭努力。許多人基本上是逃進森林，而不是前來報到服役。"
 overextension.1.a: "反正他們本來也只會是懦夫。"
 overextension.2.title: "廣泛反對"
 overextension.2.desc: "我國聲名極其狼藉，而[ROOT.GetCountry.GetName]有許多人對此深感不滿。"
 overextension.2.a: "我們需要更好的鞭子……"
 overextension.3.title: "惡名昭彰！"
 overextension.3.desc: "我們近期的策略，是從任何碰巧擋在路上的人手中切割出新的省份；出乎意料的是，這似乎對我們在其他國家之間的地位造成了某種負面影響。"
 overextension.3.a: "他們一如既往地反應過度！"
 overextension.4.title: "通貨膨脹"
 overextension.4.desc: "持續戰爭的狀態已侵蝕我國經濟，如今通貨膨脹正失控飆升！"
 overextension.4.a: "試著鑄造更多硬幣！"
 overextension.5.title: "軍官逃亡"
 overextension.5.desc: "[ROOT.GetCountry.GetName]反覆發動看似漫無目的的戰爭，令軍中許多軍官感到幻滅，並已逃離軍中，去別處尋求更好的任命。"
 overextension.5.a: "呸，我們還有其他軍官！"
 overextension.6.title: "商人受怨"
 overextension.6.desc: "一些市場顯然以厭惡[ROOT.GetCountry.GetName]無止境的征服戰爭為由，決定驅逐我們的商人。"
 overextension.6.a: "那我就連他們也一起征服！"
 overextension.7.title: "商人遇刺！"
 overextension.7.desc: "一些國家顯然對我們的外交政策極為震驚，竟決定以刺殺我們的商人作為報復，試圖打擊我們的財政！\n\n更令人震驚的是，這甚至發生在我們自己的市場中……"
 overextension.7.a: "有人要掉腦袋！希望不是我的……"
 overextension.8.title: "正統性遭質疑"
 overextension.8.desc: "[target_ruler.GetName]所展現的嗜血行徑已在世人眼中毀壞[ROOT.GetCountry.GetName]的名聲，如今連我們自己的臣民也開始質疑如此殘酷統治者的正統性。"
 overextension.8.a: "這可不太妙……"
 overextension.9.title: "地方法官辭職"
 overextension.9.desc: "地方法官乃是一個國家的筋骨，而不幸的是，我們所有的地方法官都在辭職！\n\n他們聲稱，這是為了抗議無休止戰爭加諸他們身上的負擔。"
 overextension.9.a: "他們做的事我自己也能做！"
 overextension.10.title: "顧問辭職"
 overextension.10.desc: "一名重要宮廷顧問因對我們一心征服的外交政策感到震驚而辭職，拒絕再為我國效力！"
 overextension.10.a: "典型唱反調者……走了也好！"
 merchant_recalled: "商人受怨"
 overextension.11.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]階層感到沮喪"
 overextension.11.desc: "由於我們惡名昭彰的行徑，我們的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]已經注意到，這正在影響他們與其他國家貴族的關係。這顯然不是理想狀況！"
 overextension.11.a: "$common_string_what_can_we_do$"
 overextension.12.title: "惡名乃是[ROOT.GetCountry.GetReligion.GetSinPrefixName][ROOT.GetCountry.GetReligion.GetSinName|U]"
 overextension.12.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]相當直言不諱地表示，我們的[antagonism|e]使我們在人們眼中惡名昭彰，而這同樣也是[ROOT.GetCountry.GetReligion.GetSinPrefixName][ROOT.GetCountry.GetReligion.GetSinName]！"
 overextension.12.a: "這是[ROOT.GetCountry.GetReligion.GetGodName]的旨意"
 overextension.13.title: "惡名會帶來後果！"
 overextension.13.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]主張，我們的[antagonism|e]已導致貿易機會減少，影響我國的財政福祉！"
 overextension.13.a: "這是我們可以承受的取捨。"
 overextension.14.title: "惡名違背[ROOT.GetCountry.GetAdjectiveWithNoTooltip]傳統"
 overextension.14.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]聲稱，我們的[antagonism|e]違背我國傳統，而且這並不是美好往昔中曾經存在的事物。"
 overextension.14.a: "時代變了"