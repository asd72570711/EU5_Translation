l_simp_chinese:
 espionage_events.1.title: "忠誠減半，雙面間諜加倍"
 espionage_events.1.desc: "間諜活動或許是對一個人是否忠於祖國最嚴苛的考驗。恐懼與誘惑時刻圍繞著間諜，而他們越擅長自己的工作，就越必然會面對這些考驗。當然，這些誘惑正是我們非常樂意提供給外國特工的東西。\n\n來自腐敗橫行之國[espionage_event_country.GetName]的一名特工，最近決定屈服於其中一種誘惑。他渴望獲得比多數人靠收受賄賂所能期望的更多利益，因此提出願意為我們充當雙面間諜。然而，他所選擇的「匿名」聯絡方式，結果並沒有預期中那麼匿名，因此我們現在知道了他的名字。我們該如何處置？"
 espionage_events.1.a: "以較低金額接受提議，並饒他一命。"
 espionage_events.1.b: "暗中跟蹤他幾天，再讓他發生一場意外。"
 espionage_events.2.title: "叛徒的第二次機會"
 espionage_events.2.desc: "我們很清楚腐敗正在侵蝕[ROOT.GetCountry.GetAdjective]社會，但至少曾希望它還沒有超出我國公民之間金錢往來的範圍。我們錯了。負責維持我們在[origin_country.GetName]間諜網的一名特工，其同夥最近證明他收受了一筆只能來自[origin_country.GetAdjective]政府的金錢。我們不得不承認，我們最優秀的人之一並沒有如我們所望那般忠誠。\n\n有人說這項行動或許仍可挽救。若以他背叛的證據與他對質，他或許願意重新轉回原本的效忠對象——附帶的好處是，他已取得[origin_country.GetAdjectiveWithNoTooltip]人的信任。這值得冒險嗎？"
 espionage_events.2.a: "現在他對我們會更加有用。"
 espionage_events.2.b: "他已造成夠多傷害。邀他最後一次回家吧。"
 espionage_events.3.title: "雙重叛徒？"
 espionage_events.3.desc: "依賴品格低劣之人的難處在於，他們很少會是最後一次被誘惑動搖。我們曾向一名[espionage_event_country.GetAdjective]間諜提供大筆金錢與寬恕，換取他背叛自己的國家、成為我們的雙面間諜；如今看來，他似乎已被遭他背叛的人發現。我們其他間諜回報，他被提議繼續為兩國效力，但真正的效忠對象要轉回他的祖國。\n\n這項提議確實存在，毫無疑問。他能活著脫身，意味著他至少假裝接受了。儘管如此，他仍可能是在為我們工作，只是向敵人交出象徵性的情報。我們承擔得起這樣的風險嗎？"
 espionage_events.3.a: "這越來越荒唐了，相信他的想法也是。"
 espionage_events.3.tt_1: "如果該特工如今效忠於他們："
 espionage_events.3.b: "他又騙過他們了？他還真有一套。"
 espionage_events.3.tt_2: "如果該特工仍效忠於我們："
 espionage_events.4.title: "告解之印"
 espionage_events.4.desc: "宗教機構被視為神聖不可侵犯，應高於國家與間諜的卑微陰謀算計。這正是滲透它們至關重要的原因。許多絕不會被公開說出口的祕密，都會在信任之下告知宗教權威，而告解這項實踐甚至已將此制度化。\n\n[victim_country.GetName]的一座教堂，位於我們集中投入間諜活動的國家，為我們利用這一點提供了前所未有的機會。我們一名忠誠特工偽裝成當地修道院的修女，發現自己在教堂做雜務時，能偷聽告解室裡的談話。雖然她很可能逃過偵察，但若計畫曝光，將激怒宗教權威。這值得冒險嗎？"
 espionage_events.4.a: "他們的罪孽或許值得關注，即使我們無法赦免他們……"
 espionage_events.4.b: "不可想像！她應該通知神父，他們的話會被聽見。"
 espionage_events.5.title: "教宗發現陰謀"
 espionage_events.5.desc: "我們利用告解室情報來改善在[victim_country.GetName]情報蒐集的計畫，因特工在行動數月後被發現，已導致我們與教廷之間的外交災難。面對教會的怒火，她此後便帶著自己的物品從修道院消失；這究竟是她自己的作為，還是敵人的行動，我們或許永遠無從得知。\n\n然而，我們可以確定，教會已查明足夠多的內容，明白我們就是幕後主使。教宗對我們竟以這種方式利用教會及其慣例感到震驚。[ROOT.GetCountry.GetGovernment.GetRulerTitle]雖然仍有一定的合理否認空間，但國家的聲望已遭到不可逆轉的損害。"
 espionage_events.5.a: "現在請求寬恕還來得及嗎？"
 espionage_events.8.title: "間諜總管懷疑鄰國"
 espionage_events.8.desc: "聘用間諜總管主要有助於我們在國外蒐集情報，但我們的間諜總管有時也會協調反間諜活動。最近，調查揭露了一場陰謀，而這只能是某個鄰國所為。究竟是哪個鄰國在背後主使仍不清楚，但幕後之人若要持續交換情報，必然距離不遠。\n\n我們的間諜總管已準備逮捕並嚴厲審問一批可能涉案的外國官員，但關於罪魁禍首的各種推論彼此衝突，使得該把矛頭指向誰，需由[ROOT.GetCountry.GetGovernment.GetRulerTitle]決定。我們的鄰國大概不會樂見這些指控，但我們必須有所行動，而且要快。"
 espionage_events.8.a: "在眾多可能嫌疑人之中，這個……"
 counterintelligence_operation: "反間諜行動"
 espionage_events.8.b: "……或是這個，似乎最有可能。"
 espionage_events.9.title: "同盟中的祕密"
 espionage_events.9.desc: "大使與外交使節常常也兼作間諜，或至少是超出自身職責，在本應誠實談判的國家蒐集情報的線人。因此，[spying_ambassador.GetAdjective]大使在[ROOT.GetCountry.GetCapital.GetName]被懷疑涉及間諜活動，也就不算令人意外。如今的難題在於如何得體地處理這項發現，因為只有徹底盤問才能確定其罪責。"
 espionage_events.9.a: "我們必須查明真相。逮捕大使。"
 espionage_events.9.b: "要求更換他。"
 espionage_events.9.c: "只要設法讓他遠離重要事務。"
 espionage_events.10.title: "大使招供"
 espionage_events.10.desc: "一旦被逮捕並帶離其職位的舒適環境，我們懷疑共謀間諜活動的大使很快便在審訊中承認了罪行。更重要的是，他的供詞顯示，他所屬的間諜網比先前懷疑的更加廣泛。雖然這對[spying_ambassador.GetName]來說無疑是尷尬之事，但他們要求我們立即將大使遣返回國，以友好方式解決此局面。\n\n在可避免時不殺害或囚禁外交官，確實是良好慣例，但此人已證明自己是我國的敵人。更重要的是，他或許仍掌握對我們有價值的情報。我們是否應放他離開，以緩和局勢？"
 espionage_events.10.a: "不。會在壓力下屈服的敵方間諜，是寶貴的情報來源。"
 imprisoned_ambassador: "遭囚禁的大使"
 espionage_events.10.b: "我們都在互相刺探。既往不咎吧。"