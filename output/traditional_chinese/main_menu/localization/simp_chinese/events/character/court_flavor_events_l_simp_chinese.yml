l_simp_chinese:

 STATIC_MODIFIER_NAME_arrested_character: "遭監禁"

 court_flavor_events.1.title: "牽線顧問"
 court_flavor_events.1.desc: "[advisor.GetName]以[advisor.GetHerHis]的積極主動、出色領導能力，以及[advisor.GetHerHis]努力融入[ROOT.GetCountry.GetAdjective]宮廷的作為，令國內許多人印象深刻。然而，[advisor.GetSheHe]似乎並未切斷與[advisor.GetHerHis]在[advisor_liaisons_target_country.GetLongName]同胞的一切聯繫。[advisor.GetSheHe|U]一直推動我們與[advisor.GetHerHis]的故鄉[advisor_liaisons_target_country.GetLongNameWithNoTooltip]改善關係，並提議運用[advisor.GetHerHis]在[advisor_liaisons_target_country.GetAdjectiveWithNoTooltip]宮廷中的人脈，促使[advisor_liaisons_target_country.GetGovernment.GetRulerTitle]對我們採取更友善的立場。"
 court_flavor_events.1.a: "就這麼做吧。"
 court_flavor_events.1.A.tooltip: "[advisor.GetName]將接洽[advisor_liaisons_target_country.GetLongName]，以尋求改善關係。"
 court_flavor_events.1.b: "我們不需要與他們改善關係。"

 court_flavor_events.2.title: "與[from.GetLongNameWithNoTooltip]和解？"
 court_flavor_events.2.desc: "[advisor.GetName]是一位技藝精湛的[advisor.GetCulture.GetName][from.GetGovernment.GetCabinetMemberTitle]，受僱於[from.GetAdjective][from.GetGovernment.GetCourtTitle]；如今，已接觸[advisor.GetHerHis]在我國的舊識，計畫推動[from.GetLongNameWithNoTooltip]與[ROOT.GetCountry.GetLongName]之間改善關係。一位[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]帶著[from.GetAdjectiveWithNoTooltip]方面的訊息晉見[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，其中表達了他們希望兩國人民建立友誼的願望。"
 court_flavor_events.2.a: "改善關係確實可能對我們有利。"
 opinion_court_events_accept: "和解"
 court_flavor_events.2.b: "改善關係不符合我們的利益。"
 opinion_court_events_rebuke_1: "和解遭拒"
 court_flavor_events.2.c: "友誼？滾出我的視線！"
 opinion_court_events_rebuke: "和解遭拒"
 
 court_flavor_events.3.title: "和解成功"
 court_flavor_events.3.desc: "[advisor.GetName]在[advisor_liaisons_target_country.GetLongName]的人脈已向[advisor_liaisons_target_country.GetGovernment.GetRulerTitle][advisor_liaisons_target_country.GetGovernment.GetRuler.GetName]陳述我們的立場，並獲得了正面回應。[advisor_liaisons_target_country.GetGovernment.GetRulerTitle]表示，[advisor_liaisons_target_country.GetGovernment.GetRuler.GetSheHe]期待兩國之間開啟友誼的新時代。"
 court_flavor_events.3.a: "$common_string_good$"
 
 court_flavor_events.4.title: "和解失敗"
 court_flavor_events.4.desc: "[advisor.GetName]的人脈似乎未能在[advisor_liaisons_target_country.GetAdjectiveWithNoTooltip]宮廷中取得太多進展。[advisor_liaisons_target_country.GetGovernment.GetRulerTitle][advisor_liaisons_target_country.GetGovernment.GetRuler.GetName]告知他們，[advisor_liaisons_target_country.GetLongName]無意與[ROOT.GetCountry.GetLongName]改善關係。"
 court_flavor_events.4.a: "$common_string_this_is_not_good$"
 
 court_flavor_events.5.title: "和解遭強硬駁回"
 court_flavor_events.5.desc: "[advisor.GetName]的人脈未能在[advisor_liaisons_target_country.GetAdjective]宮廷中取得進展。事實上，他們收到的回應公開帶有敵意。他們不僅被明確告知[advisor_liaisons_target_country.GetLongName]無意與[advisor_liaisons_target_country.GetLongName]改善關係，[advisor.GetName]也被告知[advisor.GetSheHe]今後不再受[advisor_liaisons_target_country.GetLongName]歡迎。在反[ROOT.GetCountry.GetAdjective]情緒之中，[advisor_liaisons_target_country.GetGovernment.GetRulerTitle][advisor_liaisons_target_country.GetGovernment.GetRuler.GetName]甚至進一步將我們這位顧問的數名友人逐出[advisor_liaisons_target_country.GetGovernment.GetRuler.GetHerHis]宮廷。"
 court_flavor_events.5.a: "那就這樣吧。"
 
 court_flavor_events.10.title: "不忠指控"
 court_flavor_events.10.desc: "並非所有人都樂見將尋求與[advisor_liaisons_target_country.GetLongName]改善關係的任務託付給[advisor.GetName]。隨著[ROOT.GetCountry.GetAdjective]宮廷中的異議日增，另一位[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]出面提出不忠指控；此人此前曾與[advisor.GetHerHim]為爭取[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的關注而保持友善競爭。他聲稱已調查[advisor.GetNameWithNoTooltip]的活動，並發現[advisor.GetHerHim]的所作所為無非是假借尋求和解之名，將國家機密洩露給[advisor_liaisons_target_country.GetLongNameWithNoTooltip]。\n\n至於[advisor.GetHerHis]本人，[advisor.GetNameWithNoTooltip]則抗議稱，針對[advisor.GetHerHim]提出的證據乃是對手嫉妒[advisor.GetHerHis]成功而捏造。[advisor.GetSheHe|U]發誓[advisor.GetSheHe]忠心耿耿，只要我們給予[advisor.GetSheHe]完全信任，便會帶來正面成果。"
 court_flavor_events.10.a: "[advisor.GetSheHe|U]獲得我們的完全信任。"
 court_flavor_events.10.A.tt1: "[advisor.GetName]保持忠誠。"
 court_flavor_events.10.A.tt2: "[advisor.GetName]背叛我們的信任。"
 court_flavor_events.10.b: "最好不要冒險。逮捕他們！"
 court_flavor_events.10.B.tt: "[advisor_liaisons_target_country.GetLongName]可能會抗議這項行動。"
 
 court_flavor_events.11.title: "背叛"
 court_flavor_events.11.desc: "[advisor.GetName]背叛了我們！一名對手發現了無可辯駁的證據，證明[advisor.GetSheHe]在假裝代表我方利益的同時，已將各種國家機密透露給[advisor_liaisons_target_country.GetLongName]。不幸的是，在我們能逮捕[advisor.GetHerHim]之前，[advisor.GetSheHe]已越過邊境逃走。"
 court_flavor_events.11.a: "$common_string_this_is_not_good$"
 
 court_flavor_events.12.title: "[from.GetAdjectiveWithNoTooltip]叛逃者！"
 court_flavor_events.12.desc: "有一人來到[ROOT.GetCountry.GetGovernment.GetRulerTitle]面前，堅稱必須讓他陳情。據他所言，他曾為[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetRulerTitle]效力，並掌握了對我們與[from.GetLongName]都至關重要的情報。如今，他聲稱自己是[ROOT.GetCountry.GetAdjective]愛國者，願向我們提供服務與情報；據他所稱，這些情報是他從[from.GetAdjectiveWithNoTooltip]宮廷最核心圈層中巧妙取得，並冒著極大生命危險帶到我們面前的。"
 court_flavor_events.12.a: "他的效勞將被銘記——並獲得回報。"
 opinion_court_events_annoyed: "收留叛徒"
 court_flavor_events.12.b: "我們不需要叛徒。"
 opinion_court_events_grateful: "拒收叛徒"
 
 court_flavor_events.13.title: "當場抓獲"
 court_flavor_events.13.desc: "[advisor_liaisons_target_country.GetAdjective]大使報告稱，[advisor_liaisons_target_country.GetAdjective]當局已逮捕惡徒[advisor.GetName]，因為[advisor.GetSheHe]企圖背叛我們的信任並叛逃至[advisor_liaisons_target_country.GetLongName]。他向我們保證，我方機密安然無恙，而我們的[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]是在未獲[advisor_liaisons_target_country.GetAdjective]方面知情或批准的情況下行動。"
 court_flavor_events.13.a: "我們的感激將永恆不渝。"
 
 court_flavor_events.15.title: "被囚於[from.GetLongNameWithNoTooltip]的同胞"
 court_flavor_events.15.desc: "我們注意到，[advisor.GetName]——一位曾受僱於[from.GetAdjective]宮廷的我國同胞——正因涉嫌計畫向我們洩露國家機密而遭拘押。雖然這些指控似乎屬實，一位[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]仍接手此案，並向[ROOT.GetCountry.GetGovernment.GetRulerTitle]請願：「忠誠臣民為何要被囚於異國殿堂？」[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]問道。「我們必須強烈抗議此舉，並要求將他們歸還給我們。」"
 court_flavor_events.15.a: "我們不能拋棄他們。"
 opinion_court_events_interfered: "干涉我國事務"
 court_flavor_events.15.b: "我們不會干涉。"
 
 court_flavor_events.16.title: "[advisor_liaisons_target_country.GetAdjectiveWithNoTooltip]的要求"
 court_flavor_events.16.desc: "[advisor_liaisons_target_country.GetAdjective][advisor_liaisons_target_country.GetGovernment.GetRulerTitle]向我們發來一封憤怒信函，要求我們解釋逮捕該叛徒的原因：「我們聽聞你們正囚禁我國一名同胞，指控其受我們唆使背叛你們的利益。我們可以向你們保證，事實並非如此。我們要求你們立即釋放[advisor.GetHerHim]！」"
 court_flavor_events.16.a: "好吧。那就這樣。"
 opinion_court_events_released_compatriot: "釋放同胞"
 court_flavor_events.16.b: "我們不會違背正義行事。"
 opinion_court_events_held_compatriot: "囚禁同胞"
 
 court_flavor_events.17.title: "[from.GetAdjective]的回應"
 court_flavor_events.17.desc: "[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetRulerTitle]已回應我們的要求：「作為善意表示，儘管有大量不利於其本人的罪證，我們仍已釋放[advisor.GetName]。希望你們能因這項舉動而對我們另眼相看。」"
 court_flavor_events.17.a: "這才是公正之舉。"
 
 court_flavor_events.18.title: "[from.GetAdjective]的回應"
 court_flavor_events.18.desc: "[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetRulerTitle]已回應我們的要求：「我們不會釋放叛國罪犯。[advisor.GetName]將繼續被拘押。」"
 court_flavor_events.18.a: "你們會後悔的。"
 
 court_flavor_events.20.title: "可疑的支出慣例"
 court_flavor_events.20.desc: "[advisor.GetName]的支出習慣引起了一些人的側目。[advisor.GetSheHe|U]一直花費大筆金錢——遠超[advisor.GetHerHis]職位所應能支配的數額——向[advisor.GetHerHis]家鄉地區的當地[advisor.GetEstateType.GetName]分發禮物，並改善地方基礎設施。一項調查揭示了事實：[advisor.GetNameWithNoTooltip]並未盡[advisor.GetHerHis]所能為[ROOT.GetCountry.GetGovernment.GetRulerTitle]效力，而是將國家資金輸送至[corrupt_advisor_location.GetName]，以提升[advisor.GetHerHis]在當地的人望。雖然這對地方經濟有所助益，但若容忍這種做法，可能會對整個國家造成損害。"
 court_flavor_events.20.a: "睜一隻眼閉一隻眼。"
 court_flavor_events.20.b: "逮捕[advisor.GetHerHim]！"
 
 court_flavor_events.21.title: "良知驅使的離去"
 court_flavor_events.21.desc: "在[ROOT.GetCountry.GetGovernment.GetRulerTitle]的文件中發現了一封[advisor.GetName]留下的信。\n\n#F 我的[ROOT.GetCountry.GetGovernment.GetRulerTitle]，\n我一直盡我所能為您與[ROOT.GetCountry.GetLongName]效力。然而，我必須懷著沉重的心情宣布辭去您的[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]一職。對[religious_enemy_country.GetLongName]宣戰已越過底線——面對您對我宗教同胞犯下的罪行，我再也無法保持沉默。\n\n謹上，\n[advisor.GetNameWithNoTooltip]#!\n\n\n目前尋找[advisor.GetHerHim]的嘗試均未成功。看來[advisor.GetSheHe]已經逃離國境。"
 court_flavor_events.21.a: "$common_string_this_is_not_good$"
 
 court_flavor_events.22.title: "外邦智慧"
 court_flavor_events.22.desc: "雖然[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]對外邦人為他們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]效力一事多少感到不安，但我們的[advisor.GetCulture.GetName][ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle][advisor.GetName]因將新思想與新做法帶入宮廷而廣受讚譽。看來我們仍能從外邦學問中學到一兩件事！"
 court_flavor_events.22.a: "$common_string_good$"
 
 court_flavor_events.25.title: "血濃於水？"
 court_flavor_events.25.desc: "當前與[advisor_enemy_country.GetLongName]的戰爭，在[ROOT.GetCountry.GetAdjective]宮廷中引發了一輪陰謀。其一，[advisor.GetName]——我們的[advisor.GetCulture.GetName][ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]——提議動用[advisor.GetHerHis]在[advisor_enemy_country.GetLongNameWithNoTooltip]的人脈網絡來為戰事提供情報；[advisor.GetSheHe]聲稱這是一張相當龐大的網絡，其中包括數名接近[advisor_enemy_country.GetGovernment.GetRulerTitle]的人士。\n\n其二，[advisor.GetHerHis]的政敵則對[advisor.GetHerHis]的忠誠提出質疑。他們主張，儘管[advisor.GetHerHis]過去的服務堪稱典範，但此時我們實在不能信任一名[advisor.GetCulture.GetNameWithNoTooltip]參與國家大事的商議。因此，他們要求將[advisor.GetSheHe]逐出宮廷。"
 court_flavor_events.25.a: "他們說得對——放逐[advisor.GetHerHim]！"
 court_flavor_events.25.b: "留下[advisor.GetHerHim]——[advisor.GetHerHis]的情報會派上用場。"
 
 court_flavor_events.26.title: "關於[advisor_enemy_country.GetAdjectiveWithNoTooltip]戰爭計畫的報告"
 court_flavor_events.26.desc: "儘管[advisor.GetHerHis]的忠誠仍受質疑，[advisor.GetName]似乎確實信守了[advisor.GetHerHis]的承諾。來自[advisor.GetHerHis]人脈網絡的第一批報告已經送達，為我們提供了關於[advisor_enemy_country.GetAdjective]戰爭計畫的大量情報。"
 court_flavor_events.26.a: "$common_string_good$"
 
 court_flavor_events.27.title: "[from.GetAdjectiveWithNoTooltip]叛逃者！"
 court_flavor_events.27.desc: "有一人來到[ROOT.GetCountry.GetGovernment.GetRulerTitle]面前，堅稱必須讓他陳情。他聲稱曾為[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetRulerTitle]效力，並獲悉[from.GetAdjective]針對其祖國[ROOT.GetCountry.GetLongName]的戰爭計畫細節。作為一名自稱的[ROOT.GetCountry.GetAdjectiveWithNoTooltip]愛國者，如今他願意向我們提供服務與這些情報；據他所稱，這些情報是他從[from.GetAdjectiveWithNoTooltip]宮廷最核心圈層中巧妙取得，並冒著極大生命危險帶到我們面前的。"
 court_flavor_events.27.a: "他的效勞將被銘記——並獲得回報。"

 court_flavor_events.28.title: "背叛"
 court_flavor_events.28.desc: "[advisor.GetName]背叛了我們！儘管[advisor.GetHerHis]的敵人嚴加監視，[advisor.GetSheHe]仍設法帶著我方戰爭計畫相關重要文件的副本越過邊境！"
 court_flavor_events.28.a: "$common_string_this_is_not_good$"

 court_flavor_events.30.title: "政策轉向？"
 court_flavor_events.30.desc: "[advisor.GetName]作為[ROOT.GetCountry.GetGovernment.GetRulerTitle]的[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]以[advisor.GetHerHis]盡忠職守的服務，因此在[ROOT.GetCountry.GetAdjective]宮廷中結交了許多朋友。然而，在[advisor_antiliaisons_target_country.GetAdjective][advisor_antiliaisons_target_country.GetGovernment.GetGovernmentType.GetName]效力的[advisor.GetHerHis]同胞之間，情況似乎恰好相反：他們嫉妒[advisor.GetHerHis]的地位，譴責[advisor.GetHerHim]受僱於[advisor.GetHerHis]人民的敵人之中，並開始散播謠言，質疑[advisor.GetHerHis]是否值得信任\n由於擔心[advisor.GetHerHis]在[ROOT.GetCountry.GetAdjectiveWithNoTooltip]宮廷中的地位，[advisor.GetNameWithNoTooltip]已成為[advisor_antiliaisons_target_country.GetAdjectiveWithNoTooltip][advisor_antiliaisons_target_country.GetGovernment.GetRulerTitle]的激烈反對者。[advisor.GetSheHe|U]與數名志同道合者結盟，呼籲對[advisor_antiliaisons_target_country.GetLongNameWithNoTooltip]採取更強硬的立場。"
 court_flavor_events.30.a: "[advisor.GetSheHe|U]是對的——政策確實需要改變。"
 advisor_antiliaisons: "強硬立場"
 advisor_spurious_accusations: "不實指控"
 court_flavor_events.30.b: "關係惡化不符合我們的利益。"
 
 court_flavor_events.31.title: "多事的顧問"
 court_flavor_events.31.desc: "我們在[from.GetLongName]的耳目回報稱，[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetRulerTitle]最近對[ROOT.GetCountry.GetLongName]採取了更強硬的立場。看來這項政策轉變主要是由[advisor.GetName]促成的；此人是一名[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetCabinetMemberTitle]，由於擔心[advisor.GetHerHis]在[from.GetAdjectiveWithNoTooltip]宮廷中的地位，便對我們提出各種指控，並鼓動他們對我們所謂的侵略採取強硬回應。"
 court_flavor_events.31.a: "這小東西竟敢……！"
 
 court_flavor_events.32.title: "多事的顧問"
 court_flavor_events.32.desc: "儘管我們並未支持[advisor.GetHerHis]在我們與[advisor_antiliaisons_target_country.GetLongName]之間挑撥不和的計畫，[advisor.GetName]仍未停止[advisor.GetHerHis]的努力。看來[advisor.GetSheHe]已吸引了一大批支持[advisor.GetHerHis]立場的有影響力人士，他們正急切呼籲改變政策。他們竭盡所能傳播自己的訊息，而這些訊息似乎在平民之中引發強烈共鳴。違逆他們的意志可能會帶來風險。"
 court_flavor_events.32.a: "也許[advisor.GetSheHe]終究是對的。"
 court_flavor_events.32.b: "不就是不。"
 
 court_flavor_events.35.title: "[exile_country.GetAdjectiveWithNoTooltip]流亡者"
 court_flavor_events.35.desc: "[advisor.GetName]是一名來自[exile_country.GetLongName]的政治流亡者，如今出現在我們宮廷之中。他願意為[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetGovernmentType.GetNameWithNoTooltip]效力，以換取免受[exile_country.GetAdjectiveWithNoTooltip][exile_country.GetGovernment.GetRulerTitle]迫害的保護。我們是否應該收留他？"
 court_flavor_events.35.a: "他的效勞會很有用。"
 opinion_took_in_exiles: "收留流亡者"
 court_flavor_events.35.b: "我們沒有容身之處給他。"
 opinion_turned_away_exiles: "拒收流亡者"
 
 court_flavor_events.36.title: "[exile_country.GetAdjectiveWithNoTooltip]流亡者"
 court_flavor_events.36.desc: "[advisor.GetName]感謝我們准許其在[ROOT.GetCountry.GetAdjective]宮廷中獲得庇護。然而，[advisor.GetSheHe]最近提請我們注意，還有許多與[advisor.GetHerHis]處境相同的[exile_country.GetAdjective]顯貴——[advisor.GetSheHe]堅稱他們都是極富智慧與影響力之人。若我們希望加強對[exile_country.GetAdjectiveWithNoTooltip]野心的反對，允許他們加入我們的宮廷或許會很有用。"
 court_flavor_events.36.a: "我們會收留他們。"
 court_flavor_events.36.b: "我們沒有空間收留更多流亡者。"
 
 court_flavor_events.37.title: "[from.GetLongNameWithNoTooltip]的流亡者"
 court_flavor_events.37.desc: "我們在[from.GetLongName]的耳目回報稱，他們收留了許多我方[ROOT.GetCountry.GetGovernment.GetRulerTitle]的政敵；這些人此前曾被逐出[ROOT.GetCountry.GetAdjective]宮廷，或選擇到他處尋求機會。如今，他們正推動對當前[ROOT.GetCountry.GetAdjectiveWithNoTooltip]「政權」採取強硬行動，並積極協助[from.GetAdjectiveWithNoTooltip][from.GetGovernment.GetRulerTitle]達成這一目標。"
 court_flavor_events.37.a: "他們怎敢！"
 opinion_hosting_exiles: "收留流亡者"
 
 
 court_flavor_events.39.title: "[heathen_advisor_country.GetLongNameWithNoTooltip]的異端"
 court_flavor_events.39.desc: "我們注意到，[heathen_advisor_country.GetAdjective][heathen_advisor_country.GetGovernment.GetRulerTitle]正在[heathen_advisor_country.GetGovernment.GetRuler.GetHerHis]宮廷中庇護一名異端。[heathen_advisor_country.GetGovernment.GetRuler.GetHerHis|U][heathen_advisor_country.GetGovernment.GetCabinetMemberTitle][advisor.GetName]已背離教宗的教誨，並公開宣稱信奉[advisor.GetReligion.GetName]信仰——過程中還散播針對聖座的惡毒謊言。"
 court_flavor_events.39.a: "不可容忍！我們必須提出抗議。"
 opinion_interfering_pope: "干涉的教宗"
 court_flavor_events.39.b: "我們將睜一隻眼閉一隻眼。"
 
 court_flavor_events.40.title: "教宗的要求"
 court_flavor_events.40.desc: "一支[GetCountry('PAP').GetAdjective]代表團已經抵達。他們神情凝重地告知我們，[target_pope.GetHisHerFormal][target_pope.GetName]已獲悉我們正在自己的[ROOT.GetCountry.GetGovernment.GetFlavorRank]中庇護一名異端。他們要求我們將[advisor.GetHerHim]交給宗教裁判所。若不照辦，[target_pope.GetShortNameWithNoTooltip]將認定我們已背離正道，並將被迫對我們採取一切必要措施。"
 court_flavor_events.40.a: "交出[advisor.GetHerHim]。"
 opinion_bowed_to_papal_demand_advisor: "屈從教宗要求"
 court_flavor_events.40.b: "我們不會屈服於教宗壓力。"
 
 opinion_rejected_papal_demand_advisor: "庇護異端"
 court_flavor_events.41.title: "[heathen_advisor_country.GetLongNameWithNoTooltip]遵從要求"
 court_flavor_events.41.desc: "[heathen_advisor_country.GetAdjective][heathen_advisor_country.GetGovernment.GetRulerTitle]為雇用該異端致歉；此人將被鎖鏈押送至我們面前，其謊言也將永遠沉默！"
 court_flavor_events.41.a: "$common_string_good$"
 
 court_flavor_events.42.title: "[heathen_advisor_country.GetLongNameWithNoTooltip]挑戰我方權威"
 court_flavor_events.42.desc: "[heathen_advisor_country.GetAdjective][heathen_advisor_country.GetGovernment.GetRulerTitle]對我們的要求表示憤怒，[heathen_advisor_country.GetGovernment.GetRuler.GetSheHe]竟膽敢聲稱這逾越了我們的權威——彷彿教宗並非基督教世界一切靈性事務的裁判者。邪惡確實已在[heathen_advisor_country.GetLongName]紮根。"
 court_flavor_events.42.a: "他們已被引入歧途。"