l_simp_chinese:
 survive_string: "若[target_character.GetLastName]能在[target_character.GetHerHis]旅途中倖存，庇護[target_character.GetHerHim]的[country|e]將得知"
 ibn_battuta_events.1.title: "見多識廣的旅行者"
 ibn_battuta_events.1.entry: "$ibn_battuta_events.1.title$"
 ibn_battuta_events.1.desc: "在許多土地已被[target_character.GetHerHim]拋諸身後之後，[target_character.GetLastName]如今將[target_character.GetHerHis]目光投向遙遠的[GetCountry('YUA').GetLongName]。關於宏偉城市、精緻風俗與強大皇帝的傳聞，早已傳入[target_character.GetHerHis]耳中。渴望親眼見證東方奇觀，並擴展[target_character.GetHerHis]對遠方宮廷與文化的認識，[target_character.GetLastNameWithNoTooltip]正為[target_character.GetHerHis]旅程下一段，也是最雄心勃勃的一段做好準備。前路漫長而未知，但[target_character.GetLastNameWithNoTooltip]懷抱堅定不移的決心與好奇心前行，堪稱我們時代真正的先驅。"
 ibn_battuta_events.1.a: "引導[target_character.GetHerHis]前往[target_location_1.GetNameWithNoTooltip]的航程。"
 ibn_battuta_events.1.b: "[target_character.GetSheHe|U]必須造訪[target_location_2.GetNameWithNoTooltip]！"
 ibn_battuta_events.1.c: "[target_location_3.GetNameWithNoTooltip]港口是[target_character.GetHerHis]旅途中值得一看的景象。"
 ibn_battuta_events.1.d: "直接將[target_character.GetHerHim]送往[target_character.GetHerHis]目的地。"
 ibn_battuta_events.1.historical_info: "伊本·巴圖塔是摩洛哥旅行家與學者，生於十四世紀初的丹吉爾。他年輕時離家，踏上前往麥加的宗教朝聖之旅，但他的行程最終延伸至已知世界的大部分地區。在三十年間，他造訪了非洲、中東、波斯、印度、中亞，甚至中國部分地區。途中，他曾在數個穆斯林宮廷擔任法律專家與法官。他對旅程的詳細記述，即《里哈拉》，為當時諸多文化與社會留下了罕見而豐富的觀察。"
 ibn_battuta_will_islamic_texts_in_pasai_tt: "在[target_location_1.GetName]期間，[target_character.GetLastName]將研讀[ShowReligionGroupAdjective('muslim')]典籍。[target_character.GetHerHis]旅途中的後續停留地將受益於[ShowSocietyDirectionName('jurisprudence')]加成"
 when_ibn_battuta_drafts_rihla_he_will_remember_sumatra_tt: "$survive_string$[target_location_1.GetArea.GetName]"
 ibn_battuta_will_admire_and_study_the_architecture_of_angkor_tt: "在[target_location_2.GetName]期間，[target_character.GetLastName]將讚嘆並研究[target_location_2.GetRank.GetName]的宏偉建築。[target_character.GetHerHis]旅途中的後續停留地將受益於[building|e]加成"
 when_ibn_battuta_drafts_rihla_he_will_remember_lower_mekong_tt: "$survive_string$[target_location_2.GetArea.GetName]"
 ibn_battuta_trade_in_martaban_tt: "在[target_location_3.GetName]期間，[target_character.GetLastName]將見證其繁忙港口與貴重貨物的穩定流通。[target_character.GetHerHis]旅途中的後續停留地將受益於[selling_efficiency|e]加成。"
 when_ibn_battuta_drafts_rihla_he_will_remember_irrawady_delta_area_tt: "$survive_string$[target_location_3.GetArea.GetName]"

 
 ibn_battuta_events.2.title: "[target_character.GetLastNameWithNoTooltip]造訪我國土地"
 ibn_battuta_events.2.desc: "著名的[ShowCultureName('moroccan')]旅行家[target_character.GetLastName]，在受外交任命離開$india$後，如今[target_character.GetHerselfHimself]來到我國[ROOT.GetCountry.GetFlavorRank]這片充滿活力而濕潤的土地。[target_character.GetHerHis|U]日誌記述了一座繁忙的[ShowReligionGroupAdjective('muslim')]港口，祈禱召喚與異國香料的芬芳在此交會。\n\n如今，[target_character.GetSheHe]以[target_character.GetHerHis]到來為[target_location.GetName]的殿堂增光。[target_character.GetSheHe|U]寫下了以禮物款待[target_character.GetHerHim]的統治者、宏偉的神廟與地方習俗，以及在接受新信仰的同時仍緊守古老傳統的人們。雖然[target_character.GetHerHis]行跡仍籠罩在曖昧不明之中，但有一件事毋庸置疑——[target_character.GetHerHis]旅程在東方的宮廷與港口留下了迴響。"
 ibn_battuta_events.2.a: "真是個有趣的人物！"
 ibn_studied_islamic_texts_in_pasai_tt: "由於[target_character.GetLastName]曾在[ShowLocationName('pasai')]研讀[ShowReligionGroupAdjective('muslim')]典籍："
 angkor_ibn_battuta_effect: "由於[target_character.GetLastName]曾研究[ShowLocationName('angkor')]的建築："
 martaban_ibn_battuta_effect_tt: "由於[target_character.GetLastName]曾研究[ShowLocationName('martaban')]大港的商人貿易："
 
 ibn_battuta_events.3.title: "[target_character.GetLastNameWithNoTooltip]抵達[GetCountry('CHI').GetNameWithNoTooltip]"
 ibn_battuta_events.3.desc: "在海上航路、三角洲與諸王朝之間漂泊多年後，[target_character.GetLastName]已抵達我國[ROOT.GetCountry.GetFlavorRank]傳說中的土地。雖然[target_character.GetHerHis]筆記不如早前記述那般精確，但[target_character.GetSheHe]描繪了活動熙攘的宏偉城市、令[target_character.GetHerHim]感到陌生的奇特風俗，以及權力籠罩整個領域的遙遠統治者。\n\n無論[target_character.GetHerHis]旅程是將[target_character.GetHerHim]帶到[ROOT.GetCountry.GetCapital.GetName]，抑或僅止於南方海岸遼闊的港口，[target_character.GetSheHe]都對[ShowCultureGroupName('chinese_group')]文明的規模與秩序深感敬畏。異國文字、寺廟與大市場或許很快便會填滿[target_character.GetHerHis]日誌的篇頁，見證一位真正跨越已知世界邊緣的旅行者。"
 ibn_battuta_events.3.a: "讓[target_character.GetHerHim]參與我們的典禮與文化活動。"
 ibn_battuta_events.3.b: "將允許[target_character.GetSheHe|U]觀察並研究我們的法律體系。"
 ibn_battuta_events.3.c: "[target_character.GetSheHe|U]不過又是一名訪客，無須特別待遇！"
 ibn_battuta_observes_customs_tt: "在[ROOT.GetCountry.GetCapital.GetName]期間，[target_character.GetLastName]將記錄並研究我們的地方習俗。[target_character.GetHerHis]旅途中的後續停留地將受益於[cultural_influence|e]與[cultural_tradition|e]加成"
 ibn_battuta_observes_chinese_laws_tt: "在[ROOT.GetCountry.GetCapital.GetName]期間，[target_character.GetLastName]將記錄並研究我們的法律。[target_character.GetHerHis]旅途中的後續停留地將受益於與其[cabinet|e]相關的加成"
 when_ibn_battuta_drafts_rihla_he_will_remember_capital_region_tt: "$survive_string$[ROOT.GetCountry.GetCapital.GetRegion.GetName]"
 ibn_battuta_will_simply_observe_while_hes_here_tt: "在[ROOT.GetCountry.GetCapital.GetName]期間，[target_character.GetLastName]只會在我們的市場與景觀之間閒逛，不會為後續可能接待[target_character.GetHerHim]的[countries|e]提供任何加成"

 ibn_battuta_next_destination_target_country_1_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 2#!年後成為[target_country_1.GetName]"
 
 ibn_battuta_events.4.title: "[target_character.GetLastNameWithNoTooltip]抵達"
 ibn_battuta_events.4.desc: "在穿越[ShowRegionName('indonesia_region')]的遙遠航程，甚至或許造訪過[GetCountry('YUA').GetLongName]的傳說城市之後，[target_character.GetLastName]如今[target_character.GetHerselfHimself]身處我國[ROOT.GetCountry.GetFlavorRank]的某處。這位疲憊的旅行者依照我們的地方傳統與習俗受到迎接，並渴望考察我們的社會，記下所有吸引[target_character.GetHerHis]目光的事物。\n\n坦白說，[target_character.GetSheHe]帶著[target_character.GetHerHim]來自東方海域彼端的故事、禮物與見聞。關於宏偉城市、紀律嚴明的官僚體系，以及從[ShowRegionNameWithNoTooltip('indonesia_region')]延伸至[GetCountry('CHI').GetCapital.GetName]的商業網絡的傳聞，如今在我們的學者與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]之間流傳。無論是在為地方行政官提供建議、於[ShowBuildingTypeName('sufi_mosque')]中辯論，或在圓頂陰影下默默沉思，[target_character.GetLastNameWithNoTooltip]都再次證明自己是遠方智慧的載體，由不確定的道路承載而來。"
 ibn_battuta_events.4.a: "以配得上[target_character.GetSheHe]帶給我們之知識的禮物，慷慨賞賜[target_character.GetHerHis]。"
 ibn_battuta_events.4.b: "我們應展現好客，而非錢財。"
 ibn_studied_customs_of_china_tt: "由於[target_character.GetLastName]曾研究[GetCountry('CHI').GetNameWithNoTooltip]的文學與表現習俗："
 chinese_laws_ibn_battuta_effect_tt: "由於[target_character.GetLastName]曾研究[GetCountry('CHI').GetNameWithNoTooltip]的法律禮制與體系："
 ibn_battuta_will_carry_gifts_tt: "在[ROOT.GetCountry.GetCapital.GetName]期間，[target_character.GetLastName]將從當地人處獲得許多禮物與錢幣。[target_character.GetHerHis]旅途中的後續停留地將透過取得一部分[gold|e]而受益於這筆財富"
 next_stop_is_target_country_2_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 2#!年後成為[target_country_2.GetName]"
 
 ibn_battuta_events.5.title: "[target_character.GetLastNameWithNoTooltip]在[target_location_5.GetNameWithNoTooltip]"
 ibn_battuta_events.5.desc: "橫渡[ShowRegionName('indian_ocean_region')]後，[target_character.GetLastName]踏上了[target_location_5.GetName]受人敬仰的土地。祈禱召喚迴盪於山谷之間，古代先知的塵埃彷彿仍隨每陣微風飄散。對[target_character.GetHerHim]而言，這不僅是一個目的地，實則更是一座精神頂峰。\n\n當[target_character.GetSheHe]加入朝聖者向西行進的商隊時，[target_character.GetHerHis]旅程便從外在世界轉向內在。在此，[target_character.GetSheHe]打算研讀我們的法律，與眾多學派的學者交流，並省思將如此遙遠的諸多民族相繫於一體的信仰合一。聖城、嚴酷沙漠，以及[ShowRegionName('arabia_region')]莊嚴樸素之美，都將留下印記，並在[target_character.GetHerHis]日後的著作中迴響。"
 ibn_battuta_events.5.a: "一位令人著迷的人物。"
 next_stop_is_target_country_3_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 2#!年後成為[target_country_3.GetName]"
 mor_ibn_battuta_donates_coin_tt: "[target_character.GetLastName]將捐出[target_character.GetHerHis]部分[gold|e]："
 
 ibn_battuta_events.6.title: "[target_character.GetLastNameWithNoTooltip]抵達[ShowRegionNameWithNoTooltip('iberia_region')]"
 ibn_battuta_events.6.desc: "在穿越[ShowRegionName('arabia_region')]的漫長而動盪旅程後，[target_character.GetLastName]如今[target_character.GetHerselfHimself]來到[target_location_6.GetName]肥沃丘陵與學術城市之中。雖然[ShowRegionName('iberia_region')]大部分地區已經歷[ShowReligionGroupAdjective('christian')]與[ShowReligionGroupAdjective('muslim')]統治者之間數百年的戰火，但這個[ROOT.GetCountry.GetFlavorRank]仍如我們文化中的一顆明珠般閃耀。[target_character.GetLastName]熱切地想漫步於花園與宮殿之中，在那裡，詩人與學者在[ROOT.GetCountry.GetAdjective]卓越氣度的注視下繁盛。[target_character.GetSheHe|U]將驚嘆於建築與自然的和諧，並記下曾經共享這片土地的諸信仰之間不安的共存。在這裡，在#italic 伊斯蘭世界#!的西陲，[target_character.GetHerHis]旅程獲得了新的面向；那是記憶、美麗與靜默韌性的一面。"
 ibn_battuta_events.6.a: "[target_character.GetSheHe]有什麼故事要告訴我們？"
 next_stop_is_target_country_4_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 2#!年後成為[target_country_4.GetName]"
 
 ibn_battuta_events.7.title: "[target_character.GetLastNameWithNoTooltip]在[target_location_7.GetNameWithNoTooltip]"
 ibn_battuta_events.7.desc: "[ShowAreaName('desert_area')]漫長的陰影如今已落在[target_character.GetLastName]身後；穿越炙熱沙丘與鹽跡斑斑的道路，抵達陽光照耀的[ROOT.GetCountry.GetFlavorRank]。在[target_location_7.GetName]腹地，[target_character.GetSheHe]必將見證一個黃金自由流通、正義被高聲宣示、王權以沉靜尊嚴包裹自身的世界。\n\n[target_character.GetLastNameWithNoTooltip]希望造訪那些宮廷，在那裡，神聖經文與地方傳統一同被誦讀；也希望驚嘆於我們首都的市場，駱駝商隊與河上獨木舟在此交會。儘管遠離東方宣禮塔，[target_character.GetSheHe]卻發現[ShowReligionGroupName('muslim')]正隨[ShowRegionName('sahel_region')]之風的節奏繁盛，信仰、財富與口述傳承在此交融，而[target_character.GetHerHis]筆將把這一切帶過沙海，送回遙遠土地。"
 ibn_battuta_events.7.a: "坐在火堆旁吧，陌生人，告訴我們遠方帝國的故事。"
 next_stop_is_target_country_5_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 2#!年後成為[target_country_5.GetName]"

 ibn_battuta_events.8.title: "[target_character.GetLastNameWithNoTooltip]歸來"
 ibn_battuta_events.8.desc: "在遠方諸國旅行多年後，從[ShowLocationName('mecca')]的清真寺到[target_location_7.GetName]的市集，從$india$的王座到[ShowRegionName('north_china_region')]的港口——[target_character.GetLastName]終於回到[GetCountry('MOR').GetName]。[target_location_8.GetName]的街道既熟悉又陌生，因為[target_character.GetSheHe]早已被城門之外遙遠世界所塑造。\n\n[target_character.GetHerHis|U]家人中許多人如今已不在人世，無緣聽見這些故事；但書吏、學者與統治者仍會聆聽。[target_character.GetHerHis]披風上帶著塵土，記憶在[target_character.GetHerHis]腦海中擁擠，[target_character.GetSheHe]準備開口，也準備書寫。一段信仰之旅，已化作一整個世界的編年史；來自異域的知識與有趣見聞，全都被記錄在[target_character.GetHerHis][target_art.GetName]之中。"
 ibn_battuta_events.8.a: "#italic 旅行——它先使你啞口無言，隨後又讓你成為說故事的人。#!"
 ibn_battuta_composes_the_rihla_tt: "[target_character.GetLastName]撰寫[target_art.GetName]，一部記述[target_character.GetHerHis]旅途的完整[ShowWorkOfArtTypeName('chronicle')]"
 travels_of_ibn_battuta_tt: "我們將發現[target_character.GetLastName]曾造訪過的所有[areas|e]，例如[target_area.GetName]"

 next_stop_is_target_location_1_owner_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 1#!年後成為[target_location_1.GetOwner.GetName]"
 next_stop_is_target_location_2_owner_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 1#!年後成為[target_location_2.GetOwner.GetName]"
 next_stop_is_target_location_3_owner_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 1#!年後成為[target_location_3.GetOwner.GetName]"
 next_stop_is_china_tt: "[target_character.GetLastName]將停留在我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]。[target_character.GetHerHis|U]下一個目的地將在大約#Y 2#!年後成為[GetCountry('CHI').GetName]"