l_simp_chinese:
 personality_events.1.title: "[target_ruler.GetNameWithNoTooltip]的諸多興趣"
 personality_events.1.desc: "我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]對高深的智識追求越來越感興趣，甚至能花上數日與我國[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的博學之士交談。[target_ruler.GetHeSheFormal|U]已開始邀請遠近各地的學者，協助[target_ruler.GetHerHim]更深入理解世界及其中人們的運作方式。\n\n照這樣發展下去，若[target_ruler.GetSheHe]能在[target_ruler.GetHerHis]選擇的領域投入足夠時間與資源，[target_ruler.GetName][target_ruler.GetHerselfHimself]或許也能憑藉[target_ruler.GetHerHis]自身成為一方權威。"
 personality_events.1.a: "我們必須努力理解身邊的物質世界。"
 personality_events.1.a.tt: "這或許能使我國受益，但多半會花費我們[gold|e]"
 personality_events.1.b: "統治者必須理解神與人的法律。"
 personality_events.1.c: "別讓[target_ruler.GetHerHis]的時間與金錢浪費在這種事情上。"
 personality_events.2.title: "製圖學的進展"
 personality_events.2.desc: "作為[target_ruler.GetHerHim]周遭世界的虔誠學生，[target_ruler.GetName]已對地圖著迷。[target_ruler.GetHerHis|U]位於[ROOT.GetCountry.GetCapital.GetName]的宮殿中，有幾個房間完全用於收藏[target_ruler.GetHerHis]的地圖，而我們親愛的[ROOT.GetCountry.GetGovernment.GetRulerTitle]也花了相當多時間凝視並編目這些地圖。\n\n雖然這讓[target_ruler.GetHerHim]在[target_ruler.GetHerHis]廷臣（以及[ROOT.GetCountry.GetGovernment.GetAdjective|U]財務官）眼中顯得有些古怪，但我國正從[target_ruler.GetSheHe]所建立、關於周遭世界的龐大檔案中受益。"
 personality_events.2.a: "世界真是如此遼闊。"
 personality_events.3.title: "槍械製造的進展"
 personality_events.3.desc: "[target_ruler.GetName]對槍械的功能與形制產生了濃厚興趣。大量精力被投入追尋異常或創新的火器，而任何送到[target_ruler.GetHerHim]面前的武器，[target_ruler.GetNameWithNoTooltip]都會興高采烈地拆解並重新組裝。\n\n有人或許會認為這份迷戀有些病態（更不用說還很昂貴），但作為這項長期計畫的成果，我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]已創造出[target_ruler.GetSheHe]聲稱完美無缺的火器。"
 personality_events.3.a: "讓世界顫抖吧！"
 personality_events.4.title: "追求黃金"
 personality_events.4.desc: "自[target_ruler.GetHerHis]童年早期起，[target_ruler.GetName]便沉迷於創造黃金的可能性，而隨著政府金庫向[target_ruler.GetHerHim]敞開，這已發展成一種執念。每一本書與每一位所謂專家都被召集到[ROOT.GetCountry.GetCapital.GetName]接受檢驗或盤問。[target_ruler.GetNameWithNoTooltip][target_ruler.GetHerselfHimself]已在[target_ruler.GetHerHis]實驗室中度過許多時日，卻至今仍未接近創造這種昂貴金屬。\n\n有人會稱這種追求是徒勞無功，但它確實提升了我們對化學的認識。"
 personality_events.4.a: "很好，現在讓我們試著收斂一點。"
 personality_events.4.b: "必須……創造黃金……"
 personality_events.4.b.tt: "讓我們的統治者自由追求煉金術。成功機率極不確定。"
 personality_events.5.title: "對嗜好的追求"
 personality_events.5.desc: "雖然[target_ruler.GetName]在[target_ruler.GetHerHis]統治期間，對各種智識追求都抱有濃厚興趣，但看來[target_ruler.GetHerHis]想在世界學者之間為[target_ruler.GetHerselfHimself]揚名的雄心並不十分成功。即便[target_ruler.GetHerHis]未竟的雄心仍是這位[ROOT.GetCountry.GetGovernment.GetRulerTitle]心中的痛處，[target_ruler.GetHerHis|U]對更偉大智者的贊助，對整個[ROOT.GetCountry.GetName]而言也並非毫無價值。"
 personality_events.5.a: "#italic Dicitur nos esse quasi nanos, gigantium humeris insidentes.#!"
 personality_events.5.b: "[target_ruler.GetNameWithNoTooltip]將讓[target_ruler.GetHerselfHimself]身邊圍繞著我們這個時代的偉大心智！"
 personality_events.6.title: "法律編纂"
 personality_events.6.desc: "經過密集研究與辯論後，[ROOT.GetCountry.GetName]的[target_ruler.GetName]下令，以[target_ruler.GetHerHis]親自制定的一套新法律，取代[ROOT.GetCountry.GetNameWithNoTooltip]各地若干地方法律與法律傳統。\n\n這部法典彙整了我們[ROOT.GetCountry.GetFlavorRank]各地以及其他[ROOT.GetCountry.GetReligion.GetAdjective]國家的法學傳統，而[target_ruler.GetNameWithNoTooltip]相信，它將成為後世法官效法的典範。"
 personality_events.6.a: "人人都有權獲得公正審判。"
 personality_events.6.b: "我們可以習慣這一切……"
 personality_events.7.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]大辯論"
 personality_events.7.desc: "為了充分理解治理一片土地及其居民的規則，[target_ruler.GetName]讓[target_ruler.GetHerselfHimself]沉浸於神學與哲學巨著之中。大量學者也被帶到[ROOT.GetCountry.GetCapital.GetName]，就世界萬物秩序發表見解。\n\n這場尋求指引的追求，如今在[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]達到高潮，由我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle][target_ruler.GetHerselfHimself]親自主持一場偉大辯論。"
 personality_events.7.a: "這真是求知的偉大日子！"
 personality_events.7.b: "我們必須繼續尋找答案。"
 personality_events.8.title: "戰爭與和平中的正義"
 personality_events.8.desc: "在[target_ruler.GetHerHis]追求正義的過程中，[target_ruler.GetName]開始讓[target_ruler.GetHerselfHimself]關注大國之間的關係。國家在戰爭中、海上，或其他遠離本土之處的行為，受到少數法律與許多傳統約束。決心塑造這些議題的國際辯論，[target_ruler.GetNameWithNoTooltip]蒐羅[target_ruler.GetSheHe]能找到的一切材料，撰寫一本關於戰爭、和平與國際行為法則的著作。目前尚不清楚這是否能帶來我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]所期望的改變，但它顯然已改變我國在其他國家眼中的地位。"
 personality_events.8.a: "什麼構成有效的宣戰理由？"
 personality_events.9.title: "法力藥水？"
 personality_events.9.desc: "將低賤材料轉化為黃金的祕密仍持續躲避[target_ruler.GetName]，但在[target_ruler.GetHerHis]的實驗中，[target_ruler.GetSheHe]成功創造出某種[target_ruler.GetSheHe]稱為「法力藥水」的東西。我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]堅稱，飲下此藥水將為[target_ruler.GetHerHim]帶來生命與活力，更不用說還會帶來為我們[ROOT.GetCountry.GetFlavorRank]成就偉業的力量。"
 personality_events.9.a: "[target_ruler.GetNameWithNoTooltip]將飲下法力藥水！"
 personality_events.10.title: "省份紛爭"
 personality_events.10.desc: "原本只是一些地方強人與其佃戶之間的小爭端，卻不知怎地演變成具有全國重要性的糾紛。隨著[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]、學者、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]與街頭煽動者全都盡可能大聲發表意見，紛爭雙方終於轉向[target_ruler.GetName]，請求解決他們的衝突。\n\n在聽取雙方陳情後，我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]相信，無論佃戶處境多麼悲慘，錯在他們。一項公正且論證充分的裁決不太可能激怒任何人，但利用輿論、以犧牲這些強人為代價來增加我們對該省的權威，確實相當誘人。"
 personality_events.10.a: "試著公正解決此事。"
 personality_events.10.b: "我們必須利用這個局勢！"
 personality_events.11.title: "正義的[ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 personality_events.11.desc: "很少有君主能像[target_ruler.GetName]一樣，擁有如此熱烈的支持者基礎。然而，[target_ruler.GetHerHis]的代理人並不總是如此幸運。在某些情況下，我們的臣民就是拒絕相信某位總督、稅吏或其他政府官員是在代表[target_ruler.GetNameWithNoTooltip]行事。一份請願書已送到我們面前，控訴整個總督行政機構據民間說法濫用我們的善意，並使人民受苦。"
 personality_events.11.a: "斥責總督行政機構。"
 personality_events.11.b: "試著為總督行政機構辯護。"
 personality_events.11.c: "交給當地人處理。"
 personality_events.12.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]的美德"
 personality_events.12.desc: "[target_ruler.GetName]的統治以出色的合作為標誌，從官僚到普通商人，甚至共和貴族，人人似乎都覺得我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]真心為他們著想。然而，有一群人認為[target_ruler.GetNameWithNoTooltip]辜負了他們。[target_ruler.GetHerHis|U]自己的家族與支持者認為[target_ruler.GetSheHe]沒有充分利用[target_ruler.GetHerHis]的職位。即便他們的財產與影響力在[target_ruler.GetHerHis]任內沒有大幅增長，仍相當可觀，許多人堅稱若得到機會，他們能為共和國成就大事。"
 personality_events.12.a: "我們必須對抗一切形式的裙帶關係！"
 personality_events.12.b: "我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]自己的血親值得信任。"
 personality_events.12.c: "繼續避開[target_ruler.GetNameWithNoTooltip]的親族。"
 personality_events.13.title: "[target_ruler.GetNameWithNoTooltip]信任的天性"
 personality_events.13.desc: "我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]以寬容我們[ROOT.GetCountry.GetFlavorRank]中的非[ROOT.GetCountry.GetReligion.GetAdjective]社群而聞名。有人甚至會說[target_ruler.GetHeSheFormal]過於信任他人，任由這些不信者蒙蔽[target_ruler.GetHerHis]的判斷。尤其是[target_ruler.GetNameWithNoTooltip]身邊一群親近的異教密友，引來了大量嫉妒與惡意。謠言已開始流傳，聲稱我們親愛的[ROOT.GetCountry.GetGovernment.GetRulerTitle]的寵信者已滲透政府，意圖密謀對抗信徒。"
 personality_events.13.a: "胡說八道！"
 personality_events.13.b: "[target_ruler.GetNameWithNoTooltip]怎會如此盲目？"
 personality_events.14.title: "戰爭蹂躪"
 personality_events.14.desc: "戰爭會留下深刻傷痕，在衝突結束很久之後，仍盤踞於新臣民心中。在特別嚴重遭受戰爭蹂躪的地區，過去的政府機構，甚至當地人的大家族，都可能所剩無幾。[target_ruler.GetName]親自表達了擔憂，認為煽動者會在這些地區煽起分離主義與不和，阻礙其融入更廣大的國家，並使人民遭受不必要的苦難。"
 personality_events.14.a: "我們必須幫助這些可憐人重建生活！"
 personality_events.14.b: "不如讓我們利用這片荒廢為自己謀利！"
 personality_events.14.c: "地方當局正在處理。"
 personality_events.15.title: "異端首領？"
 personality_events.15.desc: "一名名為[heresiarch.GetName]的怪人，近日在我們[ROOT.GetCountry.GetFlavorRank]各處鄉間被人發現。他正在向所有願意聽他愉快胡言亂語的人，傳授一套極不正統的世界創造說法。據某些人所言，[heresiarch.GetNameWithNoTooltip]代表對神聖教義危險且卑劣的重新詮釋，但我們許多臣民似乎已被這位自封先知及其思想的異端所吸引。\n\n受到[target_ruler.GetName]作為自由思想[target_ruler.GetWomanMan]之名聲吸引，[heresiarch.GetNameWithNoTooltip]如今要求覲見我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]，並願意擔任靈性事務顧問。"
 personality_events.15.a: "世界像滿是蛆蟲的乳酪？真是迷人的觀點！"
 personality_events.15.b: "我們不能允許[heresiarch.GetNameWithNoTooltip]嘲弄我們的信仰！"
 personality_events.15.c: "直接請[heresiarch.GetNameWithNoTooltip]離開。"
 personality_events.16.title: "[target_ruler.GetNameWithNoTooltip]充滿活力的[ROOT.GetCountry.GetGovernment.GetCabinetTitle|U]"
 personality_events.16.desc: "[target_ruler.GetName]把認識當代所有優秀男女視為[target_ruler.GetHerHis]的分內之事。這使[target_ruler.GetHerHim]能聚集[ROOT.GetCountry.GetName]最聰穎頭腦，組成一個極其令人印象深刻的[ROOT.GetCountry.GetGovernment.GetCabinetTitle]。隨著[target_ruler.GetHerHim]周遭之人意識到這是推動仕途的絕佳途徑，許多[ROOT.GetCountry.GetGovernment.GetCabinetTitle]成員便接近[target_ruler.GetNameWithNoTooltip]，請求[target_ruler.GetSheHe]為他們的門生騰出一席之地。多數人不足掛齒，但其中一位格外機智聰慧的候選人[protege.GetName]，或許真值得在我們核心圈中佔有一席。"
 personality_events.16.a: "這是顆卓越的頭腦，我們應該好好榨取它。"
 personality_events.16.b: "我們的行政體系裡，總能替[protege.GetNameWithNoTooltip]找個位置吧？"
 personality_events.17.title: "以身作則"
 personality_events.17.desc: "[target_ruler.GetName]不是那種輕易失去[target_ruler.GetHerHis]鎮定的[target_ruler.GetWomanMan]。在動盪、紛爭或衝突之時，[target_ruler.GetSheHe]總是堅定而有力地站穩腳步，避免恐慌並鼓舞他人保持冷靜。久而久之，這種作風已滲透到我們行政體系的最底層，也使我國更加穩定。"
 personality_events.17.a: "堅守立場。"
 personality_events.18.title: "謹慎周旋"
 personality_events.18.desc: "作為一個雄心勃勃國家的統治者，想與每個人交朋友並不容易。然而，有時仔細留意國際社群的動向，能讓人減輕過去冒犯所造成的影響。在[target_ruler.GetHerHis]與鄰國統治者的私人書信往來中，[target_ruler.GetName]希望一點一滴提升我國在世界上的地位。"
 personality_events.18.a: "我們真的只是被誤解了。"
 personality_events.18.a.tt: "所有與我國和平相處且對我國觀感為負的鄰近[countries|e]，將獲得對我國的[ShowBiasValue('careful_diplomatic_manouvering')|+=][opinion|e]。"
 personality_events.19.title: "[target_ruler.GetNameWithNoTooltip]的大密碼"
 personality_events.19.desc: "自[target_ruler.GetHerHis]童年以來，密碼學便是[target_ruler.GetName]的嗜好，而隨著[target_ruler.GetSheHe]逐漸成熟，[target_ruler.GetHerHis]隱藏[target_ruler.GetHerHis]祕密的方法也同樣進步。在發現一系列被拆開的信件後，我們已清楚知道，不受歡迎的眼睛讀過我們與省份總督的通信。我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]有信心，只要得到資源，[target_ruler.GetSheHe]就能大幅提升安全性。"
 personality_events.19.a: "讓我們把這件事列為最高優先！"
 personality_events.19.b: "別把精力浪費在這上面。這方法終究會傳開。"
 personality_events.20.title: "下九流之友"
 personality_events.20.desc: "據說，我們宿敵首都裡每隔一個表演者、藝術家或小偷，實際上都是[target_ruler.GetName]的線人。由於對幾乎所有有影響力之人的來去都抱有敏銳的個人興趣，我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]往往比我們的間諜首領更早看見機會。最近，[target_ruler.GetNameWithNoTooltip]的人脈指出，在若干我們關注的國家中，存在可供我們利用的破綻。不過，這將需要我們稍微打開國庫。"
 personality_events.20.a: "金錢只是個數字。"
 personality_events.20.b: "讓我們把諜報交給專業人士吧。"
 personality_events.23.title: "從他人的錯誤中學習"
 personality_events.23.desc: "[target_ruler.GetName]一向認為，聆聽那些先於[target_ruler.GetHerHim]而來者的建言，並讓[target_ruler.GetHerselfHimself]身邊圍繞經驗豐富的顧問，是一種美德。然而，令[target_ruler.GetHerHim]擔憂的是，[target_heir.GetName]或許尚未完全理解統治[ROOT.GetCountry.GetName]意味著什麼。終有一天，這份責任將由[target_heir.GetNameWithNoTooltip]肩負，而到那時，如果[target_heir.GetSheHe]已更充分理解統治所帶來的挑戰，或許會是最好的。"
 personality_events.23.a: "我們必須教導[target_heir.GetHerHim]行政之道。"
 personality_events.23.b: "我們必須教導[target_heir.GetHerHim]外交事務。"
 personality_events.23.c: "我們必須教導[target_heir.GetHerHim]戰爭之道。"
 personality_events.23.d: "[target_heir.GetNameWithNoTooltip]已經準備得很完美了！"
 personality_events.24.title: "學習永不嫌晚？"
 personality_events.24.desc: "認識自身不足，並將職責委派給能補足自身能力的能人，是健全統治最重要的面向之一。[target_ruler.GetName]堅信應聆聽良好建議，並透過聽取更有經驗者的意見來提升[target_ruler.GetHerselfHimself]。然而，隨著時間推移，也許能學會那些對他人而言與生俱來的事物。若我們允許[target_ruler.GetNameWithNoTooltip]讓[target_ruler.GetHerselfHimself]全心投入，一位導師或許能提升[target_ruler.GetHerHis]對治理[ROOT.GetCountry.GetAdjective]國家更進階部分的掌握。"
 personality_events.24.a: "讓[target_ruler.GetHerHim]研習[ROOT.GetCountry.GetAdjectiveWithNoTooltip]行政"
 personality_events.24.b: "讓[target_ruler.GetHerHim]研習外交事務。"
 personality_events.24.c: "讓[target_ruler.GetHerHim]研習戰爭。"
 personality_events.24.d: "[target_ruler.GetNameWithNoTooltip]不需要導師！"
 personality_events.25.title: "不義之戰"
 personality_events.25.desc: "隨著我們當前戰爭中的談判日益接近，[target_ruler.GetName]一直忙於會見我們共同友邦與宿敵的使節。作為抵禦不公侵略戰爭的防衛者，我們得到了國際社群的同情。眼下一切尚未定局，但我們可以確信，未來談判中將握有不少籌碼。"
 personality_events.25.a: "該達成協議了。"
 personality_events.25.b: "我們需要的是重建援助。"
 personality_events.26.title: "[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip|U]信仰的擴張"
 personality_events.26.desc: "[target_ruler.GetName]將傳播[ROOT.GetCountry.GetReligion.GetAdjective]信仰視為[target_ruler.GetHerHis]畢生事業，並很快在我國各地宗教社群中為[target_ruler.GetHerselfHimself]打響名聲。[target_ruler.GetHerHis|U]與[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的密切關係，使各類宗教學者在[ROOT.GetCountry.GetCapital.GetName]成為常見身影，並在權力廳堂中擁有影響力。\n\n隨著時間推移，我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]的名聲甚至開始傳到國境之外。如今，我們的間諜告訴我們，宿敵臣民之中有些宗教少數群體會歡迎我們的解放軍進入他們的土地。"
 personality_events.26.a: "我們必須保衛我們的宗教弟兄！"
 personality_events.26.a.tt: "所有信奉與我們不同宗教群組之[religion|e]的鄰近[countries|e]，將獲得對我國的[ShowBiasValue('zealot_reputation_opinion')|+=][opinion|e]。"
 personality_events.26.b: "讓我們避免不必要的流血。"
 personality_events.27.title: "虔誠者的支持"
 personality_events.27.desc: "許多人正在貢獻自己僅有的一點財物，以支持我們的國家與虔誠領袖對抗不信者的[target_ruler.GetHerHis]鬥爭。我們地方[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]也回報，志願者激增，他們準備拿起武器，對抗信仰之敵。"
 personality_events.27.a: "我們的祈禱已獲回應。"
 personality_events.27.b: "最健壯者將在我們軍中服役。"
 personality_events.28.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的吸引力"
 personality_events.28.desc: "最理想的附庸-庇護關係，是雙方都能獲得原本不可能取得之額外利益的互惠事務。在[target_ruler.GetName]堅定的手腕下，許多受我們保護的國家都繁榮發展。這為我們帶來的眾多好處之一，就是來自附屬國的年輕王子與其他名流，認為[ROOT.GetCountry.GetName]是開創仕途的好地方。"
 personality_events.28.a: "讓他們為在我國行政體系服務的榮耀而競爭。"
 personality_events.28.b: "最有才華者將獲准在我軍服役。"
 personality_events.29.title: "法律改革"
 personality_events.29.desc: "如同許多規模相近的國家，[ROOT.GetCountry.GetName]表面上的統一，在一定程度上只是幻象。地方上，任何城市、階層，甚至村莊，都可能自古以來便有自己的規則與法律。我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]急於減少國內法制不一致，已開始撤回特權並發布新的全國性指令，以將秩序帶入混亂。然而，這並非總能立刻成功。隨著最近一項政府指令在我國某地遭到公然無視，[target_ruler.GetName]的權威正受到質疑。"
 personality_events.29.a: "分析他們的反對意見，並徹底調和我們的立法。"
 personality_events.30.title: "在意想不到之處找到錢"
 personality_events.30.desc: "[target_ruler.GetName]以[target_ruler.GetHerHis]無人能及的能力聞名，總能在最不可能的地方找到新的國家收入來源。[target_ruler.GetHerHis|U]最近對地方報告的審計，在我們某個省份發現了一項全新的收入來源，正緩慢而穩定地增加流入國庫的金錢。"
 personality_events.30.a: "錢！"
 personality_events.31.title: "恪守準則"
 personality_events.31.desc: "[target_ruler.GetName]對道德操守與腐敗的嚴格執行與看法，已幫助我們的國家變得更加誠實。這也讓[target_ruler.GetHerHim]在行政官與書記之間結交不到多少朋友。雖然我們已遏止收受賄賂，但許多人正積極運用一切可用手段，拖慢政府齒輪的轉動。"
 personality_events.31.a: "總有一天，我們會把他們全都連根拔起。"
 personality_events.31.b: "我們可以稍微彎曲一下崇高原則。"
 personality_events.32.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]學派"
 personality_events.32.desc: "數代以來，我們首都的天際線從未如此滿是吊車、半建成的高塔與紀念建築。[target_ruler.GetName]的統治以越來越多的建設工程為特色，這些工程遍及[ROOT.GetCountry.GetCapital.GetName]與我們[ROOT.GetCountry.GetFlavorRank]的其他地區。\n\n受僱依照我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]品味規劃並興建宏偉建築的人數不斷增加，促成了一種全新且鮮明的建築風格。國際上對[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]學派偉大建築師與建造者的需求日益增加，而一些外國城市如今也能在我們自己的風格上與我們競爭。"
 personality_events.32.a: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]必須繼續是最宏偉的城市！"
 personality_events.32.b: "讓我們鼓勵大師們將這種風格進一步傳播海外。"
 personality_events.33.title: "輕鬆金錢的誘惑"
 personality_events.33.desc: "一批經濟投資者接近[target_ruler.GetName]，要求取得開發我們控制下某一地區的權利。他們願意支付一筆總款，以換取從我國土地中抽取收入的權利，之後便由他們代替我們收取金錢。投資者很快指出，投資地方基礎設施符合他們的利益，因為這能增加他們賺取超過已支付土地權利金額的機會。"
 personality_events.33.a: "[target_ruler.GetNameWithNoTooltip]當[target_ruler.GetSheHe]看見好交易時，自然認得出來！"
 personality_events.33.b: "還是穩妥為上。"
 personality_events.34.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]的經濟學"
 personality_events.34.desc: "[target_ruler.GetName]以[target_ruler.GetHerHis]不知疲倦的精力與工作習慣聞名。夜裡很少有幾個時辰[target_ruler.GetHerHis]房中的燈火不亮，而[ROOT.GetCountry.GetGovernment.GetAdjective]敕令也常在清晨與深夜自[ROOT.GetCountry.GetCapital.GetName]發出。[target_ruler.GetSheHe|U]似乎也持續注視著我國所有商業部門。外國人有時驚訝地得知，即便是省份中全新的商業事業，[target_ruler.GetNameWithNoTooltip]也會親自制定規範。\n\n隨著我們親愛的[ROOT.GetCountry.GetGovernment.GetRulerTitle]抓住我國新的成長機會，真正的問題只在於，我們是否有資源同時完成[target_ruler.GetSheHe]所希望的一切。"
 personality_events.34.a: "錢不是問題。"
 personality_events.34.b: "[target_ruler.GetNameWithNoTooltip]將得到[target_ruler.GetSheHe]所需的一切，甚至更多。"
 personality_events.34.c: "或許改日吧。"
 personality_events.35.title: "新大陸的誘惑"
 personality_events.35.desc: "自[target_ruler.GetHerHis]童年以來，[target_ruler.GetName]便深深著迷於遠方之地的故事，而成為[ROOT.GetCountry.GetGovernment.GetRulerTitle]後，[target_ruler.GetSheHe]一直積極推動發現航行與殖民。如今，我們的殖民行政官要求我們給予更多支持以實現海外雄心，[target_ruler.GetSheHe]便決定依靠[target_ruler.GetHerHis]自己的力量籌措所需資源，而不加重國庫負擔。"
 personality_events.35.a: "是時候組織一場遠征了！"
 personality_events.36.title: "政府干預"
 personality_events.36.desc: "[target_ruler.GetName]作為談判者與中介人的才華，通常是國際談判中的資產，但有時也會出現可用來造福我國市場的機會。最近一系列與外國使節的會議揭示了一個契機，可在我國本土商人向外國市場出口商品時賦予他們優勢。"
 personality_events.36.a: "專注於重商主義議程。"
 personality_events.36.b: "偏向自由貿易。"
 personality_events.36.c: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]應超然於此等事務之上。"
 personality_events.37.title: "恐懼與敬畏"
 personality_events.37.desc: "在[target_ruler.GetHerHis]統治期間，[target_ruler.GetName]透過言語與行動證明了[target_ruler.GetHerHis]作為征服者的雄心。受到軍隊敬仰之下，一次即興造訪軍營，如今便在士兵心中灌注了勝利的光榮夢想。"
 personality_events.37.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]的親臨將驅使他們走向勝利！"
 personality_events.37.b: "我們應以[target_ruler.GetNameWithNoTooltip]之名譜寫行軍歌！"
 personality_events.38.title: "戰爭藝術"
 personality_events.38.desc: "這個時代少有人具備足以媲美我們傑出的[target_ruler.GetName]的戰術頭腦。[target_ruler.GetSheHe|U]徹底革新了我們面對戰場的方式，而我們預見[ROOT.GetCountry.GetFlavorRank]的未來將有許多偉大勝利。[target_ruler.GetNameWithNoTooltip]正在考慮撰寫一本關於[target_ruler.GetHerHis]方法的書。雖然這將幫助我們在自軍中傳播軍事戰術知識，但它也必然會傳到鄰國手中。"
 personality_events.38.a: "不分享這項進步，便是對人類的罪行！"
 personality_events.38.a.tt: "所有鄰國將獲得[ShowNamedValue('army_tradition_mild_bonus')|+=0][army_tradition|e]。"
 personality_events.38.b: "他們今天會頌揚我們，明天就會從背後捅我們一刀。"
 personality_events.39.title: "只有和平，毫無樂趣"
 personality_events.39.desc: "[target_ruler.GetName]最近一直在[target_ruler.GetHerHis]住處來回踱步。閒話說，是感情問題讓這位[ROOT.GetCountry.GetGovernment.GetRulerTitle]焦躁不安，但任何熟悉這位[target_ruler.GetWomanMan]的人都知道，真正原因其實是[ROOT.GetCountry.GetFlavorRank]當前的和平——像[target_ruler.GetShortNameWithNoTooltip]這樣勇敢的戰士，只要沒有戰爭可供謀劃，就會覺得自己像鳥兒一樣被困在[target_ruler.GetHerHis]房中。不過話說回來，[target_ruler.GetSheHe]可是[ROOT.GetCountry.GetGovernment.GetRulerTitle]……"
 personality_events.39.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]應該舉辦一場比武大會！"
 personality_events.39.b: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]應多花些時間操練[target_ruler.GetHerHis]軍隊。"
 personality_events.40.title: "嚴格禮儀"
 personality_events.40.desc: "某天傍晚，[target_heir.GetName]與[target_ruler.GetName]共進晚餐。傳言說，結果並不愉快。據說一開始只是關於禮儀的爭論，很快便演變成一向彬彬有禮的[ROOT.GetCountry.GetGovernment.GetHeirTitle]在用餐途中衝出房間，緊接著[target_ruler.GetName]大喊那個混帳企圖毒害[target_ruler.GetHerHim]！"
 personality_events.40.a: "這絕不能容忍！[ROOT.GetCountry.GetGovernment.GetHeir.GetNameWithNoTooltip]將為此付出代價。"
 personality_events.40.b: "這大概只是誤會。"
 personality_events.41.title: "修辭的力量"
 personality_events.41.desc: "因當前戰爭局勢而憂心，[target_ruler.GetName]為[target_ruler.GetHerHis]疲憊的軍隊發表了一場振奮人心的演說。如今，無論[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]還是平民之間，都在流傳這樣的傳聞——[target_ruler.GetSheHe]像燈塔般站在他們面前，陽光從[target_ruler.GetHerHis]盔甲上反射，而[target_ruler.GetHerHis]的言辭為士兵激起新的希望。"
 personality_events.41.a: "我們比他們想像中更堅韌。"
 personality_events.42.title: "新一代"
 personality_events.42.desc: "多年來，[target_ruler.GetName]對塑造我軍展現出濃厚興趣，並親自訓練許多軍中年輕俊才。透過這些門生，[target_ruler.GetNameWithNoTooltip]得以將[target_ruler.GetHerHis]思想傳播到我軍各階層。[ROOT.GetCountry.GetGovernment.GetRulerTitle]相信，[target_ruler.GetHerHis]最新的學生[protege.GetName]測試[protege.GetHerHis]羽翼的時候已經到了。如今，我們必須決定[protege.GetSheHe]要如何才能最有效地造福我們高貴的[ROOT.GetCountry.GetFlavorRank]。"
 personality_events.42.a: "[protege.GetNameWithNoTooltip]應專注於提升我軍士氣的改革。"
 personality_events.42.b: "我們可以用得上一位新將軍。" 
 personality_events.44.title: "強硬殺價"
 personality_events.44.desc: "多年來，許多人都畏懼談判桌上的[target_ruler.GetName]。[target_ruler.GetSheHe|U]毫不退讓，勇猛如獅、狡黠如蛇。最終，大多數人只是為了逃離[target_ruler.GetHerHis]鐵一般的目光，便把[target_ruler.GetNameWithNoTooltip]想要的一切交給[target_ruler.GetSheHe]。當我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]召集銀行家重新談判國家貸款時，我們都知道結局會如何。"
 personality_events.44.a: "接下來幾個月，銀行家們睡覺都會輾轉反側！"
 personality_events.45.title: "最後一根稻草"
 personality_events.45.desc: "長久以來，我們的外交官一直對[target_ruler.GetName]以及[target_ruler.GetHerHis]辱罵一切人事物的傾向感到疲憊。他們片刻不得休息，因為必須收拾我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]留下的所有爛攤子。最近一次讓他們頭痛的事，發生在我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]激怒了[angry_country.GetName]的[angry_ruler.GetName]派來的使節，嚴重到[angry_ruler.GetSheHe]在[angry_ruler.GetHerHis]訪問期間大發脾氣。我們偉大的廳堂中從未聽過如此辱罵！"
 personality_events.45.a: "我們必須捍衛[ROOT.GetCountry.GetFlavorRank]的榮譽！"
 personality_events.46.title: "烏雲總有金邊"
 personality_events.46.desc: "[target_ruler.GetName]的一些顧問最近發現國庫中有部分資金不翼而飛。他們並不意外地發現錢究竟進了誰的口袋。起初，他們苦於找不到既能解決問題又不冒犯[ROOT.GetCountry.GetGovernment.GetRulerTitle]的方法，如今他們有了一個有趣的想法。何不利用這位[ROOT.GetCountry.GetGovernment.GetRulerTitle]的「才華」來重新充實國庫呢？"
 personality_events.46.a: "這是為了[ROOT.GetCountry.GetFlavorRank]的好！"
 personality_events.46.b: "錯上加錯並不會變成正確。"
 personality_events.48.title: "工作與享樂"
 personality_events.48.desc: "我們的[target_ruler.GetName]以[target_ruler.GetHerHis]輕浮且往往醜聞纏身的生活方式聞名。直到現在，最可恥的行徑都仍被藏在緊閉門後。然而，情況似乎正在改變。[target_ruler.GetNameWithNoTooltip]將[target_ruler.GetHerHis]最寵愛的情人[lover.GetName]——一名知名騙徒——帶到了[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 personality_events.48.a: "[lover.GetSheHe|U]顯然有些才能。讓我們派[lover.GetHerHim]做事吧。"
 personality_events.49.title: "難忘之夜"
 personality_events.49.desc: "[target_ruler.GetName]以[target_ruler.GetHerHis]放縱的天性與奢華生活方式聞名——或者該說臭名昭著。雖然我們的行政官常抱怨這對政府資金造成消耗，但懂得安排令人印象深刻的宴會，本身也是一種資源。[target_ruler.GetNameWithNoTooltip]透過[target_ruler.GetHerHis]舞會與宴席，為我們[ROOT.GetCountry.GetFlavorRank]結交了許多朋友。如今[target_ruler.GetSheHe]正在籌劃另一場盛大活動，不過貴賓人選尚未決定。"
 personality_events.49.a: "這樣下去不可持續……"
 personality_events.50.title: "轉出利潤"
 personality_events.50.desc: "雖然[target_ruler.GetName]的貪婪確實傷害了我國經濟，但[target_ruler.GetHerHis]對快速金錢無止境的追逐並不總是毫無成果。有時[target_ruler.GetSheHe]投資的商業冒險會獲得回報，而今天正是這樣的日子。"
 personality_events.50.a: "活在當下確實也能很甜美！"
 personality_events.51.title: "鐵拳"
 personality_events.51.desc: "[target_ruler.GetName]對我們[lazy_province.GetName]省的最新報告感到不滿。[target_ruler.GetSheHe|U]確信那些毫無價值的農民應該受責。或許我們應該拿其中一些人殺雞儆猴，好鼓勵其他人更加努力工作？"
 personality_events.51.a: "讓他們見識懶惰的代價！"
 personality_events.51.b: "我們不能冒著爆發起義的風險，否則就沒人工作了。"
 personality_events.52.title: "十年最佳雇主"
 personality_events.52.desc: "[target_ruler.GetName]並不總是容易相處——[target_ruler.GetHerHis]欠缺思慮的作風與完全不懂分寸，多年來冒犯了許多人。然而，有一群人很欣賞[target_ruler.GetNameWithNoTooltip]的天真。[target_ruler.GetHerHis|U]顧問已意識到，我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]很容易被說服，而且幾乎會對任何提議感到興奮。由於他們如此滿足，而爭奪職位的競爭又如此激烈，我們得以稍微降低他們的薪水。"
 personality_events.52.a: "一點競爭只會讓他們更加努力工作！"
 personality_events.54.title: "意外的稱讚"
 personality_events.54.desc: "在一場宴會上，[target_ruler.GetName]加入了關於食物與甜點的討論。雖然多數參與者仍堅持自己的評價，主張本地料理的優越之處，但這位[ROOT.GetCountry.GetGovernment.GetRulerTitle]卻在[target_ruler.GetSheHe]不小心說出[target_ruler.GetHerHis]意見時，發表了尷尬言論：認為[SCOPE.sCountry('cool_neighbor_country').GetName]有最好的乳酪拼盤，而我們的相比之下完全索然無味！'\n\n雖然我們的廚師受到嚴重侮辱，但[SCOPE.sCountry('cool_neighbor_country').GetName]的[SCOPE.sCountry('cool_neighbor_country').GetGovernment.GetRulerTitle][cool_ruler.GetName]想必在宴會上安插了間諜，因為[cool_ruler.GetHerHis]一名使節後來送來一大箱乳酪，完全免費。"
 personality_events.54.a: "噢，那個渾然不覺的[target_ruler.GetNameWithNoTooltip]！"
 personality_events.55.title: "[ROOT.GetCountry.GetNameWithNoTooltip]的精銳"
 personality_events.55.desc: "對我們偉大[ROOT.GetCountry.GetFlavorRank]的軍隊而言，只有最優秀的[ROOT.GetCountry.GetAdjective]士兵才足夠！[target_ruler.GetName]花了許多不眠之夜思索我軍未來，並得出結論：我們需要設定更高標準。雖然可用人數必然會因此減少，但我們可以期待士兵在戰場上有更佳表現。"
 personality_events.55.a: "確實，我們應重質不重量！"
 personality_events.55.b: "我們承擔不起拒絕健壯男子的代價。"
 personality_events.56.title: "給顧問的建議"
 personality_events.56.desc: "人人都知道，我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]在[ROOT.GetCountry.GetGovernment.GetCourtTitle]成員之間並不受歡迎。雖然多數人容忍[target_ruler.GetHerHis]懷恨在心的個性，很可能是出於對其他反應的恐懼，但一位顧問最近已不只一次與我們的統治者發生爭執。[target_advisor.GetName]不甚有說服力地聲稱「這純粹是公事」，如今正威脅要離開宮廷。然而，有一種語言是所有行政官都懂的……"
 personality_events.56.a: "讓我們的金錢開口。"
 personality_events.56.b: "我們不需要[target_advisor.GetNameWithNoTooltip]。"
 personality_events.57.t: "裝備自卑情結"
 personality_events.57.desc: "[target_ruler.GetName]對我軍能力相較於那些「渴望擴張」鄰國的持續恐懼、低估與偏執，已開始影響我們的軍官。\n\n突然之間，整個軍隊都陷入糟糕情緒，認為若我們不取得一批全大陸最新、最閃亮、最昂貴的武器，就會被邊境鄰國整個吞下。"
 personality_events.57.a: "只要能安心，怎樣都好。"
 personality_events.57.b: "我們不需要多餘裝備。"
 personality_events.58.t: "鄰國戰術天才"
 personality_events.58.desc: "[target_origin_country.GetName]的[target_ruler.GetName]最近出版了一本戰爭著作，並被粗心地允許流出[target_origin_country.GetAdjectiveWithNoTooltip]國境之外。雖然[target_origin_country.GetAdjectiveWithNoTooltip]戰術在我們[ROOT.GetCountry.GetFlavorRank]中傳統上一直不受信任，但這本書讓我們最頂尖的將軍得到一些新想法，他們聲稱這些想法可被納入我們自己的軍隊。"
 personality_events.58.a: "取其精華為我所用。"
 personality_events.58.a.tt: "我們獲得了#G 5#![army_tradition|e]。"