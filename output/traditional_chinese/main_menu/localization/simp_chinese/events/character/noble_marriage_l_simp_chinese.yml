l_simp_chinese:
 noble_marriage.1.title: "為[ROOT.GetCountry.GetGovernment.GetRuler.GetName]尋覓[ROOT.GetCountry.GetGovernment.GetConsortTitle]"
 noble_marriage.1.desc: "由於我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]尚未成婚，貴族們對我國君主制的延續表示憂慮。我們最重要的貴族之一[target.GetDynasty.GetDynastyHead.GetName]提議，讓我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]與[target.GetName]成婚。"
 noble_marriage.1.a: "這是個好辦法！"
 noble_marriage.1.b: "區區貴族絕不能成為[ROOT.GetCountry.GetGovernment.GetConsortTitle]"

 noble_marriage.2.title: "未來的[ROOT.GetCountry.GetGovernment.GetConsortTitle]！"
 noble_marriage.2.desc: "由於我們的[ROOT.GetCountry.GetGovernment.GetHeirTitle]尚未成婚，貴族們對我國君主制的延續表示憂慮。我們最重要的貴族之一[target.GetDynasty.GetDynastyHead.GetName]提議，讓我們的[ROOT.GetCountry.GetGovernment.GetHeirTitle]與[target.GetName]成婚。"
 noble_marriage.2.a: "這是個好辦法！"
 noble_marriage.2.b: "這是對我們[ROOT.GetCountry.GetGovernment.GetHeirTitle]的侮辱。"

 noble_marriage.3.title: "$noble_marriage.1.title$"
 noble_marriage.3.desc: "$noble_marriage.1.desc$"
 noble_marriage.3.a: "別無選擇！"
 noble_marriage.3.b: "只有王室血脈才配得上！"
 
 
 valid_female_of_ruler_dynasty: "是其[dynasty|e]中有效的女性[character|e]"
 noble_marriage.4.title: "與[male_target.GetDynasty.GetNameWithNoTooltip]家族建立更緊密關係"
 noble_marriage.4.desc: "為了將他們的家族與[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]聯繫在一起，[male_target.GetDynasty.GetDynastyHead.GetName]提議讓自己迎娶[female_target.GetName]。"
 noble_marriage.4.a: "這對[ROOT.GetCountry.GetLongNameWithNoTooltip]有利！"
 noble_marriage.4.b: "這是侮辱！"