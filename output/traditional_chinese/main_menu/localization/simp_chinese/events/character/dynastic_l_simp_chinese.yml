l_simp_chinese:
 dynastic.1.title: "肉慾之罪"
 dynastic.1.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]發現[ruler_char.GetHerselfHimself]被某位[devil_char.GetName]迷得神魂顛倒；其身影白日縈繞於[ROOT.GetCountry.GetGovernment.GetAdjective]廳堂，夜晚則徘徊在[ROOT.GetCountry.GetGovernment.GetRulerTitle]的夢中。這份誘惑已讓[ruler_char.GetHerHim]幾乎難以承受，但最終，唯有命運能決定[ruler_char.GetShortName]是否會在本週日為不僅止於念想的罪行尋求寬恕。"
 dynastic.1.a: "新[ROOT.GetCountry.GetGovernment.GetHeirTitle]的需求，優先於赦罪的需求。"
 dynastic.1.b: "她所走的是魔鬼之路。"
 dynastic.2.title: "深受愛戴的[ROOT.GetCountry.GetGovernment.GetHeirTitle]逝世"
 dynastic.2.desc: "一場怪異的熱病奪走了[ROOT.GetCountry.GetGovernment.GetRulerTitle]摯愛的[ROOT.GetCountry.GetGovernment.GetHeirTitle]的生命。當[ROOT.GetCountry.GetGovernment.GetCourtTitle]褪去華服，換上更深沉的黑衣時，所有人都猛然意識到生命竟是如此脆弱而短暫。"
 dynastic.2.a: "人必須在主的懷抱中尋得慰藉。"
 dynastic.3.title: "宮廷政變"
 dynastic.3.desc: "[heir_char.GetShortName]的劍自鞘中掃出，劍尖如今直指[ROOT.GetCountry.GetGovernment.GetRulerTitle]。終於對[heir_char.GetSheHe]認為長久以來治理失當的王座採取[heir_char.GetHerHis]行動後，[heir_char.GetShortNameWithNoTooltip]緊張地望向[heir_char.GetHerHis]的共謀者。與此同時，一股異樣的疲憊感席捲[ROOT.GetCountry.GetGovernment.GetRulerTitle]全身；其明白這場危機不可能有毫無痛苦的解法。"
 dynastic.3.a: "[ruler_char.GetShortNameWithNoTooltip]確實覺得自己相當年邁了。"
 dynastic.3.b: "[heir_char.GetShortNameWithNoTooltip]，那個被寵壞的小混蛋！"
 dynastic.4.title: "悲泣之歌"
 dynastic.4.desc: "戰爭讓[ROOT.GetCountry.GetFlavorRank]的母親與妻子們付出了沉重代價。當[ROOT.GetCountry.GetGovernment.GetRulerTitle]與[ROOT.GetCountry.GetGovernment.GetHeirTitle]經過一名衣衫襤褸的老寡婦身旁時，她正坐在那裡，臉深深埋入合攏的雙手之中，[ROOT.GetCountry.GetGovernment.GetHeirTitle]於是問道：為何所有女人都在哭泣。"
 dynastic.4.a: "她們都在為自己的男人哭泣。"
 dynastic.4.b: "她們只是哭哭而已。"
 dynastic.5.title: "寂靜之春"
 dynastic.5.desc: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]望著她靜靜躺在[ruler_char.GetHerHim]面前，發現她的美貌在整個[ROOT.GetCountry.GetName]乃至更遠的國度中都無人能及。[ruler_char.GetSheHe|U]一言不發。春意瀰漫在空氣中，當[ruler_char.GetSheHe]向她俯身靠近時，她那令人迷醉的香水氣息幾乎痛楚地縈繞在鼻端，而一個念頭掠過[ruler_char.GetHerHis]心頭。"
 dynastic.5.a: "讓[young_female.GetNameWithNoTooltip]成為[ROOT.GetCountry.GetGovernment.GetConsortTitle]。"
 dynastic.5.b: "或是一枚談判籌碼？"
 dynastic.5.c: "春天從不長久……"
 dynastic.6.title: "晚宴聚會"
 dynastic_lires: "里拉琴"
 dynastic_violins: "小提琴"
 dynastic.6.desc: "枝形吊燈在[ROOT.GetCountry.GetGovernment.GetAdjective]宮殿宏偉的舞廳中灑下交錯的光影，百把起舞的[ROOT.GetCountry.Custom('GetContemporaryStringedInstrumentPlural')]樂聲充滿空氣。外國賓客與本地顯貴以歡騰迎接[ruler_char.GetHerHim]。四處皆是交談、笑聲、議論，以及生命呼吸而脈動的節奏。[ROOT.GetCountry.GetGovernment.GetRulerTitle]的目光掃過雲集的人群，思索著今晚[ruler_char.GetSheHe]該與誰攀談。"
 dynastic.6.a: "用童年故事取悅一位女士。"
 dynastic.6.b: "用童年故事取悅一位勳貴。"
 dynastic.6.c: "與所有人攀談。"
 other_sons: "其他兒子的數量"
 dynastic.6001.title: "我們行動的後果"
 dynastic.6001.desc: "看來[ruler_char.GetName]近來享受的狂歡並非毫無後果，因為[ruler_char.GetHerHis]與[hookup_char.GetName]的一場邂逅導致了一名孩子的誕生。如今問題在於，[ROOT.GetCountry.GetGovernment.GetCourtTitle]將如何接納[target_child.GetName]。"
 dynastic.6001.a: "現在所有人都知道這場失足了。"
 dynastic.6001.b: "這顯然是[ROOT.GetCountry.GetGovernment.GetConsort.GetNameWithNoTooltip]的[target_child.GetDaughterSon]。"
 dynastic.6001.c: "我們又能怎麼辦呢？"
 dynastic.7.title: "[target_child.GetNameWithNoTooltip|U]染病"
 dynastic.7.desc: "[target_child.GetName|U]呼吸沉重。[target_child.GetHeSheFormal|U]已在床上躺了三天，而[target_child.GetHerHis]額頭汗珠中映出的，是[target_child.GetHerHis]侍從眼中對[target_child.GetHerHis]生命的恐懼。若不採取行動，[target_child.GetShortNameWithNoTooltip|U]恐怕撐不過今晚。"
 dynastic.7.a: "派人去請受過訓練的醫師。"
 dynastic.7.b: "帶來一位受訓於[target_location.GetNameWithNoTooltip]學派的醫師。"
 dynastic.7.c: "為[target_child.GetHisHer]的生命祈禱。"
 dynastic.7.d: "[target_child.GetVariable('talisman_giver_variable').GetShortNameWithNoTooltip]的護符將拯救[target_child.GetShortNameWithNoTooltip]"
 dynastic.8.title: "蘆葦叢中的孩子"
 dynastic.8.desc: "突然，有什麼東西驚動了那頭動物，在[ROOT.GetCountry.GetGovernment.GetRulerTitle]來得及射擊之前，它早已逃得無影無蹤。[ruler_char.GetSheHe|U]環顧四周。小溪中的水面映照著完美晴日的陽光，蘆葦在微風前緩緩搖曳。那是笑聲嗎？[ruler_char.GetSheHe|U]如今才明白究竟是什麼驚動了那頭動物。蘆葦間漂浮著一只搖籃，裡面躺著一個正在發笑的小男孩。從他的笑容看來，任誰都會說他一生從未認識過恐懼。"
 dynastic.8.a: "收養他，視如[ROOT.GetCountry.GetGovernment.GetRulerTitle]親生。"
 dynastic.8.b: "那頭鹿跑去哪了？"
 dynastic.9.title: "馬上長槍比武大會"
 dynastic.9.desc: "[ROOT.GetCountry.GetName]驕傲的旗幟在風中飄揚，鍍金號角吹響四聲致敬號音，向[ROOT.GetCountry.GetFlavorRank]的馬術菁英致意。空氣中瀰漫著烤杏仁、馬匹與陰謀的氣味。[ROOT.GetCountry.GetAdjectiveWithNoTooltip]文化與軍事上的顯赫確實是極大的恩賜，而今日此地最能體現這一點。"
 dynastic.9.a: "觀看[ROOT.GetCountry.GetGovernment.GetHeir.GetShortNameWithNoTooltip]的馬上長槍比武。"
 dynastic.9.b: "吹噓[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]的藝術成就。"
 dynastic.9.c: "單純享受這一天。"
 dynastic.10.title: "狩獵事故"
 dynastic.10.desc: "[heir_char.GetHerHis|U]的遺體被人——無人知道是誰——覆上了一塊白布，如今那白布已被[heir_char.GetHerHis]流失的生命之血染紅。人們說[heir_char.GetSheHe]是在林中一片空地被[heir_char.GetHerHis]的馬發現的。我們知道他們所說的那個地方。[heir_char.GetHerHis|U]的面容平靜，幾乎安詳。廷臣們伸手觸碰。可怕的現實在所有人心中浮現。眾人所感受到的寒意，正是死亡本身。"
 dynastic_10_a_helper: "[heir_char.GetName]已經死亡"
 dynastic.10.a: "悲傷籠罩[ROOT.GetCountry.GetGovernment.GetCourtTitle]。"
 dynastic.11.title: "家族祕密？"
 dynastic.11.desc: "第一次時，[ruler_char.GetDynasty.GetName]家族並未放在心上，但當第二次、第三次發生時，人便不免開始懷疑。為何人們以為無人聽見時會發笑？經過一番調查後，答案終於從一名侍女口中得知。看來[heir_char.GetShortName]一直以極不基督徒的方式在城中四處遊蕩，而[ROOT.GetCountry.GetGovernment.GetAdjective]家族如今正逐漸成為[ROOT.GetCountry.GetCapital.GetProvince.GetContinent.GetName]的笑柄。"
 dynastic.11.a: "公開斥責[heir_char.GetHerHim]。"
 dynastic.11.b: "[ruler_char.GetDynasty.GetNameWithNoTooltip]家族不會為這等瑣事費心。"
 dynastic.12.title: "[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]之榮耀"
 dynastic.12.desc: "學者們發現了古代文獻，將[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]王朝的血統追溯至尤利烏斯·凱撒本人。這必須為我們所用。"
 dynastic.12.a: "用它來鞏固王座。"
 dynastic.12.b: "將這項知識公諸海外。"
 dynastic.13.title: "[ruler_char.GetDynasty.GetNameWithNoTooltip]家族"
 dynastic.13.desc: "在另一個國家，[ruler_char.GetDynasty.GetName]家族的另一支分脈正陷入困境。隨著他們的國家動盪不安，[other_ruler_char.GetName]如今正艱難地試圖保住權力。若我們現在不幫助[other_ruler_char.GetHerHim]，[other_ruler_char.GetHerHis]的處境可能會顯著惡化。"
 dynastic.13.a: "家族優先。"
 opinion_dynastic_helper: "幫助了我們的統治家族"
 dynastic.13.b: "為何還要再給[other_ruler_char.GetHerHim]更多東西去揮霍？"
 dynastic.14.title: "[ruler_char.GetDynasty.GetNameWithNoTooltip]家族受到動搖"
 dynastic.14.desc: "關於[ruler_char.GetName]的[target_parent.GetMotherFather]之[disputee_char.GetMotherFather]血統，似乎出現了一場誤會。看來[disputee_char.GetName]真正的父親，是來自[ROOT.GetCountry.GetCapital.GetName]的一名卑微農民。"
 dynastic.14.a: "激烈否認。"
 dynastic.14.a.nickname: "可疑者"
 dynastic.14.b: "承認事實。"
 dynastic.14.b.nickname: "虛假者"
 opinion_ignore_dynasty: "無視需要援助的家族"
 dynastic.17.title: "[ruler_char.GetDynasty.GetNameWithNoTooltip]家族"
 dynastic.17.desc: "我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]位於[dynasty_origin.GetName]的家族，在這艱難時刻向我們提供了援助。"
 dynastic.17.a: "[ruler_char.GetDynasty.GetNameWithNoTooltip]家族同舟共濟。"
 dynastic.18.title: "[ruler_char.GetDynasty.GetNameWithNoTooltip]家族"
 dynastic.18.desc: "我們[ROOT.GetCountry.GetGovernment.GetRulerTitle]的親族，[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]在[dynasty_origin.GetName]的骨肉至親，已宣布他們無意在我們困頓之時前來援助。願[ROOT.GetCountry.GetReligion.GetGodName]憐憫他們的靈魂。"
 dynastic.18.a: "分裂之家，必不能立。"
 dynastic.19.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的恐懼與厭惡"
 dynastic.19.desc: "暮光總是駭人。雲層在無月的天空中疾馳盤旋，殘酷的星辰如碎玻璃的顆粒般懸掛其上，枝形吊燈則在[ROOT.GetCountry.GetGovernment.GetAdjective]寢室中投下怪異陰影。近來，[ROOT.GetCountry.GetGovernment.GetRulerTitle]心中生出一種奇異感覺，覺得這地方有什麼不對。它的幾何似乎……並不穩固。回想起來……一切都始於[heir_char.GetName]的誕生。"
 dynastic.19.a: "主啊，[ROOT.GetCountry.GetReligion.GetGodName]，我們在天上的父！"
 dynastic.19.b: "只工作不玩耍，會讓[ruler_char.GetShortNameWithNoTooltip]變成呆孩子"
 dynastic.20.title: "發現"
 dynastic.20.desc: "當那名侍從怯生生地詢問[ROOT.GetCountry.GetGovernment.GetAdjective]城堡中一面奇怪的牆時，[ROOT.GetCountry.GetGovernment.GetRulerTitle]立刻從她的聲音中察覺有什麼不對。她的聲音裡，在表層之下，藏著某種東西。隱藏的輕蔑，以及恐懼。\n\n[ruler_char.GetSheHe|U]如今清楚地記起來了。那具身體感覺是多麼小。把它搬進潮濕的地窖，砌上磚牆。這讓[ruler_char.GetHerHim]作嘔。徹徹底底地作嘔。殺死[ruler_char.GetHerHis]的後代，並不是[ruler_char.GetSheHe]曾期待的那種宣洩。剎那間，一瞥洞見如閃光般掠過[ruler_char.GetHerHis]心頭……"
 dynastic.20.a: "[ruler_char.GetShortNameWithNoTooltip]來啦！"
 dynastic.20.b: "太可怕了。"
 dynastic.21.title: "死亡之舞"
 dynastic.21.desc: "對[ROOT.GetCountry.GetGovernment.GetRulerTitle]而言，[ROOT.GetCountry.GetGovernment.GetAdjective]寢室是一團由氣味與形體構成的旋轉迷霧，像彩色雪花般在存在與不存在之間來去。[ruler_char.GetSheHe|U]很餓。非常非常餓。彷彿[ruler_char.GetSheHe]已經數月未曾進食。俯視[ruler_char.GetHerHim]的星辰，仍懸在無月的天空中，發笑並舞蹈。它們看起來自由而狂野。那些星辰有某種特質。它們看起來如此……正確。[ruler_char.GetSheHe|U]已經徹底瘋了。"
 dynastic.21.a: "[ruler_char.GetShortNameWithNoTooltip]願用[ruler_char.GetHerHis]該死的靈魂換一杯啤酒。"
 dynastic.21.b: "才不會，連[ruler_char.GetHerHis]下巴上的一根毛都不會！"
 dynastic.23.title: "婚禮鐘聲"
 dynastic.23.desc: "[advisor_char.GetShortName]又一次打斷了談話，[advisor_char.GetHerHis]緊皺的眉頭訴說著憂心與不眠之夜的誇張故事。[advisor_char.GetSheHe]沒完沒了地談論那些『繼承人』與『穩定繼承』之類的無聊事。這間積滿灰塵的老書房，以及顧問乾澀而滿是無聊與浪費潛能氣息的聲音，反而更襯托出窗外晴朗白日的明亮。[advisor_char.GetSheHe]到底會不會停下來？沒有任何事能說服[bachelor_char.GetShortName]相信婚姻比一片晴空的承諾更可取。畢竟，在自然界中，將動物引向墳墓的第一步永遠是繁殖。"
 dynastic.23.a: "自然總會找到自己的道路。"
 dynastic.23.b: "提議在陽台上下盤西洋棋。"
 dynastic.24.title: "一項溫和的提議"
 dynastic.24.desc: "對某些類型的[bachelor_char.GetWomanMan]而言，想要置身於不可避免的婚姻束縛之外並不罕見，然而這些束縛終究不可避免。從[ROOT.GetCountry.GetGovernment.GetRulerTitle]的高位向外望去，[ruler_char.GetSheHe]看見了[ruler_char.GetHerHis]的獵物。[bachelor_char.GetCountry.GetName]的[bachelor_char.GetName]長久以來一直推遲[bachelor_char.GetHerHis]的婚事，而[bachelor_char.GetHerHis]的王座缺乏穩固的繼承。此刻或許正是兩國締結王朝紐帶的完美時機。派遣使節，嘗試讓我們自己的[bachelorette_char.GetName]嫁入這個外國的[bachelor_country.GetGovernment.GetAdjective]家族，或許符合我們的利益。"
 dynastic.24.a: "我們當然會這麼做！"
 dynastic.24.b: "我們有更重要的事要做。"
 dynastic.25.title: "異國玫瑰"
 dynastic.25.desc: "[bachelorette_country.GetName]的統治者送來了一幅畫，描繪一名年輕女孩身處[ruler_char.GetHerHis]的[bachelorette_country.GetGovernment.GetCourtTitle]之中。[bachelorette_char.GetHerHis|U]的眼眸華麗奪目，[bachelorette_char.GetHerHis]的髮絲不可思議，而[ROOT.GetCountry.GetGovernment.GetRulerTitle]的目光被那幅畫吸引，彷彿被真空吞沒。一抹狡黠的微笑浮現在顧問臉上。室內的喧囂逐漸平息。[bachelor_char.GetName]不知道[bachelor_char.GetSheHe]究竟站在那裡凝視[bachelorette_country.GetHerHis]的美貌多久。"
 opinion_dynastic_love: "兩個家族之間的愛"
 dynastic.25.a: "再沒有比她更合適的人選了。"
 opinion_dynastic_witchcraft: "稱公主為女巫"
 dynastic.25.b: "這是什麼邪惡巫術？退下！"
 dynastic.26.title: "異國荊棘"
 dynastic.26.desc: "雖然畫作的低劣品質或許能解釋其中一部分，但事實依然是，造物主在賜予這名女孩容貌時並未過於慷慨。[bachelorette_country.GetName]的[bachelorette_country.GetGovernment.GetRuler.GetName]已提出讓她結婚，而[ROOT.GetCountry.GetGovernment.GetRulerTitle]不確定自己該大笑，還是該感到受辱。話雖如此，繼承問題仍需考量。"
 opinion_dynastic_united: "聯合的王朝"
 dynastic.26.a: "毫無疑問，是位良善的[bachelorette_country.GetReligion.GetAdjectiveWithNoTooltip]女子。"
 opinion_dynastic_refused: "拒絕婚姻提議"
 dynastic.26.b: "這顯然不可行。"
 dynastic.27.title: "餘波"
 dynastic.27.desc: "[ROOT.GetCountry.GetGovernment.GetHeir.GetShortName]聲音中的怒意清晰無誤，[heir_char.GetSheHe]猛烈抨擊[ROOT.GetCountry.GetGovernment.GetRulerTitle]在我方戰時災難中所扮演的角色。沒錯，近期衝突中確實犯下了錯誤，但那些幾乎都不是[ROOT.GetCountry.GetGovernment.GetRulerTitle]的責任。況且，[ROOT.GetCountry.GetGovernment.GetHeirTitle]也曾指揮軍隊。當[heir_char.GetShortNameWithNoTooltip]終於說出[heir_char.GetHerHis]長篇怒斥的真正目的時，最終要求[ruler_char.GetName]『退位』。"
 dynastic.27.a: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]應當承擔責任"
 dynastic.27.b: "[ROOT.GetCountry.GetGovernment.GetRulerTitle]不會在[ruler_char.GetHerHis]自己的家中遭受無禮對待！"
 dynastic.28.title: "[ROOT.GetCountry.GetAdjectiveWithNoTooltip]之月"
 dynastic.28.desc: "花園沐浴在滿月清冷的光芒中。轉過一個角落便撞見這幅景象，並非[target_ruler.GetName]所預料，但它就在眼前。矗立在[target_ruler.GetHerHim]面前的，是一座紀念我方過往戰爭的紀念碑。其美不在於精緻的大理石，甚至也不在於其工藝，而在於即使多年後的今日，紀念碑上仍散落著成千上萬朵新鮮花朵。在這裡，即便別處皆已遺忘，我們過去的記憶與逝者的記憶依然存活。"
 dynastic.28.a: "願記憶永存"
 dynastic.28.b: "我們的悲傷證明了我方事業的正義。"
 
 dynastic.29.title: "繼承[target_appanage.GetNameWithNoTooltip]"
 dynastic.29.desc: "規範我們[ROOT.GetCountry.GetFlavorRank]政治的繼承法清楚明確。一旦某個[ShowSubjectTypeName('appanage')]的統治者登上我們的王座，其領地便應整合入我們之中。讓權威與土地集中於[target_ruler.GetName]之手的道路已經明朗。"
 dynastic.29.a: "很好，是時候整合他們了。"
 dynastic.29.b: "我們不要操之過急。"

 dynastic.30.title: "[target_ruler.GetNameWithNoTooltip]的升格"
 dynastic.30.desc: "在命運的正面轉折中，我們的[target_ruler.GetName]發現[target_ruler.GetHerselfHimself]已掌握我方宗主[target_overlord.GetLongName]的大權。基於我們作為[ShowSubjectTypeName('appanage')]的地位，這強烈暗示我們的[ROOT.GetCountry.GetFlavorRank]將被以外交方式整合。"
 dynastic.30.a: "一路向前，步步高升！"