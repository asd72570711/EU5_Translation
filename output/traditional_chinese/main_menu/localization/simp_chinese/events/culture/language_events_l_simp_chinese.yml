l_simp_chinese:
 language.1.title: "敵人的語言"
 language.1.desc: "由於目前與[enemy_country.GetLongName]發生衝突，我們仍在宮廷中繼續將[enemy_dialect.GetLanguage.GetName]作為首選語言，引來了一些側目。[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的顧問已建議我們為這個明顯的矛盾提出解決之道。"
 language.1.a: "推廣我國本族語言的官方使用。"
 language.1.a.subject: "我們的[subjects|E]可能會選擇效法我們。"
 language.1.b: "採用我們的禮儀語言。"
 language.1.c: "採用[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]的[ruler_language.GetNameWithNoTooltip]語言。"
 language.1.d: "我們使用[enemy_dialect.GetNameWithNoTooltip]的歷史早於這場瑣碎爭端。"
 language.1.e: "我們應繼續以經文之語統治。"

 language.2.title: "$language.1.title$"
 language.2.desc: "[overlord.GetLongName]在其宮廷中繼續將[enemy_dialect.GetName]作為首選語言，因目前與[enemy_country.GetLongName]的衝突而引發爭議。\n\n作為解決之道，他們轉而決定採用[new_language.GetName]作為宮廷語言。我們是否也該效法？"
 language.2.a: "我們也應推廣本族[common_dialect.GetNameWithNoTooltip]語言的官方使用。"
 language.2.b: "我們也應採用[new_language.GetNameWithNoTooltip]。"
 language.2.c: "不，但我們也該自行採用[common_dialect.GetNameWithNoTooltip]語。"
 language.2.d: "不，[enemy_dialect.GetNameWithNoTooltip]沒有任何問題。"

 language.10.title: "[country.GetGovernment.GetRulerTitle|U]的言語"
 language.10.desc: "又一場議會會議，又一份官方文件，而[ruler.GetShortName]顯然無法在宮廷中妥善應對[ruler.GetHerselfHimself]。\n\n由於[ruler.GetHisHer][ruler_culture.GetName]成長背景，[ruler.GetHisHer]對[court_language.GetName]的掌握遠遠不夠。[ruler.GetHisHer|U]明顯的外國口音令本族耳朵難以忍受，也不斷提醒眾人：[ruler.GetSheHe]其實並非真正適合掌管一個[court_language.GetNameWithNoTooltip]宮廷的人。"
 language.10.a: "我們應採用[ruler.GetHisHer][ruler_language.GetNameWithNoTooltip]語言。"
 language.10.b: "[ruler.GetHisHer|U]理解不足或許反而有益。"

 language.20.title: "[common_language.GetNameWithNoTooltip]訴答法令"
 language.20.desc: "普通[primary_culture.GetName]百姓被迫以[court_language.GetName]接受法律審判，而那是一種他們並不理解的語言。\n\n要求司法制度採用通行[common_language.GetNameWithNoTooltip]的呼聲日益高漲，如此訴狀與判決便能被更廣泛理解。"
 language.20.desc_ENG: "自1066年諾曼征服以來，普通[primary_culture.GetName]百姓便被迫以[court_language.GetName]接受法律審判，而那是一種他們並不理解的語言。\n\n要求司法制度採用通行[common_language.GetNameWithNoTooltip]的呼聲日益高漲，如此訴狀與判決便能被更廣泛理解。"
 language.20.desc_IRE: "數代以前的威爾斯諾曼征服將[court_language.GetName]語言帶到[ireland_region.GetName]，但在[ROOT.GetCountry.GetLongName]，[norman_culture.GetName]的直接影響此後已經衰退。如今[primary_culture.GetName]地方法官佔據城堡並建設城鎮。\n\n然而，普通百姓仍被迫以[court_language.GetNameWithNoTooltip]接受法律審判，而那是一種他們並不理解的語言。\n\n要求司法制度採用通行[common_language.GetNameWithNoTooltip]的呼聲日益高漲，如此訴狀與判決便能被更廣泛理解。"
 language.20.a: "徹底廢除我國政府中[court_language.GetNameWithNoTooltip]的使用。"
 language.20.b: "允許[common_language.GetNameWithNoTooltip]在普通法院中使用。"
 language.20.c: "保留[court_language.GetNameWithNoTooltip]作為法律的通用語言。"