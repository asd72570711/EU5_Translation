l_simp_chinese:
 culture_japan.1.title: "御家騷動"
 culture_japan.1.desc: "近來，不同[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]家族之間的爭端日益激烈，甚至已造成死傷。若任其持續，將對政治體制的穩定構成嚴重威脅，因此必須慎重處理。\n\n這些仇爭已深植於文化之中，以至於人們開始稱其為「家中紛爭」，亦即#italic 御家騷動#!。只要沒有直接牽涉自身，人們便將這些衝突視為尋常之事，甚至某種娛樂。\n\n如今，[target_character.GetName][target_character.GetHerselfHimself]似乎也捲入其中一場爭端，而民眾正要求取下[target_character.GetHerHis]首級。"
 culture_japan.1.a: "[target_character.GetSheHe|U]早該知道後果！"
 culture_japan.1.b: "拒絕滿足他們的要求。"
 
 culture_japan.2.title: "難以駕馭的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 culture_japan.2.desc: "過去數年的太平，使許多[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]階層成員無事可做。這些閒置的雙手如今轉而剝削並壓迫當地[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]人口。我們必須處理此事。"
 culture_japan.2.a: "這只是他們保持武藝精熟的方式。"
 culture_japan.2.b: "他們將受到嚴厲懲罰。"

 culture_japan.3.title: "無嗣"
 culture_japan.3.desc: "由於[target_ruler.GetName]一直未能為我們的[ROOT.GetCountry.GetFlavorRank]提供合適的[ROOT.GetCountry.GetGovernment.GetHeirTitle]，關於國家未來走向的猜測四處蔓延。這些爭論威脅著我們的地位。[target_ruler.GetShortNameWithNoTooltip]可以收養[target_character.GetName]為[target_ruler.GetHerHis]自己的[target_character.GetDaughterSon]與[ROOT.GetCountry.GetGovernment.GetHeirTitle]，但這麼做可能被視為軟弱的象徵。"
 culture_japan.3.a: "孤寂之中亦有力量。"
 culture_japan.3.b: "收養並使[target_character.GetNameWithNoTooltip]合法化。"
 
 culture_japan.4.title: "顏面盡失"
 culture_japan.4.desc: "我們[ROOT.GetCountry.GetFlavorRank]相對不穩的局勢，使外界開始質疑我們維持國家凝聚力的能力。[target_character.GetName]的[target_character.GetHerHis]領導與整體管理能力不斷受到質疑。承認局勢已有些脫離掌控，將會重創我們的權威與影響力。"
 culture_japan.4.a: "承認情況並不理想。"
 culture_japan.4.b: "堅稱一切安好！"

 culture_japan.5.title: "獻給[target_emperor.GetGovernment.GetRulerTitle]的漆器"
 culture_japan.5.desc: "我們書房中一只美麗的漆器箱吸引了一名宮廷侍從的目光，而這件精美器物的消息也傳到了朝廷，以及[target_emperor.GetGovernment.GetRulerTitle][target_emperor_character.GetHerselfHimself]耳中。我們與[target_emperor.GetGovernment.GetRulerTitle]之間似乎已有默契：這只箱子應作為[target_emperor_character.GetHerHis]最忠誠臣民獻給[target_emperor_character.GetHerHim]的禮物。"
 culture_japan.5.a: "這只箱子自然應獻給[target_emperor_character.GetHimHerFormal]！"
 culture_japan.5.b: "不幸的是，我們負擔不起這樣的禮物。"

 culture_japan.6.title: "初釀清酒"
 culture_japan.6.desc: "本季第一批清酒已經釀成，傳統品酒儀式也只剩數週。問題在於，我們該邀請[target_boss.GetGovernment.GetRulerTitle]一同慶祝初嚐，還是應利用我們在市場上的地位，趁早出售這批酒。"
 culture_japan.6.a: "我們迫切需要[target_boss.GetGovernment.GetRulerTitle]的青睞。"
 culture_japan.6.b: "讓這批酒上市吧！"
 culture_japan.6.c: "它將成為神聖供品。"
 
 culture_japan.7.title: "卓越刀劍"
 culture_japan.7.desc: "一名新鐵匠為我軍打造了一批品質無可比擬的刀劍。我們可以用來裝備自己的軍隊，也可以趁機出售，賺取巨額利潤。這樣的刀劍在鄰國想必會供不應求……"
 culture_japan.7.a: "我軍永遠對裝備擁有優先權。"
 culture_japan.7.b: "我們最需要的是金錢！"

 culture_japan.8.title: "政變未遂！"
 culture_japan.8.desc: "看來[ROOT.GetCountry.GetLongName]的政治局勢並不像人們以為的那般穩定。[target_ruler.GetName]巡行全國時，正在[target_ruler.GetHerHis]軍隊附近的一座寺院休息，軍隊將領見機不可失，便以[target_character.GetHerHis]自己的部隊包圍寺院，宣稱「敵人就在裡面」。唯有忠誠部隊迅速果斷的行動，才及時救出[ROOT.GetCountry.GetGovernment.GetRulerTitle]並逮捕叛徒。\n\n這名將領的動機尚不明朗；[target_character.GetSheHe]可能出於復仇，也可能只是赤裸裸地渴望權力。此事重新鞏固了[target_ruler.GetShortNameWithNoTooltip]對軍隊的控制，但短暫爆發的衝突已奪走許多良士的性命；顯然，我們必須重新聚焦內部政治，以確保此事不再發生。"
 culture_japan.8.a: "如此不名譽之舉絕不可寬恕！"
 culture_japan.8.b: "野心其實應受獎賞，而非懲罰。"
 
 culture_japan.9.title: "$jap_jokamachi$的擴散"
 culture_japan.9.desc: "鄰近的[target_neighbor.GetName]已開始修築新堡壘，並在周圍形成#italic $jap_jokamachi$#!，即圍繞城堡興起的「城下町」。這些聚落由[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]居住，社會群體之間沒有分隔，也沒有固定分配，確保[ROOT.GetCountry.GetGovernment.GetRulerTitle]能嚴密控制[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]階層。\n\n其他階層，再加上自由市場與開放行會的建立，刺激了商品與貿易，進而帶來繁榮。因此，$jap_jokamachi$可能成為[ROOT.GetCountry.GetGovernment.GetRulerTitle]在軍事與經濟領域同時加強控制、並增加領地財富的手段。"
 culture_japan.9.a: "我們應鼓勵這些城下町的發展。"
 culture_japan.9.b: "我們有更重要的事要專注。"
  
 culture_japan.10.title: "城市文化興起"
 culture_japan.10.desc: "隨著城市人口增加，[ROOT.GetCountry.GetName]的人民對文化活動展現出更濃厚的興趣。因此，許多文化形式正蓬勃發展，例如歌舞伎劇場——歌唱與舞蹈的藝術；以及浮世繪——以風景、歷史故事、劇場與遊廓為題材的木版畫、木刻與繪畫。或許[ROOT.GetCountry.GetGovernment.GetCourtTitle]也該對歌舞伎或浮世繪表現出一些興趣。"
 culture_japan.10.a: "這會幫助他們更理解人民。"
 culture_japan.10.b: "他們要這些東西能有什麼用？"
 
 culture_japan.11.title: "座"
 culture_japan.11.desc: "在[ROOT.GetCountry.GetLongName]，行會，或稱#italic Za#!，始終存在；商人在其中與寺院、神社合作，以保護自己免受盜匪、[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]與軍閥侵害。隸屬這些行會的商人可以組隊旅行，更安全地運送貨物。他們也有安排能讓自己在寺院境內販售商品，從而獲得寺院本身的庇護。\n\n[ROOT.GetCountry.GetLongNameWithNoTooltip]的一些[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]認為這些好處仍然不足，於是轉向[target_character.GetName]，願意以部分利潤換取保護、若干免稅與其他正式政府利益。"
 culture_japan.11.a: "聽起來是筆很划算的交易。"
 culture_japan.11.b: "我們目前對此沒有興趣。"
 
 culture_japan.12.title: "座的權勢增長"
 culture_japan.12.desc: "[ROOT.GetCountry.GetLongName]中的貿易行會「座」正在日益壯大並更有組織，甚至已能自行保護其活動。因此，它們的影響力足以左右一般市場價格，並有壟斷若干貿易的風險。已有聲音主張採取措施限制其影響，以免我們整個經濟落入它們手中。"
 culture_japan.12.a: "削減座的特權。"
 culture_japan.12.b: "維持現狀。"
 
 culture_japan.13.title: "$jap_jokamachi$"
 culture_japan.13.desc: "在日益敵對的世界中，城堡的安全既承諾保護，也提供工作。多年來，[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]一直離開鄉間宅邸，遷往主君城堡牆下的聚落，與商人和工匠為鄰。我們的首都[target_location.GetName]也不例外，其成長已成為行政官員憂慮的來源。\n\n若想盡量降低火災與疾病等問題，可能需要新的資金來改善基礎設施。"
 culture_japan.13.a: "他們會得到所需之物。"
 culture_japan.13.b: "限制誰可以遷入[target_location.GetNameWithNoTooltip]。"

 culture_japan.14.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]遷往[target_location.GetNameWithNoTooltip]"
 culture_japan.14.desc: "隨著鄉村人口增加，每位農民所持有的土地面積也隨著每次繼承而縮小。雖然產量提高，有些農民仍無法僅靠土地維生。許多人改而遷往首都，進一步加劇[target_location.GetName]的成長陣痛。\n\n地主們正在抱怨，並懇請我們施加更多社會秩序。他們強烈建議我們執行法律，以限制人民在我們[ROOT.GetCountry.GetFlavorRank]內移動。"
 culture_japan.14.a: "下令任何人未經許可不得遷徙。"
 culture_japan.14.b: "我們無法阻止城市的成長。"

 culture_japan.15.title: "貿易壟斷"
 culture_japan.15.desc: "城市成長使我國古老的「座」貿易行會迅速壯大。我們[ROOT.GetCountry.GetFlavorRank]整體混亂的局勢，也意味著它們愈發仰賴自己的安全安排。行會如今已將寺院、地主與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]綁上自己的事業，但它們也樹立了敵人。\n\n有人懇求我們的[ROOT.GetCountry.GetGovernment.GetRulerTitle]挺身對抗行會，向有能力者開放經濟。也有人主張，我們至少應把壟斷權與特權授予行會以外的人。"
 culture_japan.15.a: "我們將廢除滋養它們的舊規章！"
 culture_japan.15.b: "壟斷很有用，但不該基於傳統授予。"
 culture_japan.15.c: "我們必須保護祖先留下的安排。"

 culture_japan.16.title: "倭寇"
 culture_japan.16.desc: "倭寇源自[ShowRegionName('japan_region')]沿岸諸多島嶼，如今已在本地區猖獗，劫掠[ShowSubContinentName('east_asia')]與[ShowRegionName('korea_region')]的海岸，也襲擊我們自己的海岸。儘管如此，與$china$貿易的困難意味著，這些海盜是我們取得[ShowCultureGroupName('chinese_group')]與[ShowCultureName('korean_culture')]商品的唯一來源。海盜襲擊日益頻繁，使我們再也不能保持被動。我們必須決定如何處理他們。"
 culture_japan.16.a: "資助海盜。"
 culture_japan.16.b: "打擊海盜。"

 culture_japan.17.title: "倭寇與八幡貿易"
 culture_japan.17.desc: "在不安定時期，這些土地上的漁民與海員常轉向海盜行徑，劫掠鄰國海岸。誠實貿易能獲得的利潤通常不及單純掠奪與襲擊，而「八幡貿易」也開始被用來指稱這些海盜襲擊。\n\n然而，時勢與權力平衡容易改變，八幡貿易又再次成為我國臣民中愈發常見的職業。一些領主甚至開始資助或親自參與襲擊。與此同時，倭寇的受害者也開始向協助終結這項威脅的人授予頭銜與榮譽。"
 culture_japan.17.a: "我們必須利用他們！"
 culture_japan.17.b: "我們必須阻止這些襲擊！"
 wako_raids: "倭寇襲擊"

 culture_japan.18.title: "對倭寇的反應"
 culture_japan.18.desc: "海盜與劫掠持續增加。參與者從普通漁民、小領主，到外國海岸居民都有。隨著時間推移，國內外的強大利益集團開始庇護成功的海盜頭目，而海盜據點似乎已遍布我們的島嶼與海岸。\n\n如今，鄰近國家開始採取嚴厲得多的行動。他們正準備迎擊襲擊者，並主動追捕海盜首領。[target_ruler.GetName][target_ruler.GetHerselfHimself]已收到外國使節明確威脅：除非我們強力行動，否則他們將把我方船隻視為敵人，並認定它們也屬於海盜。"
 culture_japan.18.a: "這與我們無關。"
 culture_japan.18.a.tt: "[trade_range|e]內所有已知[countries|e]對[ROOT.GetCountry.GetName]獲得[ShowBiasValue('opinion_pirate_supporters')|+=0][opinion|e]。"
 culture_japan.18.b: "讓我們協助保護外國。"
 culture_japan.18.b.tt: "[trade_range|e]內所有已知[countries|e]對[ROOT.GetCountry.GetName]獲得[ShowBiasValue('opinion_pirate_fighting')|+=0][opinion|e]。"

 culture_japan.19.title: "[target_location.GetNameWithNoTooltip]的海盜據點"
 culture_japan.19.desc: "[target_location.GetName]的領主以無畏海盜聞名，他們掌握的忠誠與財富賦予其巨大影響力與權力。在那裡，一名名為[target_character.GetName]、格外成功的海盜首領，建立了一座完全由[target_character.GetHerHis]遠征維持的據點。攻下這樣的堡壘代價恐怕很高，但[target_character.GetSheHe]正在嘲弄我們自己的海軍雄心。"
 culture_japan.19.a: "[target_character.GetSheHe]靠外國人的財富維生，又與我們何干？"
 culture_japan.19.b: "也許可以讓[target_character.GetSheHe]成為我國臣僕……"
 culture_japan.19.c: "我們必須從花園中拔除這些腐敗雜草！"

 culture_japan.20.title: "居所問題"
 culture_japan.20.desc: "[target_character.GetName]傳來消息，表示[target_character.GetSheHe]依照[ShowPolicyName('sankin_kotai_policy')]政策，要求我們留駐首都附近。全年住在我們位於[ROOT.GetCountry.GetCapital.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]已不可接受，我們家族必須全年居住在[target_country.GetCapital.GetName]。雖然過去有時已是如此，但這道[target_country.GetGovernment.GetAdjective]命令幾乎不容我們自行決定。[target_own_ruler.GetName]必須立刻前往[target_country.GetGovernment.GetAdjective][target_country.GetGovernment.GetCourtTitle]，否則將面臨嚴重後果。"
 culture_japan.20.a: "無論如何，就照辦吧。"
 culture_japan.20.b: "[target_country.GetLongNameWithNoTooltip]既軟弱又意志薄弱。"

 culture_japan.21.title: "新王朝崛起"
 culture_japan.21.desc: "隨著[new_ruler.GetName]掌權，舊[old_ruler.GetDynasty.GetName]的權勢已告終結。這將為我們的[ROOT.GetCountry.GetFlavorRank]揭開新時代，甚至我們的身份也可能受到質疑。歸根究柢，沒有[old_ruler.GetDynasty.GetNameWithNoTooltip]家族，我們還能被稱為[ROOT.GetCountry.GetLongName]嗎？"
 culture_japan.21.a: "新[ROOT.GetCountry.GetFlavorRank]的崛起。"
 culture_japan.21.b: "其實，[old_ruler.GetShortNameWithNoTooltip]已在[old_ruler.GetHerHis]遺囑中收養了[new_ruler.GetShortNameWithNoTooltip]。"

 culture_japan.22.title: "首級與臨陣退卻"
 culture_japan.22.desc: "為了獎賞戰功，我們的武士會展示他們斬下的敵人首級。首級越顯赫，獎賞就越高。我們世世代代都以這種方式征戰，但總有人想要鑽空子。把低階士兵甚至當地農民的首級冒充高官，展示自己實際未殺之人的首級，或任何其他詭計，都能增加表面戰功。\n\n最近，一項可疑行為似乎圍繞著[target_character.GetName]流傳：在最近一次交戰中，[target_character.GetSheHe]因已滿足於取得的首級數量，便在戰鬥結束前離開。當然，這並不罕見，許多人寧願接受較小獎賞，也不願冒生命危險，因而在滿意戰利品後離開戰場。然而，圍繞[target_character.GetNameWithNoTooltip]的傳聞指稱[target_character.GetHerHim]是出於畏懼敵人才這麼做，而非滿足於取得首級，甚至還質疑那些首級與[target_character.GetHerHim]戰功的真偽。"
 culture_japan.22.a: "臨陣脫逃，何等羞恥！"
 culture_japan.22.b: "[target_character.GetNameWithNoTooltip]是有榮譽的[target_character.GetWomanMan]。"

 culture_japan.1000.title: "檢地"
 culture_japan.1000.desc: "在經歷動盪時期後，我們對[GetUniqueInternationalOrganization('japanese_shogunate').GetName]的權威並不如理想般穩固。為補救此事，我們可以組織全國檢地，清查各氏族所有人口與資源，以及其內部關係與同盟。這將讓我們在必要時重新分配土地與頭銜，使各氏族彼此更為均衡，並全都服從於我們。當然，這項事業代價高昂，也不會受到他們歡迎。"
 culture_japan.1000.a: "這絕對必要。"
 culture_japan.1000.a.tt: "[GetUniqueInternationalOrganization('japanese_shogunate').GetName]的所有[members|e]都會對此作出反應。"
 culture_japan.1000.b: "不要去捅馬蜂窩。"

 culture_japan.1001.title: "$culture_japan.1000.title$"
 culture_japan.1001.desc: "為了提升[target_ruler.GetHerHis]對[GetUniqueInternationalOrganization('japanese_shogunate').GetName]的權威，[target_ruler.GetName]正在進行全國性檢地。這包括丈量並統計所有人口、資源與所有權關係，再依[target_ruler.GetHerHis]構想加以重塑。這本是[target_ruler.GetHerHis]職務的一部分，卻被用來顛覆長久以來的權力關係。\n\n今日，輪到[ROOT.GetCountry.GetLongName]接受這樣的檢地。[target_country.GetGovernment.GetAdjective]行政機構的使節已來到我們面前，帶來一項宣告：授予附庸的封地終究屬於國家，附庸只是暫時受託持有土地。"
 culture_japan.1001.a: "沒有人能碰我徵稅的權利！"
 culture_japan.1001.b: "歡迎[target_country.GetGovernment.GetAdjective]行政官員。"

 culture_japan.1100.title: "任命至[target_shogunate.GetGovernment.GetAdjective]官職"
 culture_japan.1100.desc: "我們有許多氏族服務於我們的[ROOT.GetCountry.GetFlavorRank]。其領袖皆懷抱野心，不斷彼此爭權奪利。然而，服務我們仍是他們的職責，有些人履行得比其他人更勤勉。目前我國行政機構有一個空缺，我們可以將此頭銜授予某個氏族，既給予其巨大榮譽，也使其更緊密地綁定於我方利益。甚至能藉此限制其影響力。"
 culture_japan.1100.a: "讓我們將它授予[target_clan_1.GetLongNameWithNoTooltip]。"
 culture_japan.1100.b: "[target_clan_2.GetLongNameWithNoTooltip]會做得很好。"
 culture_japan.1100.c: "最好把[target_clan_3.GetLongNameWithNoTooltip]留在身邊。"
 culture_japan.1100.d: "沒有必要讓氏族牽涉其中。"

 culture_japan.1101.title: "$culture_japan.1100.title$"
 culture_japan.1101.desc: "[target_shogunate.GetLongName]傳來消息，表示[target_ruler.GetName]預計將出任[target_shogunate.GetGovernment.GetAdjective]官員。鑑於這項要求的誠意，拒絕已不在考慮之列，甚至可能被視為公然叛逆與不名譽。這顯然也是為[ROOT.GetCountry.GetFlavorRank]取得威望與影響力的途徑，但這是一項危險的榮譽。[target_shogunate.GetFlavorRank]近來撤換官員的速度令人不安。他們不再滿足於讓支持者與忠誠家臣擔任高位，如今會罷免那些未能達成[target_shogunate.GetGovernment.GetRulerTitle]期望成果的人。對某些人來說，這是任人唯賢；但對眾多[target_shogunate.GetGovernment.GetAdjective]官員而言，這意味著持續害怕審查。"
 culture_japan.1101.a: "我們必須服務[target_shogunate.GetGovernment.GetRulerTitle]。"
 culture_japan.1101.a.tt: "[target_shogunate.GetName]可能會利用此事限制我們的影響力並削減我們的領地"
 culture_japan.1101.b: "我們不能參與這場鬧劇，拒絕任命。"
 culture_japan.1101.b.tt: "[target_shogunate.GetName]可能不會對此感到高興"

 culture_japan.1102.title: "[target_clan.GetLongNameWithNoTooltip]接受任職"
 culture_japan.1102.desc: "[target_clan.GetLongName]的[target_ruler.GetName]已恪盡職責地接受[target_ruler.GetHerHis]任命，成為我們新的[ROOT.GetCountry.GetGovernment.GetAdjective]官員。藉此，[target_ruler.GetSheHe]證明了[target_ruler.GetHerHis]對我們的忠誠，也證明了[target_ruler.GetHerHis]的誠信與榮譽。如今我們能將[target_ruler.GetHerHim]留在身邊，並控制[target_clan.GetLongNameWithNoTooltip]的影響力。"
 culture_japan.1102.a: "限制該氏族的行動。"
 culture_japan.1102.b: "要求他們以部分土地作為補償。"
 culture_japan.1102.b.tt: "這可能會激怒他們，並給予他們針對我們的[casus_belli|e]"
 culture_japan.1102.c: "他們將忠實地服務我們。"

 culture_japan.1103.title: "越權行事"
 culture_japan.1103.desc: "[target_shogunate.GetLongName]已越過其權限，藉由近期任命[target_ruler.GetName]為[target_shogunate.GetGovernment.GetAdjective]官員的藉口，奪走部分本應屬於我們的領土。這是不可容忍的冒犯，我們應準備回應。"
 culture_japan.1103.a: "必要時我們將以武力捍衛利益！"
 culture_japan.1103.b: "[target_shogun.GetNameWithNoTooltip]終究是[target_shogunate.GetGovernment.GetRulerTitle]。"

 culture_japan.1104.title: "[target_clan.GetLongNameWithNoTooltip]拒絕服務！"
 culture_japan.1104.desc: "我們的家臣，[target_clan.GetLongName]的[target_ruler.GetName]拒絕接受[ROOT.GetCountry.GetGovernment.GetAdjective]召命，不願在我國行政體系中任職。雖然提出了軟弱的藉口，但這顯然是在挑戰我們的權威。"
 culture_japan.1104.a: "那我們只好另尋他人。"
 culture_japan.1104.b: "此事不可容忍，我們必須懲罰[target_clan.GetNameWithNoTooltip]！"

 culture_japan.1105.title: "[target_shogun.GetNameWithNoTooltip]退讓"
 culture_japan.1105.desc: "[target_shogun.GetName]同意撤回服務要求，證明[target_shogun.GetHerselfHimself]正如我們所疑般軟弱。[target_shogun.GetSheHe|U]已下令將我們拒絕的職位交給其他人，但[target_shogun.GetHerHis]權威已嚴重受損，所有人都看得見我們拒絕所造成的效果。"
 culture_japan.1105.a: "讓所有人都看見[target_shogun.GetNameWithNoTooltip]的軟弱！"

 culture_japan.1106.title: "[target_shogunate.GetFlavorRank]並不高興"
 culture_japan.1106.desc: "我們拒絕服務[target_shogunate.GetLongName]並未受到[target_shogunate.GetGovernment.GetAdjective][target_shogunate.GetGovernment.GetCourtTitle]善意看待，他們不僅表達失望，也對我們的決定表示憤怒。若不久後[target_shogunate.GetGovernment.GetAdjective]軍隊敲響我們的大門，也不足為奇。"
 culture_japan.1106.a: "這並不理想。"

 culture_japan.1200.title: "[target_shogunate.GetLongNameWithNoTooltip]權力衰退"
 culture_japan.1200.desc: "在這些艱難時日，我們[ROOT.GetCountry.GetFlavorRank]的權威正受到威脅。我們的名號不再如應有般令人敬重，命令也常遭反對或乾脆被忽視。正是在這種時候，我們必須依靠忠誠支持我們的氏族，讓他們履行職責並前來援助。然而，他們可能會想要一些回報。"
 culture_japan.1200.a: "請求[target_clan_1.GetLongNameWithNoTooltip]協助。"
 culture_japan.1200.b: "仰賴[target_clan_2.GetLongNameWithNoTooltip]。"
 culture_japan.1200.c: "[target_clan_3.GetLongNameWithNoTooltip]想必會幫助我們。"
 culture_japan.1200.d: "我們會自行渡過難關。"

 culture_japan.1201.title: "$culture_japan.1200.title$"
 culture_japan.1201.desc: "[target_shogunate.GetLongName]的衰弱人人皆知，因為他們難以維持對各氏族的權威。在需要幫助之時，他們來找最忠誠的僕從——也就是我們——尋求援助。回應其請求是我們的職責，但我們甚至可以利用這個機會要求回報。"
 culture_japan.1201.a: "我們將忠實履行職責！"
 culture_japan.1201.b: "也許我們可以被說服。"
 culture_japan.1201.c: "我們自己的問題更重要。"
 culture_japan.1201.c.tt: "他們不會喜歡這樣，並可能獲得針對我們的[casus_belli|e]"

 culture_japan.1202.title: "[target_clan.GetLongNameWithNoTooltip]前來支援我們"
 culture_japan.1202.desc: "[target_clan.GetLongName]已恪盡職責回應召命，在我們有需要時前來援助。多虧他們的幫助，我們的權威將略有恢復，其餘氏族也必定會更加尊重我們的話語。"
 culture_japan.1202.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 culture_japan.1203.title: "[target_clan.GetLongNameWithNoTooltip]要求補償"
 culture_japan.1203.desc: "卑劣的[target_clan.GetName]竟敢因履行前來援助我們的職責而要求補償。即使我們確實需要他們的協助，他們的義務也應是在不求回報的情況下回應召命。然而，我們在[target_location.GetName]有一些土地，或許可用來說服他們。"
 culture_japan.1203.a: "承諾給予他們[target_location.GetNameWithNoTooltip]的權利。"
 culture_japan.1203.tt: "若他們接受，我們將在[target_location.GetName]為他們建造一座[ShowBuildingTypeName('yamashiro')]"
 culture_japan.1203.b: "他們會來，否則後果自負。"
 culture_japan.1203.c: "無妨，反正我們也不需要他們。"

 culture_japan.1204.title: "[target_location.GetNameWithNoTooltip]的權利"
 culture_japan.1204.desc: "[target_shogunate.GetLongName]又派來一名使者，試圖說服我們前去援助他們。這一次，他們提出將[target_location.GetName]土地的權利授予我們，企圖以此爭取我們的好感。"
 culture_japan.1204.a: "接受禮物，並派出援助。"
 culture_japan.1204.b: "這不可接受。"

 culture_japan.1205.title: "[target_shogunate.GetFlavorRank]發出威脅"
 culture_japan.1205.desc: "[target_shogunate.GetLongNameWithNoTooltip]在傲慢中變得更加大膽，威脅我們必須履行回應召命的職責，否則便會招致其怒火。若我們不服從，他們可能以此為藉口將我們定為叛徒。"
 culture_japan.1205.a: "很好，派人援助他們。"
 culture_japan.1205.b: "我們不會被如此輕視！"

 culture_japan.1206.title: "[target_shogunate.GetFlavorRank]退讓"
 culture_japan.1206.desc: "看來[target_shogunate.GetLongNameWithNoTooltip]的需求並不像表面那樣迫切，因為[target_shogunate.GetGovernment.GetAdjective][target_shogunate.GetGovernment.GetCourtTitle]已撤回求援請願，聲稱他們其實並不需要我們的協助。"
 culture_japan.1206.a: "[ROOT.GetCountry.Custom('common_string_ok')]"

 culture_japan.1207.title: "[target_clan.GetLongNameWithNoTooltip]拒絕援助我們"
 culture_japan.1207.desc: "[target_clan.GetLongName]公然拒絕回應我們的召命，並拒絕提供援助。他們勉強提出一些目前在自家領地過於忙碌的藉口，但我們很清楚，他們只是蔑視我們的權威，並錯誤地認為自己不受服務我們的義務束縛。"
 culture_japan.1207.a: "我們或許必須讓他們明白自己的錯誤。"
 culture_japan.1207.b: "$culture_japan.1203.c$"

 culture_japan.1300.title: "$culture_japan.1200.title$"
 culture_japan.1300.desc: "[target_shogunate.GetLongName]的權威已不如往昔，其軟弱也昭然若揭。我們可以趁其領導力衰退，迫使他們給予更多土地或特權。"
 culture_japan.1300.a: "為我們的[ROOT.GetCountry.GetFlavorRank]要求更多土地。"
 culture_japan.1300.a.tt: "我們將送出要求更多土地的請願"
 culture_japan.1300.b: "迫使他們承認我們的領導地位。"
 culture_japan.1300.c: "我們不會利用他們的軟弱。"

 culture_japan.1301.title: "[target_clan.GetNameWithNoTooltip]要求土地"
 culture_japan.1301.desc: "[target_clan.GetLongName]來到我們面前，以為我們的領導已弱到無力報復，並要求一些額外土地的權利。他們的膽大妄為前所未有，但我們的[ROOT.GetCountry.GetFlavorRank]確實不如理想般強大。也許此刻稍作寬容，能避免未來更多麻煩。"
 culture_japan.1301.a: "他們怎敢向我們提出要求？"
 culture_japan.1301.b: "以其他承諾安撫外交局面。"
 culture_japan.1301.c: "很好，給予他們[target_location.GetNameWithNoTooltip]的權利。"

 culture_japan.1302.title: "$culture_japan.1205.title$"
 culture_japan.1302.desc: "[target_shogunate.GetLongName]確實對我們近期要求更多土地的請願感到不滿。他們提醒我們，服侍他們是我們的義務，不應期待應得之外的額外回報。因此，他們不打算授予我們任何尚未享有的額外權利。"
 culture_japan.1302.a: "我們不需要遵守他們的規則。"
 culture_japan.1302.b: "看來他們或許並不像表面那樣軟弱。"

 culture_japan.1303.title: "$culture_japan.1204.title$"
 culture_japan.1303.desc: "[target_shogunate.GetLongName]已屈服於我們的壓力，並授予我們[target_location.GetName]的權利。這不僅將提升我們的權力與權威，也清楚顯示[target_shogunate.GetFlavorRank]的權威已衰落至何等地步。"
 culture_japan.1303.a: "[ROOT.GetCountry.Custom('common_string_positive')]"