l_simp_chinese:
 culture_religion_events.1.title: "[target_heir.GetNameWithNoTooltip]與[teacher.GetCulture.GetNameWithNoTooltip]人。"
 culture_religion_events.1.desc: "在[target_heir.GetHerHis]受教育期間，[target_heir.GetName]逐漸親近我國[ROOT.GetCountry.GetGovernment.GetAdjective][ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle][teacher.GetName]，不僅與[teacher.GetHerHim]建立了特殊羈絆，也與[teacher.GetShortNameWithNoTooltip]故鄉的[teacher.GetCulture.GetName]人產生了聯繫。\n\n[target_heir.GetNameWithNoTooltip]走訪我國境內[teacher.GetCulture.GetNameWithNoTooltip]社群，對我朝聲望大有助益，卻也在[ROOT.GetCountry.GetCapital.GetName]引來許多側目。[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]開始擔心，當[target_heir.GetNameWithNoTooltip]接掌我國[ROOT.GetCountry.GetFlavorRank]時，會偏袒[teacher.GetCulture.GetNameWithNoTooltip]臣民，並已開始在[ROOT.GetCountry.GetGovernment.GetCourtTitle|U]中密謀反對[target_heir.GetHerHim]與[teacher.GetNameWithNoTooltip]。他們要求我們訓誡[ROOT.GetCountry.GetGovernment.GetHeirTitle]，並保障[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]的權利。"
 culture_religion_events.1.a: "年輕的[target_heir.GetShortNameWithNoTooltip]該學會[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]習俗了。"
 culture_religion_events.1.b: "[target_heir.GetShortNameWithNoTooltip]在此事上有我們的祝福。"
 culture_religion_events.2.title: "[target_ruler.GetNameWithNoTooltip]與[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]人"
 culture_religion_events.2.desc: "[target_ruler.GetName]即位一事，在我國[ROOT.GetCountry.GetFlavorRank]中的[target_ruler.GetCulture.GetName]同情者之間大受歡迎，但許多本地[ROOT.GetCountry.GetCulture.GetName]人對他們的新[ROOT.GetCountry.GetGovernment.GetRulerTitle]仍抱有幾分不信任。在他們眼中，[target_ruler.GetSheHe]在許多方面都是一位習俗奇異、舉止異邦的[target_ruler.GetWomanMan]。"
 culture_religion_events.2.a: "他們終會學著愛戴[target_ruler.GetHimHer]。"
 culture_religion_events.2.a.tt: "所有與[target_ruler.GetNameWithNoTooltip]同屬[target_ruler.GetCulture.GetNameWithNoTooltip]文化的[countries|e]，都會獲得對我國[ShowBiasValue('opinion_ruler_of_our_culture')|+=]的[opinion|e]。"
 culture_religion_events.2.b: "安撫[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]人。"
 culture_religion_events.3.title: "[target_ruler.GetNameWithNoTooltip]的信仰"
 culture_religion_events.3.desc: "長久以來，[target_ruler.GetName]的信仰一直令我國[ROOT.GetCountry.GetFlavorRank]中領導性的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]憂心不已。然而隨著時間推移，[target_ruler.GetHerHis]的影響力使一些「新人」，甚至若干舊家族也改宗[target_ruler.GetReligion.GetAdjective]信仰。[target_ruler.GetReligion.GetAdjectiveWithNoTooltip]儀式在[ROOT.GetCountry.GetCapital.GetName]中開啟了出路，再加上[target_ruler.GetNameWithNoTooltip]崇拜活動日益可見，使該儀式在全國傳播，吸引了來自國內乃至世界其他地區的新皈依者。"
 culture_religion_events.3.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 culture_religion_events.3.a.tt: "我國每個[control|e]低於50%的地點中，十分之一非[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip][pops|e]將改信[target_ruler.GetNameWithNoTooltip]的[target_ruler.GetReligion.GetAdjectiveWithNoTooltip][religion|e]。"
 culture_religion_events.3.b: "[target_ruler.GetNameWithNoTooltip]的[target_ruler.GetReligion.GetNameWithNoTooltip]會撕裂我們的[ROOT.GetCountry.GetFlavorRank]！"
 culture_religion_events.4.title: "不良影響"
 culture_religion_events.4.desc: "許多正直的[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]早已一致認為，[target_ruler.GetName]的異端信仰正在毒害[ROOT.GetCountry.GetFlavorRank]，並使我國人民陷入危險。\n\n在[rebel_province.GetName]當地祭司的協助下，一位來自古老家族、格外虔誠的後裔已在[rebel_province.GetName]集結軍隊，如今正向首都進軍，意圖廢黜[ROOT.GetCountry.GetCapital.GetName]中那位卑劣的異端。"
 culture_religion_events.4.a: "叛徒必須死。"
 culture_religion_events.5.title: "異教[ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 culture_religion_events.5.desc: "一位公開信奉異教的[target_ruler.GetReligion.GetGroup.GetAdjective][ROOT.GetCountry.GetGovernment.GetRulerTitle]出現在[ROOT.GetCountry.GetCapital.GetName]，並未逃過我國[ROOT.GetCountry.GetFlavorRank]中[ROOT.GetCountry.GetReligion.GetAdjective]臣民的注意。在虔信者之間，這已成為普遍的不滿；而在原本已有宗教緊張的地區，衝突也因此更加頻繁。據報，當地[ROOT.GetCountry.GetGovernment.GetEstateName('clergy')]在[rebel_province.GetName]向人民煽動演說時，反覆提及「[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的腐化」，進一步煽動了局勢。到了這個地步，若不大規模動用武力，恐怕很難將他們從[rebel_province.GetName]的地位上逐出。"
 culture_religion_events.5.a: "大規模動用武力正合其宜。"
 culture_religion_events.5.b: "為了一頂王冠，改宗也是值得的！"
 culture_religion_events.6.title: "[target_ruler.GetNameWithNoTooltip]的[target_ruler.GetReligion.GetAdjectiveWithNoTooltip|U][ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 culture_religion_events.6.desc: "雖然許多人認為[target_ruler.GetName]的信仰冒犯了一切神聖之物，[target_ruler.GetSheHe]卻已將[target_ruler.GetHerHis][ROOT.GetCountry.GetGovernment.GetCourtTitle]打造為[target_ruler.GetHerHis]信仰姊妹兄弟真正的庇護所。憑藉如此建立的聯絡網，我們能接觸到許多原本永遠無法吸引的人。其中一位聯絡人[minister.GetName]如今遭到我國[ROOT.GetCountry.GetFlavorRank]統治體制中根深蒂固者的攻擊。"
 culture_religion_events.6.a: "我們需要[minister.GetHerHis|U]才能！"
 culture_religion_events.6.b: "解除[minister.GetNameWithNoTooltip]的職務。"
 culture_religion_events.7.title: "爭奪[ROOT.GetCountry.GetGovernment.GetRulerTitle]寵信"
 culture_religion_events.7.desc: "[target_ruler.GetName]將[target_ruler.GetCulture.GetName]人珍藏於[target_ruler.GetHerHis]心中，且[target_ruler.GetSheHe]說[ROOT.GetCountry.GetCulture.GetLanguage.GetName]語時帶有明顯口音，這早已不是秘密。\n\n[target_ruler.GetNameWithNoTooltip]甚至讓[target_ruler.GetHerselfHimself]身邊充滿[target_ruler.GetCulture.GetNameWithNoTooltip]顧問與廷臣，此事並未逃過我國古老[ROOT.GetCountry.GetCulture.GetName]家族的注意。[minister.GetName]是傳統[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]價值的老牌捍衛者，近來與[target_ruler.GetNameWithNoTooltip]的政策越發不合，如今正準備退出[ROOT.GetCountry.GetGovernment.GetAdjective|U] Council。"
 culture_religion_events.7.a: "我們必須設法補救此局面。"
 culture_religion_events.7.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 culture_religion_events.8.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的偏袒"
 culture_religion_events.8.desc: "[target_ruler.GetName]對[target_ruler.GetCulture.GetName]文化的明目張膽偏袒，並未逃過我國[ROOT.GetCountry.GetFlavorRank]中[ROOT.GetCountry.GetCulture.GetName]人的注意。能夠表達不滿者，正越來越普遍地採取阻撓，將他們對近期政策的不滿昭然示眾。"
 culture_religion_events.8.a: "根本沒有這種偏袒。"
 culture_religion_events.8.b: "我們必須展現一些補償姿態。"
 culture_religion_events.9.title: "海外友邦"
 culture_religion_events.9.desc: "[target_ruler.GetName]偏愛[target_ruler.GetCulture.GetName]文化與語言，在許多人看來多少有些古怪，但也為我們打開了通往更廣大[target_ruler.GetCulture.GetNameWithNoTooltip]國家共同體的大門。[target_ruler.GetNameWithNoTooltip]一直盡[target_ruler.GetSheHe]所能，與[target_ruler.GetHerHis]同胞建立更緊密的聯繫。"
 culture_religion_events.9.a: "朋友永遠不嫌多。"
 culture_religion_events.9.b: "讓我們研究[advanced_country.GetAdjectiveWithNoTooltip][advanced_country.GetFlavorRank]之道。"
 culture_religion_events.10.title: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]的陰謀"
 culture_religion_events.10.desc: "這位[minister.GetCulture.GetName]官員[minister.GetName]升任高位激怒了許多最接近[target_ruler.GetName]的人。我國若干最古老[ROOT.GetCountry.GetCulture.GetName]家族中的一些資深成員已覲見我國[ROOT.GetCountry.GetGovernment.GetRulerTitle]，要求我們解除[minister.GetShortNameWithNoTooltip]的[minister.GetHerHis]職務。"
 culture_religion_events.10.a: "我們必須聽取我國[ROOT.GetCountry.GetFlavorRank]的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]意見。"
 culture_religion_events.10.b: "荒謬！"
 culture_religion_events.11.title: "[minister.GetCulture.GetNameWithNoTooltip]人口中的支持日增"
 culture_religion_events.11.desc: "作為[minister.GetCulture.GetName]社群的領袖人物，[minister.GetName]不僅洞察深刻，其影響力也遠超[minister.GetSheHe]在[ROOT.GetCountry.GetCapital.GetName]所參與的議會。[minister.GetSheHe]善用此一事實為我們所用，大幅提升了民眾對我國[ROOT.GetCountry.GetFlavorRank]，以及統治它的[ROOT.GetCountry.GetCulture.GetName]人的支持。"
 culture_religion_events.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 culture_religion_events.12.title: "[minister.GetReligion.GetAdjectiveWithNoTooltip]大臣"
 culture_religion_events.12.desc: "[minister.GetReligion.GetAdjective]信徒懷著興趣與熱情，注視著我國[minister.GetName]的崛起。對許多人而言，[minister.GetSheHe]已成為一個證明：即使不屬於國教，也仍可能在[ROOT.GetCountry.GetAdjective]國家中出人頭地。"
 culture_religion_events.12.a: "有朝一日，你們或許都能像[minister.GetNameWithNoTooltip]一樣崛起。"
 culture_religion_events.12.a.tt: "我國信奉[minister.GetReligion.GetAdjectiveWithNoTooltip][religion|e]的[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 culture_religion_events.13.title: "身居高位的異教徒"
 culture_religion_events.13.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]長期反對我們任用異教徒擔任高位。當[minister.GetName]被任命進入我國[ROOT.GetCountry.GetGovernment.GetCabinetTitle]時，他們便大聲反對，而這些反對隨時間過去絲毫未減。國內外一些重要宗教學者如今正譴責我國[ROOT.GetCountry.GetFlavorRank]明目張膽偏袒非[ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]官員。"
 culture_religion_events.13.a: "是時候讓[minister.GetNameWithNoTooltip]離開了。"
 culture_religion_events.13.b: "我們不會屈從於渺小半吊子的要求。"
 culture_religion_events.13.b.tt: "所有我國宗教組的[countries|e]都會獲得對我國[ShowBiasValue('entertaining_heathens')|+=]的[opinion|e]。"
 entertaining_heathens: "異教傾向"
 culture_religion_events.14.title: "[ROOT.GetCountry.GetGovernment.GetCabinetTitle|U]中的[minister.GetReligion.GetAdjectiveWithNoTooltip]影響"
 culture_religion_events.14.desc: "我國[ROOT.GetCountry.GetName]中許多虔誠的[ROOT.GetCountry.GetReligion.GetAdjective]臣民，都將[minister.GetName]視為政府神學純潔性的威脅。他們擔心[target_ruler.GetName]會在[minister.GetHerHis]影響下，被說服偏袒政府中的[minister.GetReligion.GetAdjective]官員，甚至[minister.GetSheHe]可能會使[ROOT.GetCountry.GetGovernment.GetRulerTitle][target_ruler.GetHerselfHimself]偏離真正的信仰。"
 culture_religion_events.14.a: "是時候讓[minister.GetNameWithNoTooltip]離開了。"
 culture_religion_events.14.b: "荒謬。"
 culture_religion_events.18.title: "[target_religion.GetAdjectiveWithNoTooltip|U][ROOT.GetCountry.GetGovernment.GetHeirTitle]？"
 culture_religion_events.18.desc: "[target_heir.GetName]對[target_religion.GetAdjective]教義產生了濃厚興趣。作為法定繼承人，[target_heir.GetSheHe]當然應該了解我們所有臣民，但或許不該到[target_heir.GetSheHe]親自討論神學，並由[target_heir.GetHerselfHimself]主持關於[target_religion.GetName]的辯論這種程度。[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的重要成員如今已接近[target_ruler.GetName]表達憂慮。他們認為，若我們不迫使[target_heir.GetHerHim]恢復[target_heir.GetHerHis]理智，我國[ROOT.GetCountry.GetGovernment.GetHeirTitle]將不可能在高層政府中有未來。"
 culture_religion_events.18.a: "是時候與[target_heir.GetNameWithNoTooltip]談談了"
 culture_religion_events.18.b: "統治這個國家的是[ROOT.GetCountry.GetGovernment.GetRulerTitle]。"
 culture_religion_events.21.title: "信仰之問"
 culture_religion_events.21.desc: "長久以來，[target_ruler.GetName]的個人信念一直與[ROOT.GetCountry.GetName]的宗教建制不合。這已造成摩擦與衝突，[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]與重要[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]如今也經常質疑[target_ruler.GetHerHis]統治。然而，無論是在[ROOT.GetCountry.GetCapital.GetName]，還是在[ROOT.GetCountry.GetAdjectiveWithNoTooltip]鄉間，如今也有許多人因其對[target_ruler.GetReligion.GetAdjective]信仰的虔誠而支持[target_ruler.GetHerHim]。\n\n或許，是時候對[ROOT.GetCountry.GetNameWithNoTooltip]的[ROOT.GetCountry.GetFlavorRank]運作核心作出重大改變了？舊道的捍衛者當然不會自願退場，但有志者事竟成……"
 culture_religion_events.21.a: "[target_capital.GetNameWithNoTooltip]將成為[target_ruler.GetReligion.GetAdjectiveWithNoTooltip][target_capital.GetRank.GetNameWithNoTooltip]。"
 culture_religion_events.21.a.tt: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]中四分之一我國[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip][pops|e]將改信[target_ruler.GetNameWithNoTooltip]的[target_ruler.GetReligion.GetAdjectiveWithNoTooltip][religion|e]。"
 culture_religion_events.21.b: "我們絕不能冒這樣的風險。"
 culture_religion_events.22.title: "[target_ruler.GetNameWithNoTooltip]的[ROOT.GetCountry.GetGovernment.GetCourtTitle|U]"
 culture_religion_events.22.desc: "自[target_ruler.GetName]開始統治以來，[target_ruler.GetHerHis]的心向著[target_ruler.GetCulture.GetName]早已清楚可見。隨著時間推移，[ROOT.GetCountry.GetCapital.GetName]的宮殿廳堂開始迴盪著完全依照傳統[target_ruler.GetCulture.GetNameWithNoTooltip]方式舉行的歡慶聲，甚至連[ROOT.GetCountry.GetCulture.GetName][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]也開始接受[ROOT.GetCountry.GetGovernment.GetRulerTitle]那些奇特卻似乎時髦的習俗。\n\n由於這些外來習俗得到如此多支持，我國[ROOT.GetCountry.GetGovernment.GetCabinetTitle]中的許多人認為，是時候將[target_ruler.GetCulture.GetNameWithNoTooltip]文化在我國[ROOT.GetCountry.GetFlavorRank]中的特殊地位正式法制化了。"
 culture_religion_events.22.a: "時機確實已經到來。"
 culture_religion_events.22.a.tt: "[ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]中四分之一我國[ROOT.GetCountry.GetCulture.GetNameWithNoTooltip][pops|e]將採納[target_ruler.GetNameWithNoTooltip]的[target_ruler.GetCulture.GetNameWithNoTooltip][culture|e]。"
 culture_religion_events.22.b: "我們絕不能玷污祖先的遺產。"