l_simp_chinese:
 haudenosaunee.1.title: "不可饒恕的冒犯"
 haudenosaunee.1.desc: "他們在夜裡到來。月光幾乎照不亮他們的面容，火把旁的武器卻閃著明亮寒光。他們沉默而來。腳步輕柔而迅捷，如夏日微風，幾乎難以聽見。然後，沉默結束了，夜晚也結束了。\n\n他們襲擊了我們的村莊，焚燒帳篷，偷走食物，擄走俘虜。我們許多戰士立刻醒來並試圖阻止他們，但他們沒有為這場襲擊做好準備，因此許多人死於戰鬥。他們殺了我們。父親、兄弟、兒子。他們殺了我們所有人。\n只要我們還活著，願他們永不得安息。"
 haudenosaunee.1.a: "我們的心將永遠為他們的逝去而哭泣。"
 opinion_haudenosaunee_affront: "不可饒恕的冒犯"

 haudenosaunee.2.title: "哀悼戰爭"
 haudenosaunee.2.desc: "襲擊鄰近村莊、尋找俘虜以取代離我們而去之人，長久以來一直是我們族人的傳統。氏族母親們要求發動一場「哀悼戰爭」，以撫慰她們孩子近日逝去所帶來的悲痛，而接受這份合情合理的請求正是我們的責任。\n\n今夜。藍色的夜。這段夜晚之後的夜。我們的戰士已成功襲擊[target_location.GetName]，並在混亂之中設伏，俘獲了相當數量的當地人。"
 haudenosaunee.2.a: "我們應該帶走一些俘虜。"
 haudenosaunee.2.b: "只要讓他們知道，我們本可以帶走他們。"

 haudenosaunee.3.title: "新的俘虜"
 haudenosaunee.3.desc: "我們的戰士帶著先前在[target_location.GetName]突襲所得的一些俘虜歸來。他們勝利地來到[target_character.GetName]面前，將一具孩童的屍體放在[target_character.GetHerHim]眼前。有人說：「作為你損失的補償」，淚水再次浮現。"
 haudenosaunee.3.a: "拒絕他。"
 haudenosaunee.3.b: "收養他。"

 haudenosaunee.4.title: "[target_child_character.GetNameWithNoTooltip]的成長背景"
 haudenosaunee.4.desc: "[target_child_character.GetName]被從異鄉帶到[target_child_character.GetHerHis]父親身邊，彷彿只是昨日之事。那時[target_child_character.GetSheHe|U]還只是個嬰孩，但自那以後，[target_child_character.GetSheHe]已作為我國[ROOT.GetCountry.GetFlavorRank]的一員長大。[target_child_character.GetSheHe|U]幾乎不記得[target_child_character.GetHerHis][target_child_character.GetCulture.GetName]出身，但模糊的記憶依然留存，使[target_child_character.GetHerHim]想要提出疑問。"
 haudenosaunee.4.a: "[target_child_character.GetSheHe|U]是我們的一員，再也不能稱[target_child_character.GetHerselfHimself]為[target_child_character.GetCulture.GetNameWithNoTooltip]人。"
 haudenosaunee.4.b: "[target_child_character.GetSheHe|U]要麼成為我們的一員，[target_child_character.GetSheHe]要麼就死。"