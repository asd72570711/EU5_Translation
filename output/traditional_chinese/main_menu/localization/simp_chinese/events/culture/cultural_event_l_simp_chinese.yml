l_simp_chinese:
 cultural_event.1.title: "即興喜劇演出"
 cultural_event.1.desc: "聽啊，聽啊！讓潘塔隆、哈爾利奎，以及傳統義大利即興喜劇中的所有其他定型角色，登上毫無防備的民眾面前，看著人民被他們的滑稽舉止與胡鬧逗樂。一齣好喜劇能讓任何人暫時忘卻人生的悲愁與疲憊。再說，這也實在有趣！"
 cultural_event.1.a: "讓它成真！"
 cultural_event.1.b: "這些都是無謂的消遣。"
 cultural_event.2.title: "自由、平等、博愛"
 cultural_event.2.desc: "如同一支強大的火炬，將理性之光帶入舊世界與新世界最黑暗的角落，[ShowInstitutionName('enlightenment')]正席捲全球。進一步擁抱這場運動無疑會帶來科學與哲學的進步，但該運動關於人類自由與不可剝奪人權的觀念，也可能在我國激起些許反叛熱情。"
 cultural_event.2.a: "讓我們探索[ShowInstitutionNameWithNoTooltip('enlightenment')]所能提供的一切！"
 cultural_event.2.b: "不，這不值得冒動亂的風險。"
 cultural_event.3.title: "來自[GetCountry('BYZ').GetNameWithNoTooltip]的難民"
 cultural_event.3.desc: "[GetCountry('BYZ').GetName]已經陷落，羅馬帝國最後的堡壘——君士坦丁之城——也隨之失守。當基督教世界仍因震驚而動盪時，[GetCountry('BYZ').GetAdjectiveWithNoTooltip]難民湧向[ShowContinentName('europe')]的城市與宮廷，帶來古典知識的舊手稿，其中包括亞里斯多德、柏拉圖與蓋倫的論著，也帶來對[ShowLanguageName('latin_language')]與[ShowLanguageName('greek_language')]的深厚知識。 \n\n邀請這些難民來到[ROOT.GetCountry.GetName]，或許能大大助益我們在文化與科學領域的努力。"
 cultural_event.3.a: "當然，讓他們來吧！"
 cultural_event.3.b: "不，我們負擔不起他們的存在。"
 cultural_event.4.title: "$STATIC_MODIFIER_NAME_florentine_school$"
 cultural_event.4.desc: "由於我們具備相當聲望，得以支持佛羅倫斯畫派中的[ShowCultureGroupName('italian_group')]藝術家。被視為國際藝術的贊助者，必將改善人民對我們的觀感。"
 cultural_event.4.a: "當然！他們將得到我們的支持！"
 cultural_event.4.b: "不，我們已有足夠的問題。"
 cultural_event.5.title: "最後的馬上長槍比武大會"
 cultural_event.5.desc: "我們能在風中感覺到。很快，我們的騎馬菁英將只剩下值得追憶的夢，因為騎士傳統正在現代性的猛攻前消逝。世界正在改變，但此刻，最後一次，讓[ROOT.GetCountry.GetName]的騎士們馳騁吧！"
 cultural_event.5.a: "前進，奔向榮耀！"
 cultural_event.5.b: "不，我們必須適應新時代。"
 cultural_event.6.title: "授予$STATIC_MODIFIER_NAME_guild_of_st_luke$特許狀"
 cultural_event.6.desc: "以藝術家守護聖人聖路加之名創立的藝術家行會，正在[ShowSubContinentName('western_europe')]各地出現。在[ROOT.GetCountry.GetName]特許成立一個行會或許相當昂貴，但其文化效益將有目共睹。發展行會的官僚體系也將強化我們本土的官僚傳統。"
 cultural_event.6.a: "當然！他們將得到我們的支持。"
 cultural_event.6.b: "不，我們負擔不起。"
 cultural_event.7.title: "[target_location.GetNameWithNoTooltip]的繪畫黃金時代"
 cultural_event.7.desc: "[target_location.GetName]的人民近日已改信[ROOT.GetCountry.GetReligion.GetName]，同時仍保有該國深厚的人文思想與哲學潛流，這為他們與舊[ShowReligionAdjective('catholic')][ShowContinentName('europe')]既有藝術傳統與理想決裂鋪平了道路。乘著[target_location.GetNameWithNoTooltip]貿易發展所湧入財富的東風，我們或可幫助開創一個繪畫黃金時代！"
 cultural_event.7.a: "當然！我們必須支持藝術！"
 cultural_event.7.b: "不，我們已有足夠的問題。"
 cultural_event.8.title: "$STATIC_MODIFIER_NAME_diwani_script$"
 cultural_event.8.desc: "$STATIC_MODIFIER_NAME_diwani_script$是一種[ShowLanguageName('arabic_language')]書法草書體，旨在用於王家敕令。我們可以藉由以書法的和諧宣告我等詔令，以及[ROOT.GetCountry.GetReligion.GetGodName]之言，來強化我們的統治。"
 cultural_event.8.a: "照辦！"
 cultural_event.8.b: "這不值得我們關注。"
 cultural_event.9.title: "茶道"
 cultural_event.9.desc: "雖然[ShowGoodsName('tea')]已在[ShowRegionName('japan_region')]種植數百年，但某些群體正在發展更為精緻的#italic 茶之湯#!美學，也就是茶道。一半是宗教儀式，一半是文化傳統；若我們願意支持它，茶道或許能成為我國文化遺產不可或缺的一部分。"
 cultural_event.9.a: "照辦！"
 cultural_event.10.title: "支持[ShowInstitutionNameWithNoTooltip('renaissance')]哲學"
 cultural_event.10.desc: "新興哲學緊扣人類的榮光，宣揚人類成就的偉大潛能。推廣這些人文主義理想，或許能激發我國人民更大的雄心、創造力與生產力；然而如此做也可能鼓勵他們質疑我們統治的權威。"
 cultural_event.10.a: "這些哲學將得到我們的支持。"
 cultural_event.10.b: "不，我們已有足夠的問題。"
 cultural_event.11.title: "[ShowModifierWithNoTooltip('south_german_organ_tradition')]"
 cultural_event.11.desc: "來自[ShowRegionName('south_german_region')]的管風琴作曲家一直師從[ShowCultureGroupName('italian_group')]大師，並由此激發出自身獨特風格。這種新風格充滿即興前奏曲、夏康舞曲與帕薩卡利亞舞曲；若我們決定支持，它或許能成為值得珍視的音樂與文化傳統。"
 cultural_event.11.a: "當然。他們將得到我們的支持。"
 cultural_event.11.b: "不，我們已有足夠的問題。"
 cultural_event.12.title: "支持巴洛克音樂"
 cultural_event.12.desc: "我們永遠無從得知，也幾乎難以想像，有多少藝術才華因金錢太少、食物太少、關愛太少而被浪費。然而，如果我們以贊助幫助[ROOT.GetCountry.GetName]中掙扎的作曲家，他們也會反過來幫助我們。"
 cultural_event.12.a: "當然。他們將得到我們的支持。"
 cultural_event.12.b: "不，我們已有足夠的問題。"
 cultural_event.13.title: "民族史詩"
 cultural_event.13.desc: "我國人民開始講述關於[SCOPE.sCharacter('target_character').GetName]的故事與傳說。傳說稱，在[ROOT.GetCountry.GetName]最黑暗的時刻，[SCOPE.sCharacter('target_character').GetSheHe]將重返我國，將其從邪惡中拯救出來。無論這個說法是否真實，我們都可以正式採納這則神話，以鼓舞希望並為我們的統治賦予正統性。"
 cultural_event.13.a: "是的，人民需要一個好故事。"
 cultural_event.13.b: "不，我們的人民應專注於此時此地。"
 cultural_event.14.t: "資助[target_location.GetNameWithNoTooltip]的[ShowBuildingTypeNameWithNoTooltip('university')]"
 cultural_event.14.desc: "[target_location.GetName]的[ShowBuildingTypeName('university')]中日益拓展的知識景觀需要大量資金。經院哲學的興起、人文主義，以及對久已遺忘的古典文本重新燃起的渴望，都無法自行支付開銷；它們需要國庫來餵養！\n\n資產拮据的[ShowBuildingTypeNameWithNoTooltip('university')]親自提出，願意讓其最優秀的教師之一為國家效力，以換取一大筆黃金，用於推進他們的學術追求。代價高昂，但知識無價，而一位好老師也能成為優秀的[ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle]。"
 cultural_event.14.a: "飢渴的心智必須得到滋養！"
 cultural_event.14.b: "我們必須拒絕資助該機構。"