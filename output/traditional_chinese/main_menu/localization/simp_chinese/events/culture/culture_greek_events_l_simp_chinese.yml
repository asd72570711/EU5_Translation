l_simp_chinese:
 culture_greek.1.title: "與[target_character.GetNameWithNoTooltip]的爭端"
 culture_greek.1.desc: "雖然我們作為自豪的[ROOT.GetCountry.GetReligion.GetAdjective]國家的立場，對許多鄰國而言十分清楚，但我們的牧首區內部似乎仍存在一些問題。\n\n[target_character.GetName]注意到[target_character2.GetName]在[target_character2.GetHerHis]宗教職責上的疏忽。[target_character.GetSheHe|U]列舉了對[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]的不當對待、宗教儀式中的失當行為，以及對我國[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]宗教文化整體缺乏尊重。\n\n雖然許多人認為這些指控過於誇大，但人民仍很清楚[target_character2.GetNameWithNoTooltip]的疏忽，以及[target_character2.GetSheHe]如何自認[target_character2.GetHerselfHimself]凌駕於任何宗教機構之上。正因如此，我們的一些[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]公民開始認為[target_character2.GetHerHim]並不正統，也不配擁有[ROOT.GetCountry.GetGovernment.GetRulerTitle]頭銜。"
 culture_greek.1.a: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]根本不知道自己在說什麼！"
 culture_greek.1.b: "也許我們應該進一步限制[target_character2.GetNameWithNoTooltip]。"
 culture_greek.1.c: "沒有人可以質疑[target_character2.GetNameWithNoTooltip]的正統性！"
 culture_greek.1.d: "一場演說必定能平息他們的疑慮。"


 culture_greek.2.title: "牧首祝福[target_character2.GetNameWithNoTooltip]"
 culture_greek.2.desc: "[ROOT.GetCountry.GetName]的優雅與秩序，使[target_character.GetName]對[target_character2.GetName]的統治方式產生興趣。[target_character.GetSheHe]初抵[target_capital.GetName]時，便對維護[ROOT.GetCountry.GetReligion.GetName]宗教支柱所投入的細節深感印象深刻。修道院維護良好，並以[ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName]所能匯聚的財富裝飾；市民欣賞道路旁的大理石聖燈，回想逝去親人的故事，或幫助他們度過危機時刻的奇蹟。\n\n在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中，許多成員誦讀聖經，也能見到他們在彌賽亞本人的聖像前祈禱。當[target_character.GetNameWithNoTooltip]走近[target_character2.GetNameWithNoTooltip]商議政治的廳室時，乳香氣息瀰漫空中。"
 culture_greek.2.a: "牧首的祝福已是囊中之物。"
 culture_greek.2.b: "祝福還不夠。我們需要在[target_capital.GetNameWithNoTooltip]投入更多努力。"
 
 culture_greek.3.title: "[target_country.GetNameWithNoTooltip]的宗教改革"
 culture_greek.3.desc: "隨著宗教改革浪潮席捲[ShowContinentName('europe')]，像[target_character.GetName]這樣的人開始有意與[target_country.GetName]這類反對教宗制度的改革派建立外交關係。\n\n經過討論後，我們很清楚雙方確有共同敵人：他們也希望擺脫[papal_capital.GetName]腐敗之道，並重奪[target_country.GetGovernment.GetEstateName('crown_estate')]的自主權。然而，仍有一些差異是我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]無法接受的——那就是[ShowReligionName('catholic')]留在其土地上的印記。"
 culture_greek.3.a: "敵人的敵人就是朋友。"
 culture_greek.3.b: "我們不需要異端的幫助。"
 culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip]讓我們看起來像傻瓜！"

 culture_greek.4.title: "「[ShowCultureNameWithNoTooltip('greek_culture')]」問題"
 culture_greek.4.desc: "專制主義的興起，以及國家與其人民的概念，正在塑造我們當前人口的思維。過去，這類問題不會被公開思考，因為文化主要由宗教塑造。然而如今，隨著下層出身的偉大思想家出現，我們教育機構中的許多人開始提出一個問題：[ShowCultureNameWithNoTooltip('greek_culture')]究竟是什麼？\n\n有人聲稱，[ROOT.GetCountry.GetName]語言中存在的雙言現象維持了一道分界：官僚與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]在幾乎所有方面都與[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]相互分離，因為他們有完全不同的禮俗，也說著不同方言。\n\n這種情況逐漸使許多人激進化，他們呼籲改變，以彌合這道分裂並真正統一國家。"
 culture_greek.4.a: "緩慢但確實地，我們能團結人民。"
 culture_greek.4.b: "做出這類改變會動搖我們目前的權力結構。"
 culture_greek.4.c: "不存在文化差異，只有同一文化的不同變體。"
 greek_culture_greek_peasants_will_gain_satisfaction: "非[rural_locations|e]中所有屬於[ShowCultureGroupName('greek_group')][culture|e]，且為[ShowPopTypeName('peasants')]或[ShowPopTypeName('laborers')]的[pops|e]，將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"

 culture_greek.5.title: "[target_character.GetNameWithNoTooltip]的崛起"
 culture_greek.5.desc: "在[victory_location1.GetName]與[victory_location2.GetName]等地取得諸多勝利後，人民開始將[target_character.GetHerHim]尊為傑出的將軍，一位以劍擊潰[ROOT.GetCountry.GetName]之敵、為主與[target_character2.GetName]之名流敵人鮮血的人。\n\n與[ROOT.GetCountry.GetGovernment.GetCourtTitle]中許多有影響力的成員交談後，他們似乎也尊敬[target_character.GetHerHim]，並對[target_character.GetHerHis]講述的[victory_location3.GetName]之戰——最近人人都在討論的故事——深感興趣。[target_character2.GetNameWithNoTooltip]對這份名聲感到些許威脅，因為[target_character2.GetSheHe]覺得[ROOT.GetCountry.GetGovernment.GetCourtTitle]的影響力正在轉向這名將軍。不過，或許這也能用來進一步鞏固[target_character2.GetDynasty.GetName]對[ROOT.GetCountry.GetNameWithNoTooltip]的統治。"
 culture_greek.5.a: "讓我們讚頌這樣的英雄。"
 culture_greek.5.b: "我們應限制[target_character.GetShortNameWithNoTooltip]的影響力。"
 culture_greek.5.c: "讓[target_character.GetHerHim]離我們#italic 夠近#!，但盡可能遠離政治。"
 greek_culture_strategos_will_never_be_able_to_influence_politics: "透過剝奪[target_character.GetName]影響[courtiers|e]的能力，我們將確保[target_character.GetSheHe]日後不會對我們發動政變"
 greek_culture_strategos_will_never_get_the_opportunity_to_coup: "[target_character.GetName]將永遠無法獲得影響[courtiers|e]的機會，這意味著[target_character.GetSheHe]永遠無法對我們發動政變"

 culture_greek.6.title: "人民的將軍"
 culture_greek.6.desc: "當著名將軍[target_character.GetName]與[target_character.GetHerHis]親衛走過[target_capital.GetName]街頭時，人群聚集，只為親眼見證這位戰略頭腦。\n\n[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]、[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]一同高聲呼喊[target_character.GetHerHis]名字：「[target_character.GetShortNameWithNoTooltip]！」。人群中也有較低聲的耳語，說[target_character.GetSheHe]會成為一位更少腐敗、真正願意聆聽人民的統治者。這些言論的傳聞已傳至[ROOT.GetCountry.GetGovernment.GetCourtTitle]，正是此人已獲得威望的明證。"
 culture_greek.6.a: "即便是[target_character.GetHerHis]的對手，也應向這位將軍表示尊敬。"
 culture_greek.6.b: "在人們產生想法前，試著讓群眾噤聲。"
 greek_culture_all_capital_pops_gain_pop_satisfaction: "[target_capital.GetName]的所有[pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 greek_culture_prevent_coup_for_two_year: "若[target_character.GetName]正計畫政變，[target_character.GetHerHis]努力將停滯#y 2#!年"

 culture_greek.7.title: "[target_character.GetNameWithNoTooltip]的政變"
 culture_greek.7.desc: "經過數月陰謀、集結支持、削弱對手影響力並召集軍隊後，[target_character.GetName]如今已能推翻[target_character2.GetName]。\n\n相信[target_character.GetHerselfHimself]才是[ROOT.GetCountry.GetName]正統統治者，且是更仁慈也更有能力的統治者；如今[target_character.GetSheHe]已來到[ROOT.GetCountry.GetCapital.GetName]城外，要求[target_character2.GetShortName]讓出[ROOT.GetCountry.GetNameWithNoTooltip]王位。"
 culture_greek.7.a: "我們需要新的領導，才能擺脫頹敗。"
 culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip]不會如此輕易退位！"
 culture_greek.7.c: "[target_character.GetShortNameWithNoTooltip]懂什麼正統性？"
 culture_greek.7.d: "因企圖推翻我們，將[target_character.GetHerHim]放逐。"
 greek_culture_weaker_due_to_righteous_trait: "[rebels|e]將大幅削弱。"

 culture_greek.8.title: "[target_location.GetNameWithNoTooltip]的間諜"
 culture_greek.8.desc: "[target_location.GetName]的守衛最近發現一群間諜，試圖滲透[ROOT.GetCountry.GetName]最重要的秘密——例如希臘火，以及我們取得的其他技術進步；他們想將這些帶回自己的國度。\n\n雖然他們尚未供認為誰效力，但他們告訴我們，自己已被派駐此地數月，從旅店到旅店、從教堂到教堂，試圖尋找任何能挖掘我們秘密的線索。也許這些間諜有比在地牢裡腐爛、盼望主人得知其下場更好的用途。也許他們可以服務於我們。"
 culture_greek.8.a: "那些間諜對我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]更有用。"
 culture_greek.8.b: "讓他們腐爛，並揭發其他滲透[target_location.GetNameWithNoTooltip]的間諜網！"
 culture_greek.8.c: "也許他們能幫我們找出藏在[target_location.GetRank.GetNameWithNoTooltip]中的其他間諜網。"
 every_country_with_spy_network_on_us_will_lose_25_network: "所有已知在我們[target_location.GetRank.GetNameWithNoTooltip]中擁有至少#Y 15#![spy_network|e]的[country|e]，都將失去#R -25#![spy_network|e]"

 culture_greek.9.title: "[target_location.GetNameWithNoTooltip]金璽詔書"
 culture_greek.9.desc: "[ShowCultureGroupName('italian_group')]在[target_location.GetName]的[target_location.GetRank.GetName]中影響力已開始主宰當地貿易。人們只想與總部位於[ShowRegionName('italy_region')]的商人交易，導致大量財富從我們手中溜走，因為我們無法適當利用這些財富。然而，這些做法也確有好處，主要是讓國家得以出售財富，儘管價格並不理想。但這類交易也可能導致[target_character.GetName]的權威衰退，或許使我們更加依賴這些[ShowCultureGroupNameWithNoTooltip('italian_group')]商人。"
 culture_greek.9.a: "只要能帶來財富，就讓他們享有更多特權。"
 culture_greek.9.b: "若他們想帶走這座[target_location.GetRank.GetNameWithNoTooltip]的財富，就必須支付額外費用。"
 culture_greek.9.c: "讓我們給他們一些特權——但不要帶來真正好處。"
 culture_greek.9.d: "若要為保護他們起草法律，我們需要有效率地進行。"
 all_italian_pops_become_happier: "所有[ShowCultureGroupName('italian_group')][ShowPopTypeName('burghers')][pops|e]將獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]"
 all_italian_pops_become_angrier: "所有[ShowCultureGroupName('italian_group')][ShowPopTypeName('burghers')][pops|e]將失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"

 culture_greek.10.title: "[target_location.GetNameWithNoTooltip]的新世代"
 culture_greek.10.desc: "隨著現行官僚體系根深蒂固，管理者中的腐敗也日益嚴重，許多傑出的年輕學生開始出現，希望以更進步的方法取代舊派過時手段，根除這種腐敗。這些新人之一是[target_character.GetName]，一名[target_estate.GetName]成員，出生於[target_location2.GetName]的普通家庭，但多年來展現出以激進手段改善我國官僚體系的能力。這些新方法承諾將目前僵化的官僚結構重塑為有利於國家與人民的體制。\n\n雖然這無疑會提升行政效率，但許多既有職位者害怕自己遭到撤換，正壓制這一新世代的聲音，甚至賄賂某些人「讓他們閉嘴」。"
 culture_greek.10.a: "這些年輕人就是未來。"
 culture_greek.10.b: "在這類事情上，我們支持舊派。"

 culture_greek.11.title: "外來語句"
 culture_greek.11.desc: "雖然羅馬語言在東方[ROOT.GetCountry.GetGovernment.GetCourtTitle]中的影響力已經衰退，但我們仍試圖維持作為自豪[ShowCultureGroupName('greek_group')]人民的身份。不過，一些[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]似乎足夠博學，能背誦[ShowLanguageName('latin_language')]語句。\n\n「Pro bono」，[target_character.GetName]對廷臣們說道。眾人困惑不已，直到[target_character.GetSheHe]解釋其來源與意義。有些人極為保守，嘲笑[target_character.GetHerHim]使用這種奇怪語言；另一些人則被激起興趣，想進一步學習[ShowLanguageNameWithNoTooltip('latin_language')]。有這樣的人在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中，便有人低聲談論採納這種言說風格，並將其融入行政體系。這算是某種回歸古羅馬傳統，試圖在[ROOT.GetCountry.GetNameWithNoTooltip]內維持羅馬之道。"
 culture_greek.11.a: "沒有理由放棄我們的[ShowCultureNameWithNoTooltip('greek_culture')]特質。"
 culture_greek.11.b: "應鼓勵[ShowLanguageName('latin_language')]言說。"
 culture_greek.11.c: "[ROOT.GetCountry.GetGovernment.GetCourtTitle]應尊重所有語言。"

 culture_greek.12.title: "腐敗一瞥"
 culture_greek.12.desc: "雖然[ROOT.GetCountry.GetName]許多重要職位都由能幹之人擔任，但體系中的某些齒輪似乎表現不佳。\n\n近期對行政體系的檢查得出相當有趣的結果：傳言稱[target_character.GetName]一直把職位分給親族、朋友，甚至能讓[target_character.GetHerHim]致富的人。當這消息傳到[ROOT.GetCountry.GetGovernment.GetCourtTitle]，更重要的是傳到[target_character2.GetName]耳中時，有些人很快將其斥為檢查官與[target_character.GetNameWithNoTooltip]之間的單純對立。\n\n也許需要更直接的干預，讓那些把行政體系視為增財之道的人明白，每個行動都有其後果。"
 culture_greek.12.a: "若清洗每一名腐敗成員，我們就不會剩下任何成員。"
 culture_greek.12.b: "[target_character.GetShortNameWithNoTooltip]做出了選擇，也將面對後果。"
 culture_greek.12.c: "所有腐敗都必須被清除！"
 culture_greek.12.d: "也許……可以做些安排。"

 culture_greek.13.title: "失敗的凱法利"
 culture_greek.13.desc: "[target_area.GetName]的凱法利自設立以來便不斷衰退。其總督居於[target_location.GetName]，卻未能達到期望，而這種失敗也被我們官僚體系中的許多人忽視。這使當地人得以逃避納稅，也讓一些貴族接管該地土地，剝削農民及其潛在財富。當這些報告傳到[target_character.GetName]的[ROOT.GetCountry.GetGovernment.GetCourtTitle]時，許多人如逐腐肉的禿鷲般建議更換總督，不是換成自己，就是換成親戚，聲稱自己更能維持地區安全。雖然這類行動看似激烈，但更換當地管理或許不是壞主意。又或者，這是我們忽視當地領導的錯，我們應派出更多資源協助他們約束不馴的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]，並要求驕傲的平民服從。"
 culture_greek.13.a: "讓我們以他人取代總督。"
 culture_greek.13.b: "正是疏忽才導致[target_area.GetNameWithNoTooltip]的失敗。讓我們支援他們。"
 culture_greek.13.c: "唯有時間能療癒這道傷口。那裡不需要新管理。"
 all_pops_in_kephale_area_lose_satisfaction: "[target_area.GetName]的所有[pops|e]將失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
 gain_extra_control_in_the_area: "我們在[target_area.GetName]擁有的每個[location|e]都將獲得[ShowNamedValue('control_mild_bonus')|+=2%][control|e]與[ShowModifier('increased_kephale_support')][modifier|e]，持續#Y 10#!年"
 lose_extra_control_in_the_area: "我們在[target_area.GetName]擁有的每個[location|e]都將失去[ShowNamedValue('control_mild_penalty')|+=2%][control|e]"

 culture_greek.14.title: "非紫室而生"
 culture_greek.14.desc: "雖然[target_character.GetName]已為[target_character.GetHerselfHimself]聲索[ROOT.GetCountry.GetName]王位，但[target_character.GetHerHim]身上缺乏威望。由於[target_character.GetNameWithNoTooltip]並非紫室而生，許多人認為這種名望不足使[ROOT.GetCountry.GetGovernment.GetCourtTitle]處於弱勢。關於這名[target_character.GetWomanMan]缺乏尊嚴的傳聞已經出現，說其更像征服者而非統治者。甚至有人開始計畫以在[target_character.GetNameWithNoTooltip]親近者眼中顯得奢華的方式「重塑」行政體系。"
 culture_greek.14.a: "應花費金錢來提升[target_character.GetNameWithNoTooltip]的地位。"
 culture_greek.14.b: "威望何時能單獨維持一個國度？"
 culture_greek.14.c: "若他們想知道什麼是尊嚴，就讓他們親身體會。"

 culture_greek.15.title: "$STATIC_MODIFIER_NAME_despot_modifier$不和"
 culture_greek.15.desc: "雖然[target_character.GetDynasty.GetName]家族始終團結於治理[ROOT.GetCountry.GetName]的共同目標，但對於該如何處理仍出現分歧。[target_character.GetName]與[target_character2.GetName]就[ROOT.GetCountry.GetGovernment.GetCourtTitle]應如何與家族運作產生爭執。[target_character.GetShortNameWithNoTooltip]希望其更貼近我們的統治，使我們更容易控制任何附屬者。[target_character2.GetShortNameWithNoTooltip]則主張相反，認為允許附屬者自主能成就更偉大的國度，讓我們在廣闊土地上維持小片影響。"
 culture_greek.15.a: "應偏向[target_character.GetShortNameWithNoTooltip]的理念。"
 culture_greek.15.b: "[target_character2.GetShortNameWithNoTooltip]的承諾似乎很誘人……"
 culture_greek.15.c: "提醒他們誰才統治[ROOT.GetCountry.GetNameWithNoTooltip]。"
 culture_greek.15.d: "也許他們都能向[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip]學習。"

 culture_greek.16.title: "[target_character.GetNameWithNoTooltip]在[ROOT.GetCountry.GetGovernment.GetCourtTitle]發言"
 culture_greek.16.desc: "[target_character.GetName]事蹟的消息已傳遍[ROOT.GetCountry.GetName]與[ROOT.GetCountry.GetCapital.GetName]。許多廷臣希望親眼見證這段刻入我國歷史的傳奇，便向[target_character.GetHerHim]送信，召[target_character.GetHerHim]前往[ROOT.GetCountry.GetGovernment.GetCourtTitle]，讓[target_character.GetHerHim]有機會與其他有影響力的成員交流。\n\n[target_character.GetHerHis]的一些對手並不喜歡這個主意，有些人相信這會讓[target_character.GetHerHim]產生想法，其中一些或許會導致[target_character.GetHerHim]想要篡奪[target_character2.GetName]的位置，並為[target_character.GetHerselfHimself]聲索[ROOT.GetCountry.GetNameWithNoTooltip]。"
 culture_greek.16.a: "我們有何資格剝奪一名[target_character.GetWomanMan]在[ROOT.GetCountry.GetGovernment.GetCourtTitle]發言的權利？"
 culture_greek.16.b: "在[ROOT.GetCountry.GetGovernment.GetCourtTitle]得到機會？我們不會允許。"

 culture_greek.17.title: "[target_location.GetNameWithNoTooltip]貿易擴張"
 culture_greek.17.desc: "我們的海事專長促成[ROOT.GetCountry.GetName]新港口與貿易路線的發展。其中一處新商埠是[target_location.GetName]，一座吸引許多[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]湧入的[target_location.GetRank.GetName]，因為他們獲得特權以進一步鞏固自身地位。\n\n當地人建立的新基礎設施吸引越來越多來自[ROOT.GetCountry.GetNameWithNoTooltip]各地的人，導致對市場、船隻與住房的需求更加龐大。這些需求傳入[target_character.GetName]耳中，已召集[ROOT.GetCountry.GetGovernment.GetCourtTitle]決定如何解決此事。"
 culture_greek.17.a: "讓我們促進[target_location.GetNameWithNoTooltip]的貿易。"
 culture_greek.17.b: "我們會幫助他們，只要他們願意欠我們人情。"
 culture_greek.17.c: "我們應共同分擔成本。"

 culture_greek.18.title: "[target_location.GetNameWithNoTooltip]的$a_akritai$怠忽職守"
 culture_greek.18.desc: "[target_location.GetName]這座邊境[target_location.GetRank.GetName]的領袖，因鬆懈日常操練而怠忽守護前線之責，因而容易遭受敵人襲擊與入侵。\n\n近期檢查讓我們對情況有更多了解：他們的指揮官似乎是裙帶關係的產物，透過家族而非才幹繼承職位。部隊也享受著[ROOT.GetCountry.GetName]給予的資金，飲酒作樂，誇耀與實際能力不符的事蹟。與其接受這種局面，冒著[target_area.GetName]邊境被突破的風險，不如在這些$a_akritai$中執行紀律。也許[target_character.GetName]應在此事上更積極。"
 culture_greek.18.a: "我們沒有多餘資金用於此事。"
 culture_greek.18.b: "保衛邊境是他們的職責，他們將被提醒這一點。"
 all_pop_in_location_lose_satisfaction: "[target_location.GetName]的所有[pops|e]將失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"

 culture_greek.19.title: "[target_location.GetNameWithNoTooltip]的$a_akritai$傳說"
 culture_greek.19.desc: "雖然許多關於$a_akritai$的故事為了廣傳[ROOT.GetCountry.GetName]的威望而有所誇大，但[target_location.GetName]那些守衛[target_area.GetName]邊境的人，也有未經粉飾的故事。他們的勤勉確保敵人被拒於門外，也使[target_character.GetName]之名在這些土地上受人尊敬。有些人懷疑這些$a_akritai$的正統性，但[ROOT.GetCountry.GetGovernment.GetCourtTitle]中也有人希望進一步援助他們，強化他們試圖建立的傳說，即便這只是為了[ROOT.GetCountry.GetNameWithNoTooltip]的利益。或許[target_character.GetNameWithNoTooltip]也能試著提供一些協助，為[target_location.GetNameWithNoTooltip]人民創造一則地方傳奇。"
 culture_greek.19.a: "若$a_akritai$的事蹟能因此傳播，我們就推廣他們的故事。"
 culture_greek.19.b: "單憑服役便足以成就千古傳說。"

 culture_greek.20.title: "[target_location.GetNameWithNoTooltip]的$a_akritai$請求援助"
 culture_greek.20.desc: "由於[ROOT.GetCountry.GetName]是遼闊的[ROOT.GetCountry.GetFlavorRank]，某些地區總難免出現疏忽。雖然這通常並非刻意為之，卻使當地人心生不滿。這種疏忽讓[target_area.GetName]人民感到受威脅，因為邊境並不如他們希望那般安全。他們已要求[target_location.GetName]的當地駐軍進一步強化努力並提高警戒，但若要妥善防備襲擊或入侵，他們也需要[ROOT.GetCountry.GetGovernment.GetCourtTitle]支持。\n\n他們的使者抵達[target_capital.GetName]，尋求與[target_character.GetName]覲見。他們請求我們派出資金，以資助[target_location.GetNameWithNoTooltip]防禦工事擴建，並派遣更多人手，或作為駐軍，或作為每日操練士兵的教官。"
 culture_greek.20.a: "我們將確保每個角落都受到保護。"
 culture_greek.20.b: "我們無法撥出這些資源。"

 culture_greek.21.title: "[target_location.GetNameWithNoTooltip]地中海貿易衰退"
 culture_greek.21.desc: "新大陸的發現帶來新貿易路線。許多新路線削弱了地中海貿易的重要性，而我們曾試圖利用這一貿易為己所用。由於已在此海域累積專長，[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]中許多人相當固執，不願放棄現有海上網絡。他們反而相信，能幫助自己的不是改變傳統，而是[ROOT.GetCountry.GetGovernment.GetCourtTitle]資助，並持續推廣其偏好的貿易中心。\n\n提出這類援助請求的中心之一，是[target_location.GetName]這座[target_location.GetRank.GetName]，它正因全球貿易路線轉移而受苦。他們請求我們提供資金，使其商人能進口新商品，創造更多商機，並可能恢復[target_location.GetNameWithNoTooltip]曾擁有的重要性。"
 culture_greek.21.a: "讓我們給予他們這些資金。"
 culture_greek.21.b: "若他們想成為成功商人，就該學會更好地管理已有資源。"
 culture_greek.21.c: "沒有什麼是精明解決不了的。"
 burghers_in_location_lose_satisfaction: "[target_location.GetName]的所有[ShowPopTypeName('burghers')][pops|e]將失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 burghers_in_location_gains_satisfaction: "[target_location.GetName]的所有[ShowPopTypeName('burghers')][pops|e]將獲得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"

 culture_greek.22.title: "[target_location.GetNameWithNoTooltip]的誕神女節慶"
 culture_greek.22.desc: "耶穌的誕生對任何虔誠[ShowReligionAdjective('orthodox')]信徒而言都是重大事件，因此許多人以祂的母親瑪利亞之名舉辦節慶；瑪利亞常被稱為#italic Theotokos#!，即誕神女。\n\n沒有哪裡的人比[target_location.GetName]人民更熱衷於這些慶祝。他們正在[target_location.GetRank.GetName]及其周邊地區舉辦節慶，希望真正休息一整天，並將喜悅傳播給所有願意加入的人。事實上，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中已有一些成員正在前往當地觀看盛況，儘管其中較為虔敬者也希望為人民豐富這個聖日。"
 culture_greek.22.a: "確實是盛大的場合。"
 culture_greek.22.b: "我們將與他們一同慶祝。"
 culture_greek.22.c: "雖然我們不共享他們的信仰，但至少可以尊重它。"
 culture_greek.22.d: "不允許任何[ShowReligionAdjectiveWithNoTooltip('orthodox')]傳統在[target_location.GetNameWithNoTooltip]傳播。"
 all_pops_in_location_gain_satisfaction: "所有[pops|e]將獲得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"
 all_orthodox_pops_in_location_lose_satisfaction: "所有[ShowReligionAdjective('orthodox')][pops|e]將失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"

 culture_greek.23.title: "[target_location.GetNameWithNoTooltip]的影響力"
 culture_greek.23.desc: "[target_location.GetName]在[ROOT.GetCountry.GetName]中的影響力正日益顯而易見，尤其是居於[target_capital.GetName]的官員們。他們相當好奇，這座位於[target_area.GetName]的[target_location.GetRank.GetName]究竟如何崛起，主要原因是[ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]以及多位[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]個人的贊助。低階官僚與富有的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]成員同樣受益於這座[target_location.GetRank.GetNameWithNoTooltip]提供的機會，而當地的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]則享受奢華生活。\n\n雖然這一切讓一些人感到滿意，但也導致該地區影響力上升，削弱[target_capital.GetName]與其他地方的權力，擾亂全國權力平衡。"
 culture_greek.23.a: "一個地方吸引新人與新財富，為何要懲罰它？"
 culture_greek.23.b: "其他城市的擔憂有其道理。也許我們應限制[target_location.GetNameWithNoTooltip]的成長。"
 all_pops_with_influential_polis_modifier_lose_satisfaction: "所有位於擁有[ShowModifier('greek_culture_influential_polis')][modifier|e]之[locations|e]的[pops|e]，將失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"
 all_pops_in_location_lose_satisfaction: "[target_location.GetName]的所有[pops|e]將失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]"

 culture_greek.24.title: "羅馬人之宣稱"
 culture_greek.24.desc: "羅馬帝國的影響仍在[ROOT.GetCountry.GetName]土地上徘徊。雖然$BYZ$頭銜並非我們可聲索之物，但人民仍將自己與舊帝國相連，聲稱[target_character.GetName]應採取更積極的方針，聲索羅馬帝國的部分土地。比起只收復其領土，[ROOT.GetCountry.GetGovernment.GetCourtTitle]中一些民粹者認為，我們應開始如傳說中的皇帝那般塑造自身。[target_capital.GetName]也應反映這種風格，採用能賦予我們必要正統性與威望的美學，使我們對舊領土提出更有力的宣稱。"
 culture_greek.24.a: "這些「羅馬人」可以忘掉他們的幻想了。"
 culture_greek.24.b: "這類行動或許有益；也許我們可以推行。"

 culture_greek.25.title: "[ShowLocationNameWithNoTooltip('mystras')]學術"
 culture_greek.25.desc: "著名的[ShowLocationName('mystras')]哲學之道，正將影響力傳遍[ShowRegionName('balkan_region')]、[ShowAreaName('west_anatolia_area')]與[ShowRegionName('italy_region')]。\n\n貧富各地皆曾有學者造訪。其中之一是位於[target_area.GetName]內的[target_location.GetName]。踏上探索遠方土地之旅的小學者在此停留，與人民分享其哲學、文化與修辭理念。許多當地人對這些理念產生興趣，尤其是希望拓展視野的受教育者。這些教學也吸引了[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]注意，而其在此事上有更極端的看法。有些人希望壓制任何看似危險的理念與教學，尤其是那些可能威脅[ROOT.GetCountry.GetNameWithNoTooltip]身份的思想；而一些地位較低者則希望允許理念傳播，因為它們為我們人民提供了學習的良機。"
 culture_greek.25.a: "他們的教學並不危險。讓他們傳播知識。"
 culture_greek.25.b: "為何要冒[target_location.GetNameWithNoTooltip]形成激進思想的風險？"
 event_will_only_fire_for_locations_within_mystras_scholarship_geography: "此[event|e]只會在[ShowScriptedGeographyName('mystras_scholarship_geography')]內的[locations|e]觸發"

 culture_greek.26.title: "新的[ROOT.GetCountry.GetAdjectiveWithNoTooltip]修辭"
 culture_greek.26.desc: "羅馬時代產生了無數作品，全都以[ShowLanguageName('latin_language')]寫成，而[ROOT.GetCountry.GetName]有些人不願學習這種語言。這使我們較具智識的學者將其翻譯為[ROOT.GetCountry.GetCommonLanguage.GetName]，也就是日常公民所說的共同語。\n\n精英已注意到此事，並對下層也能接觸到[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]多年研讀並精熟的同樣文本感到受威脅。因此，他們已在[ROOT.GetCountry.GetGovernment.GetCourtTitle]中談論此事，敦促在整個[ROOT.GetCountry.GetFlavorRank]禁止此類翻譯作品，以維持精英的完整性與威望。"
 culture_greek.26.a: "平民也有學習的權利。"
 culture_greek.26.b: "凡能維護[ROOT.GetCountry.GetAdjectiveWithNoTooltip]精英優越性之事皆可。"

 culture_greek.27.title: "[target_character.GetNameWithNoTooltip]要求凱旋式"
 culture_greek.27.desc: "[target_character.GetName]又一次帶著輝煌勝利歸來，走過[target_capital.GetName]街道時，人群為[target_character.GetHerHim]與[target_character.GetHerHis]成就喝采，身旁則環繞著一支由[target_character.GetHerHis]最忠誠士兵組成的龐大衛隊，保護[target_character.GetHerHim]免於任何傷害。\n\n抵達[ROOT.GetCountry.GetGovernment.GetCourtTitle]後，[target_character.GetSheHe]要求覲見，最終勉強獲准。無論友敵，[target_character.GetSheHe]都無視其他廷臣，而是直視[target_character2.GetName]，要求舉辦一場古式凱旋式以表彰[target_character.GetHerHis]。[target_character.GetSheHe|U]堅稱所有人都必須知道[target_character.GetHerHis]成就，以鼓舞士氣，並震懾任何膽敢以軍事方式反對[ROOT.GetCountry.GetName]者。"
 culture_greek.27.a: "凱旋式？何等吵鬧。我們拒絕這些要求。"
 culture_greek.27.b: "若這是為了[ROOT.GetCountry.GetNameWithNoTooltip]的榮耀，我們樂意舉辦。"
 greek_culture_strategos_will_not_use_triumph_for_popularity: "不為[target_character.GetName]舉辦凱旋式，將使[target_character.GetSheHe]無法為任何計畫中的政變取得進展"
 greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "為[target_character.GetName]舉辦凱旋式，將使[target_character.GetSheHe]能利用[target_character.GetHerHis]人氣加速任何政變嘗試"

 culture_greek.28.title: "學者出走"
 culture_greek.28.desc_common: "[ROOT.GetCountry.GetName]的不穩定，導致許多受教育者尋求遠離我們動盪[ROOT.GetCountry.GetFlavorRank]的更好生活。"
 culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n 他們希望過上更穩定的生活，能夠追求哲學、法律與宗教理念；不會在頃刻之間被戰爭、饑荒或死亡奪走。正因如此，許多人滿懷嚮往地談論[target_country.GetName]，一個更有威望、更穩定的[target_country.GetFlavorRank]，能給予他們渴望的安適。許多人已開始遷往[target_destination.GetName]，這讓我們[ROOT.GetCountry.GetGovernment.GetCourtTitle]中較為精緻的成員感到憂慮。他們認為這種遷徙是[ROOT.GetCountry.GetNameWithNoTooltip]威望上的傷口，因為這顯示我們無力保護那些雖無法承受當前危機，卻仍是社會寶貴成員的人。"
 culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\n 雖然沒有適合這種出走的土地，但他們談論著自己讀到的遙遠國度榮光：在[scholar_country.1.GetName]，平民如何生活奢華，與此地形成對比；[scholar_country2.GetName]的統治者如何不虐待臣民，反而尊重他們作為人的權利；以及在[scholar_country3.GetName]，維持一切運作的不是傳統，而是革新。\n\n雖然起初無害，這些聲音已傳遍我們[ROOT.GetCountry.GetFlavorRank]每個角落，造成民間動盪，令我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]深感憂慮。"
 culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 culture_greek.28.b: "讓我們阻止他們，在更多人試圖離開之前。"
 culture_greek.28.c: "他們的話語正在造成更多不穩。"
 culture_greek.28.d: "也許我們可以投入一些資金，以防止更多動亂。"
 greek_culture_migration_largely_prevented: "大部分[migration|e]將被緩解"

 culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')]請求協助"
 culture_greek.29.desc: "[target_location.GetName]人民是[ROOT.GetCountry.GetReligion.GetName]的虔誠信徒，每日向[ROOT.GetCountry.GetReligion.GetGodName]祈禱。然而，由於缺乏[ROOT.GetCountry.GetName]及其政府支持，[target_location.GetRank.GetName]當地的[ShowBuildingTypeName('orthodox_monastery')]迫切需要新的裝飾，以適當反映其神聖地位。因此，那裡的司祭已向我們的[ROOT.GetCountry.GetGovernment.GetCourtTitle]傳信，敦促[target_character.GetName]送出資金，妥善裝飾這處聖地的外部與內部。給予如此恩惠不會被忽視，將向所有人展現我們對[ROOT.GetCountry.GetFlavorRank]內任何[ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip]事業的投入。"
 culture_greek.29.a: "他們會得到用於裝飾的黃金。"
 culture_greek.29.b: "[target_character.GetNameWithNoTooltip]不該為每一處聖地都慷慨解囊。"
 culture_greek.29.c: "以[ShowReligionNameWithNoTooltip('orthodox')]之名，我們不惜任何資金。"
 all_orthodox_pops_gain_satisfaction_in_location: "所有[ShowReligionAdjective('orthodox')][pops|e]將獲得[ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%][pop_satisfaction|e]"

 culture_greek.30.title: "帝國遺產"
 culture_greek.30.desc: "東羅馬帝國之光已經熄滅。儘管如此，許多公民仍自稱羅馬人，而我們[ROOT.GetCountry.GetGovernment.GetCourtTitle]的部分成員似乎也承襲了舊帝國習俗。這反過來賦予我們一些正統性，能以其正當繼承者的名義收復這個古老國度的部分土地。[ROOT.GetCountry.GetCapital.GetName]中許多人注意到我們在[target_province.GetName]的邊界，並主張從[target_country.GetName]手中收復該地，因為他們無權自稱羅馬繼承者。軍方似乎同意這種情緒，並與[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]一同鼓動民眾開戰，奪回理應屬於[ROOT.GetCountry.GetName]之物。"
 culture_greek.30.a: "羅馬的邊界將被收復！"
 culture_greek.30.b: "沒有開戰的必要。"