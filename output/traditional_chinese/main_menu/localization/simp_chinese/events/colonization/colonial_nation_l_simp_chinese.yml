l_simp_chinese:
 colonial_nation.4.title: "自由鬥士還是叛亂者？"
 colonial_nation.4.desc: "軍中一名上校以強烈主張武裝抵抗[ROOT.GetCountry.GetDiplomacy.GetOverlord.GetLongName]而聲名鵲起。除了是一位天賦出眾的士兵外，他似乎也是一位鼓舞人心且富有魅力的領袖，越來越多人似乎開始聽從他的獨立理念。\n\n我們該將他打成叛徒與叛亂者，還是他或許正是能幫助我們擺脫殖民枷鎖，並帶領[ROOT.GetCountry.GetName]走向自由的人？"
 colonial_nation.4.a: "晉升他為將軍！"
 colonial_nation.4.b: "他必須被處決！"
 colonial_nation.5.title: "[from.GetName]的麻煩"
 colonial_nation.5.desc: "[from.GetAdjective]軍中一名上校以強烈主張武裝抵抗[ROOT.GetCountry.GetName]而聲名鵲起！除了是一位天賦出眾的士兵外，他似乎也是一位鼓舞人心且富有魅力的領袖，越來越多人似乎開始聽從他危險的獨立理念。\n\n但[from.GetName]當地當局並未立刻砍下這個新貴的腦袋，反而將他晉升為將軍！"
 colonial_nation.5.a: "他們怎敢？！"
 colonial_nation.6.title: "殖民叛軍遭處決"
 colonial_nation.6.desc: "[from.GetAdjective]軍中一名上校以強烈主張武裝抵抗[ROOT.GetCountry.GetName]而聲名鵲起！除了是一位天賦出眾的士兵外，他似乎也是一位鼓舞人心且富有魅力的領袖，越來越多人似乎開始聽從他危險的獨立理念。\n\n幸運的是，[from.GetCountry.GetGovernment.GetRulerTitle][from.GetCountry.GetGovernment.GetRuler.GetName]迅速處理了此事，砍下了那名上校的腦袋。然而，這項行動似乎在[from.GetName]激起了更強烈的自由渴望……"
 colonial_nation.6.a: "或許這是個魯莽的解決方式……"
 colonial_nation.14.title: "戰爭的負擔"
 colonial_nation.14.desc: "最近的戰爭使國家精疲力竭。或許這些負擔中的一部分應由我們的殖民地分擔？"
 colonial_nation.14.a: "提高殖民稅收！"
 colonial_nation.14.b: "我們將承擔這份負擔。"
 colonial_nation.15.title: "戰爭的負擔"
 colonial_nation.15.desc: "[from.GetName]最近的戰爭使我國精疲力竭。由於這場戰爭涉及我們的一個鄰國，[from.GetCountry.GetGovernment.GetRulerTitle][from.GetCountry.GetGovernment.GetRuler.GetName]如今決定，我們也該分擔一部分負擔！"
 colonial_nation.15.a: "無法忍受！"
 colonial_nation.182.title: "腐敗的總督"
 colonial_nation.182.desc: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName]在治理我國行政事務上的掙扎並非秘密，而我們最熟練的外交官也不得不壓下有關[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis]無能的傳聞，試圖維持殖民地和平。然而，近期腐敗增加帶來了不可避免的後果。我們的一名前行政官員公開表示，王室收到的金錢援助直接進了[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的口袋。\n\n這種在困難時期的不名譽行為，已在我國人民之間引發多起需要處理的起義。"
 colonial_nation.182.a: "這太離譜了。"
 colonial_nation.183.title: "新總督"
 colonial_nation.183.desc: "有關[ROOT.GetCountry.GetGovernment.GetRuler.GetName]低效統治的傳聞已不可避免地傳到王室耳中，引發其對這種不幸局面可能如何影響他們與我們聲譽的擔憂。在遭王室同化的威脅下，殖民地向我們提出了一項權宜協議：在為時已晚之前任命一位能接掌殖民地的新總督。 "
 colonial_nation.183.a: "我們應該接受他們的建議。"
 colonial_nation.183.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip]仍然可以統治。"
 colonial_nation.184.title: "[ROOT.GetCountry.GetNameWithNoTooltip|U]負債了！"
 colonial_nation.184.desc: "我們殖民地面臨的艱難時期似乎沒有盡頭。如今壓在我們身上的金錢債務擊垮了我國人民的精神；受家人正遭受饑荒所迫，他們要求[ROOT.GetCountry.GetGovernment.GetRuler.GetName]立即提出有效解決方案。"
 colonial_nation.184.a: "我們將運用影響力來解決此事。"
 colonial_nation.184.b: "他們的抱怨毫無根據。"
 colonial_nation.186.title: "殖民誘因"
 colonial_nation.186.desc: "我們殖民地的土地肥沃且非常適合耕作，我們的人民友善好客，行政效率已盡其所能，風中也傳唱著安寧與穩定，與都會本土的政治動盪相去甚遠。我們確實是人間天堂，但改變往往令人不悅，儘管有時也是必要的過程，而我們的人口並未高到理想程度。\n\n一名顧問建議頒行新政策，提高我們對其他信仰的寬容，以便吸引更多殖民者前來我們繁榮的土地。"
 colonial_nation.186.a: "這必定會為我們帶來更多定居者。"
 STATIC_MODIFIER_NAME_colonist_incentives: "殖民誘因"
 STATIC_MODIFIER_DESC_colonist_incentives: "一套新的特權已授予所有信仰。"
 colonial_nation.187.title: "安撫[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]"
 colonial_nation.187.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]對我方殖民地統治提出了擔憂。在過去數月中，他們的意見曾被暗示並暗中散播，但如今在許多方面已變得明確：他們的不滿清楚且令人憂慮。\n\n今天早晨，他們的一名成員甚至在[ROOT.GetCountry.GetGovernment.GetRuler.GetSheHe]出席議會前，就走近[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，並相當明白地表達了意圖，說道：「我們深切擔憂貴族寡頭以其舊世界的惡習與貪婪影響[ROOT.GetCountry.GetName]的命運。」"
 colonial_nation.187.a: "我們應該站在[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]一邊。"
 colonial_nation.187.b: "我們需要保護[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]。"
 colonial_nation.188.title: "貴族的憂慮"
 colonial_nation.188.desc: "[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]並不擅長隱藏自己的政治立場，似乎也不在乎。人們曾聽見他們在宴會與筵席上大聲宣稱，殖民地注定失敗，原因就在於[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]錯誤地掌握了權力。\n\n然而今天，他們的意圖導向了一種前所未有的手段：其中一人在黎明前的最初時刻來到[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的房間。「很抱歉打擾您的休息，我的[ROOT.GetCountry.GetGovernment.GetRulerTitle]，」他們說，「然而必須立刻採取行動。[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]的傲慢與缺乏德性，正使這座殖民地成為愚人的樂園。這必須在今天的議會開始前被阻止。」"
 colonial_nation.188.a: "我們應該站在[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]一邊。"
 colonial_nation.188.b: "我們需要保護[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]。"