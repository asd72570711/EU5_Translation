l_simp_chinese:
 conquest_of_paradise.1.title: "建築工人工資法"
 conquest_of_paradise.1.desc: "由於技術勞工短缺，而湧入該地區的新殖民者又極需他們的服務，建設成本正在上升。有人提出一項提案，要在[ROOT.GetCountry.GetName]全境為所有木匠、鋸木工、石匠與砌磚工設定最高工資。他們的工資將被限制在合理水準，而任何要求更高報酬，或為建築工程支付更高薪資的人都將受到處罰。我們該如何投票？"
 conquest_of_paradise.1.a: "投贊成票。這是個合理的主意。"
 conquest_of_paradise.1.b: "我們不需要管制那件事。"
 STATIC_MODIFIER_NAME_construction_wages: "建設工資"
 STATIC_MODIFIER_DESC_construction_wages: "為了壓低不斷上漲的價格，建築勞工的最高工資已被制定。"
 conquest_of_paradise.2.title: "殖民邊境衝突"
 conquest_of_paradise.2.desc: "來自[colonial_conflict_target.GetLongName]殖民地的定居者突破了我們的邊境！他們在尋找資源時擴張到屬於[ROOT.GetCountry.GetName]的土地，並與當地人口發生衝突。這絕不能容忍！"
 conquest_of_paradise.2.a: "派遣當地民兵驅逐他們！"
 conquest_of_paradise.2.a.tt: "不過他們可能會報復……"
 conquest_of_paradise.2.b: "讓局勢自行解決。"
 conquest_of_paradise.3.title: "殖民邊境衝突"
 conquest_of_paradise.3.desc: "為了尋找新的土地與資源，來自[ROOT.GetCountry.GetName]的定居者越過邊境進入[colonial_conflict_source.GetName]，並與當地人口發生衝突。隨後[colonial_conflict_source.GetLongName]派出民兵驅逐他們，但他們的民兵似乎做得太過火，任務退化成對[ROOT.GetCountry.GetName]的報復性襲擊。這絕不能容忍！"
 conquest_of_paradise.3.a: "也派出我們的當地民兵！"
 conquest_of_paradise.3.b: "讓局勢自行解決。"
 conquest_of_paradise.4.title: "殖民邊境衝突"
 conquest_of_paradise.4.desc: "派遣我們的民兵去驅逐來自[colonial_conflict_target.GetLongName]的競爭定居者，或許是個錯誤。受到輕易成功的鼓舞，我們的部隊得意忘形，繼續進入外國土地，襲擊那裡的邊境村莊。這極大地激怒了當地人，他們也反過來派遣民兵進入我們的土地。"
 conquest_of_paradise.4.a: "該死的傢伙！"
 conquest_of_paradise.5.title: "殖民邊境衝突"
 conquest_of_paradise.5.desc: "唉……該從何說起？看來來自[colonial_conflict_target.GetLongName]的定居者為了尋找新的土地與資源，闖入了[colonial_conflict_source.GetLongName]。[colonial_conflict_source.GetName]隨後派出民兵驅逐他們，但他們過於狂熱，追逐定居者回到[colonial_conflict_target.GetName]境內，並襲擊、焚燒那裡的聚落。當[colonial_conflict_target.GetName]派出民兵驅逐[colonial_conflict_source.GetAdjective]民兵，並自行襲擊[colonial_conflict_target.GetName]境內時，衝突進一步升級。\n\n[colonial_conflict_source.GetName]的[colonial_conflict_source.GetGovernment.GetRulerTitle]正在責怪[colonial_conflict_target.GetName]的[colonial_conflict_target.GetGovernment.GetRulerTitle]，反之亦然。我們該如何解決這場衝突，同時不失顏面？"
 conquest_of_paradise.5.a: "讓殖民地自行解決。"
 conquest_of_paradise.5.b: "斥責那些升級衝突的人！"
 conquest_of_paradise.5.c: "斥責那些挑起衝突的人！"
 conquest_of_paradise.6.title: "殖民邊境衝突"
 conquest_of_paradise.6.desc: "在[colonial_conflict_source.GetName]與[colonial_conflict_target.GetName]邊境近期發生的衝突中，[the_overlord.GetLongName]站在了[colonial_conflict_target.GetLongName]一方！[the_overlord.GetGovernment.GetRulerTitle][the_overlord.GetGovernment.GetRuler.GetName]決定將這起事件歸咎於[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，並已將[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]解職。"
 conquest_of_paradise.6.a: "那位「[the_overlord.GetGovernment.GetRulerTitle]」以為[the_overlord.GetGovernment.GetRuler.GetSheHe]是誰？"
 conquest_of_paradise.7.title: "殖民邊境衝突"
 conquest_of_paradise.7.desc: "在[colonial_conflict_source.GetName]與[colonial_conflict_target.GetName]邊境近期發生的衝突中，[the_overlord.GetLongName]站在了我們這一方！[the_overlord.GetGovernment.GetRulerTitle][the_overlord.GetGovernment.GetRuler.GetName]決定將這起事件歸咎於[colonial_conflict_target.GetGovernment.GetRulerTitle][colonial_conflict_target.GetGovernment.GetRuler.GetName]，並已將[colonial_conflict_target.GetGovernment.GetRuler.GetHerHim]解職。"
 conquest_of_paradise.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 conquest_of_paradise.8.title: "殖民邊境衝突"
 conquest_of_paradise.8.desc: "在[colonial_conflict_source.GetName]與[colonial_conflict_target.GetName]邊境近期發生的衝突中，[the_overlord.GetLongName]站在了[colonial_conflict_source.GetLongName]一方！[the_overlord.GetGovernment.GetRulerTitle][the_overlord.GetGovernment.GetRuler.GetName]決定將這起事件歸咎於[ROOT.GetCountry.GetGovernment.GetRuler.GetName]，並已將[ROOT.GetCountry.GetGovernment.GetRuler.GetHerHim]解職。"
 conquest_of_paradise.8.a: "那位「[the_overlord.GetGovernment.GetRulerTitle]」以為[the_overlord.GetGovernment.GetRuler.GetSheHe]是誰？"
 conquest_of_paradise.9.title: "殖民邊境衝突"
 conquest_of_paradise.9.desc: "在[colonial_conflict_source.GetName]與[colonial_conflict_target.GetName]邊境近期發生的衝突中，[the_overlord.GetLongName]站在了我們這一方！[the_overlord.GetGovernment.GetRulerTitle][the_overlord.GetGovernment.GetRuler.GetName]決定將這起事件歸咎於[colonial_conflict_source.GetGovernment.GetRulerTitle][colonial_conflict_source.GetGovernment.GetRuler.GetName]，並已將[colonial_conflict_source.GetGovernment.GetRuler.GetHerHim]解職。"
 conquest_of_paradise.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 conquest_of_paradise.10.title: "強化殖民民兵"
 conquest_of_paradise.10.desc: "議會提議我們撥出大量資源來強化民兵。殖民地需要更好的保護，以抵禦原住民攻擊與其他殖民地的襲擊。若我們某天發現自己與[ROOT.GetOverlord.GetName]交戰，這也將增強我們的力量。"
 conquest_of_paradise.10.a: "頒行該提案。"
 STATIC_MODIFIER_NAME_enhanced_colonial_militia: "強化殖民民兵"
 conquest_of_paradise.10.b: "不要頒行該提案。"
 conquest_of_paradise.11.title: "禁止毛皮貿易"
 conquest_of_paradise.11.desc: "[ROOT.GetCountry.GetName]的人民與原住民過於友善。有人提出提案，禁止所有與原住民的私人貿易，其中包括對任何被抓到教導原住民如何開槍的人處以死刑。這些新限制將損害原住民與我們屬民的地方經濟，但也將確保我們免受武裝原住民襲擊的安全。"
 conquest_of_paradise.11.a: "批准該提案。"
 STATIC_MODIFIER_NAME_restrict_fur_trade: "毛皮貿易受限"
 conquest_of_paradise.11.b: "忽略這個問題。"
 conquest_of_paradise.12.title: "[GetCurrentYear]年的收成"
 conquest_of_paradise.12.desc: "今年[ROOT.GetCountry.GetName]的作物收成非常糟糕，整個殖民地已經感受到糧食短缺。糧價飆升，還有人進一步預測嚴冬可能將至。附近的原住民得知我們的困境後，自願送來了一些糧食補給。他們帶來的東西遠不足以支撐我們度過冬天，但贈禮來源之處必然還有更多玉米。有人提議我們派士兵前往原住民村莊奪取他們的糧食。"
 conquest_of_paradise.12.a: "拿走我們需要的東西。"
 conquest_of_paradise.12.b: "我們會自行解決。"
 conquest_of_paradise.13.title: "發現鐵礦"
 conquest_of_paradise.13.desc: "為了維持自身，[ROOT.GetCountry.GetName]必須尋找新的收入來源，並降低對進口的依賴。不過，一個絕佳機會出現了，因為在[ROOT.GetCountry.GetName]發現了沼鐵礦！如今有人提議，強制土地所有者建造熔爐與鍛爐並立即開始生產。作為交換，該所有者將獲得為期10年的免稅保障，以補貼初始成本。"
 conquest_of_paradise.13.a: "這聽起來是個好機會。"
 conquest_of_paradise.13.b: "不，謝了。"
 conquest_of_paradise.14.title: "本土羊毛產業"
 conquest_of_paradise.14.desc: "殖民貿易利潤減少，以及我們對進口商品的依賴，正開始傷害[ROOT.GetCountry.GetName]。我們必須尋求脫離進口的經濟獨立，為此一項新提案已被提出：透過禁止羊隻出口並命令更多羊毛在本地生產，我們將確保有足夠暖衣提供給殖民者。若要使其奏效，應在[ROOT.GetCountry.GetName]建立一座紡織工場。"
 conquest_of_paradise.14.a: "這聽起來是個好機會。"
 conquest_of_paradise.14.b: "不，謝了。"
 conquest_of_paradise.15.title: "經濟作物禁令"
 conquest_of_paradise.15.desc: "不同於[ROOT.GetCountry.GetName]的創建者，新定居者往往目光短淺，把利潤置於保障自己與家人未來之上。許多人忽視為殖民地生產糧食的必要性，轉而專門種植經濟作物，相信自己能出售作物並從其他農民手中購買糧食。若這種情況持續下去，我們的殖民地最終將面臨饑荒與動亂。為了防止這種結果，有人建議制定法律，要求新農民至少在部分田地中生產糧食。"
 conquest_of_paradise.15.a: "法律似乎是必要的。"
 conquest_of_paradise.15.b: "這不關我們的事。"
 conquest_of_paradise.16.title: "禁止種植菸草"
 conquest_of_paradise.16.desc: "我們初抵此地時，菸草價格飆升，利潤極為可觀。如今，隨著更多農民到來並開始經營自己的種植園，菸草供給迅速增加，導致歐洲價格逐年下跌。既有種植園主提出一項提案，禁止種植菸草一年，讓價格有時間恢復。新農民顯然反對這項提案，但我們必須採取必要措施保護自身生計。"
 conquest_of_paradise.16.a: "執行這項禁令。"
 STATIC_MODIFIER_NAME_banned_tobacco_planting: "禁止種植菸草"
 conquest_of_paradise.16.b: "拒絕他們的提案。"