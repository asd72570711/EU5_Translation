l_simp_chinese:
 colonial_policies.10.title: "殖民者熱潮"
 colonial_policies.10.desc: "我們對新大陸的追尋傳聞，讓更多人準備好以殖民定居者的身分展開新生活。"
 colonial_policies.10.a: "他們或許會派上用場。"
 STATIC_MODIFIER_NAME_colonial_enthusiasm: "殖民熱忱"
 STATIC_MODIFIER_DESC_colonial_enthusiasm: "大批懷抱雄心的人對遷往殖民地深感興趣。"
 colonial_policies.11.title: "人民逃往殖民地"
 colonial_policies.11.desc: "我們對新大陸的追尋，為殖民地中的人民打開了機會。持續不斷的戰爭使我國許多最優秀、最聰慧的人相信，現在正是抓住這些機會的時候。"
 colonial_policies.11.a: "讓他們去吧。"
 colonial_policies.11.b: "必須阻止他們。"
 colonial_policies.13.title: "傑出的總督"
 colonial_policies.13.desc: "每隔一段時間，國家便會受惠於一批誠實且為國勤勉工作的能人。我們海外領地中幾位優秀的總督正為我們帶來實質助益。"
 colonial_policies.13.a: "很高興聽到這個消息。"
 STATIC_MODIFIER_NAME_excellent_administration: "卓越行政"
 STATIC_MODIFIER_DESC_excellent_administration: "我們的總督表現卓越，提升了我們來自海外省份的收入。"
 colonial_policies.14.title: "腐敗總督"
 colonial_policies.14.desc: "海外省份向來難以維持治安，優秀的總督對維持秩序至關重要。然而，有時事情並不如計畫般發展，腐敗且貪婪之人最終掌握了權力。"
 colonial_policies.14.a: "採取行動。"
 colonial_policies.14.b: "就睜一隻眼閉一隻眼吧。"
 STATIC_MODIFIER_NAME_corrupt_viceroys: "腐敗總督"
 STATIC_MODIFIER_DESC_corrupt_viceroys: "不幸的是，我們最近任命的一些總督認為，既然他們在王權之下擁有可牟利的官職，那麼牟利才是最重要的部分。"
 colonial_policies.21.title: "成功的公司"
 colonial_policies.21.desc: "我們決定授予商業公司特許權的做法證明相當明智。我們的收益已大幅提升，而這筆錢也能用於其他事務。"
 colonial_policies.21.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 colonial_policies.22.title: "殖民熱忱"
 colonial_policies.22.desc: "「殖民地有全新的生活在等著你！在充滿機遇與冒險的黃金之地重新開始的機會！」殖民生活並非如此，但人們相信它就是這樣，並在這些想像中的機會消失前爭相奔赴殖民地。"
 colonial_policies.22.a: "他們真是愚蠢……"
 colonial_policies.23.title: "外交行動"
 colonial_policies.23.desc: "我們的外交團隊一直努力確保我方利益能在外國宮廷中得到代表。他們的努力讓我們得以將影響力之網進一步撒向遠方。"
 colonial_policies.23.a: "這是好消息！"
 STATIC_MODIFIER_NAME_diplomatic_moves: "外交行動"
 STATIC_MODIFIER_DESC_diplomatic_moves: "我們勤勉的外交官已確保我方利益能在外國宮廷中得到代表，使我們得以將影響力之網擴張得更遠。"
 colonial_policies.24.title: "造船熱潮"
 colonial_policies.24.desc: "我們的造船業曾因商船訂單而迎來一波熱潮。如今這股熱潮已經結束，船塢產能出現過剩。這種情況不會持續太久，但現在我們的海軍可以從中獲益。"
 colonial_policies.24.a: "讓我們好好利用它"
 STATIC_MODIFIER_NAME_ship_building_boom: "造船熱潮"
 STATIC_MODIFIER_DESC_ship_building_boom: "在商船訂單熱潮之後，出現了可供我國海軍受益的過剩船塢產能。"
 colonial_policies.25.title: "聲譽提升"
 colonial_policies.25.desc: "長久以來，我們的外交官一直努力確保我國聲譽達到最佳狀態。一連串奇妙的事件組合，使我們如今享有提升後的外交聲譽。"
 colonial_policies.25.a: "讓我們加以利用！"
 STATIC_MODIFIER_NAME_enhanced_reputation: "聲譽提升"
 STATIC_MODIFIER_DESC_enhanced_reputation: "外交官的努力與一連串奇妙事件，使我們如今享有提升後的外交聲譽。"
 colonial_policies.26.title: "貿易成功"
 colonial_policies.26.desc: "我們的商人階層在世界各地取得了近乎不可思議的成功。有人說這只是偶然的運氣，但我們並不在乎，因為無論財富如何到手，財富終究是財富。"
 colonial_policies.26.a: "讓他們分享財富……和我們分享"
 STATIC_MODIFIER_NAME_trade_success: "貿易成功"
 STATIC_MODIFIER_DESC_trade_success: "商人在世界各地取得了略顯不可思議的成功，為我們帶來更多財富。"
 colonial_policies.28.title: "貿易失敗"
 colonial_policies.28.desc: "近來我們商人的表現不佳。我們的大商場中不見世界各地的貨物，更重要的是，我們的收入也下降了。"
 colonial_policies.28.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 STATIC_MODIFIER_NAME_trade_failure: "貿易失敗"
 STATIC_MODIFIER_DESC_trade_failure: "我們商人近期表現不佳，導致收入降低。"
 colonial_policies.28.b: "嘗試避免它！"
 colonial_policies.29.title: "造船問題"
 colonial_policies.29.desc: "各方對船隻的需求激增，導致航運需求也從各種來源暴增，使造船所需的時間與成本上升。雖然沒有人敢向我們收取更高船價，但造船所需時間確實變得更長了。"
 colonial_policies.29.a: "我們有這個時間嗎？"
 STATIC_MODIFIER_NAME_ship_building_problems: "造船問題"
 colonial_policies.30.title: "外交失禮"
 colonial_policies.30.desc: "在我們某個鄰國宮廷舉行的一場非常重要的國家活動中，我們的大使犯下了最糟糕的失禮之舉。消息已經傳開，我們的外交官日子變得更加難過，因為鄰國花了大量時間嘲笑他們。"
 colonial_policies.30.a: "這太糟糕了！"
 STATIC_MODIFIER_NAME_diplo_fuax_pas: "外交失禮"
 STATIC_MODIFIER_DESC_diplo_fuax_pas: "我方一名大使犯下的外交失禮，讓我們的外交官處境更加艱難。"