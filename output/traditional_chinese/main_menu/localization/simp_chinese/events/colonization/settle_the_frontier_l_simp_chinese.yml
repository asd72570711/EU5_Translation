 third_change_settling_character_loyalty: "[CHARACTER.GetName]使[CHARACTER.GetHerHis]#Y $settler_character_truthfulness$#!增加$VALUE|V0G$（目前：#Y [CHARACTER.MakeScope.GetVariable('settler_character_truthfulness').GetValue]#!）"
 third_neg_change_settling_character_loyalty: "[CHARACTER.GetName]使[CHARACTER.GetHerHis]#Y $settler_character_truthfulness$#!降低$VALUE|V0R$（目前：#Y [CHARACTER.MakeScope.GetVariable('settler_character_truthfulness').GetValue]#!）"
 past_change_settling_character_loyalty: "已使[CHARACTER.GetHerHis]#Y $settler_character_truthfulness$#!增加$VALUE|V0G$（目前：#Y [CHARACTER.MakeScope.GetVariable('settler_character_truthfulness').GetValue]#!）"
