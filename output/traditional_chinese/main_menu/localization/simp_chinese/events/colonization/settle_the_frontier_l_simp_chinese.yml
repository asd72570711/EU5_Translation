 third_past_change_settling_character_loyalty: "[CHARACTER.GetName]已使[CHARACTER.GetHerHis]#Y $settler_character_truthfulness$#!增加$VALUE|V0G$（目前：#Y [CHARACTER.MakeScope.GetVariable('settler_character_truthfulness').GetValue]#!）"
