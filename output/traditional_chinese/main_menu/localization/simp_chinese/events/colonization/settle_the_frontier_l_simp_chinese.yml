l_simp_chinese:
 settle_the_frontier.1.title: "向[target.GetNameWithNoTooltip]擴張"
 settle_the_frontier.1.desc: "[recipient.GetName]——[ROOT.GetCountry.GetLongName]的一位勇敢成員——率領一群志願者冒險前往[target.GetName]的無主土地。[recipient.GetSheHe|U]與[recipient.GetHerHis]追隨者將擴張我們[ROOT.GetCountry.GetFlavorRank]的領土。"
 settle_the_frontier.1.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 settle_the_frontier.1.a.tt: "[recipient.GetName]將嘗試定居[target.GetName]。此過程最多需要#Y 10年#!"

 settle_the_frontier.2.title: "前往[target.GetNameWithNoTooltip]的事業"
 settle_the_frontier.2.desc: "雖然[from_province.GetName]是[actor.GetName]的首都省份，但其中一些居民希望在[target.GetName]尋找機會——那片土地目前正由[recipient.GetName]探索。"
 settle_the_frontier.2.a: "讓他們在該省份展開新生活。"
 settle_the_frontier.2.b: "改為改善他們在首都的處境。"
 settle_the_frontier.2.b.tt: "接下來一年內，不會有[pops|e]遷往[target.GetName]"

 settle_the_frontier.3.title: "文化傳播"
 settle_the_frontier.3.desc: "隨著[recipient.GetName]持續定居[target.GetName]，[recipient.GetSheHe]與[recipient.GetHerHis]追隨者接觸到了這些土地上的當地原住民。[recipient.GetSheHe|U]請求[actor.GetAdjective]支援，在原住民之間傳播[target_culture.GetName]理念。"
 settle_the_frontier.3.a: "把我們最優秀的故事與藝術帶到[target.GetNameWithNoTooltip]。"
 settle_the_frontier.3.b: "一些簡單的[target_culture.GetNameWithNoTooltip]故事就足夠了。"
 settle_the_frontier.3.c: "沒有多少理由去啟蒙原住民。"

 settle_the_frontier.4.title: "投資請求"
 settle_the_frontier.4.desc: "[target.GetName]的土地比預期更難定居。我們的殖民者[recipient.GetName]已向[actor.GetAdjective][ROOT.GetCountry.GetGovernment.GetCourtTitle]提出正式請求，希望獲得更多財政資助，因為似乎需要更多資源。"
 settle_the_frontier.4.a: "我們必須不惜代價支持定居者。"
 settle_the_frontier.4.b: "他們可以自行籌措資金。"

 settle_the_frontier.5.title: "鄰近衝突"
 settle_the_frontier.5.desc: "[target.GetName]新興的聚落已與其周邊既有土地與人民發生衝突。[recipient.GetName]請求我們更勤勉地執行他們對[target.GetNameWithNoTooltip]的特權，並懲罰這些滋事者。"
 settle_the_frontier.5.a: "定居者必須受到尊重。"
 settle_the_frontier.5.b: "敵意終究會停止。"

 settle_the_frontier.6.title: "早期資源開發"
 settle_the_frontier.6.desc: "[recipient.GetName]的定居工作已展現初步成功。[target.GetName]中年輕的[actor.GetAdjective]村莊已建立起最初取得並開發土地資源的通道。我們可以動用權威，要求其中一些資源供自身受益……"
 settle_the_frontier.6.a: "我們需要[target_goods_0.GetNameWithNoTooltip]。"
 settle_the_frontier.6.b: "我們的首都需要[target_goods_1.GetNameWithNoTooltip]。"
 settle_the_frontier.6.c: "取得[target_goods_2.GetNameWithNoTooltip]將支援國家。"
 settle_the_frontier.6.d: "想必他們並不那麼需要[target_goods_3.GetNameWithNoTooltip]。"
 settle_the_frontier.6.e: "[target_goods_4.GetNameWithNoTooltip]將大大服務於我們。"
 settle_the_frontier.6.zzz: "我們不該從他們手中奪走珍貴材料。"

 settle_the_frontier.100.title: "[target.GetNameWithNoTooltip]的定居完成"
 settle_the_frontier.100.desc: "數年前，[recipient.GetName]奉[actor.GetAdjective]之命前往[target.GetName]的未定居土地，為[actor.GetLongNameWithNoTooltip]宣稱該地。這項事業今日終於迎來終結！"
 settle_the_frontier.100.desc.a: "$settle_the_frontier.100.desc$\n\n[recipient.GetNameWithNoTooltip]已將該省份移交給[recipient.GetHerHis]祖國。雖然[recipient.GetSheHe]仍是定居土地的總督，但此地如今已完全置於我們的行政之下。"
 settle_the_frontier.100.desc.b: "$settle_the_frontier.100.desc$\n\n不幸的是，[recipient.GetNameWithNoTooltip]從未回到[actor.GetNameWithNoTooltip]。看來我們授予[recipient.GetHerHim]的自治權，讓[recipient.GetHerHim]宣布建立[recipient.GetHerHis]自己的[target_country.GetLongName]。"
 settle_the_frontier.100.a: "[actor.Custom('common_string_positive')]"
 settle_the_frontier.100.b: "[recipient.GetSheHe|U]會為[recipient.GetHerHis]的傲慢後悔！"
 settle_the_frontier.100.b.tt: "[target_country.GetName]已在[target.GetName]建立"
 settle_the_frontier.100.c: "[target.GetNameWithNoTooltip]發生了什麼事？"

 settle_the_frontier.101.title: "向[target.GetNameWithNoTooltip]擴張的終結"
 settle_the_frontier.101.desc: "隨著[recipient.GetName]突然死亡，追隨[recipient.GetHerHim]直到最後的定居者已失去繼續事業的所有希望與士氣。曾經團結之處如今只剩混亂，而少數已建立的聚落也已解散。"
 settle_the_frontier.101.a: "[actor.Custom('common_string_disappointing')]"
 settle_the_frontier.101.a.tt: "我們定居[target.GetName]的努力已中止"

 settle_the_frontier.102.title: "定居[target.GetNameWithNoTooltip]失敗"
 settle_the_frontier.102.desc: "雖然[recipient.GetName]定居[target.GetName]土地的事業原本相當有前景，但我們收到消息，表示我們開始得太晚了。整個省份已經被我們的鄰國完全殖民並設防……"
 settle_the_frontier.102.a: "[actor.Custom('common_string_disappointing')]"
 settle_the_frontier.102.a.tt: "[recipient.GetName]返回[actor.GetName]"

 settler_character_truthfulness: "定居者忠誠"
 change_settling_character_loyalty: "使[CHARACTER.GetHerHis]#Y $settler_character_truthfulness$#!增加$VALUE|V0G$（目前：#Y [CHARACTER.MakeScope.GetVariable('settler_character_truthfulness').GetValue]#!）"
