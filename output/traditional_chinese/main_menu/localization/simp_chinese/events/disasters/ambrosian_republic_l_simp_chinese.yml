l_simp_chinese:
 ambrosian_republic.1.title: "[ROOT.GetCountry.GetNameWithNoTooltip]的穩定政府"
 ambrosian_republic.1.desc: "金色安布羅修共和國的建立並非毫無波折，但穩定終於佔了上風。經歷如此動盪的時代後，我們的國家真正經受烈火鍛造，並以前所未有的強大姿態重生。和平、正義與自由在[ROOT.GetCountry.GetName]全境施行。"
 ambrosian_republic.1.b.desc: "在[target_country.GetName]統治下重建秩序的過程並非毫無波折，但安寧終將佔了上風。無論未來如何，我們在宗主夥伴麾下的前途都已穩固。和平、正義與自由在[ROOT.GetCountry.GetName]全境施行。"
 ambrosian_republic.1.a: "讚美聖安波羅修！"
 ambrosian_republic.2.title: "[GetCountry('MLO').GetAdjectiveWithNoTooltip]繼承問題"
 ambrosian_republic.2.desc: "隨著[ROOT.GetCountry.GetName]王位懸空，[GetCountry('FRA').GetName]的[GetCountry('FRA').GetGovernment.GetRulerTitle]，以及身為[GetUniqueInternationalOrganization('hre').GetName]皇帝的[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetName][GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRulerTitle]，都公開討論起各自對王位的宣稱。[GetCountry('FRA').GetAdjectiveWithNoTooltip]的宣稱建立在與舊[ShowDynastyName('visconti_dynasty')]王朝的婚姻關係之上。雖然這項宣稱並不牢固，但[GetCountry('FRA').GetNameWithNoTooltip]覬覦[ShowRegionName('italy_region')]已久，而有力量抵抗[GetCountry('FRA').GetAdjectiveWithNoTooltip][GetCountry('FRA').GetGovernment.GetRulerTitle]者寥寥無幾。與此同時，皇帝則主張，在沒有明確繼承人的情況下，依照帝國法律，[ROOT.GetCountry.GetNameWithNoTooltip]的頭銜應授予皇帝。"
 ambrosian_republic.2.a: "我們必須準備好捍衛自由。"
 ambrosian_republic.3.title: "$ambrosian_republic.2.title$"
 ambrosian_republic.3.desc: "[GetCountry('MLO').GetName]已陷入政治混亂。王位懸空，而一個暴起的新興[GetCountry('MLO').GetGovernment.GetGovernmentType.GetName]正徒勞地試圖建立秩序。如今正是執行我們對其頭銜宣稱的大好時機，而此宣稱建立在我們與已然絕嗣的[ShowDynastyName('visconti_dynasty')]家族之婚姻關係上。"
 ambrosian_republic.3.a: "王位屬於我們！"
 ambrosian_republic.3.b: "我們對[GetCountry('MLO').GetNameWithNoTooltip]沒有興趣"
 ambrosian_republic.4.title: "$ambrosian_republic.2.title$"
 ambrosian_republic.4.desc: "[GetCountry('MLO').GetName]已陷入政治混亂。王位懸空，而一個暴起的新興[GetCountry('MLO').GetGovernment.GetGovernmentType.GetName]正徒勞地試圖建立秩序。依照帝國法律，當[GetCountry('MLO').GetNameWithNoTooltip]的血脈斷絕時，其頭銜應轉歸皇帝[ROOT.GetCountry.GetGovernment.GetRuler.GetHerselfHimself]。若我們希望執行這項法律，並為自己宣稱[GetCountry('MLO').GetNameWithNoTooltip]，就必須迅速行動，廢黜這個所謂的金色安布羅修共和國。"
 ambrosian_republic.4.a: "王位屬於我們！"
 ambrosian_republic.4.b: "$ambrosian_republic.3.b$"
 ambrosian_republic.5.title: "給[target_character.GetLastNameWithNoTooltip]的提議"
 ambrosian_republic.5.title.fallback: "給一位將軍的提議"
 ambrosian_republic.5.desc: "[target_character.GetName]是我們這個時代最偉大的軍事將領之一，也是顯赫的傭兵隊長領袖。很遺憾，在鎮壓叛軍的鬥爭中，我們竟與[target_character.GetHerHim]站在對立面。然而[target_character.GetLastNameWithNoTooltip]在[ROOT.GetCountry.GetAdjective]人民之間廣受歡迎，甚至擁有王位宣稱。\n\n分裂政府中的一個派系已致函[target_character.GetHerHim]，提出慷慨條件：若[target_character.GetSheHe]斷絕與我們敵人的一切聯繫並加入我們的事業，[ROOT.GetCountry.GetNameWithNoTooltip]將授予[target_character.GetHerHim]大片土地，以及「隊長與守護者」的職位。[target_character.GetLastNameWithNoTooltip]能成為[ROOT.GetCountry.GetFlavorRank]的一大助力，但許多人質疑，[target_character.GetHerHis]對我們的忠誠是否能壓過[target_character.GetHerHis]個人野心。"
 ambrosian_republic.5.a: "我們將任命[target_character.GetHerHim]為我軍統帥。"
 ambrosian_republic.5.b: "我們不能冒著迎來另一個潛在僭主的風險！"
 ambrosian_republic.6.title: "[target_character.GetLastNameWithNoTooltip]與[ROOT.GetCountry.GetFlavorRank]衝突"
 ambrosian_republic.6.desc: "[target_character.GetName]在[ROOT.GetCountry.GetLongName]內有許多政敵。那些創建[ROOT.GetCountry.GetFlavorRank]、較為理想主義且崇尚學問的政治家，懷疑[target_character.GetHerHim]正密謀奪取王位；而更務實的政治家，則忌恨[target_character.GetHerHis]在人民之間的聲望。\n\n[target_character.GetLastNameWithNoTooltip]最近得知，有人密謀剝奪[target_character.GetHerHim]的軍事指揮權，並將[target_character.GetHerHim]逐出[target_character.GetHerHis]在政府中的職位。盛怒之下，[target_character.GetLastNameWithNoTooltip]向國家發出最後通牒：接受[target_character.GetHerHis]絕對軍事統治，否則就再度在戰場上面對[target_character.GetHerHim]。"
 ambrosian_republic.6.a: "在[target_character.GetLastNameWithNoTooltip]麾下實施軍事統治。"
 ambrosian_republic.6.b: "反抗[target_character.GetLastNameWithNoTooltip]的暴政。我們為自由而戰！"
 sforza_rebellion: "斯福爾扎叛亂"
 sforza_gains_support.tt: "[target_character.GetLastNameWithNoTooltip]將號召[target_character.GetHerHis]支持者並起兵反抗我們"
 ambrosian_republic.7.title: "[target_character.GetLastNameWithNoTooltip]奪取王位"
 ambrosian_republic.7.desc: "一向野心勃勃且善於投機的[target_character.GetName]，如今出於[target_character.GetHerHis]野心背叛了[ROOT.GetCountry.GetFlavorRank]，並宣稱自己是[ROOT.GetCountry.GetName]的合法統治者！[target_character.GetHerHis|U]在人民之間的聲望，以及對軍隊與國家機器的鐵腕掌控，使得反抗[target_character.GetHerHis]統治看似注定失敗。或許我們必須接受[target_character.GetHerHis]君主制的建立。又或許，自由值得付出任何代價。"
 ambrosian_republic.7.a: "向[target_character.GetLastNameWithNoTooltip]歡呼！"
 ambrosian_republic.7.b: "不可接受！必要時我們將與[target_character.GetHerHim]開戰。"
 ambrosian_republic.7.c: "絕不！讓我們依創建者的本意恢復[ROOT.GetCountry.GetFlavorRank]。"