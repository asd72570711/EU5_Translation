l_simp_chinese:
 castilian_civil_war.1.title: "[target_country.GetAdjectiveWithNoTooltip]內戰"
 castilian_civil_war.1.desc: "雖然[previous_ruler.GetName]已經離開權位一段時日，[previous_ruler.GetHerHis]遺緒仍然延續。[previous_ruler.GetHerHis|U][ccw_legitimate_ruler.GetDaughterSon]、[target_country.GetName]的[ccw_legitimate_ruler.GetName]兼[target_country.Custom('GetRulerOrHeirTitle')]，並不是我們前任統治者唯一的子嗣，因為[previous_ruler.GetSheHe][previous_ruler.Custom('GetBoreSired')]了許多私生子女。\n\n令[ccw_legitimate_ruler.GetNameWithNoTooltip]驚愕的是，其中一名私生子女[ccw_bastard_ruler.GetName]竟敢挑戰[ccw_legitimate_ruler.GetShortNameWithNoTooltip]的正統性。最糟的是，我們[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]中許多背信棄義的成員支持這位覬覦者的野心，並試圖迫使我們的[target_country.Custom('GetRulerOrHeirTitle')]退位……"
 castilian_civil_war.1.a: "依照繼承權，[ccw_legitimate_ruler.GetShortNameWithNoTooltip]必將獲勝！"
 castilian_civil_war.1.nobility_joins_bastard: "[target_country.GetGovernment.GetEstateName('nobles_estate')]加入[ccw_bastard_ruler.GetName]。人口最多的#Y 3#!個已擁有[locations|e]中的[ShowPopTypeName('nobles')]加入[succession_crisis_pretender_scope.GetName]。"
 castilian_civil_war.1.b: "應由[ccw_bastard_ruler.GetShortNameWithNoTooltip]統治[target_country.GetNameWithNoTooltip]。"
 castilian_civil_war.1.commoners_join_legitimate_ruler: "[target_country.GetGovernment.GetEstateName('burghers_estate')]與[target_country.GetGovernment.GetEstateName('peasants_estate')]加入[ccw_bastard_ruler.GetName]。人口最多的#Y 3#!個已擁有[locations|e]中的[ShowPopTypeName('peasants')]與[ShowPopTypeName('burghers')]加入[succession_crisis_pretender_scope.GetName]。"
 ccw_side_against_ruler.ccw_bastard_ruler: "若干不滿我們統治的[provinces|e]將加入[ccw_bastard_ruler.GetName]的陣營"
 ccw_side_against_ruler.ccw_legitimate_ruler: "若干不滿我們統治的[provinces|e]將加入[ccw_legitimate_ruler.GetName]的陣營"
 castilian_civil_war.2.title: "[target_province.GetNameWithNoTooltip]加入[target_rebels.GetNameWithNoTooltip]"
 castilian_civil_war.2.title.fallback: "省份加入覬覦者叛軍"
 castilian_civil_war.2.desc: "當[target_ruler.GetName]享受王室宮廷的奢華時，[target_province.GetName]的人民正被叛逆的[target_pretender.GetName]與[target_rebels.GetName]鼓動。若王冠不加干預，[target_estate.GetName]的成員便會紛紛聚集到覬覦者的旗幟之下……"
 castilian_civil_war.2.a: "收買[target_estate.GetNameWithNoTooltip]的忠誠。"
 castilian_civil_war.2.b: "這個省份已無可救藥。"
 castilian_civil_war.2.b.at: "所有[ShowPopTypeName('peasants')]與[ShowPopTypeName('burghers')][pops|e]失去[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%][pop_satisfaction|e]並加入[target_rebels.GetName]"
 castilian_civil_war.2.b.bt: "所有[ShowPopTypeName('peasants')]與[ShowPopTypeName('nobles')][pops|e]失去[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%][pop_satisfaction|e]並加入[target_rebels.GetName]"
 castilian_civil_war.3.title: "[target_estate.GetNameWithNoTooltip]叛逆"
 castilian_civil_war.3.title.fallback: "階層叛逆"
 castilian_civil_war.3.desc: "忠誠止於追求權力者的私利與野心。令宮廷與[target_ruler.GetName]沮喪的是，[target_estate.GetName]為了擴大自身影響，尋求[target_pretender.GetName]的支持，已證明他們相當渴求權力。"
 castilian_civil_war.3.a: "他們不值得我們掛心。"
 castilian_civil_war.3.b: "也許一些特權能取悅[target_estate.GetNameWithNoTooltip]。"
 castilian_civil_war.3.c: "屠盡這些叛徒！"
 castilian_civil_war.100.title: "繼承危機的終結"
 castilian_civil_war.100.title.war: "[from_country.GetAdjectiveWithNoTooltip]內戰"
 castilian_civil_war.100.desc.war: "[target_ruler.GetName]與[target_pretender.GetName]之間的紛爭已不再只是暗潮洶湧，而是被[from_country.GetLongName]的熾烈內戰取代。兩位[from_country.Custom('GetSibling')]都已布置好各自的舞台：同盟已經締結，軍隊已經訓練，而[from_country.GetAdjectiveWithNoTooltip]國家的命運如今將在戰場上決定。"
 castilian_civil_war.100.desc.inheritance: "雖然已為一場艱難的內戰做好準備，宮廷中的緊張局勢以及[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]不斷的背叛，仍使[target_ruler.GetName]陷入精神上的痛苦。最終，這份精神耗竭對[target_ruler.GetHerHim]而言過於沉重，[target_ruler.GetShortNameWithNoTooltip]被迫退位，使[target_pretender.GetName]成為[from_country.GetName]的合法統治者。"
 castilian_civil_war.100.desc.ruler_death: "經歷一段動盪後，[target_ruler.GetName]的逝世讓[target_pretender.GetName]得以主張[from_country.GetAdjective]王位。無論好壞，這位昔日覬覦者都將帶領[from_country.GetNameWithNoTooltip]走向新的未來。"
 castilian_civil_war.100.desc.pretender_death: "唉，神明向[target_ruler.GetName]伸出了恩典之手。[target_pretender.GetName]這位醞釀叛亂、威脅將整個[from_country.GetAdjective]領域拖入內戰的領袖已經身亡。這是神意介入，還是幸運的骰子一擲？無論好壞，[from_country.GetNameWithNoTooltip]重新掌握了自身內政。"
 castilian_civil_war.100.desc.fallback: "內亂、公開叛亂與無數其他詛咒降臨到[from_country.GetAdjective]人民身上。然而，沒有任何一項能摧毀國家，而[target_ruler.GetName]與[target_pretender.GetName]之間漫長的衝突終於迎來結局。"
 castilian_civil_war.100.war: "拿起武器！"
 castilian_civil_war.100.peace: "一場災難勉強避免了。"
 castilian_civil_war.101.a: "那我們的交易怎麼辦？"
 castilian_civil_war.101.a.tt: "所有關於[from_country.GetName]及其[target_ruler.GetName]與[target_pretender.GetName]之間衝突的義務與獎賞皆作廢"
 castilian_civil_war.200.join_war: "讓我們以無上榮耀加入這場戰爭！"
 castilian_civil_war.200.mercs: "派出一支象徵性但可觀的軍隊援助我們的盟友！"
 castilian_civil_war.200.gold: "我們的盟友會感謝這筆額外資金"
 castilian_civil_war.200.coward: "我們無力捲入此事。"
 ccw_ara_company: "$ARA_ADJ$傭兵隊長"
 ccw_por_company: "$POR_ADJ$傭兵隊長"
 ccw_fra_company: "$FRA_ADJ$傭兵隊長"
 ccw_eng_company: "$ENG_ADJ$傭兵隊長"
 ccw_nav_company: "$NAV_ADJ$傭兵隊長"
 ccw_fallback_company: "內戰傭兵隊長"
 ccw_from_country_joins_target_country_in_100yw_issues_tt: "[from_country.GetName]加入[target_country.GetName]參與所有與[ShowSituationName('hundred_years_war')]相關的衝突"
 castilian_civil_war.201.desc.common: "來自[target_country.GetName]的消息傳到了我們的宮廷！"
 castilian_civil_war.201.title: "來自[target_country.GetNameWithNoTooltip]的支援"
 castilian_civil_war.201.desc: "$castilian_civil_war.201.desc.common$我們信賴的[target_country.GetAdjectiveWithNoTooltip]盟友履行了承諾，向我們送來支援！"
 castilian_civil_war.201.desc.join_war: "$castilian_civil_war.201.desc$他們已加入[target_ruler.GetName]一方參戰，準備全力投入我們的事業！"
 castilian_civil_war.201.desc.mercs: "$castilian_civil_war.201.desc$他們派出一支可觀的象徵性部隊，以免費傭兵身分交由我們指揮！"
 castilian_civil_war.201.desc.gold: "$castilian_civil_war.201.desc$他們贈予我們一大筆慷慨的黃金，應能幫助我們的戰爭努力！"
 castilian_civil_war.201.a: "他們的支援令人感激不盡。"
 castilian_civil_war.202.title: "[target_country.GetNameWithNoTooltip]拋棄了我們！"
 castilian_civil_war.202.desc: "$castilian_civil_war.201.desc.common$我們那卑劣的[target_country.GetAdjectiveWithNoTooltip]盟友背棄了承諾，背叛了[from_country.GetAdjective]王冠！我們對他們的義務已不復存在。"
 castilian_civil_war.202.a: "他們會為這場背叛後悔！"
 castilian_civil_war.301.title: "[target_country.GetNameWithNoTooltip]加入叛軍！"
 castilian_civil_war.301.desc: "$castilian_civil_war.201.desc.common$可詛咒的[target_country.GetLongNameWithNoTooltip]履行了他們與[target_pretender.GetName]的同盟，並已經把支援送給叛軍。"
 castilian_civil_war.301.desc.join_war: "$castilian_civil_war.301.desc$他們已加入[target_pretender.GetNameWithNoTooltip]一方參戰，準備全力投入叛軍的事業！"
 castilian_civil_war.301.desc.mercs: "$castilian_civil_war.301.desc$他們派出一支可觀的象徵性部隊，作為免費傭兵支援叛軍！"
 castilian_civil_war.301.desc.gold: "$castilian_civil_war.301.desc$他們贈予叛軍一大筆慷慨的黃金，應能幫助叛軍的戰爭努力！"
 castilian_civil_war.301.a: "該死的叛軍！"
 ccw_hire_mercs_tt: "[THIS.GetCountry.GetName]雇用[target_country.GetName]的[mercenaries|e]"
 castilian_civil_war.302.title: "[target_country.GetNameWithNoTooltip]的中立"
 castilian_civil_war.302.desc: "$castilian_civil_war.201.desc.common$看來[target_pretender.GetName]的事業未能說服[target_country.GetAdjectiveWithNoTooltip]人民。因此，他們決定在我們的衝突中保持中立。"
 castilian_civil_war.302.a: "這是再歡迎不過的意外。"
 castilian_civil_war.400.title: "[from_country.GetAdjectiveWithNoTooltip]內戰的餘波"
 castilian_civil_war.400.desc: "漫長等待之後，戰鬥聲終於平息。[target_loser.GetName]的效忠者屈服於[target_winner.GetName]軍隊的壓倒性力量，而[from_country.GetAdjective]王位也從[target_winner.GetHerHis]背信棄義的[target_loser.GetSisterBrother]手中得到保衛。[target_loser.GetShortNameWithNoTooltip]在[target_winner.GetShortNameWithNoTooltip]之手與其劍下迎來[target_loser.GetHerHis]終局，隨之而去的，還有他們父親[target_father.GetName]所犯下的錯誤。"
 castilian_civil_war.400.a: "[target_winner.GetShortNameWithNoTooltip]萬歲！"
 castilian_civil_war.401.desc: "漫長等待之後，戰鬥聲終於平息。儘管英勇奮戰，[target_loser.GetName]的軍隊仍無法抵擋[target_winner.GetName]與[target_winner.GetHerHis]盟友。[target_winner.GetShortNameWithNoTooltip]在戰場上的[target_loser.GetHerHis]帳篷中拜訪[target_loser.GetShortNameWithNoTooltip]，準備談判和平；然而，當[target_loser.GetShortNameWithNoTooltip]第一次與[target_loser.GetHerHis][target_winner.GetSisterBrother]四目相對時，便清楚知道[target_winner.GetShortNameWithNoTooltip]心中只有殺意。迅捷的一擊終結了[target_loser.GetNameWithNoTooltip]的性命，也終結了[from_country.GetAdjective]內戰。"
 castilian_civil_war.401.a: "至少戰爭結束了……"
 castilian_civil_war.410.title: "[target_winner.GetShortNameWithNoTooltip]的勝利"
 castilian_civil_war.410.desc: "雖然血腥，[from_country.GetAdjective]內戰終於隨著[target_winner.GetName]在最後一場決定性大戰中粉碎[target_loser.GetName]的軍隊而落幕。當然，若沒有我們慷慨的支援，[target_winner.GetSheHe]絕不可能成就如此壯舉。我們應當提醒[target_winner.GetHerHim]履行[target_winner.GetHerHis]在交易中的承諾。"
 castilian_civil_war.410.a: "是時候提出我們的宣稱了！"
 castilian_civil_war.410.a.at: "我們可以要求落實與[target_winner.GetName]交易中的條件。若[from_country.GetName]接受，將發生以下效果："
 castilian_civil_war.410.a.bt: "若[from_country.GetName]拒絕滿足我們的要求，則會改為發生以下效果："
 castilian_civil_war.410.b: "他們勝利的榮耀已足以作為我們的獎賞。"
 castilian_civil_war.411.title: "[target_country.GetNameWithNoTooltip]放棄要求"
 castilian_civil_war.411.desc.common: "[target_winner.GetName]的勝利固然驚人，但若沒有[target_country.GetLongName]的支援便不可能實現——而這份支援正是[target_winner.GetShortNameWithNoTooltip]與[target_country.GetAdjectiveWithNoTooltip]王冠所訂交易的一部分。"
 castilian_civil_war.411.desc: "$castilian_civil_war.411.desc.common$幸運的是，[target_ruler.GetName]顯得相當慷慨，表示願意放棄他們從這筆交易中取得的任何宣稱。"
 castilian_civil_war.411.a: "真是一位有榮譽的[target_ruler.GetWomanMan]！"
 castilian_civil_war.412.title: "[target_country.GetNameWithNoTooltip]提出要求"
 castilian_civil_war.412.desc: "$castilian_civil_war.411.desc.common$如今，[target_ruler.GetName]向[target_winner.GetShortNameWithNoTooltip]提出要求與宣稱，並威脅若我們不信守承諾，便將承擔後果……"
 castilian_civil_war.412.a: "當然。忠誠理應得到公平回報。"
 castilian_civil_war.412.a.tt: "將發生以下效果："
 castilian_civil_war.412.b: "我們沒有餘力滿足這些要求。"
 castilian_civil_war.413.title: "[from_country.GetNameWithNoTooltip]接受要求"
 castilian_civil_war.413.desc: "來自[from_country.GetName]的消息傳到了我們的宮廷。[target_winner.GetName]接受了我們的要求！我們很快就會獲得應得的獎賞。"
 castilian_civil_war.413.a: "很高興聽到這個消息。"
 castilian_civil_war.414.title: "[from_country.GetNameWithNoTooltip]拒絕要求"
 castilian_civil_war.414.desc: "來自[from_country.GetName]的消息傳到了我們的宮廷。[target_winner.GetName]拒絕滿足我們的要求！這種背信之舉將玷污我們的關係長達一個世紀……"
 castilian_civil_war.414.a: "那些該死的狗東西！"
 castilian_civil_war.420.title: "[target_loser.GetShortNameWithNoTooltip]的敗北"
 castilian_civil_war.420.desc: "儘管我們竭盡全力，[from_country.GetAdjective]內戰仍以[target_loser.GetName]屈辱敗北告終。[target_winner.GetName]擊敗了[target_loser.GetShortNameWithNoTooltip]的聯軍，並殺死了[target_loser.GetHerHim]。既然掌權者中已無人能執行我們的要求，[target_loser.GetShortNameWithNoTooltip]向我們作出的一切承諾皆作廢。"
 castilian_civil_war.420.a: "真是可惜……"
 castilian_civil_war.1000.title: "[from_country.GetAdjectiveWithNoTooltip]王冠衝突"
 castilian_civil_war.1000.desc.common: "[from_father.GetName]多年來與[from_father.GetHerHis][from_mother.Custom('GetLover')]之間的情事，終於顯露出其後果。雖然[from_father.GetHerHis][target_legitimate.GetDaughterSon][target_legitimate.GetName]也許是[from_country.GetName]的合法統治者，但[target_legitimate.GetHerHis]的私生[target_bastard.GetSisterBrother][target_bastard.GetName]已經集結軍隊，要為[target_bastard.GetHerselfHimself]奪取王位。"
 castilian_civil_war.1000.desc: "$castilian_civil_war.1000.desc.common$\n\n在這緊張時刻，[target_pretender.GetNameWithNoTooltip]已向[target_country.GetAdjective][target_country.GetFlavorRank]伸出手，請求我們支持[target_pretender.GetHerHis]宣稱，以對抗[target_pretender.GetHerHis][target_ruler.GetSisterBrother]——當然，也會為我們的努力提供適當補償。"
 castilian_civil_war.1000.a: "這將是我們[target_country.GetFlavorRank]的大好機會！"
 castilian_civil_war.1000.a.tt: "一旦針對[from_country.GetName]的[civil_war|e]爆發，我們將支持[target_rebels.GetName]"
 castilian_civil_war.rebels_join_reward: "[target_country.GetName]加入[target_rebels.GetName]一方，且[civil_war|e]由其陣營獲勝後，將發生以下效果："
 castilian_civil_war.loyalists_join_reward_for_root: "[ROOT.GetCountry.GetName]加入[from_country.GetName]一方，且[civil_war|e]由其陣營獲勝後，將發生以下效果："
 castilian_civil_war.rebels_join_reward_for_root: "[ROOT.GetCountry.GetName]加入[target_rebels.GetName]一方，且[civil_war|e]由其陣營獲勝後，將發生以下效果："
 castilian_civil_war.loyalists_join_reward: "[target_country.GetName]加入[from_country.GetName]一方，且[civil_war|e]由其陣營獲勝後，將發生以下效果："
 castilian_civil_war.1000.a.tt.100yw: "若[target_pretender.GetName]贏得[civil_war|e]，[from_country.GetName]將在[ShowSituationName('hundred_years_war')]中加入我方"
 castilian_civil_war.1000.b: "干涉[from_country.GetAdjectiveWithNoTooltip]人民的事務對我們毫無利益。"
 castilian_civil_war.1000.b.tt: "我們將在[from_country.GetAdjective][civil_war|e]中對[target_rebels.GetName]保持#Y 中立#!"
 castilian_civil_war.1001.title: "[target_country.GetAdjectiveWithNoTooltip]干涉"
 castilian_civil_war.1001.common.desc: "可憎的叛徒與覬覦者[target_pretender.GetName]已向[target_country.GetName]求援，企圖在即將到來、對抗[target_ruler.GetName]的內戰中取得他們的支持。"
 castilian_civil_war.1001.desc: "$castilian_civil_war.1001.common.desc$我們將在戰場上看見[target_country.GetAdjectiveWithNoTooltip]的旗幟！"
 castilian_civil_war.1001.a: "那他們就會被埋在[target_pretender.GetHerHis]墳旁！"
 castilian_civil_war.1002.title: "[target_country.GetAdjectiveWithNoTooltip]中立"
 castilian_civil_war.1002.desc: "$castilian_civil_war.1001.common.desc$幸運的是，他們的智慧尚未拋棄他們，因為他們拒絕了[target_pretender.GetHerHis]的請求。"
 castilian_civil_war.1002.a: "終於有些好消息了。"
 castilian_civil_war.1002.a.tt: "[target_country.GetName]在可能對抗[target_rebels.GetName]的[civil_war|e]中保持#y 中立#!"
 castilian_civil_war.1003.desc.common: "兩位同父異母手足[target_ruler.GetName]與[target_pretender.GetName]之間的衝突，使[from_country.GetName]的緊張局勢日益升高。為了即將到來、爭奪[from_country.GetAdjectiveWithNoTooltip]王冠的戰爭，雙方都在尋求對抗競爭者的支援。"
 castilian_civil_war.1003.desc: "$castilian_civil_war.1003.desc.common$我們最尊貴的盟友[target_country.GetName]表示願意援助[target_pretender.GetShortNameWithNoTooltip]，以換取[ShowRegionName('iberia_region')]的恩惠與土地。在這場衝突中站在[target_country.GetNameWithNoTooltip]一邊，或許能給我們機會為自己索取部分[from_country.GetAdjectiveWithNoTooltip]土地，同時強化我們與[target_country.GetAdjectiveWithNoTooltip][target_country.GetFlavorRank]的關係。前提是，這位覬覦者能贏得即將到來的內戰……"
 castilian_civil_war.1003.a: "我們必須為自己抓住這個機會！"
 castilian_civil_war.1003.a.tt: "我們將在[civil_war|e]中加入[target_country.GetName]與[target_rebels.GetName]，對抗[from_country.GetName]"
 castilian_civil_war.1003.b: "我們承擔不起與[from_country.GetAdjectiveWithNoTooltip]王冠爆發衝突。"
 castilian_civil_war.1004.title: "[root_country.GetAdjectiveWithNoTooltip]干涉"
 castilian_civil_war.1004.desc.common: "看清[target_country.GetAdjective][target_country.GetFlavorRank]的愚蠢決定後，[root_country.GetName]已考慮讓自己捲入這場正在醞釀的衝突。"
 castilian_civil_war.1004.desc: "$castilian_civil_war.1004.desc.common$這些可鄙的[root_country.GetAdjectiveWithNoTooltip]人竟違背常理，決定支持[target_pretender.GetName]對抗[target_ruler.GetName]。"
 castilian_civil_war.1004.a: "這份協定將成為他們的末日！"
 castilian_civil_war.1004.a.tt: "#R 若[civil_war|e]爆發，[root_country.GetName]將加入[target_rebels.GetName]一方#!\n若[target_pretender.GetName]奪取王位，[root_country.GetName]將要求取得[target_province_definition.GetName]的[province|e]，以及[target_location_1.GetName]和[target_location_2.GetName]的[locations|e]"
 castilian_civil_war.1005.title: "[root_country.GetAdjectiveWithNoTooltip]中立"
 castilian_civil_war.1005.desc: "$castilian_civil_war.1004.desc.common$令我們驚喜的是，光榮的[root_country.GetAdjectiveWithNoTooltip]人決定在[target_pretender.GetName]與[target_ruler.GetName]之間即將到來的衝突中保持中立。"
 castilian_civil_war.1005.a: "明智的決定。"
 castilian_civil_war.1005.a.tt: "[root_country.GetName]在可能對抗[target_rebels.GetName]的[civil_war|e]中保持#y 中立#!"
 castilian_civil_war.1020.title: "[pretender_mother.GetNameWithNoTooltip]的命運"
 castilian_civil_war.1020.title.fallback: "覬覦者之母的命運"
 castilian_civil_war.1020.desc.legal_heir: "$castilian_civil_war.1020.desc$隨著[alfonso_scope.GetHerHis][alfonso_scope.Custom('GetAbdicationDeath')]以及[target_ruler.GetNameWithNoTooltip]掌權，[pretender_mother.GetNameWithNoTooltip]再也無法免受[ruler_mother.GetShortNameWithNoTooltip]的怒火。這位[ruler_mother.GetWomanMan]因不幸的婚姻而沮喪，又因嫉妒而苦澀，極其渴望看見[pretender_mother.GetShortNameWithNoTooltip]人頭落地；[ruler_mother.GetSheHe]將[ruler_mother.GetHerHis]敵手標為叛徒，並要求[target_ruler.GetShortNameWithNoTooltip]處決[pretender_mother.GetNameWithNoTooltip]。"
 castilian_civil_war.1020.desc.bastard_heir: "$castilian_civil_war.1020.desc$隨著[alfonso_scope.GetShortNameWithNoTooltip]不再掌權，而[alfonso_scope.GetHerHis]的私生[target_ruler.GetDaughterSon]成為[from_country.GetName]統治者，[pretender_mother.GetNameWithNoTooltip]曾經擁有的影響力與政治權力只剩回憶。為了[ruler_mother.GetHerselfHimself]與[ruler_mother.GetHerHis]孩子感到恐懼，[ruler_mother.GetNameWithNoTooltip]希望將[pretender_mother.GetShortNameWithNoTooltip]放逐。"
 castilian_civil_war.1020.desc: "[target_ruler.GetName]與[target_pretender.GetName]之間的紛爭，不只是兩位同父異母[from_country.Custom('GetSiblings')]之間的衝突，更是[maria_scope.GetName]與[alfonso_scope.GetName]的[leonor_scope.Custom('GetLover')][leonor_scope.GetName]之間更深層的敵對。"
 castilian_civil_war.1020.a: "[pretender_mother.GetSheHe|U]應因叛害[from_country.GetNameWithNoTooltip]而被處決！"
 castilian_civil_war.1020.b: "[pretender_mother.GetHerHis|U]罪行尚不至死。"
 castilian_civil_war.1020.b.tt: "我們最多#Y 3#!名最優秀的[characters|e]將與[ruler_mother.GetName]一同離開[from_country.GetName]"
 castilian_civil_war.1020.c: "[pretender_mother.GetShortNameWithNoTooltip]應被逐出[from_country.GetNameWithNoTooltip]！"
 castilian_civil_war.1020.d: "[pretender_mother.GetSheHe|U]只是在犬吠。[pretender_mother.GetHerHis|U]才能仍是此地所需。"
 castilian_civil_war.1020.d.tt: "這可能會對[ruler_mother.GetName]與[ruler_mother.GetHerHis]孩子造成後果……"
 castilian_civil_war.1020.f: "幸運的是，[from_country.GetNameWithNoTooltip]並無衝突。"
 castilian_civil_war.1021.title: "宮廷謀殺"
 castilian_civil_war.1021.desc: "悲劇降臨宮廷！[target_character.GetName]遭到冷血刺殺！雖然兇手仍在追查之中，但所有早期跡象都指向[murderer_character.GetName]涉入此案。"
 castilian_civil_war.1021.a: "將[murderer_character.GetShortNameWithNoTooltip]逐出宮廷！"
 castilian_civil_war.1021.b: "唯有處決才能償還死亡！"
 castilian_civil_war.1021.c: "我們不該妄下結論……"
 castilian_civil_war.1022.title: "[maria_scope.GetNameWithNoTooltip]的放逐"
 castilian_civil_war.1022.desc: "[target_country.GetName]之子女[maria_scope.GetName]已被逐出[from_country.GetName]。[maria_scope.GetHerHis|U]與昔日偉大的[alfonso_scope.GetName]之婚姻，再也無法維繫我們兩國之間的聯繫。"
 castilian_civil_war.1022.a: "但願[maria_scope.GetSheHe]至少能在[maria_scope.GetHerHis]故鄉得到慰藉。"
 castilian_civil_war.1023.title: "[maria_scope.GetNameWithNoTooltip]的處決"
 castilian_civil_war.1023.desc: "[target_country.GetName]之子女[maria_scope.GetName]在[from_country.GetName]遭到殺害！[maria_scope.GetHerHis|U]被指控為叛徒，並如怪物般遭受虐待；這段與昔日偉大的[alfonso_scope.GetName]之婚姻，也未能保護[maria_scope.GetHerHim]免受那位被[from_country.GetAdjectiveWithNoTooltip]人民稱為[from_country.Custom('GetRulerOrHeirTitle')]者的毒手。"
 castilian_civil_war.1023.a: "願[maria_scope.GetSheHe]安息。"
 castilian_civil_war.1024.title: "新陰謀的傳聞……"
 castilian_civil_war.1024.desc: "廳堂中的低語；夜色裡一閃而逝的影子。一股普遍的不安籠罩宮廷。無論效忠者或陰謀者，都沒有公開說出一字。人們聽見的只有模糊的流言。\n\n「鮮血將玷污宮廷的地板……」"
 castilian_civil_war.1024.a: "只是偏執的低語。沒什麼好擔心的。"
 castilian_civil_war.1025.title: "[maria_scope.GetNameWithNoTooltip]歸來"
 castilian_civil_war.1025.desc: "自15歲嫁給[alfonso_scope.GetName]以來，[maria_scope.GetName]與[alfonso_scope.GetHerHim]之間的關係始終只有不幸。這位[from_country.GetAdjective]統治者在[alfonso_scope.GetHerHis][leonor_scope.Custom('GetLover')]懷中尋得[alfonso_scope.GetHerHis]愛情，而[maria_scope.GetShortNameWithNoTooltip]身邊只有[maria_scope.GetHerHis][target_ruler.GetDaughterSon]作伴。然而，即使是[target_ruler.GetSheHe]，在美麗的[maria_scope.Custom('GetLadyLord')][maria_scope.GetShortName]眼中也已證明背信棄義。唉，[target_country.GetName]深愛的子女[maria_scope.GetSheHe]已回到[maria_scope.GetHerHis]故鄉。"
 castilian_civil_war.1025.a: "歡迎回來，[maria_scope.GetShortNameWithNoTooltip]。"
 castilian_civil_war.1030.title: "王冠的盟友"
 castilian_civil_war.1030.desc: "叛逆的[target_pretender.Custom('GetPrincessPrince')][target_pretender.GetName]繼續與那些試圖在[ShowRegionName('iberia_region')]滋長自身權力的人建立外交關係。但並非所有人都會支持[target_pretender.GetHerHis]關於[from_country.GetName]的構想，而不是[target_ruler.GetName]的構想。我們狡猾的外交官已成功為與[target_country.GetLongName]締結同盟奠定基礎。"
 castilian_civil_war.1030.a: "接觸[target_country.GetAdjectiveWithNoTooltip][target_country.Custom('GetRulerOrRegentTitle')]。我們有許多事要談。"
 castilian_civil_war.1030.a.tt: "若針對[target_rebels.GetName]的[civil_war|e]爆發，我們將與[target_country.GetName]談判一項[alliance|e]"
 castilian_civil_war.1030.b: "我們不需要外人的幫助。"
 castilian_civil_war.1031.title: "[from_country.GetAdjectiveWithNoTooltip]同盟"
 castilian_civil_war.1031.desc: "$castilian_civil_war.1000.desc.common$\n\n在這緊張時刻，[target_ruler.GetNameWithNoTooltip]已向[target_country.GetLongName]伸出手，請求我們支援[target_ruler.GetHerHim]對抗[target_ruler.GetHerHis][target_pretender.GetSisterBrother]。當然，我們可以出於善意支持他們，但擴大我們在[ShowRegionName('iberia_region')]的影響力也同樣誘人……"
 castilian_civil_war.1031.a.tt: "我們將向[target_ruler.GetName]提出以下提案："
 castilian_civil_war.1031.a.tt.join_war: "一旦[civil_war|e]爆發，[target_country.GetName]將支持[from_country.GetName]對抗[target_rebels.GetName]"
 castilian_civil_war.1031.a.tt.100yw: "若[target_ruler.GetName]贏得[civil_war|e]，[from_country.GetName]將在[ShowSituationName('hundred_years_war')]中加入[target_country.GetName]一方"
 castilian_civil_war.1031.b: "這不是為了戰利品，而是為了戰鬥的榮耀。[target_ruler.GetShortNameWithNoTooltip]將得到我們的利刃！"
 castilian_civil_war.1031.b.tt: "一旦[civil_war|e]爆發，我們將支持[from_country.GetName]對抗[target_rebels.GetName]"
 castilian_civil_war.1032.title: "[target_country.GetNameWithNoTooltip]的條件"
 castilian_civil_war.1032.desc: "來自[target_country.GetName]的消息傳到了我們的宮廷。雖然同情[target_ruler.GetName]與[target_ruler.GetHerHis]事業，[target_country.GetAdjectiveWithNoTooltip][target_country.Custom('GetRulerOrRegentTitle')]仍強調他們必須承擔的風險，因此要求若我們需要他們援助，便必須承諾補償。"
 castilian_civil_war.1032.a: "我們接受他們合理的要求。"
 castilian_civil_war.1032.a.tt: "我們將接受條件。接著將發生以下事項："
 castilian_civil_war.1032.b: "他們的要求絕對無法接受。我們不需要他們的幫助。"
 castilian_civil_war.1032.b.tt: "我們將拒絕他們的條件。[target_country.GetName]將在[civil_war|e]期間保持#Y 中立#!。"
 castilian_civil_war.1033.title: "[from_country.GetNameWithNoTooltip]接受我們的條件！"
 castilian_civil_war.1033.desc: "來自[from_country.GetName]的消息傳到了我們的宮廷。可敬的[target_ruler.GetName]已接受條件，並向我們的新同盟宣誓。"
 castilian_civil_war.1033.a: "畢竟，這是他們唯一的選擇。"
 castilian_civil_war.1034.title: "[from_country.GetNameWithNoTooltip]拒絕我們的條件"
 castilian_civil_war.1034.desc: "來自[from_country.GetName]的消息傳到了我們的宮廷。在[target_ruler.GetHisHer]「無限智慧」之中，[target_ruler.GetName]拒絕了我們伸出的援手，還宣稱我們合理的要求荒謬至極。顯然，他們呼求支援的真誠程度，正如他們希望我們相信的那般。"
 castilian_civil_war.1034.a: "那就這樣吧。"
 castilian_civil_war.1035.title: "與[root_country.GetNameWithNoTooltip]結盟？"
 castilian_civil_war.1035.desc: "我們的外交雖然集中於和[target_country.GetName]建立關係，以備即將到來對抗[target_pretender.GetName]的戰爭，但顯然有一個國家特別有興趣加入任一方：[root_country.GetName]。然而，由於他們與[target_country.GetName]有緊密同盟，除非我們承諾給予某些[ShowCultureName('basque')]土地，[root_country.GetAdjectiveWithNoTooltip]王冠可能認為支持我們價值不大。"
 castilian_civil_war.1035.a: "若他們幫助我們，北方土地可以歸他們所有。"
 castilian_civil_war.1035.a.tt: "我們向[root_country.GetName]提議：若他們在即將到來的[civil_war|e]中加入我方對抗[target_rebels.GetName]，便可取得[target_province_definition.GetName]、[target_location_1.GetName]與[target_location_2.GetName]的所有權"
 castilian_civil_war.1035.b: "他們不值得我們作出這樣的承諾。"
 castilian_civil_war.1036.desc: "$castilian_civil_war.1003.desc.common$我們最尊貴的盟友[target_country.GetName]已表達援助[target_ruler.GetShortNameWithNoTooltip]的意願，甚至連[from_country.GetLongNameWithNoTooltip]也向我們伸出手，想爭取我們的支持。"
 castilian_civil_war.1036.a: "我們當然會支持我們的[from_country.GetAdjectiveWithNoTooltip]鄰邦。"
 castilian_civil_war.1036.a.tt: "我們將與[target_country.GetName]和[from_country.GetName]一同加入[civil_war|e]，對抗[target_rebels.GetName]及其盟友\n若[target_ruler.GetName]贏得內戰，[root_country.GetName]可宣稱[target_province_definition.GetName]的[province|e]，以及[target_location_1.GetName]和[target_location_2.GetName]的[locations|e]"
 castilian_civil_war.1036.b: "這不是我們的衝突。"
 castilian_civil_war.1037.title: "[root_country.GetNameWithNoTooltip]接受同盟！"
 castilian_civil_war.1037.desc: "來自[root_country.GetName]的消息傳到了我們的宮廷。正如預料，[root_country.GetNameWithNoTooltip]的[root_country.Custom('GetRulerOrRegentTitle')]已接受我們的提議。他們將成為我們對抗叛軍的盟友。"
 castilian_civil_war.1037.a: "但願他們的貢獻值得這份代價。"
 castilian_civil_war.1037.a.tt: "若[civil_war|e]爆發，[root_country.GetName]將加入我方對抗[target_rebels.GetName]\n若[target_ruler.GetName]保住王位，[root_country.GetName]將為自己索取[target_province_definition.GetName]的[province|e]，以及[target_location_1.GetName]和[target_location_2.GetName]的[locations|e]"
 castilian_civil_war.1038.title: "[root_country.GetNameWithNoTooltip]拒絕同盟"
 castilian_civil_war.1038.desc: "來自[root_country.GetName]的消息傳到了我們的宮廷。出於我們的大使無法理解的理由，[root_country.GetNameWithNoTooltip]的[root_country.Custom('GetRulerOrRegentTitle')]拒絕了我們的提議。他們將在即將到來的衝突中保持中立。"
 castilian_civil_war.1038.a: "他們對擴張過敏嗎？"
 castilian_civil_war.1039.title: "[target_country.GetNameWithNoTooltip]接受同盟！"
 castilian_civil_war.1039.desc: "來自[target_country.GetName]的消息傳到了我們的宮廷。出於對[target_ruler.GetName]與[target_ruler.GetHerHis]事業的同情，[target_country.GetAdjectiveWithNoTooltip][target_country.Custom('GetRulerOrRegentTitle')]已向[target_ruler.GetShortNameWithNoTooltip]宣誓效忠，將在即將到來對抗覬覦者叛軍的戰爭中提供支持，且沒有進一步要求。"
 castilian_civil_war.1039.a: "還有人說騎士精神已死呢。"
 castilian_civil_war.1040.title: "[target_country.GetNameWithNoTooltip]拒絕同盟"
 castilian_civil_war.1040.desc: "來自[target_country.GetName]的消息傳到了我們的宮廷。[target_country.GetLongNameWithNoTooltip]拒絕同盟。他們的理由令我們費解，不過有人私下低語，說這份同盟本來只會對我們的事業有利。"
 castilian_civil_war.1040.a: "[ROOT.GetCountry.Custom('common_string_disappointing')]"
 castilian_civil_war.1050.title: "[ShowRegionNameWithNoTooltip('iberia_region')]諸王冠"
 castilian_civil_war.1050.desc.portugal: "$castilian_civil_war.1050.desc$[target_country.GetName]尤其關注我們的事務，因為那裡是[maria_scope.GetName]的家鄉；其亦為[target_ruler.GetShortNameWithNoTooltip]的[maria_scope.GetMotherFather]，也是[target_country.GetAdjectiveWithNoTooltip]王冠的[maria_scope.Custom('GetPrincessPrince')]。與[target_country.GetAdjectiveWithNoTooltip]人民商議同盟，會是明智的決定。"
 castilian_civil_war.1050.desc.aragon: "$castilian_civil_war.1050.desc$當[target_pretender.GetShortNameWithNoTooltip]在[target_pretender.GetHerHis]血親之中尋找盟友時，[target_country.GetLongName]已對我們的事務表達濃厚興趣。雖然他們顯然有意擴張自己在[ShowRegionNameWithNoTooltip('iberia_region')]的影響力，但[target_country.GetAdjectiveWithNoTooltip]力量或許正是我們對抗叛軍威脅所需。"
 castilian_civil_war.1050.desc: "[target_ruler.GetName]與[target_pretender.GetName]之間的衝突日益緊張。自然，[ShowRegionName('iberia_region')]的鄰邦完全知道困擾[from_country.GetName]的內部紛爭。"