l_simp_chinese:
  byzantine_succ_crisis.1.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]要求補償"
  byzantine_succ_crisis.1.desc: "在這艱困時刻，那些自稱[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]的禿鷲提醒我們，[target_character2.GetName]乃是他們階級的一員。他們以含糊威脅與空洞言辭，試圖脅迫我們給予金錢回報，以換取他們那可悲且日漸衰微的支持。"
  byzantine_succ_crisis.1.a: "好吧。"
  byzantine_succ_crisis.1.b: "他們越界了！"
  peasants_unhappy_tt: "我們每個擁有[location|e]中的[ShowPopTypeName('peasants')]都會失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]"
  byz_every_noble_sides_with_pretender_tt: "我國[provinces|e]各地的[ShowPopTypeName('nobles')][pops|e]會失去[ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%][pop_satisfaction|e]，並支持[target_character.GetName]的事業"

  byzantine_succ_crisis.2.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]拒絕納稅"
  byzantine_succ_crisis.2.desc: "眾所周知，[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]向來抗拒[target_character2.GetName]的權威。他們以公開叛亂作為藉口，並趁我國領土各地普遍動盪之機，正式提出要求，要我們減少，甚至直接撤銷對他們課徵的若干賦役。"
  byzantine_succ_crisis.2.a: "很好，我們需要他們。"
  byzantine_succ_crisis.2.b: "我們不會與這種人談判！"

  byzantine_succ_crisis.3.title: "我們的[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]支持覬覦者！"
  byzantine_succ_crisis.3.desc: "頑劣孩童與任性而貪權的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]也許沒有多少共通之處，但他們都仰賴我國家門之內蔓延的混亂而茁壯。他們以中央權威日漸衰弱為藉口，公然譴責[target_character2.GetShortName]，轉而支持[target_character.GetName]！"
  byzantine_succ_crisis.3.a: "我們不需要他們。"
  byzantine_succ_crisis.3.b: "給些特權能改變他們的想法嗎？"

  byzantine_succ_crisis.4.title: "[ShowLocationNameWithNoTooltip('thessaloniki')]的水手行會"
  byzantine_succ_crisis.4.desc: "在我國疆土之中，少有地方像[target_location.GetName]一樣成為動亂與腐敗的大雜燴。民眾反抗主人、群眾揭竿而起、劫掠並摧毀[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]莊園的報告，已成為每日可見之事。毫無疑問，[target_location.GetNameWithNoTooltip]正一步步逼近對既定秩序的公開叛亂。"
  byzantine_succ_crisis.4.a: "我們可以聽聽他們的要求。"
  byzantine_succ_crisis.4.b: "他們會被鞭打回秩序之中！"
  thessaloniki_effect_1_tt: "[target_location.GetNameWithNoTooltip]的[ShowPopTypeName('nobles')][pops|e]會失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%][pop_satisfaction|e]，而[ShowPopTypeName('peasants')]與[ShowPopTypeName('burghers')]會獲得[ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%]\n[target_location.GetNameWithNoTooltip]會失去[ShowNamedValue('control_ultimate_penalty')|+=2%][control|e]"
  thessaloniki_effect_2_tt: "[target_location.GetNameWithNoTooltip]的[ShowPopTypeName('nobles')][pops|e]會獲得[ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%][pop_satisfaction|e]，而[ShowPopTypeName('peasants')]與[ShowPopTypeName('burghers')]會失去[ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]\n[target_location.GetNameWithNoTooltip]會失去[ShowNamedValue('control_ultimate_penalty')|+=2%][control|e]"

  byzantine_succ_crisis.5.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]要求清洗[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
  byzantine_succ_crisis.5.desc: "[target_location.GetName]的局勢已走到無可挽回的地步，一群群[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]如飢餓野獸般在大地上徘徊，向當地[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]揮舞拳頭與武器，指控他們怠忽職守且貪婪無度。若我們不介入，當地[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]恐怕將遭清洗；而他們的成員或許正急於以支持我們的事業，來換取自身安全……"
  byzantine_succ_crisis.5.a: "以貴族之血滿足[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]的渴望！"
  byzantine_succ_crisis.5.b: "我們必須保護[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]……"

  byzantine_succ_crisis.6.title: "擅離職守"
  byzantine_succ_crisis.6.desc: "眾所周知，[target_character2.GetName]經常逃避軍事職責。很多時候，人們都能在附近一間破敗酒館中找到[target_character2.GetSheHe]，而[target_character2.GetHerHis]麾下部隊既未受訓練，也毫無紀律，士氣更是徹底崩潰。這是一幅極其可恥的景象，在如此動盪的時代尤其如此……"
  byzantine_succ_crisis.6.a: "正式申斥[target_character2.GetHerHim]及[target_character2.GetHerHis]同僚！"
  byzantine_succ_crisis.6.b: "強制[target_character2.GetHerHis]階層繳納罰金。"
  byzantine_succ_crisis.6.c: "這次可以寬恕[target_character2.GetSheHe|U]。"
  byz_character_might_cause_trouble_again_tt: "[target_character2.GetShortNameWithNoTooltip]近期可能再次惹出麻煩……"

  byzantine_succ_crisis.7.title: "[ROOT.GetCountry.GetGovernment.GetParliament.GetName]的集會"
  byzantine_succ_crisis.7.desc: "近期局勢將[target_character.GetName]推上王位競爭者的位置，並引發一連串軍事行動，意在清除對這位覬覦者的支持。許多來自[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]等各階層的顯要成員，長久以來一直支持擴張[ROOT.GetCountry.GetGovernment.GetParliament.GetName]權力的構想，試圖藉此取得更有利且更具影響力的結果……"
  byzantine_succ_crisis.7.a: "他們的話不無道理。"
  byzantine_succ_crisis.7.b: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]永遠擁有最後決定權！"
  unlock_new_issues_about_civil_war_tt: "所有新的[parliament_issues|e]都會在[ShowDisasterName('succession_crisis')][disaster|e]期間獲得強化"
  scales_with_crown_power_tt: "此[modifier|e]會隨我們的[crown_power|e]變化"

  byzantine_succ_crisis.8.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]拒絕覬覦者"
  byzantine_succ_crisis.8.desc: "我國各地的宗教團體長久以來都對局勢發展，以及[target_character.GetName]煽動的公開叛亂抱持反感。他們認為這場社會騷動將危及人民，也違背了他們對一體共融的教義觀點。因此，他們尋求協助我們使對抗這一內部威脅的鬥爭正當化。"
  byzantine_succ_crisis.8.a: "他們的努力將協助[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]。"
  byzantine_succ_crisis.8.b: "凡反對[target_character2.GetShortNameWithNoTooltip]統治者，都將冒犯神怒。"
  scales_with_clergy_estate_power_tt: "此獲得量會隨我們[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]的[estate_power|e]變化"
  province_pops_gain_satisfaction_tt: "我國許多有不滿[pops|e]且信奉[ROOT.GetCountry.GetReligion.GetName]的[provinces|e]會獲得[ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%][pop_satisfaction|e]"

  byzantine_succ_crisis.9.title: "不穩定造成的蹂躪"
  byzantine_succ_crisis.9.desc: "病弱的牧場、垂死的牲畜與焚毀的作物，只是這動盪時代最常見的景象。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]代為提出的抱怨正不斷累積，動亂也籠罩著鄉間。強盜、竊賊與劫掠四方的傭兵彼此反目，再一次摧毀了[target_province.GetName]那曾經美麗的鄉野……"
  byzantine_succ_crisis.9.a: "別怕，我們會資助復原！"
  byzantine_succ_crisis.9.b: "這一次，我們負擔不起……"
  pops_in_target_province_join_succession_crisis_pretender_tt: "我們在[target_province.GetNameWithNoTooltip]的[pops|e]會失去[ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%][pop_satisfaction|e]，且可能加入[target_character.GetName]的事業！"

  byzantine_succ_crisis.10.title: "高利貸合法化"
  byzantine_succ_crisis.10.desc: "持續衝突造成的嚴酷環境，將人性本質赤裸裸地展露出來。我們注意到，[target_location.GetName]的[ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]已誘使當地人以高得離譜的利率借錢。此事已持續許久，以至於演變為整個省份經商往來的常態。[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]代為提出的懇求已傳入我們耳中，他們要求我們終結這項攫住其家園的邪惡行徑。"
  byzantine_succ_crisis.10.a: "我們不能擾亂他們的社會秩序……"
  byzantine_succ_crisis.10.b: "但我們可以從中獲利！"
  byzantine_succ_crisis.10.c: "對[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]開出罰款與警告。"
  byzantine_succ_crisis.10.d: "在[target_location.GetNameWithNoTooltip]暫時將高利貸合法化"
  nobles_burghers_10_satisfaction_at_the_expense_of_peasants_tt: "我們在[target_location.GetNameWithNoTooltip]的[ShowPopTypeName('nobles')]與[ShowPopTypeName('burghers')][pops|e]會獲得[ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%][pop_satisfaction|e]，而[ShowPopTypeName('peasants')]會失去[ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%]"

  byzantine_succ_crisis.11.title: "外國商人特權"
  byzantine_succ_crisis.11.entry: "$byzantine_succ_crisis.11.title$"
  byzantine_succ_crisis.11.desc: "[target_location.GetName]是一個繁榮商人社群的所在地，商人們從世界各個遙遠角落抵達我們的港口，渴望與他們的外國同業貿易並交換財富。遺憾的是，我們的商業與海軍事務似乎已不再共享祖先昔日的輝煌，這是海軍權威衰落與威望流失的明顯徵兆。當[target_character.GetName]威脅篡奪王冠，而我們的資金也越來越緊缺時，[GetCountry('VEN').GetName]與[GetCountry('GEN').GetName]的代表接近了我們，提出以資助我國海軍為條件，換取他們在我國市場中的特權……"
  byzantine_succ_crisis.11.a: "與[GetCountry('VEN').GetNameWithNoTooltip]簽署協議。"
  byzantine_succ_crisis.11.b: "我們將請求[GetCountry('GEN').GetNameWithNoTooltip]援助。"
  byzantine_succ_crisis.11.c: "我們可以與雙方都簽署協議。"
  byzantine_succ_crisis.11.d: "這些吸血蟲不懷好意！"
  italian_merchants_favored_key: "[ShowCultureGroupName('italian_group')]商人受偏袒"
  byzantine_succ_crisis.11.historical_info: "在1341年的拜占庭內戰期間，帝國分裂為支持年幼約翰五世·巴列奧略的攝政政府，以及宣稱者約翰六世·坎塔庫澤諾斯兩派。這場衝突將威尼斯與熱那亞捲入其中，兩者利用戰爭推進彼此競爭的商業利益。熱那亞支持覬覦者，希望確保黑海貿易主導權，並因此獲得特權與海軍影響力，尤其是在加拉塔。威尼斯則決心遏制熱那亞擴張，因而支持攝政政府。這使原本可能只是內戰的衝突，轉變為兩個海上共和國之間的代理鬥爭，進一步削弱了拜占庭，並加深其在海軍與商業事務上對外國勢力的依賴。"

  byzantine_succ_crisis.12.title: "[target_country.GetNameWithNoTooltip]提供貿易特權"
  byzantine_succ_crisis.12.desc: "為了孤注一擲地彌補海事與海軍方面的短缺，[target_location.GetName]的主人挺身而出，向我們的[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]提供特殊特權與進入其利潤豐厚市場的管道，以換取他們在當前鬥爭中的海軍支援。"
  byzantine_succ_crisis.12.a: "我確實喜歡金錢！"

  byzantine_succ_crisis.13.title: "[target_country.GetNameWithNoTooltip]拒絕我們的商人"
  byzantine_succ_crisis.13.desc: "我們得知，最近我們[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]的成員一直與[target_country.GetName]通信，試圖取得其[target_location.GetName]市場的特殊進入權。不幸的是，談判破裂，結果不過是浪費時間……"
  byzantine_succ_crisis.13.a: "他們會後悔的。"

  byzantine_succ_crisis.14.title: "投機性的要求"
  byzantine_succ_crisis.14.desc: "隨著[target_character2.GetName]對抗[target_character.GetName]的公開衝突局勢發展，顯然出手的時機已近。我們的顧問支持向[GetCountry('BYZ').GetName]提出金錢補償要求的構想，這很可能為我們帶來豐厚回報，並資助我們未來的擴張戰役。"
  byzantine_succ_crisis.14.a: "他們會付錢！"
  byzantine_succ_crisis.14.b: "我們不要擾亂和平。"
  sc_this_may_bring_us_into_conflict_tt: "#R 這可能會使我們與[GetCountry('BYZ').GetNameWithNoTooltip]爆發衝突#!"

  byzantine_succ_crisis.15.title: "[GetCountry('TUR').GetNameWithNoTooltip]的要求"
  byzantine_succ_crisis.15.desc: "我們收到了那些可憎異教徒[GetCountry('TUR').GetNameWithNoTooltip]的消息。根據他們使節所言，他們要求我們支付一大筆金錢，以換取他們含糊且徒勞的和平承諾。他們提及我們目前對抗[target_character.GetName]的鬥爭，並圍繞保障東部戰線來陳述理由。"
  byzantine_succ_crisis.15.a: "我們別無選擇……"
  byzantine_succ_crisis.15.b: "不！"

  byzantine_succ_crisis.16.title: "來自[GetCountry('BYZ').GetNameWithNoTooltip]的使者"
  byzantine_succ_crisis.16.desc.a: "我們收到消息，一名來自[GetCountry('BYZ').GetName]的使節已經抵達。他們作出了一項審慎舉動，決定以一筆直接來自其國庫的巨額錢幣，換取我們兩國人民之間脆弱的休戰！"
  byzantine_succ_crisis.16.desc.b: "我們收到消息，一名來自[GetCountry('BYZ').GetName]的使節已經抵達。他們違背邏輯與理性的命令，決定不透過微薄付款來確保我們的善意。通往[target_location.GetName]的道路已然敞開！"
  byzantine_succ_crisis.16.a: "我明白了……"