l_simp_chinese:

  #Events for the disaster
  aspiration_for_liberty.1.title: "自由渴望"
  aspiration_for_liberty.1.desc: "[target_character.GetName]備受質疑的統治、民眾對自由的渴望，以及施行啟蒙理想的願望，共同催生了一場幾乎已不可避免的革命。人民已團結起來並拿起武器，試圖推翻[ROOT.GetCountry.GetFlavorRank]，由此揭開我們這個時代最血腥革命之一的序幕。"
  aspiration_for_liberty.1.a: "艱難歲月就在前方。"
  pops_lose_satisfaction_based_on_literacy_tt: "屬於[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]或[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]的[pops|e]將根據其[literacy|e]失去[pop_satisfaction|e]"

  aspiration_for_liberty.2.title: "秩序已恢復"
  aspiration_for_liberty.2.desc.a: "在[target_character.GetName]不受制衡的權威之下，[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]所激起的怒火日益高漲。隨著稅賦提高、個人自由萎縮，人民要求恢復[ROOT.GetCountry.GetGovernment.GetParliament.GetName]，以代表他們的利益。他們將其視為對抗任意統治的保障，保護自身權利與財產免遭逾越權限的侵害。他們的政治力量迫使[target_character.GetShortNameWithNoTooltip]讓步，實質上恢復了[ROOT.GetCountry.GetGovernment.GetParliament.GetName]。"
  aspiration_for_liberty.2.desc.b: "面對[ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]與[ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]的起事，[target_character.GetName]仍死守專制統治，決意阻止[target_character.GetHerHis]權力受到任何侵蝕。\n\n[target_character.GetHerselfHimself]自視為上天任命，任何向議會權力作出的讓步，都是對[target_character.GetHerHis]權威與[target_character.GetHerHis]統治穩定的威脅。透過執行嚴厲措施並鎮壓多場叛亂，我們已再次保全了我們[ROOT.GetCountry.GetFlavorRank]的和平。"
  aspiration_for_liberty.2.a: "這是人民的意志。"
  aspiration_for_liberty.2.b: "絕不容許異議！"

  aspiration_for_liberty.3.title: "異國土地上的戰爭"
  aspiration_for_liberty.3.desc: "過去數年，我們取得財政成功的前景異常黯淡。[target_character.GetName]不斷投入鉅資，在異國土地上發動代價高昂的戰爭，已耗盡國庫，使維持國內基本需求的資源所剩無幾。再加上政府管理失當、財政疏忽與日益升高的政治不穩，這些行動已重創經濟，侵蝕公眾對統治權力的信任。\n\n如今我們正徘徊在破產邊緣，公民間動盪加劇，越來越多人開始質疑[target_character.GetShortNameWithNoTooltip]的優先事項。隨著債務不斷累積，國家在迫近的財政崩潰中連基本職能都難以維持，局勢也越發嚴峻。"
  aspiration_for_liberty.3.a: "國庫離空虛還遠得很！"
  aspiration_for_liberty.3.b: "削減戰爭支出。"

  aspiration_for_liberty.4.title: "政府無能"
  aspiration_for_liberty.4.desc: "在我國人民的[ShowDisasterName('aspiration_for_liberty')]期間，政府治理國家的無能引發了廣泛不滿，使新的起事得以在全國各地興起，例如[target_rebel.GetName]。公眾挫折已達沸點，許多人集結起來，反抗他們眼中腐敗且無能的領導者。\n\n革命的呼聲一日比一日高漲，來自各行各業的人們紛紛加入這場運動。他們決心重新掌握自身未來，不惜任何代價也要為訴求而戰，並明確表示，他們不會接受任何低於全面屈服於其要求的結果。"
  aspiration_for_liberty.4.a: "沒什麼好擔心的。"
  aspiration_for_liberty.4.b: "向[target_rebel.GetNameWithNoTooltip]作出一些讓步。"
  lose_10_control_in_affected_locations_tt: "目前支持[target_rebel.GetNameWithNoTooltip][rebellion|e]的[locations|e]將失去[ShowNamedValue('control_mild_penalty')|+=2%][control|e]"
  every_supporter_pop_gains_5_satisfaction_tt: "每個支持[target_rebel.GetNameWithNoTooltip][rebellion|e]的[pop|e]將獲得[ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%][pop_satisfaction|e]"