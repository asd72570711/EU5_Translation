 Norrkoping_Symphony_Orchestra: "北雪平交響樂團"
 Yingying_Herrdahl: "英英·赫達爾（琵琶）"
 Yingying_Herrdahl_facts: "英英·赫達爾是目前居住於瑞典的琵琶演奏家。"
 Pipa_facts: "中國琵琶是一種梨形弦樂器，以指甲或古時使用的撥片彈奏。它的起源可追溯至近兩千年前，是最受歡迎的中國樂器之一。"
 Martin_Ostergren: "馬丁·厄斯特格倫（管風琴）"
 Feras_Charestan: "費拉斯·查雷斯坦（卡農琴）"
 Feras_Charestan_facts: "費拉斯·查雷斯坦來自敘利亞東北部的阿爾-哈塞克市，並在大馬士革高等音樂學院學習卡農琴。"
 Qanun_facts: "卡農琴又稱卡努琴，是一種齊特琴類弦樂器，可能起源於古代美索不達米亞，但其起源仍不確定。"
 Ilona_Danho: "伊洛娜·丹霍（聲樂）"
 Feras_Charestan_and_Ilona_Danho: "$Feras_Charestan$、$Ilona_Danho$"
 
 Dan_Cecil_Hill: "丹·塞西爾·希爾（長笛）"
 Dan_Cecil_Hill_facts: "丹·塞西爾·希爾（卡尤加民族、鷺鷥氏族）是豪德諾索尼人（易洛魁）的藝術家與音樂家，專長於傳統原住民銀匠工藝與長笛製作。他大半生都在從事藝術創作、表演與文化領導，致力於保存並分享其民族自美國殖民前時期乃至更早以前的各個歷史面向。"
 Pierre_Harmon: "皮耶爾·哈蒙"
 Pierre_Harmon_facts: "皮耶爾·哈蒙是知名長笛演奏家，也是前哥倫布時期音樂的權威。他以珍貴的音樂學研究聞名全球，尤其專精於阿茲特克音樂；他也擁有最大的古代樂器收藏之一，並在職業生涯中鑽研這些樂器。"
 Laurent_Sauron: "羅朗·索龍"
 Pierre_Harmon_and_Laurent_Sauron: "$Pierre_Harmon$（長笛）、$Laurent_Sauron$（打擊樂）"
