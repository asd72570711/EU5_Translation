 traditional: "傳統"
 improvisational: "即興"
 Jacob_Regnart: "雅各·雷格納特（約1540年代－1599）"
 Jacob_Regnart_facts: "雷格納特是法蘭德斯文藝復興作曲家，出生於杜埃，創作過宗教與世俗音樂。他一生曾在奧地利與波希米亞等地任職，並於1580年代在茵斯布魯克擔任斐迪南大公的樂長。"
 Martin_Rinckart: "馬丁·林卡特（1586－1649）"
 Martin_Rinckart_facts: "馬丁·林卡特是路德宗神職人員與聖歌作者，曾在他出生並逝世的北薩克森艾倫堡擔任副牧師。"
 Joachim_Neander: "約阿希姆·諾伊安德（1650－1680）"
 Joachim_Neander_facts: "約阿希姆·諾伊安德出生於布萊梅，是改革宗（加爾文宗）改革宗教堂聖歌作者、神學家與教師。他被視為改革宗教堂最重要的聖歌作者，創作了約60首聖歌。"
 Dietrich_Buxtehude: "迪特里希·布克斯特胡德（1637－1707）"
 Dietrich_Buxtehude_facts: "迪特里希·漢森·布克斯特胡德於1637年出生在斯堪尼亞省赫爾辛堡。他被視為17世紀最重要的作曲家之一，並深深影響了巴哈與韓德爾等後世作曲家。"
 Gabriel_Asaad: "加布里埃爾·阿薩德（1907－1997）"
 Rohi_al_Khammash: "羅希·阿爾‑哈馬什（1923－1998）"

