 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos: "中國——十面埋伏——全曲"
 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "這是一首中國古典音樂傑作，通常由技藝高超的演奏家演奏。樂曲採用武曲風格，描寫西元前202年垓下之戰中項羽敗於劉邦的情景。"
