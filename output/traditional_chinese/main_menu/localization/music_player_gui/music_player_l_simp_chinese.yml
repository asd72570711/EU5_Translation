 Nana_Osei_Twum_Barima_aho: "娜娜·奧塞·特溫·巴里馬（聲樂、阿屯潘、恩塔赫拉、達武羅、菲里基瓦、恩特瓦姆）"
 Nana_Osei_Twum_Barima_asanteman: "娜娜·奧塞·特溫·巴里馬（聲樂、塞佩雷瓦、佩彭蘇阿、阿屯潘、達武羅、菲里基瓦、恩特瓦姆）"
 Rohan_Pillai: "羅漢·皮萊（維納琴）"
 Pancham_Upadhyay: "潘查姆·烏帕德亞伊（姆里丹加姆鼓）"
