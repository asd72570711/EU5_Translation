#### TRACK NAMES AND FLAVOUR TEXT ####

 MusicPlayer_01_Overture_I_Genesis: "01——第一號序曲：創世紀"
 MusicPlayer_01_Overture_I_Genesis_flavour: "「世界甦醒，陽光逐片揭開祂的面容。」"
 MusicPlayer_02_Overture_II_The_Odyssey: "02——第二號序曲：奧德賽"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "「故事的序曲，讓我們認識其中的角色與主題。」"
 MusicPlayer_03_Royal_Court_Invitation: "03——皇家宮廷邀請"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "大鍵琴是本曲中聽見的鍵盤樂器，在文藝復興與巴洛克音樂中十分常見。按下琴鍵會帶動羽管撥動單根琴弦，透過機械方式撥動安裝在音板上的一組琴弦而發出聲音。"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25——外交的高貴藝術"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "魯特琴類樂器在世界各地與不同歷史時期都有悠久歷史，而歐洲魯特琴是歐洲文藝復興時期世俗音樂中的主要樂器。"
 MusicPlayer_21_Conquer_or_Fall: "21——征服或隕落" 
 MusicPlayer_21_Conquer_or_Fall_flavour: "這是一首包含號角、弦樂與合唱的史詩樂曲，呈現《歐陸風雲V》音樂主要旋律主題的鼓舞人心變奏。"
 MusicPlayer_07_For_the_Lost_Ones: "07——給失落之人"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "這是一首哀婉而洶湧的樂曲，迴盪著《歐陸風雲V》其他作品中的主題與旋律動機。"
 MusicPlayer_12_Jester_Speaks_the_Truth: "12——小丑說真話"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "這首樂曲受到早期文藝復興音樂啟發，圍繞《歐陸風雲V》音樂的主要旋律動機變奏而作。"
 MusicPlayer_05_The_Rise_of_an_Empire: "05——帝國崛起"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "這首樂曲以《歐陸風雲V》的主要動機為引，強而有力地呈現遊戲體驗的核心情感。"
 MusicPlayer_20_Thirty_Years: "20——三十年"
 MusicPlayer_20_Thirty_Years_flavour: "三十年戰爭（1618－1648）是歐洲歷史上死傷最慘重的衝突之一，造成450萬至800萬人死亡。這場戰爭由16世紀的宗教改革引發，又受到外部利益衝突與長年宿怨進一步煽動。"
 MusicPlayer_24_The_Black_Death: "24——黑死病"
 MusicPlayer_24_The_Black_Death_flavour: "黑死病使歐洲14世紀的人口減少近半，是人類歷史上最致命的流行病之一。"
 MusicPlayer_10_Gloria_Patri: "10——榮耀頌"
 MusicPlayer_10_Gloria_Patri_flavour: "這是巴哈《G大調第一號大提琴組曲》巴哈作品目錄1007：第一前奏曲的聲樂變奏。"
 MusicPlayer_14_Lux_aeterna: "14——永恆之光"
 MusicPlayer_14_Lux_aeterna_flavour: "《Lux aeterna》是一段常在天主教會安魂彌撒中譜曲演唱的經文，歌頌上帝的恩典與照耀亡者的永恆之光。"
 MusicPlayer_18_Falalalan: "18——法拉拉蘭"
 MusicPlayer_18_Falalalan_flavour: "歷史總是存在於音樂之中，有時甚至不只以一種方式呈現。"
 MusicPlayer_22_A_Message_to_The_King: "22——給國王的訊息"
 MusicPlayer_22_A_Message_to_The_King_flavour: "這首樂曲充滿急迫感與熱忱，傳達出刻不容緩的重要性。"
 MusicPlayer_08_No_Fear_No_Mercy: "08——無懼無憐"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "這是一首勝利的樂曲，令人想起戰前的寧靜，以及戰士們期待戰鬥時在胸腔中跳動的心臟。"
 MusicPlayer_06_Pain_is_Salvation: "06——痛苦即救贖"
 MusicPlayer_06_Pain_is_Salvation_flavour: "歌詞融合英語、古德語與拉丁語，訴說通往救贖之路上的苦難。"
 MusicPlayer_04_In_Your_Honor: "04——為了您的榮耀"
 MusicPlayer_04_In_Your_Honor_flavour: "這是一首令人想起翠綠牧場，以及上帝與自然威嚴的悠揚樂曲。"
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15——與別西卜的交易"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "宗教與戰爭，以及為宗教而戰的戰爭。虔誠與嗜血交織其中。這些世紀展現了鮮明對比，也穿插著灰色陰影。"
 MusicPlayer_16_The_Path_to_Potsdam: "16——通往波茲坦之路"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "波茲坦城在三十年戰爭期間失去了近半人口。"
 MusicPlayer_11_Maiden_Voyage: "11——首航"
 MusicPlayer_11_Maiden_Voyage_flavour: "這是一首具有舞蹈節奏的樂曲，如同駛向未知海域時起伏的波浪。"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17——國王的新衣"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "這是一首世俗巴洛克風格的樂曲，以弦樂與大鍵琴為特色。"
 MusicPlayer_13_Battle_of_Lutzen: "13——呂岑之戰"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "呂岑之戰於1632年11月16日爆發，瑞典軍在薩克森與黑森-卡塞爾部隊支援下，對抗神聖羅馬皇帝的帝國軍。這是三十年戰爭中最重要的戰役之一。瑞典國王古斯塔夫·阿道夫在戰役中陣亡後，海爾布隆聯盟隨之建立。"
 MusicPlayer_26_Peace_of_Westphalia: "26——西發里亞和約"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "西發里亞和約是1648年在奧斯納布呂克與明斯特簽署的兩項和平條約的總稱，結束了三十年戰爭，也為神聖羅馬帝國帶來和平。"
 MusicPlayer_23_The_Flagellant: "23——鞭笞者"
 MusicPlayer_23_The_Flagellant_flavour: "鞭笞是為悔罪並分享耶穌受難而鞭打自己的行為，存在於許多基督教傳統中。鞭笞運動是西方基督教在14世紀出現的運動，起因是對戰爭、饑荒與瘟疫的回應。"
 MusicPlayer_19_O_quam_gloriosum: "19——O quam gloriosum"
 MusicPlayer_19_O_quam_gloriosum_flavour: "這首樂曲改編自湯馬斯·路易斯·德·維多利亞（1548－1611）為其《Missa O quam gloriosum》所寫的經文。"
 MusicPlayer_09_Libera_me_Domine: "09——Libera me Domine"
 MusicPlayer_09_Libera_me_Domine_flavour: "這首樂曲融合《Pie Jesu》與《Libera me》的經文，兩者常在天主教會安魂彌撒中譜曲演唱。它們祈求亡者獲得耶穌的憐憫，在審判之日得到安息與救贖。"
 MusicPlayer_sol_ashanti_Aho: "阿散蒂——阿霍"
 MusicPlayer_sol_ashanti_Aho_flavour: "娜娜·奧塞·特溫·巴里馬精通阿散蒂音樂與儀式所使用的各種樂器，包括塞佩雷瓦、傳統號角與打擊樂器。他也是阿散蒂帝國的繼承者與阿散蒂王國的創立者。歌曲標題意為「戰歌」。"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "阿散蒂——阿散蒂人知戰而不知逃"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "這首歌的歌詞開頭大致意為「阿散蒂人知道如何戰鬥，卻不知道如何逃跑」，接著宣揚阿散蒂戰士的優越性。"
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "阿散蒂——塞佩雷瓦·阿卡薩"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "歌曲標題意為「塞佩雷瓦已發聲」。塞佩雷瓦是一種豎琴‑魯特琴類樂器，具有箱形共鳴箱與10至14根琴弦，琴弦直接纏繞在琴頸上。它起源於西非；據說阿散蒂帝國的創立者奧塞·圖圖國王非常喜愛這種樂器，甚至有人以黃金製作複製品，作為王室器物。"
 MusicPlayer_sol_aztec_Mictlan: "阿茲特克——米克特蘭" 
 MusicPlayer_sol_aztec_Mictlan_flavour: "$Pierre_Harmon_facts$。歌曲標題意為「冥界」。"
