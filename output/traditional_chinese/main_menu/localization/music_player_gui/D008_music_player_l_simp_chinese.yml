#### TRACK NAMES AND FLAVOUR TEXT ####

 musicplayer_sol_byzantine_hymn_melodies: "拜占庭——聖歌旋律"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "這是一首以拜占庭單聲聖歌旋律傳統為基礎的聖歌，其形式受到八種回聲調式系統塑造；數世紀以來，該系統引導著東正教會音樂。"
 musicplayer_sol_byzantine_hymn_no_136: "拜占庭——第136號聖歌"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "這是拜占庭《詩篇》第136篇的編曲，以「我們的父」禱文與副歌「Exomologiste to Kyrio, oti agathos」（讚美主，因祂本為善）開頭，並以東正教聖歌傳統的輪唱形式演唱。"
 musicplayer_sol_byzantine_o_virgin_pure: "拜占庭——貞潔聖母"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "《Agni Parthene》（《貞潔聖母》）是一首希臘聖母頌歌，由艾伊納的聖尼克塔里奧斯於19世紀末創作，最早於1905年刊載在他的《聖母頌集》中。"
 musicplayer_sol_byzantine_overture_ii_odyssey: "拜占庭——第二號序曲：奧德賽"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "這是主題音樂序曲的詮釋，靈感來自曾在君士坦丁堡教堂中迴盪的拜占庭單聲聖歌。編曲喚起了東羅馬帝國的音樂傳統。"
 

